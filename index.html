a": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-057", "bloque": "reglas", "enunciado": "¿De qué no serán responsables, con carácter general, los árbitros y los demás miembros del equipo arbitral?", "opciones": {"A": "De cualquier lesión sufrida por un jugador, miembro del cuerpo técnico o espectador, de daños a la propiedad, o de cualquier otra pérdida derivada de una decisión adoptada conforme a las Reglas de Juego o al procedimiento normal de un partido.", "B": "Únicamente de las lesiones sufridas por los jugadores, no así de los daños a la propiedad ni de otras pérdidas económicas derivadas de una decisión adoptada durante el partido.", "C": "De ningún tipo de responsabilidad, ni siquiera de aquellas decisiones ajenas al desarrollo normal del partido o al procedimiento habitual establecido por las Reglas de Juego."}, "correcta": "A", "explicacion": "Los árbitros y los otros miembros del equipo arbitral no serán responsables de lesiones, daños a la propiedad ni de cualquier otra pérdida que se deba a una decisión tomada conforme a las Reglas de Juego o al procedimiento normal requerido para el partido.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-058", "bloque": "reglas", "enunciado": "El árbitro decide no disputar un partido por el mal estado del terreno de juego. Un club reclama responsabilidad al equipo arbitral por los perjuicios económicos derivados. ¿Es responsable el árbitro de esa decisión?", "opciones": {"A": "No, permitir o no la disputa del encuentro en función de las condiciones del terreno, sus inmediaciones o las condiciones meteorológicas es una decisión de la que el equipo arbitral no es responsable.", "B": "Sí, el árbitro deberá asumir responsabilidad económica si su decisión no estaba suficientemente justificada, al tratarse de una decisión sobre las condiciones del terreno de juego.", "C": "Solo será responsable si la decisión se toma antes del inicio del partido, no si se adopta ya comenzado el encuentro y con el juego en marcha en ese momento."}, "correcta": "A", "explicacion": "Entre las decisiones de las que el equipo arbitral no es responsable se incluye permitir o no la disputa del encuentro según las condiciones del terreno de juego, sus inmediaciones o las condiciones meteorológicas.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-059", "bloque": "reglas", "enunciado": "¿Es responsable el árbitro de las consecuencias derivadas de suspender definitivamente un partido por la razón que estime oportuna?", "opciones": {"A": "No, esa decisión está incluida entre aquellas de las que el equipo arbitral no será responsable.", "B": "Sí, siempre que la suspensión no esté motivada por condiciones meteorológicas.", "C": "Sí, salvo que la decisión haya sido consultada previamente con ambos capitanes."}, "correcta": "A", "explicacion": "El equipo arbitral no será responsable de las consecuencias de suspender definitivamente un partido por la razón que estime oportuna.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-060", "bloque": "reglas", "enunciado": "¿De qué tipo de decisión, entre las siguientes, no será responsable el equipo arbitral en relación con el material del partido?", "opciones": {"A": "De determinar la idoneidad del equipamiento o del balón utilizados durante el partido.", "B": "De determinar el fabricante oficial del balón utilizado en la competición.", "C": "De fijar el precio de las entradas al estadio en función del equipamiento utilizado."}, "correcta": "A", "explicacion": "Entre las decisiones de las que no será responsable el equipo arbitral se encuentra determinar la idoneidad del equipamiento o del balón utilizados durante el partido.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-061", "bloque": "reglas", "enunciado": "El árbitro decide no detener un partido pese a ciertos problemas en la zona de espectadores, y posteriormente se producen incidentes. ¿Es responsable el equipo arbitral de esa decisión?", "opciones": {"A": "No, detener o no un partido debido a la interferencia de los espectadores o a cualquier problema en su área es una decisión de la que el equipo arbitral no es responsable.", "B": "Sí, el árbitro será responsable si posteriormente se acredita que los incidentes eran previsibles con antelación, al no haber detenido el partido de forma preventiva.", "C": "Sí, salvo que la decisión se haya comunicado previamente al delegado de campo antes de reanudar el partido tras el problema detectado en la grada."}, "correcta": "A", "explicacion": "El equipo arbitral no será responsable de detener o no un partido debido a la interferencia de los espectadores o a cualquier problema en el área de estos.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-062", "bloque": "reglas", "enunciado": "¿De cuál de las siguientes decisiones relacionadas con un jugador lesionado no será responsable el equipo arbitral?", "opciones": {"A": "De detener o no el juego para permitir que un jugador lesionado sea transportado fuera del terreno de juego, y de solicitar que sea retirado para recibir atención médica.", "B": "De determinar el diagnóstico médico exacto de la lesión sufrida por el jugador durante el partido, al no corresponder esta valoración al equipo arbitral.", "C": "De autorizar el pago de los gastos médicos derivados de la atención prestada al jugador lesionado, al considerarse una cuestión ajena a las funciones del árbitro."}, "correcta": "A", "explicacion": "Entre las decisiones de las que no será responsable el equipo arbitral se incluyen detener o no el juego para que un jugador lesionado sea transportado fuera del terreno, y solicitar que sea retirado para recibir atención médica.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-063", "bloque": "reglas", "enunciado": "En aquellos casos en los que el árbitro posea esta autoridad, ¿de qué tipo de decisión no será responsable el equipo arbitral?", "opciones": {"A": "De permitir la presencia de personas, incluidos miembros del cuerpo técnico y del estadio, personal de seguridad, fotógrafos u otros representantes de los medios, en las inmediaciones del terreno de juego.", "B": "De determinar el número exacto de espectadores que pueden acceder al estadio donde se dispute el encuentro, al no corresponder esa función al equipo arbitral.", "C": "De contratar al personal de seguridad encargado de las inmediaciones del terreno de juego durante el partido, al ser una tarea ajena a sus funciones."}, "correcta": "A", "explicacion": "El equipo arbitral no será responsable, cuando el árbitro posea esta autoridad, de permitir la presencia de personas (cuerpo técnico, personal del estadio, seguridad, fotógrafos u otros representantes de los medios) en las inmediaciones del terreno de juego.", "referencia": "Regla 5.7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ6-001", "bloque": "reglas", "enunciado": "El árbitro asistente ha marcado que se produjo gol, pero el balón sigue en juego. ¿Cuál es la señal más apropiada que debe realizar?", "opciones": {"A": "Correr rápidamente 25-30 metros por la línea de banda hacia la línea central.", "B": "Correr rápidamente 25-30 metros por la línea de banda hacia la línea central, apoyándose en una señal discreta e inequívoca.", "C": "Levantar primero el banderín para atraer la atención del árbitro y luego correr por la línea de banda."}, "correcta": "B", "explicacion": "El procedimiento correcto para el asistente es correr hacia la línea central, apoyándose en una señal discreta que resulte inequívoca para el árbitro.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-002", "bloque": "reglas", "enunciado": "¿Qué función tiene el árbitro asistente de reserva según las Reglas de Juego?", "opciones": {"A": "Reemplazar a un árbitro asistente o al cuarto árbitro que no pueda continuar con su labor, sin asumir ninguna otra función en el partido.", "B": "Auxiliar exclusivamente al árbitro principal en el control del área técnica, sin poder sustituir a ningún otro miembro del equipo arbitral.", "C": "Reemplazar a un árbitro asistente, cuarto árbitro o árbitro asistente adicional que no pueda continuar, asistiendo además al árbitro principal como el resto del equipo arbitral en el terreno de juego."}, "correcta": "C", "explicacion": "El asistente de reserva puede sustituir a cualquier miembro del equipo arbitral que no pueda continuar (asistente, 4º árbitro o asistente adicional) y colabora con el árbitro principal igual que el resto del equipo arbitral.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-003", "bloque": "reglas", "enunciado": "¿Qué otros miembros del equipo arbitral se podrán designar, además del árbitro principal, para dirigir un partido?", "opciones": {"A": "Dos árbitros asistentes, el cuarto árbitro y un delegado de campo designado por la federación organizadora.", "B": "Únicamente dos árbitros asistentes y el cuarto árbitro, sin posibilidad de designar más figuras arbitrales.", "C": "Dos árbitros asistentes, el cuarto árbitro, dos árbitros asistentes adicionales, el árbitro asistente de reserva, el VAR y al menos un AVAR."}, "correcta": "C", "explicacion": "Se podrán designar otros miembros del equipo arbitral: dos árbitros asistentes, el cuarto árbitro, dos árbitros asistentes adicionales, el árbitro asistente de reserva, el VAR y al menos un AVAR.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-004", "bloque": "reglas", "enunciado": "¿Quién toma la decisión definitiva en el desarrollo del partido, aunque el resto del equipo arbitral ayude al árbitro principal?", "opciones": {"A": "La decisión definitiva se adopta por mayoría entre el árbitro principal y los dos árbitros asistentes.", "B": "La decisión definitiva la tomará siempre el árbitro principal.", "C": "La decisión definitiva corresponde siempre al VAR cuando este se encuentre disponible en el encuentro."}, "correcta": "B", "explicacion": "Los otros miembros del equipo arbitral ayudan al árbitro principal a dirigir el partido, pero la decisión definitiva la tomará siempre el árbitro principal.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-005", "bloque": "reglas", "enunciado": "¿Cuáles son los miembros del equipo arbitral en el terreno de juego?", "opciones": {"A": "El árbitro principal, los árbitros asistentes, el cuarto árbitro, los árbitros asistentes adicionales y el árbitro asistente de reserva.", "B": "Únicamente el árbitro principal y los dos árbitros asistentes, quedando el resto fuera de esta categoría.", "C": "El árbitro principal, los árbitros asistentes y el VAR, que también se considera miembro en el terreno de juego."}, "correcta": "A", "explicacion": "Son miembros del equipo arbitral en el terreno de juego el árbitro principal, los árbitros asistentes, el cuarto árbitro, los árbitros asistentes adicionales y el árbitro asistente de reserva.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-006", "bloque": "reglas", "enunciado": "¿A qué categoría pertenecen el VAR y el AVAR dentro del equipo arbitral?", "opciones": {"A": "No forman parte del equipo arbitral, sino de un servicio técnico externo contratado por la competición.", "B": "Son los miembros del equipo arbitral de vídeo.", "C": "Se consideran miembros del equipo arbitral en el terreno de juego, igual que los árbitros asistentes."}, "correcta": "B", "explicacion": "El VAR y el AVAR son los miembros del equipo arbitral de vídeo, y ayudan al árbitro conforme a las Reglas de Juego y al Protocolo del VAR.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-007", "bloque": "reglas", "enunciado": "Uno de los árbitros asistentes incurre en una interferencia indebida o conducta incorrecta durante el partido. ¿Qué debe hacer el árbitro principal?", "opciones": {"A": "Prescindir de sus servicios e informar a las autoridades competentes.", "B": "Amonestarlo verbalmente y permitir que continúe ejerciendo sus funciones con normalidad durante el resto del partido.", "C": "Suspender definitivamente el partido de forma automática, al tratarse de un miembro del propio equipo arbitral."}, "correcta": "A", "explicacion": "El resto de miembros del equipo arbitral actuará bajo la dirección del árbitro principal; en caso de interferencia indebida o conducta incorrecta, el árbitro prescindirá de sus servicios e informará a las autoridades competentes.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-008", "bloque": "reglas", "enunciado": "Un árbitro asistente tiene un mejor ángulo de visión que el árbitro principal sobre una infracción. ¿Qué debe hacer?", "opciones": {"A": "Detener el juego directamente mediante su banderín sin necesidad de comunicárselo al árbitro principal.", "B": "Abstenerse de intervenir, ya que la decisión final corresponde exclusivamente al árbitro principal en cualquier caso.", "C": "Ayudar al árbitro principal a determinar las faltas e infracciones."}, "correcta": "C", "explicacion": "Los otros miembros del equipo arbitral en el terreno de juego ayudarán al árbitro principal a determinar las faltas e infracciones cuando tengan un mejor ángulo de visión.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-009", "bloque": "reglas", "enunciado": "Si un miembro del equipo arbitral aprecia una conducta incorrecta grave que ni el árbitro ni el resto han apreciado, ¿qué debe hacer?", "opciones": {"A": "Esperar a que finalice la temporada para incluirlo en un informe conjunto de todas las incidencias del club.", "B": "Informar a las autoridades competentes y dar parte al árbitro y a los demás miembros del equipo arbitral de la elaboración de dicho informe.", "C": "No podrá informar de ello, al no haber sido apreciado ni sancionado en el terreno de juego durante el partido."}, "correcta": "B", "explicacion": "Deberán informar a las autoridades competentes sobre cualquier conducta incorrecta grave u otros incidentes no apreciados por el árbitro ni por el resto del equipo arbitral, y dar parte de ello a los demás miembros.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-010", "bloque": "reglas", "enunciado": "¿En qué tareas ayudan los miembros del equipo arbitral en el terreno de juego, además de determinar faltas?", "opciones": {"A": "Únicamente a controlar el tiempo de juego, sin intervenir en la inspección del equipamiento de los jugadores.", "B": "A inspeccionar el terreno de juego, los balones y el equipamiento de los jugadores, y a mantener registros de tiempo, goles y conducta incorrecta.", "C": "A supervisar exclusivamente el acceso de los medios de comunicación al terreno de juego durante el partido."}, "correcta": "B", "explicacion": "Los miembros del equipo arbitral en el terreno de juego ayudan al árbitro a inspeccionar el terreno de juego, los balones y el equipamiento de los jugadores, y a mantener registros de tiempo, goles y conducta incorrecta.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 47}, {"id": "RJ6-011", "bloque": "reglas", "enunciado": "Si el árbitro principal no puede continuar dirigiendo el partido, ¿quién debe estipular el reglamento de la competición que asuma sus funciones?", "opciones": {"A": "Deberá dejarse claro si asumirá sus funciones el cuarto árbitro, el primer árbitro asistente o el primer árbitro asistente adicional.", "B": "Asumirá automáticamente sus funciones el capitán del equipo local, salvo indicación expresa en contrario.", "C": "El partido quedará suspendido definitivamente de forma automática, sin posibilidad de continuar con otro árbitro."}, "correcta": "A", "explicacion": "El reglamento de la competición deberá estipular claramente quién sustituirá a un miembro del equipo arbitral que no pueda continuar su labor, dejando claro si asumirá las funciones del árbitro el cuarto árbitro, el primer asistente o el primer asistente adicional.", "referencia": "Regla 6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-012", "bloque": "reglas", "enunciado": "¿Cuál de las siguientes NO es una tarea propia de los árbitros asistentes según la Regla 6?", "opciones": {"A": "Indicar si el balón ha salido completamente del terreno de juego y a qué equipo corresponde el saque.", "B": "Mostrar directamente tarjetas amarillas o rojas a los jugadores sin intervención del árbitro principal.", "C": "Indicar si un jugador en posición de fuera de juego debe ser sancionado."}, "correcta": "B", "explicacion": "Los árbitros asistentes indican si el balón ha salido del terreno de juego y a qué equipo corresponde el saque, si un jugador en fuera de juego debe ser sancionado o si se solicita una sustitución, entre otras tareas; no tienen la facultad de mostrar tarjetas directamente.", "referencia": "Regla 6.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-013", "bloque": "reglas", "enunciado": "En el lanzamiento de un tiro penal, ¿qué debe indicar el árbitro asistente?", "opciones": {"A": "Si el guardameta se separa de la línea de meta antes de que se ejecute el lanzamiento y si el balón cruza la línea de meta.", "B": "Si el lanzador ha tocado el balón dos veces consecutivas antes de que otro jugador lo haya tocado.", "C": "Únicamente si el balón cruza la línea de meta, sin necesidad de valorar la posición del guardameta."}, "correcta": "A", "explicacion": "En el lanzamiento de un tiro penal, el árbitro asistente indicará si el guardameta se separa de la línea de meta antes del lanzamiento y si el balón cruza la línea de meta.", "referencia": "Regla 6.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-014", "bloque": "reglas", "enunciado": "En un partido se han designado árbitros asistentes adicionales. ¿Dónde debe situarse el árbitro asistente durante la ejecución de un tiro penal?", "opciones": {"A": "Detrás del banderín de esquina más cercano a la portería donde se ejecuta el penal.", "B": "A la altura del punto de penal.", "C": "En la intersección de la línea de meta con el área de meta, igual que cuando no hay asistentes adicionales."}, "correcta": "B", "explicacion": "Si se hubieran designado árbitros asistentes adicionales, el árbitro asistente deberá situarse a la altura del punto de penal.", "referencia": "Regla 6.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-015", "bloque": "reglas", "enunciado": "¿Qué labor adicional realiza el árbitro asistente relacionada con las sustituciones?", "opciones": {"A": "Autorizar de forma independiente la entrada del jugador suplente sin conocimiento del árbitro principal.", "B": "Supervisar el procedimiento de sustitución.", "C": "Comunicar el número del jugador sustituido directamente a la mesa de control, sin intervención del cuarto árbitro."}, "correcta": "B", "explicacion": "La labor del árbitro asistente incluye también supervisar el procedimiento de sustitución.", "referencia": "Regla 6.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-016", "bloque": "reglas", "enunciado": "¿Para qué pueden entrar los árbitros asistentes en el terreno de juego durante un tiro libre?", "opciones": {"A": "Para sustituir temporalmente al árbitro principal mientras este se dirige al área de revisión del VAR.", "B": "Para ayudar a que se respete la distancia reglamentaria de 9,15 m.", "C": "Únicamente para colocar físicamente la barrera de jugadores defensores en la posición correcta."}, "correcta": "B", "explicacion": "Los árbitros asistentes podrán entrar en el terreno de juego para ayudar a que se respete la distancia de 9,15 metros (10 yardas).", "referencia": "Regla 6.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-017", "bloque": "reglas", "enunciado": "¿Cuál de las siguientes es una labor propia del cuarto árbitro?", "opciones": {"A": "Situarse en la línea de meta para indicar si el balón la ha cruzado completamente durante un tiro penal.", "B": "Comprobar el equipamiento de los jugadores y suplentes.", "C": "Determinar de forma definitiva si un jugador en posición de fuera de juego debe ser sancionado."}, "correcta": "B", "explicacion": "Entre las labores del cuarto árbitro se incluye comprobar el equipamiento de jugadores y suplentes, además de otras funciones como supervisar sustituciones o los balones de reserva.", "referencia": "Regla 6.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-018", "bloque": "reglas", "enunciado": "¿Quién permite la vuelta al terreno de juego de un jugador tras la señal o autorización del árbitro, entre otras labores?", "opciones": {"A": "El árbitro asistente de vídeo (VAR).", "B": "El delegado de campo del equipo local, previa comunicación al árbitro principal.", "C": "El cuarto árbitro."}, "correcta": "C", "explicacion": "Entre las labores del cuarto árbitro se incluye permitir la vuelta al terreno de juego de un jugador tras la señal o autorización del árbitro.", "referencia": "Regla 6.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-019", "bloque": "reglas", "enunciado": "¿Quién indica la cantidad mínima de tiempo adicional que el árbitro tiene intención de añadir al final de cada periodo?", "opciones": {"A": "El cuarto árbitro, si bien la decisión final corresponde al árbitro principal.", "B": "El árbitro asistente de vídeo, que calcula automáticamente el tiempo perdido en cada detención del juego.", "C": "El primer árbitro asistente, que se lo comunica directamente al público mediante el tablero electrónico."}, "correcta": "A", "explicacion": "El cuarto árbitro indicará el tiempo mínimo que deberá añadirse, si bien el árbitro tomará la decisión final, pudiendo aumentar el tiempo añadido pero no reducirlo.", "referencia": "Regla 6.2 / Regla 7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-020", "bloque": "reglas", "enunciado": "Una persona situada en el área técnica se comporta de forma incorrecta y el árbitro principal no lo advierte. ¿Qué debe hacer el cuarto árbitro?", "opciones": {"A": "Expulsar directamente a esa persona del área técnica sin necesidad de informar al árbitro principal.", "B": "Comunicar al árbitro que dicha persona se ha comportado de forma incorrecta.", "C": "Anotarlo únicamente en su propio registro personal, sin comunicárselo al árbitro durante el partido."}, "correcta": "B", "explicacion": "Entre las labores del cuarto árbitro está comunicar al árbitro si alguna persona situada en el área técnica se comporta de forma incorrecta.", "referencia": "Regla 6.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-021", "bloque": "reglas", "enunciado": "¿Puede el árbitro aumentar el tiempo mínimo de añadido indicado por el cuarto árbitro?", "opciones": {"A": "Sí, el árbitro puede aumentar el tiempo añadido, pero no reducirlo.", "B": "No, el tiempo indicado por el cuarto árbitro es vinculante y no puede modificarse en ningún sentido.", "C": "Sí, puede tanto aumentarlo como reducirlo libremente según su propio criterio en cada periodo."}, "correcta": "A", "explicacion": "El cuarto árbitro indicará el tiempo mínimo a añadir, pero el árbitro tomará la decisión final y podrá aumentar el tiempo añadido, aunque no reducirlo.", "referencia": "Regla 7 / Regla 6.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-022", "bloque": "reglas", "enunciado": "¿Qué pueden indicar los árbitros asistentes adicionales respecto a la línea de meta?", "opciones": {"A": "Si el balón ha atravesado completamente la línea de meta, incluyendo el caso de concederse el gol.", "B": "Únicamente si el balón ha salido por la línea de banda más próxima a su posición durante el partido.", "C": "Si el guardameta ha tocado el balón con las manos dentro o fuera de su propia área de penal."}, "correcta": "A", "explicacion": "Los árbitros asistentes adicionales podrán indicar si el balón ha atravesado completamente la línea de meta, incluido el caso de concederse el gol.", "referencia": "Regla 6.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-023", "bloque": "reglas", "enunciado": "¿Qué otra tarea corresponde a los árbitros asistentes adicionales, además de valorar la línea de meta?", "opciones": {"A": "Mostrar la tarjeta roja de forma directa cuando aprecien una infracción grave junto a la portería.", "B": "Indicar a qué equipo corresponde ejecutar el saque de esquina o de meta.", "C": "Determinar de forma exclusiva si se debe expulsar a un jugador por conducta violenta cometida a espaldas del árbitro."}, "correcta": "B", "explicacion": "Los árbitros asistentes adicionales podrán indicar, entre otras cosas, a qué equipo corresponde ejecutar el saque de esquina o de meta.", "referencia": "Regla 6.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-024", "bloque": "reglas", "enunciado": "Durante la ejecución de un tiro penal, el guardameta se separa de la línea de meta antes del lanzamiento. Si hay árbitros asistentes adicionales, ¿qué pueden indicar?", "opciones": {"A": "Solamente la posición del guardameta, correspondiendo en exclusiva al VAR valorar si el balón cruzó la línea.", "B": "Si el guardameta se separó de la línea de meta antes del lanzamiento y si el balón ha cruzado la línea de meta.", "C": "Únicamente si el balón entró en la portería, sin poder valorar la posición del guardameta en ningún caso."}, "correcta": "B", "explicacion": "En la ejecución de un tiro penal, los árbitros asistentes adicionales podrán indicar si el guardameta se separa de la línea de meta antes del lanzamiento y si el balón ha cruzado la línea de meta.", "referencia": "Regla 6.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-025", "bloque": "reglas", "enunciado": "¿A quién puede reemplazar el árbitro asistente de reserva?", "opciones": {"A": "Exclusivamente a uno de los árbitros asistentes adicionales, sin poder sustituir a otras figuras arbitrales.", "B": "Únicamente al árbitro principal, en caso de que este no pueda seguir dirigiendo el encuentro.", "C": "A un árbitro asistente, cuarto árbitro o árbitro asistente adicional que no pueda continuar con su labor."}, "correcta": "C", "explicacion": "El árbitro asistente de reserva reemplazará a un árbitro asistente, cuarto árbitro o árbitro asistente adicional que no pueda continuar con su labor.", "referencia": "Regla 6.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-026", "bloque": "reglas", "enunciado": "¿Cómo asiste el árbitro asistente de reserva al árbitro principal una vez que entra a desempeñar sus funciones?", "opciones": {"A": "De la misma forma que los demás miembros del equipo arbitral en el terreno de juego.", "B": "Únicamente desde fuera del terreno de juego, sin poder ejercer ninguna de las funciones propias de los asistentes.", "C": "Solo puede realizar funciones administrativas relacionadas con el acta del partido, no funciones de campo."}, "correcta": "A", "explicacion": "El árbitro asistente de reserva asistirá al árbitro principal de la misma forma que los demás miembros del equipo arbitral en el terreno de juego.", "referencia": "Regla 6.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-027", "bloque": "reglas", "enunciado": "¿Qué es el árbitro asistente de vídeo (VAR) según la Regla 6?", "opciones": {"A": "Un técnico externo a la organización arbitral encargado exclusivamente de manejar las cámaras del estadio, sin capacidad para asistir al árbitro en ninguna decisión.", "B": "Un miembro del equipo arbitral que asiste al árbitro a la hora de tomar una decisión utilizando imágenes, en caso de error claro u obvio o incidente grave inadvertido.", "C": "Un miembro del equipo arbitral que sustituye de forma permanente al árbitro principal cuando este solicita ayuda visual, asumiendo entonces la dirección del partido."}, "correcta": "B", "explicacion": "El VAR es un miembro del equipo arbitral que asiste al árbitro a la hora de tomar una decisión utilizando imágenes, en caso de un error claro, obvio y manifiesto o de un incidente grave inadvertido.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-028", "bloque": "reglas", "enunciado": "¿Sobre cuáles de las siguientes situaciones puede asistir el VAR al árbitro, según la Regla 6?", "opciones": {"A": "Únicamente las decisiones relacionadas con el fuera de juego, quedando excluidos el resto de supuestos.", "B": "Gol/no gol, penal/no penal, tarjeta roja (incluida una segunda amonestación claramente incorrecta) o confusión de identidad.", "C": "Cualquier decisión relativa a un saque de banda mal ejecutado, con independencia de su repercusión en el juego."}, "correcta": "B", "explicacion": "El VAR puede asistir en caso de gol/no gol, penal/no penal, tarjeta roja (incluida una segunda amonestación claramente incorrecta) o confusión de identidad cuando se amonesta o expulsa al jugador equivocado.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-029", "bloque": "reglas", "enunciado": "¿Cuál es la principal función del AVAR (asistente del árbitro asistente de vídeo)?", "opciones": {"A": "Ayudar al VAR, por ejemplo viendo las imágenes de televisión mientras este realiza un chequeo o revisión.", "B": "Comunicarse directamente con el árbitro principal sin intervención alguna del VAR durante las revisiones.", "C": "Sustituir al VAR de forma automática en cualquier revisión que dure más de un minuto de duración."}, "correcta": "A", "explicacion": "El AVAR es un miembro del equipo arbitral que principalmente ayuda al VAR, por ejemplo viendo las imágenes de televisión mientras este realiza un chequeo o revisión.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-030", "bloque": "reglas", "enunciado": "Además de ver las imágenes de televisión, ¿qué otras tareas realiza el AVAR?", "opciones": {"A": "Tomar de forma independiente la decisión final sobre la jugada revisada, comunicándosela directamente al cuarto árbitro.", "B": "Sustituir al cuarto árbitro en la supervisión del área técnica mientras dura la revisión de la jugada.", "C": "Registrar los incidentes relacionados con el VAR y los problemas de comunicación o tecnología, y asistir en la comunicación entre el VAR y el árbitro."}, "correcta": "C", "explicacion": "El AVAR registra los incidentes relacionados con el VAR y los problemas de comunicación o tecnología, y asiste en la comunicación entre el VAR y el árbitro, por ejemplo indicándole que detenga el juego o retrase la reanudación.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-031", "bloque": "reglas", "enunciado": "¿Quién lleva un registro del tiempo «perdido» mientras el juego se ha detenido para chequear o revisar una jugada con el VAR?", "opciones": {"A": "El AVAR.", "B": "El primer árbitro asistente, que lo comunica posteriormente al árbitro principal al finalizar el partido.", "C": "El cuarto árbitro, de forma exclusiva y sin intervención del AVAR en el registro de ese tiempo."}, "correcta": "A", "explicacion": "Entre las tareas del AVAR se incluye llevar un registro del tiempo «perdido» mientras el juego se ha detenido para chequear o revisar la jugada.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-032", "bloque": "reglas", "enunciado": "¿Quién informa sobre la decisión del VAR a las partes correspondientes?", "opciones": {"A": "El AVAR.", "B": "El delegado de campo, una vez finalizado el partido y por escrito en el acta correspondiente.", "C": "El propio árbitro principal exclusivamente, sin que el AVAR intervenga en dicha comunicación a las partes."}, "correcta": "A", "explicacion": "Entre las funciones del AVAR se incluye informar sobre la decisión del VAR a las partes correspondientes.", "referencia": "Regla 6.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 6", "pagina": 48}, {"id": "RJ6-033", "bloque": "reglas", "enunciado": "¿Qué labor relacionada con el material de juego corresponde también al cuarto árbitro?", "opciones": {"A": "Supervisar los balones de reserva.", "B": "Sustituir directamente cualquier balón que considere defectuoso sin consultar al árbitro principal.", "C": "Determinar en exclusiva qué balón oficial se utilizará durante todo el partido, sin intervención del árbitro."}, "correcta": "A", "explicacion": "Entre las labores del cuarto árbitro se incluye supervisar los balones de reserva.", "referencia": "Regla 6.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 6", "pagina": 48}, {"id": "RJ7-001", "bloque": "reglas", "enunciado": "El árbitro añade 3 minutos de tiempo añadido; en el minuto 92:50 se produce un penal a favor de un equipo. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Decreta el final del encuentro, ya que el lanzamiento sería fuera de tiempo.", "B": "Prolonga el tiempo necesario hasta que se ejecute el penal.", "C": "Puede lanzarse por haberse producido antes del minuto 93:00; si hubiera sido después, decretaría el final."}, "correcta": "B", "explicacion": "Cuando se concede un penal antes de finalizar el tiempo (incluido el añadido), se prolonga el partido el tiempo necesario hasta que se ejecute y resuelva el lanzamiento.", "referencia": "Regla 7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-002", "bloque": "reglas", "enunciado": "¿Quién decide la cantidad de tiempo añadido al final de cada parte?", "opciones": {"A": "El delegado de campo, tras consultar a ambos entrenadores.", "B": "El árbitro, en función del tiempo perdido durante la parte.", "C": "El cuarto árbitro exclusivamente, sin intervención del árbitro principal."}, "correcta": "B", "explicacion": "Corresponde al árbitro decidir el tiempo añadido en función del tiempo perdido por sustituciones, atención a lesionados, pérdidas de tiempo deliberadas, etc.", "referencia": "Regla 7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-003", "bloque": "reglas", "enunciado": "¿Cuál es la duración reglamentaria de cada parte de un partido de fútbol 11 en categoría senior?", "opciones": {"A": "40 minutos.", "B": "45 minutos.", "C": "50 minutos."}, "correcta": "B", "explicacion": "La duración reglamentaria de cada parte en fútbol 11 senior es de 45 minutos, salvo acuerdo distinto entre árbitro y ambos equipos antes del inicio.", "referencia": "Regla 7", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-004", "bloque": "reglas", "enunciado": "¿En cuántos periodos se desarrollará el partido y de qué duración?", "opciones": {"A": "En dos periodos iguales de 45 minutos cada uno.", "B": "En tres periodos de 30 minutos cada uno, salvo que el reglamento de la competición indique otra cosa.", "C": "En dos periodos de 40 minutos cada uno, ampliables por acuerdo entre ambos equipos."}, "correcta": "A", "explicacion": "El partido se desarrollará en dos periodos iguales de 45 minutos cada uno.", "referencia": "Regla 7.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-005", "bloque": "reglas", "enunciado": "¿En qué condiciones pueden reducirse los dos periodos de 45 minutos?", "opciones": {"A": "Por decisión unilateral del árbitro, siempre que lo comunique a ambos equipos antes del inicio del encuentro.", "B": "Por acuerdo entre los dos equipos, sin que sea necesaria la conformidad del árbitro ni del reglamento de la competición.", "C": "Únicamente por acuerdo entre el árbitro y los dos equipos antes del comienzo del partido, si lo permite el reglamento de la competición."}, "correcta": "C", "explicacion": "Los periodos solo pueden reducirse por acuerdo entre el árbitro y los dos equipos antes del comienzo del partido, siempre que esté permitido por el reglamento de la competición.", "referencia": "Regla 7.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-006", "bloque": "reglas", "enunciado": "¿Cuál es la duración máxima de la pausa del descanso de medio tiempo a la que tienen derecho los jugadores?", "opciones": {"A": "No superior a 10 minutos, salvo ampliación expresa autorizada por el árbitro.", "B": "No superior a 20 minutos, conforme a lo establecido con carácter general en la Regla 7.", "C": "No superior a 15 minutos."}, "correcta": "C", "explicacion": "Los jugadores tendrán derecho a una pausa en el descanso de medio tiempo no superior a 15 minutos.", "referencia": "Regla 7.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-007", "bloque": "reglas", "enunciado": "¿Quién puede modificar la duración de la pausa de medio tiempo estipulada por el reglamento de la competición?", "opciones": {"A": "Solamente podrá modificarse con el permiso del árbitro.", "B": "No podrá modificarse bajo ningún concepto una vez fijada por el reglamento de la competición.", "C": "Podrá modificarse libremente por acuerdo entre los dos capitanes de los equipos antes del inicio del partido."}, "correcta": "A", "explicacion": "El reglamento de la competición deberá estipular claramente la duración de la pausa de medio tiempo, la cual solamente podrá modificarse con el permiso del árbitro.", "referencia": "Regla 7.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-008", "bloque": "reglas", "enunciado": "Tras el primer periodo del tiempo suplementario (prórroga), ¿qué tipo de pausa se permite?", "opciones": {"A": "Una pausa idéntica a la del descanso de medio tiempo, de hasta 15 minutos de duración.", "B": "Una pausa breve para beber no superior a un minuto.", "C": "No se permite ningún tipo de pausa adicional tras el primer periodo de la prórroga."}, "correcta": "B", "explicacion": "También se permite una pausa breve para beber, no superior a un minuto, tras el primer periodo del tiempo suplementario.", "referencia": "Regla 7.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-009", "bloque": "reglas", "enunciado": "¿Por cuál de los siguientes motivos NO podrá el árbitro prolongar un periodo para recuperar el tiempo perdido?", "opciones": {"A": "Por sustituciones realizadas durante ese periodo, sin que sea necesario acreditar el tiempo exacto empleado.", "B": "Por la atención o retirada de jugadores lesionados, con independencia de la gravedad de la lesión sufrida.", "C": "Por una protesta verbal de un capitán ante una decisión arbitral que el árbitro considera ajustada a las reglas."}, "correcta": "C", "explicacion": "El árbitro podrá prolongar el periodo por motivos como sustituciones, atención a lesionados, pérdida deliberada de tiempo, sanciones disciplinarias, pausas médicas, retrasos del VAR, celebraciones de goles u otros retrasos significativos; una simple protesta verbal sin más consecuencia no figura entre esos motivos.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-010", "bloque": "reglas", "enunciado": "¿Cuál es la duración máxima de las pausas de rehidratación que pueden autorizarse conforme al reglamento de la competición?", "opciones": {"A": "No superior a 30 segundos, al tratarse de una interrupción meramente puntual del juego.", "B": "No superior a un minuto.", "C": "Entre 90 segundos y tres minutos, igual que las pausas de refresco."}, "correcta": "B", "explicacion": "Entre los motivos para recuperar el tiempo perdido se incluyen las pausas de rehidratación, que no serán superiores a un minuto.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-011", "bloque": "reglas", "enunciado": "¿Cuál es la duración de las pausas de refresco que pueden autorizarse conforme al reglamento de la competición?", "opciones": {"A": "Entre dos y cinco minutos, en función de las condiciones meteorológicas del encuentro.", "B": "Entre 90 segundos y tres minutos.", "C": "No superior a un minuto, igual que las pausas de rehidratación."}, "correcta": "B", "explicacion": "Entre los motivos para recuperar el tiempo perdido se incluyen las pausas de refresco, de entre 90 segundos y tres minutos.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-012", "bloque": "reglas", "enunciado": "Durante un partido se producen varias celebraciones prolongadas de goles y retrasos por chequeos del VAR. ¿Pueden tenerse en cuenta estos motivos para prolongar el periodo?", "opciones": {"A": "Solo los retrasos del VAR pueden justificar la prolongación del periodo, no así las celebraciones de los goles.", "B": "No, únicamente las lesiones y las sustituciones pueden justificar la prolongación de un periodo según la Regla 7.", "C": "Sí, las celebraciones de goles y los retrasos originados por los chequeos y revisiones del VAR son motivos válidos para recuperar el tiempo perdido."}, "correcta": "C", "explicacion": "El árbitro podrá prolongar el periodo para recuperar el tiempo perdido debido, entre otros motivos, a las celebraciones de goles y a los retrasos originados por los chequeos y revisiones del VAR.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-013", "bloque": "reglas", "enunciado": "¿Quién indica el tiempo mínimo que deberá añadirse al final de cada periodo?", "opciones": {"A": "El primer árbitro asistente, mediante comunicación directa al marcador electrónico del estadio.", "B": "El árbitro asistente de vídeo, de forma vinculante para el árbitro principal.", "C": "El cuarto árbitro, si bien la decisión final corresponde al árbitro."}, "correcta": "C", "explicacion": "El cuarto árbitro indicará el tiempo mínimo que deberá añadirse, si bien el árbitro tomará la decisión final al respecto.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-014", "bloque": "reglas", "enunciado": "¿Puede el árbitro reducir el tiempo añadido indicado por el cuarto árbitro?", "opciones": {"A": "Solo puede reducirlo si ambos equipos están de acuerdo en que el tiempo indicado es excesivo.", "B": "No, el árbitro podrá aumentar el tiempo añadido, pero no reducirlo.", "C": "Sí, el árbitro puede tanto aumentar como reducir libremente el tiempo indicado por el cuarto árbitro."}, "correcta": "B", "explicacion": "El cuarto árbitro indicará el tiempo mínimo a añadir, pero el árbitro tomará la decisión final y podrá aumentar el tiempo añadido, aunque no reducirlo.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-015", "bloque": "reglas", "enunciado": "El árbitro cometió un error de cronometraje durante el primer periodo, añadiendo menos tiempo del debido. ¿Puede compensarlo alargando la duración del segundo periodo?", "opciones": {"A": "Sí, es obligatorio que compense cualquier error de cronometraje del primer periodo ampliando el segundo periodo.", "B": "Sí, siempre que el tiempo adicional que añada en el segundo periodo no supere los cinco minutos.", "C": "No, el árbitro no podrá compensar un error de cronometraje del primer periodo cambiando la duración del segundo."}, "correcta": "C", "explicacion": "El árbitro no podrá compensar un error de cronometraje del primer periodo cambiando la duración del segundo periodo.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-016", "bloque": "reglas", "enunciado": "Al final de un periodo se debe ejecutar un tiro penal concedido justo antes de que se cumpliera el tiempo. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Prolongar el periodo hasta que el penal se haya completado.", "B": "Decretar el final del periodo, ya que el tiempo reglamentario y el añadido ya han concluido.", "C": "Aplazar la ejecución del penal hasta el inicio del siguiente periodo del partido."}, "correcta": "A", "explicacion": "En caso de que se deba ejecutar o repetir un penal al final de un periodo, este se prolongará hasta que el penal se haya completado.", "referencia": "Regla 7.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-017", "bloque": "reglas", "enunciado": "Se concede un tiro penal al final de un periodo, se lanza, se produce un rechace y el árbitro ordena su repetición por una infracción previa a la ejecución. ¿Debe darse por finalizado el periodo antes de repetirlo?", "opciones": {"A": "Sí, el periodo finaliza en cuanto se produce el primer lanzamiento, sin posibilidad de repetirlo.", "B": "Sí, salvo que ambos equipos acuerden expresamente continuar el partido para permitir la repetición.", "C": "No, el periodo se prolongará hasta que el penal, incluida su repetición, se haya completado."}, "correcta": "C", "explicacion": "En caso de que se deba ejecutar o repetir un penal al final de un periodo, este se prolongará hasta que el penal se haya completado.", "referencia": "Regla 7.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-018", "bloque": "reglas", "enunciado": "Un partido se suspende definitivamente antes de su conclusión. ¿Qué ocurre con dicho encuentro, salvo que se estipule otro procedimiento?", "opciones": {"A": "Se da por finalizado con el resultado que reflejara el marcador en el momento de la suspensión.", "B": "Se considera empate a cero de forma automática, con independencia del resultado en el momento de la suspensión.", "C": "Se volverá a jugar."}, "correcta": "C", "explicacion": "Se volverán a jugar los partidos suspendidos definitivamente, a menos que el reglamento de la competición o el organizador estipulen otro procedimiento.", "referencia": "Regla 7.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-019", "bloque": "reglas", "enunciado": "¿Quién puede estipular un procedimiento distinto al de volver a jugar un partido suspendido definitivamente?", "opciones": {"A": "Únicamente el árbitro que dirigía el encuentro en el momento de la suspensión.", "B": "Los dos equipos, mediante acuerdo mutuo alcanzado tras la suspensión del partido.", "C": "El reglamento de la competición o el organizador de la misma."}, "correcta": "C", "explicacion": "Los partidos suspendidos definitivamente se volverán a jugar, a menos que el reglamento de la competición o el organizador de la misma estipulen otro procedimiento.", "referencia": "Regla 7.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 52}, {"id": "RJ7-020", "bloque": "reglas", "enunciado": "Durante un partido se producen varias sustituciones y una sanción disciplinaria que requiere tiempo para su gestión. ¿Puede el árbitro tener en cuenta ambos motivos para prolongar el periodo?", "opciones": {"A": "Sí, tanto las sustituciones como las sanciones disciplinarias son motivos válidos para recuperar el tiempo perdido.", "B": "No, las sanciones disciplinarias no están contempladas como motivo de recuperación de tiempo perdido.", "C": "No, únicamente las sustituciones están contempladas, no así las sanciones disciplinarias."}, "correcta": "A", "explicacion": "El árbitro podrá prolongar el periodo para recuperar el tiempo perdido debido a sustituciones y a sanciones disciplinarias, entre otros motivos.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-021", "bloque": "reglas", "enunciado": "Durante un partido, un equipo incurre repetidamente en pérdida deliberada de tiempo (retrasando saques, alejando el balón, etc.). ¿Puede el árbitro tener en cuenta este motivo para prolongar el periodo?", "opciones": {"A": "No, la pérdida deliberada de tiempo se sanciona disciplinariamente pero no está contemplada como motivo de recuperación de tiempo perdido.", "B": "Sí, la pérdida deliberada de tiempo es uno de los motivos previstos para prolongar el periodo y recuperar el tiempo perdido.", "C": "Solo puede tenerse en cuenta si, además, conlleva una amonestación al jugador infractor."}, "correcta": "B", "explicacion": "Entre los motivos que permiten al árbitro prolongar un periodo para recuperar el tiempo perdido se encuentra la pérdida deliberada de tiempo.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-022", "bloque": "reglas", "enunciado": "El juego se detiene un tiempo significativo porque un espectador invade el terreno de juego e interfiere en el desarrollo del partido. ¿Puede el árbitro añadir tiempo por este motivo?", "opciones": {"A": "No, las interferencias de agentes externos ajenos a los equipos no están contempladas como motivo de recuperación de tiempo perdido.", "B": "Sí, siempre que la interferencia haya sido provocada por un miembro del cuerpo técnico de alguno de los equipos.", "C": "Sí, todo retraso significativo al reanudarse el juego, incluido el debido a la interferencia de un agente externo, es un motivo válido para prolongar el periodo."}, "correcta": "C", "explicacion": "El árbitro podrá prolongar el periodo por cualquier otro motivo, lo que incluye todo retraso significativo al reanudarse el juego, como el debido a una interferencia causada por un agente externo.", "referencia": "Regla 7.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-023", "bloque": "reglas", "enunciado": "¿Cuál es la duración prevista para las pausas de rehidratación?", "opciones": {"A": "No superior a un minuto.", "B": "Entre 1 y 3 minutos.", "C": "Entre 90 segundos y 3 minutos."}, "correcta": "A", "explicacion": "Las pausas de rehidratación tienen una duración no superior a un minuto, distinguiéndose de la pausa de refresco.", "referencia": "Reanudaciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 51}, {"id": "RJ7-024", "bloque": "reglas", "enunciado": "Según las Reglas de Juego, ¿qué es la 'pausa de refresco'?", "opciones": {"A": "Una interrupción no superior a un minuto para que los jugadores se rehidraten.", "B": "Una pausa de 90 segundos a 3 minutos en interés de los jugadores y su salud, sin más condicionantes.", "C": "Una pausa de 90 segundos a 3 minutos contemplada por condiciones meteorológicas de temperatura y humedad altas, distinta de la de rehidratación."}, "correcta": "C", "explicacion": "La pausa de refresco se prevé, por motivos meteorológicos (temperatura y humedad altas), con duración de 90 segundos a 3 minutos, y se distingue de la pausa de rehidratación.", "referencia": "Reglamento de la competición", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 7", "pagina": 110}, {"id": "RJ8-001", "bloque": "reglas", "enunciado": "El árbitro concede un balón a tierra al guardameta dentro de su propia área penal. ¿Deben el resto de jugadores abandonar el área penal?", "opciones": {"A": "No es obligatorio abandonar el área; basta con que todos los jugadores, de ambos equipos, guarden una distancia mínima de 4 metros con respecto al balón hasta que esté en juego.", "B": "Sí; todos los jugadores de ambos equipos deben abandonar el área penal, y solo el guardameta puede permanecer dentro de ella.", "C": "Solo los adversarios deben abandonar el área; los compañeros del guardameta pueden permanecer dentro sin restricción de distancia."}, "correcta": "A", "explicacion": "El resto de jugadores, de ambos equipos, deberán mantener una distancia mínima de 4 m (4,5 yd) con respecto al balón hasta que esté en juego; no existe obligación de abandonar el área penal.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-002", "bloque": "reglas", "enunciado": "¿Qué condición debe darse para que un gol logrado directamente de un balón a tierra sea válido?", "opciones": {"A": "Que el balón haya tocado como mínimo a dos jugadores, sin que la regla exija que sean de equipos distintos.", "B": "Que el balón sea tocado previamente por dos jugadores del mismo equipo.", "C": "Que el balón sea tocado previamente por dos jugadores, uno de cada equipo."}, "correcta": "A", "explicacion": "Si tras un balón a tierra el balón entra en la portería sin haber tocado como mínimo a dos jugadores, no sube el gol; la regla no exige que esos dos jugadores pertenezcan a equipos distintos.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-003", "bloque": "reglas", "enunciado": "El árbitro detiene el juego por una causa no prevista específicamente en otra regla (por ejemplo, un objeto lanzado desde la grada que interfiere en el juego) sin que ningún equipo haya cometido infracción. ¿Cómo reanuda el juego?", "opciones": {"A": "Con un tiro libre indirecto a favor del equipo que tenía la posesión.", "B": "Con un balón a tierra en el lugar donde se encontraba el balón cuando se detuvo el juego.", "C": "Con un saque de banda a favor del equipo defensor."}, "correcta": "B", "explicacion": "Cuando el juego se detiene por una causa no contemplada de otro modo en las reglas, sin infracción de ningún equipo, se reanuda con un balón a tierra en el lugar donde estaba el balón.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-004", "bloque": "reglas", "enunciado": "¿Cómo se pone en juego el balón al inicio de cada parte y tras un gol?", "opciones": {"A": "Con un saque de banda desde el centro del campo.", "B": "Con un saque inicial desde el punto central del terreno de juego.", "C": "Con un balón a tierra en el punto central."}, "correcta": "B", "explicacion": "El juego se pone en marcha al inicio de cada parte y tras cada gol mediante un saque inicial (saque de centro) desde el punto central.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-005", "bloque": "reglas", "enunciado": "En el saque inicial, ¿pueden los adversarios del equipo que saca situarse dentro del círculo central?", "opciones": {"A": "Sí, sin restricción, siempre que no lleguen a tocar el balón antes de que este esté en juego según el árbitro.", "B": "No, deben permanecer fuera del círculo central hasta que el balón esté en juego.", "C": "Solo el capitán rival puede permanecer dentro del círculo, mientras el resto de sus compañeros deben permanecer fuera."}, "correcta": "B", "explicacion": "En el saque inicial, todos los jugadores del equipo que no saca deben permanecer fuera del círculo central hasta que el balón esté en juego.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-006", "bloque": "reglas", "enunciado": "¿En qué momentos se iniciará el juego con un saque inicial?", "opciones": {"A": "Al comienzo de cada periodo, incluida la tanda de penales, y después de cada gol anotado.", "B": "Al comienzo de cada uno de los dos periodos del partido, del tiempo suplementario y después de la anotación de un gol.", "C": "Únicamente al comienzo del partido, ya que tras un gol el juego se reanuda siempre con un balón a tierra."}, "correcta": "B", "explicacion": "El juego se iniciará con un saque inicial al comienzo de cada uno de los dos periodos, del tiempo suplementario y después de la anotación de un gol.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-007", "bloque": "reglas", "enunciado": "¿Cómo se reanudará el juego cuando el árbitro lo detenga por un motivo no contemplado en las Reglas de Juego?", "opciones": {"A": "Con un saque de banda a favor del equipo que se encontrara más próximo al lugar de la detención.", "B": "Con un balón a tierra.", "C": "Siempre con un tiro libre indirecto a favor del equipo que tuviera la posesión del balón."}, "correcta": "B", "explicacion": "Cuando el árbitro detenga el juego por un motivo no contemplado en las Reglas de Juego, este se reanudará con un balón a tierra.", "referencia": "Regla 8", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-008", "bloque": "reglas", "enunciado": "Se comete una infracción mientras el balón no está en juego. ¿Afecta esto a la manera en que se reanudará el juego?", "opciones": {"A": "Sí, siempre obligan a modificar la reanudación prevista inicialmente a favor del equipo perjudicado.", "B": "No, las infracciones cometidas cuando el balón no está en juego no afectarán a la manera en que este se reanude.", "C": "Sí, pero únicamente cuando la infracción sea cometida por un jugador titular y no por un suplente."}, "correcta": "B", "explicacion": "Las infracciones cometidas cuando el balón no esté en juego no afectarán a la manera en que este se reanude.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-009", "bloque": "reglas", "enunciado": "¿Qué debe hacer el árbitro antes del inicio del partido en relación con el sorteo de campo?", "opciones": {"A": "Preguntará a ambos capitanes cuál de los dos equipos prefiere ejecutar el saque inicial, sin realizar sorteo alguno.", "B": "Lanzará una moneda al aire para sortear el campo, y el equipo ganador elegirá la mitad del campo o ejecutar el saque inicial.", "C": "Asignará el campo y el saque inicial en función de la clasificación de cada equipo en la competición."}, "correcta": "B", "explicacion": "El árbitro lanzará una moneda al aire para sortear el campo y el equipo ganador elegirá o bien la mitad del campo desde la que atacará en el primer tiempo, o bien ejecutar el saque inicial.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-010", "bloque": "reglas", "enunciado": "¿Qué equipo ejecutará el saque de centro para iniciar el segundo tiempo?", "opciones": {"A": "El equipo que eligió el campo para el primer tiempo.", "B": "El equipo que hubiera marcado el último gol antes de finalizar el primer tiempo.", "C": "El equipo que ejecutó el saque inicial en el primer tiempo, manteniendo el mismo orden en el segundo."}, "correcta": "A", "explicacion": "El equipo que elija el campo para el primer tiempo ejecutará el saque de centro para iniciar el segundo tiempo.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-011", "bloque": "reglas", "enunciado": "El Equipo A marca un gol durante el partido. ¿Cómo se reanudará el juego a continuación?", "opciones": {"A": "El propio Equipo A, que marcó el gol, reanudará el juego con un saque inicial.", "B": "El juego se reanudará con un balón a tierra en el círculo central, a favor de cualquiera de los dos equipos.", "C": "El equipo adversario, el Equipo B, reanudará el juego con un saque inicial."}, "correcta": "C", "explicacion": "Cuando un equipo marque un gol, el equipo adversario reanudará el juego con un saque inicial.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-012", "bloque": "reglas", "enunciado": "En el saque inicial, ¿dónde deben encontrarse todos los jugadores, excepto el que lo ejecuta?", "opciones": {"A": "Fuera del círculo central, con independencia de la mitad del campo en la que se encuentren.", "B": "A una distancia mínima de 9,15 metros del balón, pudiendo estar en cualquier mitad del campo.", "C": "En su propia mitad del terreno de juego."}, "correcta": "C", "explicacion": "En el saque inicial, todos los jugadores, excepto el que ejecute el saque, deberán encontrarse en su propia mitad del terreno de juego.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ8-013", "bloque": "reglas", "enunciado": "¿A qué distancia mínima del balón deben encontrarse los adversarios del equipo que efectúa el saque inicial?", "opciones": {"A": "4 metros (4,5 yardas), igual que en el caso de un balón a tierra.", "B": "9,15 metros (10 yardas), hasta que el balón entre en juego.", "C": "5 metros, distancia general aplicable a cualquier reanudación del juego."}, "correcta": "B", "explicacion": "Los adversarios del equipo que efectúe el saque deberán encontrarse como mínimo a 9,15 m (10 yd) del balón hasta que entre en juego.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-014", "bloque": "reglas", "enunciado": "¿Puede el balón golpearse con el pie en el saque inicial antes de que el árbitro dé la señal?", "opciones": {"A": "No, el balón se colocará en el punto central y no se podrá golpear con el pie hasta que el árbitro lo indique.", "B": "Sí, siempre que el equipo que ejecute el saque avise previamente al árbitro de su intención de sacar.", "C": "Sí, el balón puede golpearse en cuanto esté correctamente colocado en el punto central, sin esperar señal alguna."}, "correcta": "A", "explicacion": "En el saque inicial, el balón se colocará en el punto central y no se podrá golpear con el pie hasta que el árbitro así lo indique.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-015", "bloque": "reglas", "enunciado": "¿Cuándo se considerará que el balón está en juego en un saque inicial?", "opciones": {"A": "En el momento en que lo golpee con el pie el jugador que haya efectuado el saque y se mueva con claridad.", "B": "En el momento en que el balón sea tocado por un segundo jugador distinto del que ejecutó el saque.", "C": "En el momento en que el árbitro dé la señal para iniciar el juego, con independencia de si el balón se ha movido."}, "correcta": "A", "explicacion": "El balón estará en juego en el momento en que lo golpee con el pie el jugador que haya efectuado el saque y se mueva con claridad.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-016", "bloque": "reglas", "enunciado": "En un saque inicial, el balón entra directamente en la meta del equipo que ejecuta el saque, sin haber sido tocado por ningún otro jugador. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Ordenará la repetición del saque inicial, sin conceder ninguna reanudación a favor del adversario.", "B": "Concederá un gol válido al equipo adversario, al haber entrado el balón en la portería.", "C": "Concederá un saque de esquina al equipo adversario."}, "correcta": "C", "explicacion": "Será posible marcar un gol directo al equipo adversario desde el saque inicial; si el balón entrara directamente en la meta del lanzador, se concederá saque de esquina al adversario.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-017", "bloque": "reglas", "enunciado": "El jugador que ejecuta el saque inicial toca el balón por segunda vez de forma voluntaria con el pie, antes de que lo haya tocado otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordenará la repetición del saque inicial, sin ninguna sanción adicional para el equipo infractor.", "B": "Concederá un tiro libre directo a favor del equipo adversario en todos los casos, sin excepción.", "C": "Concederá un tiro libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "En caso de que el jugador que ejecute el saque inicial toque el balón por segunda vez antes de que lo toque otro jugador, se concederá un tiro libre indirecto, o bien un libre directo si cometiese una infracción por mano.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-018", "bloque": "reglas", "enunciado": "El jugador que ejecuta el saque inicial toca el balón por segunda vez con la mano de forma deliberada, antes de que lo haya tocado otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concederá un tiro libre directo a favor del equipo adversario, por tratarse de una infracción por mano.", "B": "Ordenará únicamente la repetición del saque inicial, sin sanción disciplinaria ni tiro libre a favor del rival.", "C": "Concederá un tiro libre indirecto a favor del equipo adversario, como en cualquier doble toque del saque inicial."}, "correcta": "A", "explicacion": "Si el jugador que ejecuta el saque inicial toca el balón por segunda vez antes de que lo toque otro jugador, se concederá indirecto, o bien un libre directo si cometiese una infracción por mano.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-019", "bloque": "reglas", "enunciado": "En el saque inicial se comete una infracción del procedimiento distinta al doble toque del ejecutor, por ejemplo un jugador que invade el campo contrario antes de que el balón esté en juego. ¿Cómo debe actuar el árbitro?", "opciones": {"A": "Concederá directamente un tiro libre indirecto a favor del equipo adversario sin repetir el saque.", "B": "Permitirá que el juego continúe con normalidad, sin adoptar ninguna medida al respecto.", "C": "Ordenará que se repita el saque inicial."}, "correcta": "C", "explicacion": "Para cualquier otra infracción del procedimiento de saque inicial distinta al doble toque, se repetirá dicho saque.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-020", "bloque": "reglas", "enunciado": "¿A qué distancia mínima del balón deben permanecer los jugadores que no ejecutan un balón a tierra?", "opciones": {"A": "1 metro, al tratarse de una reanudación de menor entidad que el saque inicial.", "B": "9,15 metros (10 yardas), la misma distancia exigida en el saque inicial y los tiros libres.", "C": "4 metros (4,5 yardas), hasta que el balón esté en juego."}, "correcta": "C", "explicacion": "El resto de jugadores, de ambos equipos, deberán mantener una distancia mínima de 4 m (4,5 yd) con respecto al balón hasta que este esté en juego.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-021", "bloque": "reglas", "enunciado": "El árbitro debe conceder un balón a tierra y el balón se encontraba dentro del área penal en el momento de la detención. ¿A quién se concede?", "opciones": {"A": "A un jugador del equipo que hubiera conservado o ganado la posesión, aunque no sea el guardameta.", "B": "Al capitán del equipo defensor, que decidirá libremente en qué punto del área se ejecuta.", "C": "Al guardameta del equipo defensor, dentro de su propia área penal."}, "correcta": "C", "explicacion": "Si el balón está en el área penal, el árbitro concederá un balón a tierra al guardameta del equipo defensor dentro de su área penal.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-022", "bloque": "reglas", "enunciado": "El árbitro debe conceder un balón a tierra y el balón se encontraba fuera del área penal. ¿A favor de quién se concede, con carácter general?", "opciones": {"A": "Del jugador que se encuentre físicamente más cercano al lugar donde se produjo la detención del juego.", "B": "Del guardameta del equipo defensor, con independencia del lugar del terreno de juego en que se produzca.", "C": "De un jugador del equipo que habría conservado o ganado la posesión del balón, si el árbitro puede determinarlo."}, "correcta": "C", "explicacion": "Si el balón está fuera del área penal, el árbitro concederá el balón a tierra a favor de un jugador del equipo que habría conservado o ganado la posesión, siempre que pueda determinarlo.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-023", "bloque": "reglas", "enunciado": "El árbitro no puede determinar con claridad qué equipo habría conservado o ganado la posesión del balón al detener el juego fuera del área penal. ¿Cómo debe proceder?", "opciones": {"A": "Suspenderá temporalmente el partido hasta poder determinar con seguridad a qué equipo corresponde.", "B": "Concederá el balón a tierra al equipo visitante, por defecto, salvo acuerdo expreso entre ambos capitanes.", "C": "Dejará caer el balón ante un jugador del equipo que lo tocó por última vez."}, "correcta": "C", "explicacion": "Si el árbitro no puede determinar qué equipo habría conservado o ganado la posesión, dejará caer el balón ante un jugador del equipo que lo tocó por última vez.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-024", "bloque": "reglas", "enunciado": "¿Dónde deberá tocar el suelo el balón en un balón a tierra, con carácter general?", "opciones": {"A": "En el punto del terreno de juego más cercano al círculo central, con independencia de dónde se detuviera el juego.", "B": "En el lugar en el que se encontraba cuando se detuvo el juego.", "C": "En el punto medio entre la posición del balón y la portería del equipo que resulte beneficiado por la concesión."}, "correcta": "B", "explicacion": "El balón deberá tocar el suelo en el lugar en el que se encontraba cuando se detuvo el juego, salvo que hubiera impactado en un árbitro o agente externo.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-025", "bloque": "reglas", "enunciado": "El juego se detiene porque el balón impacta en el árbitro y permanece en el terreno de juego, provocando un cambio en la posesión. ¿Dónde debe dejarse caer el balón a tierra?", "opciones": {"A": "En el lugar en el que se produjo la interferencia o el contacto con el árbitro.", "B": "En el círculo central, al tratarse de una interferencia del propio equipo arbitral y no de un jugador.", "C": "En el lugar exacto en el que se encontraba el balón antes de impactar en el árbitro, sin tener en cuenta el punto de contacto."}, "correcta": "A", "explicacion": "El balón deberá tocar el suelo en el lugar donde se encontraba cuando se detuvo el juego, a menos que hubiera impactado en un árbitro o un agente externo, en cuyo caso se dejará caer en el lugar de la interferencia o el contacto.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-026", "bloque": "reglas", "enunciado": "Al ejecutarse un balón a tierra, este toca a un jugador antes de tocar el suelo. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Se repetirá el balón a tierra.", "B": "Se dará por válida la jugada y el juego continuará con normalidad sin ninguna repetición.", "C": "Se concederá un tiro libre indirecto a favor del equipo contrario al del jugador que tocó el balón."}, "correcta": "A", "explicacion": "Se repetirá el balón a tierra si este toca a un jugador antes de tocar el suelo.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-027", "bloque": "reglas", "enunciado": "Un balón a tierra sale del terreno de juego inmediatamente después de tocar el suelo, sin haber tocado a ningún jugador. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "El juego continuará con normalidad, considerando que el balón entró correctamente en juego antes de salir.", "B": "Se repetirá el balón a tierra.", "C": "Se concederá un saque de banda a favor del equipo que no tocó el balón en último lugar."}, "correcta": "B", "explicacion": "Se repetirá el balón a tierra si este sale del terreno de juego después de tocar el suelo sin haber tocado a un jugador.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-028", "bloque": "reglas", "enunciado": "Tras un balón a tierra, el balón entra directamente en la portería del equipo adversario sin haber tocado como mínimo a dos jugadores. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un balón a tierra, que deberá repetirse íntegramente el número de veces que sea necesario hasta lograr dos toques.", "B": "Con un saque de meta.", "C": "Se concederá gol válido, al haber entrado el balón en la portería contraria."}, "correcta": "B", "explicacion": "Si tras un balón a tierra, este entrara en la portería sin tocar como mínimo a dos jugadores, el juego se reanudará con un saque de meta si entró en la portería del adversario.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-029", "bloque": "reglas", "enunciado": "Tras un balón a tierra, el propio balón entra en la portería del jugador que lo tocó, sin haber sido tocado como mínimo por dos jugadores. ¿Cómo se reanuda el juego?", "opciones": {"A": "El gol se considerará válido igualmente, al tratarse de una reanudación reglamentaria del juego.", "B": "Con un saque de esquina.", "C": "Con un saque de meta a favor del equipo que sufrió el gol en su propia portería."}, "correcta": "B", "explicacion": "Si tras un balón a tierra, este entrara en la portería sin tocar como mínimo a dos jugadores, el juego se reanudará con un saque de esquina si entró en la portería del jugador que tocó el balón.", "referencia": "Regla 8.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-030", "bloque": "reglas", "enunciado": "En un saque inicial, el ejecutor golpea el balón directamente hacia la portería contraria y este entra sin ser tocado por nadie más. ¿Es válido el gol?", "opciones": {"A": "Sí, es posible marcar un gol directo al equipo adversario desde el saque inicial.", "B": "No, el gol solo puede subir al marcador si el balón ha sido tocado antes por otro jugador.", "C": "No, se concederá un saque de meta al equipo defensor por tratarse de un disparo directo no reglamentario."}, "correcta": "A", "explicacion": "Será posible marcar un gol directo al equipo adversario desde el saque inicial.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 8", "pagina": 54}, {"id": "RJ8-031", "bloque": "reglas", "enunciado": "Al comenzar el segundo tiempo, ¿qué ocurre con el campo que atacaba cada equipo?", "opciones": {"A": "Los equipos cambian de campo y atacan la portería opuesta a la del primer tiempo.", "B": "Cada equipo continúa atacando la misma portería que en el primer tiempo.", "C": "Se sortea de nuevo el campo mediante lanzamiento de moneda antes del segundo tiempo."}, "correcta": "A", "explicacion": "En el segundo tiempo, los equipos cambiarán de campo y atacarán la portería opuesta.", "referencia": "Regla 8.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 8", "pagina": 53}, {"id": "RJ9-001", "bloque": "reglas", "enunciado": "Durante el partido, un segundo balón entra al terreno de juego. ¿Qué debe hacer el árbitro, con carácter general, si el segundo balón no interfiere el juego?", "opciones": {"A": "Detiene siempre el juego, aunque no interfiera, para retirar el balón sobrante antes de permitir que continúe la jugada.", "B": "Deja que el juego continúe mientras no interfiera; si interfiere, detiene el juego y reanuda con balón a tierra, con las salvedades previstas para un gol en curso.", "C": "Concede automáticamente un balón a tierra a favor del equipo defensor, interfiera o no en el desarrollo de la jugada."}, "correcta": "B", "explicacion": "El criterio general es dejar continuar el juego si el balón sobrante no interfiere; si interfiere, se detiene y reanuda con balón a tierra, salvo las excepciones relativas a un gol que ya iba a producirse.", "referencia": "Regla 9", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 9", "pagina": 56}, {"id": "RJ9-002", "bloque": "reglas", "enunciado": "Un atacante dispara a portería desde fuera del área; el balón impacta en el árbitro, que está situado dentro del área de penal, y sale por la línea de meta. ¿Cómo reanuda el árbitro el juego?", "opciones": {"A": "Con balón a tierra a favor del equipo atacante en el lugar del último contacto.", "B": "Con balón a tierra dentro del área para el guardameta del equipo defensor.", "C": "Con un saque de meta."}, "correcta": "C", "explicacion": "Cuando el balón sale por línea de meta tras tocar al árbitro (agente neutro) sin haber entrado en la portería, se reanuda con saque de meta, como en cualquier salida por esa línea procedente de un atacante.", "referencia": "Regla 9", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 9", "pagina": 56}, {"id": "RJ9-003", "bloque": "reglas", "enunciado": "El guardameta lanza el balón lejos de su portería para pedir asistencia médica; el árbitro detiene el juego justo cuando el balón iba a ser recogido con claridad por un jugador del equipo contrario. ¿Cómo reanuda el árbitro el juego?", "opciones": {"A": "Con balón a tierra a favor del equipo del guardameta, en el lugar donde estaba el balón al detenerse el juego.", "B": "Con balón a tierra a favor del portero, dentro de su propia área.", "C": "Con balón a tierra a favor del equipo contrario, en el lugar donde estaba el balón al detenerse el juego."}, "correcta": "C", "explicacion": "Cuando se detiene el juego por una causa ajena al desarrollo normal (petición de asistencia) y el balón iba a ser recogido claramente por el equipo contrario, el balón a tierra se concede a ese equipo en el lugar donde estaba el balón.", "referencia": "Regla 9", "fuente": "ReglasDelJ
