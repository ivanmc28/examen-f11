rencia": "Glosario / Entrada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-021", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una «disputa»?", "opciones": {"A": "Acción con la que un jugador impide que el balón de un adversario llegue al destino pretendido.", "B": "Disputa con el pie por el balón, a ras del suelo o por el aire.", "C": "Acción con la que un jugador pugna con un adversario por un balón cercano con el fin de arrebatárselo."}, "correcta": "C", "explicacion": "Disputa es la acción con la que un jugador pugna con un adversario por un balón cercano para arrebatárselo.", "referencia": "Glosario / Disputa", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-022", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «chequeo»?", "opciones": {"A": "Análisis y valoración por parte del VAR de las imágenes de televisión relativas a goles, penales, tarjetas rojas directas o confusiones de identidad.", "B": "Análisis final por parte del árbitro principal de las imágenes de televisión en el área de revisión situada junto al terreno de juego.", "C": "Análisis del árbitro asistente de vídeo de cualquier decisión tomada por el árbitro durante el partido."}, "correcta": "A", "explicacion": "El chequeo es el análisis del VAR de las imágenes por decisiones sobre goles, penales, rojas directas o confusiones de identidad.", "referencia": "Glosario / Chequeo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 107}, {"id": "GL-023", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una «revisión»?", "opciones": {"A": "Análisis del VAR de las imágenes de televisión desde distintos ángulos y velocidades sobre decisiones controvertidas, sin que el árbitro deba acudir al área de revisión.", "B": "Análisis y valoración del árbitro asistente adicional de una decisión sobre gol o no gol durante el partido, comunicada directamente al árbitro principal.", "C": "Análisis y valoración final por el árbitro principal de las imágenes de televisión sobre un posible error claro, obvio y manifiesto o un incidente grave inadvertido, en el área de revisión."}, "correcta": "C", "explicacion": "La revisión es el análisis final del árbitro principal en el área de revisión de un posible error claro o incidente grave inadvertido.", "referencia": "Glosario / Revisión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 110}, {"id": "GL-024", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define la «conducta antideportiva»?", "opciones": {"A": "Acción o comportamiento contrarios al espíritu del juego limpio y la deportividad, sancionables con amonestación.", "B": "Acción o comportamiento contrarios al espíritu del juego limpio, sancionables con expulsión.", "C": "Acción con fuerza excesiva o brutalidad contra un adversario sin disputar el balón."}, "correcta": "A", "explicacion": "La conducta antideportiva es la contraria al juego limpio y la deportividad, sancionable con amonestación.", "referencia": "Glosario / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-025", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define la «conducta violenta»?", "opciones": {"A": "Acción en la que el jugador se excede en la fuerza y la impetuosidad al disputar el balón a un adversario, con independencia de que exista o no disputa directa del balón.", "B": "Entrada o disputa del balón que pone en peligro la integridad física de un adversario con fuerza excesiva o brutalidad, existiendo siempre intención de jugar el balón.", "C": "Acción sin el balón en disputa en la que el jugador actúa o tiene la intención de actuar con fuerza excesiva o brutalidad contra un adversario, o golpea intencionadamente en la cabeza o cara con fuerza y de forma agresiva."}, "correcta": "C", "explicacion": "La conducta violenta es una acción sin el balón en disputa con fuerza excesiva o brutalidad, o golpeando con fuerza en la cabeza o cara.", "referencia": "Glosario / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 107}, {"id": "GL-026", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el «juego brusco y grave»?", "opciones": {"A": "Entrada o disputa del balón que pone en peligro la integridad física de un adversario, con fuerza excesiva o brutalidad, sancionable con expulsión.", "B": "Acción sin el balón en disputa en la que el jugador actúa con fuerza excesiva o brutalidad contra un adversario.", "C": "Entrada o disputa del balón realizada sin tener en cuenta el riesgo para el adversario, sancionable con amonestación."}, "correcta": "A", "explicacion": "El juego brusco y grave es la entrada o disputa que pone en peligro la integridad del adversario con fuerza excesiva o brutalidad; se sanciona con expulsión.", "referencia": "Glosario / Juego brusco y grave", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 109}, {"id": "GL-027", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué se entiende por «deliberado»?", "opciones": {"A": "Acción realizada de manera premeditada e intencionada, nunca de forma refleja ni por reacción involuntaria.", "B": "Acción realizada con intención de dañar al adversario, aunque sea de manera refleja.", "C": "Acción realizada de manera consciente, aunque pueda ser refleja si el jugador tiene tiempo de reacción."}, "correcta": "A", "explicacion": "Deliberado es lo premeditado e intencionado, nunca refleja ni fruto de una reacción involuntaria.", "referencia": "Glosario / Deliberado", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-028", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «desaprobación»?", "opciones": {"A": "Protesta o muestra de desacuerdo, verbal o física, con la decisión de un miembro del equipo arbitral; sancionable con amonestación.", "B": "Muestra de desacuerdo únicamente verbal con una decisión del árbitro; sancionable con advertencia.", "C": "Protesta verbal contra un adversario o un miembro del equipo arbitral; sancionable con expulsión."}, "correcta": "A", "explicacion": "La desaprobación es la protesta o desacuerdo, verbal o física, con una decisión arbitral, sancionable con amonestación.", "referencia": "Glosario / Desaprobación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-029", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «distancia de juego»?", "opciones": {"A": "Espacio fijo de un metro entre el balón y el jugador para poder disputarlo con el pie.", "B": "Espacio entre el balón y el jugador que permite jugarlo con un solo paso, con independencia de su envergadura.", "C": "Espacio entre el balón y el jugador que permite a este jugarlo extendiendo el pie o la pierna o saltando; en el guardameta, saltando con los brazos extendidos."}, "correcta": "C", "explicacion": "La distancia de juego depende de la envergadura física del jugador y permite jugar el balón extendiendo pie o pierna o saltando.", "referencia": "Glosario / Distancia de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 108}, {"id": "GL-030", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué establece sobre las espinilleras?", "opciones": {"A": "Son de uso voluntario y solo deben cubrirse con las medias si el árbitro lo exige.", "B": "El club es responsable de proporcionarlas y pueden llevarse por encima de las medias.", "C": "Los jugadores son responsables de llevarlas del tamaño y material adecuados y deben quedar cubiertas por las medias."}, "correcta": "C", "explicacion": "Los jugadores son responsables de llevar espinilleras adecuadas y estas quedarán cubiertas por las medias.", "referencia": "Glosario / Espinilleras", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-031", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «examen a jugadores lesionados»?", "opciones": {"A": "Tratamiento médico completo que el jugador recibe fuera del terreno de juego tras salir por su lesión.", "B": "Evaluación que realiza el árbitro para decidir si el jugador puede seguir jugando.", "C": "Breve evaluación de una lesión, normalmente por un profesional médico, para determinar si el jugador necesita un tratamiento más completo."}, "correcta": "C", "explicacion": "El examen es una breve evaluación, normalmente médica, para decidir si el jugador necesita más tratamiento.", "referencia": "Glosario / Examen a jugadores lesionados", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 108}, {"id": "GL-032", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «exclusión temporal»?", "opciones": {"A": "Suspensión de un jugador por el resto del partido, sin posibilidad de sustituirle.", "B": "Suspensión temporal con la que, según el reglamento de la competición, se sanciona ciertas o todas las infracciones sancionables con amonestación.", "C": "Suspensión temporal con la que, según el reglamento, se sanciona todas las infracciones sancionables con expulsión."}, "correcta": "B", "explicacion": "La exclusión temporal, según el reglamento de la competición, sanciona ciertas o todas las infracciones sancionables con amonestación.", "referencia": "Glosario / Exclusión temporal", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 108}, {"id": "GL-033", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «expulsión»?", "opciones": {"A": "Sanción por la que el jugador debe abandonar el terreno de juego y solo puede volver tras el descanso.", "B": "Sanción por la que el jugador abandona el terreno de juego, pudiendo ser sustituido una vez comenzado el partido.", "C": "Sanción por la que se obliga al jugador a abandonar el terreno y sus inmediaciones el resto del partido; si este ha comenzado, no se le podrá sustituir."}, "correcta": "C", "explicacion": "La expulsión obliga a abandonar el terreno y sus inmediaciones; si el partido hubiera comenzado, no se podrá sustituir al expulsado.", "referencia": "Glosario / Expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-034", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «finta»?", "opciones": {"A": "Acción de retrasar deliberadamente la reanudación; siempre es sancionable con amonestación.", "B": "Acción destinada a engañar al árbitro para obtener ventaja; siempre es antirreglamentaria.", "C": "Acción destinada a confundir a un adversario; las Reglas definen fintas reglamentarias y antirreglamentarias."}, "correcta": "C", "explicacion": "La finta es la acción destinada a confundir a un adversario; hay fintas reglamentarias y antirreglamentarias.", "referencia": "Glosario / Finta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-035", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué significa «golpear»?", "opciones": {"A": "Acto ejecutado por el jugador al entrar en contacto con el balón con el pie (rodilla incluida).", "B": "Acto ejecutado por el jugador al entrar en contacto con el balón con el pie (tobillo incluido).", "C": "Acto ejecutado por el jugador al entrar en contacto con el balón con cualquier parte del cuerpo."}, "correcta": "B", "explicacion": "Golpear es el contacto del jugador con el balón con el pie, tobillo incluido.", "referencia": "Glosario / Golpear", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-036", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es un terreno de juego «híbrido»?", "opciones": {"A": "Terreno cuya superficie natural se ha reforzado con la integración de fibras sintéticas.", "B": "Terreno de césped artificial con una capa de arena natural.", "C": "Terreno con una mitad de césped natural y la otra de césped artificial."}, "correcta": "A", "explicacion": "Híbrido es el terreno de superficie natural reforzada con fibras sintéticas.", "referencia": "Glosario / Híbrido", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-037", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una acción «imprudente»?", "opciones": {"A": "Acción, en general una entrada o disputa del balón, realizada ignorando el riesgo o las consecuencias para el adversario.", "B": "Acción en la que el jugador se excede en la fuerza y la impetuosidad con el adversario.", "C": "Acción, en general una entrada o disputa del balón, en la que el jugador muestra falta de atención o de consideración por el adversario."}, "correcta": "C", "explicacion": "Imprudente es la acción con falta de atención o de consideración por el adversario.", "referencia": "Glosario / Imprudente", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-038", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una acción «temeraria»?", "opciones": {"A": "Acción, en general una entrada o disputa del balón, realizada ignorando o sin tener en cuenta el riesgo o las consecuencias para el adversario.", "B": "Acción en la que el jugador actúa con brutalidad y pone en peligro la integridad física del adversario.", "C": "Acción, en general una entrada o disputa del balón, en la que el jugador muestra falta de atención por el adversario."}, "correcta": "A", "explicacion": "Temeraria es la acción realizada ignorando el riesgo o las consecuencias para el adversario.", "referencia": "Glosario / Temeraria", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-039", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el «informe arbitral» (acta arbitral)?", "opciones": {"A": "Documento oficial con los nombres de jugadores, suplentes y miembros del cuerpo técnico antes del partido.", "B": "Formulario que el árbitro presenta al descanso con las alineaciones y sustituciones realizadas.", "C": "Formulario que el árbitro cumplimenta al final del partido con todos los datos e incidentes, que juzgarán después los órganos disciplinarios."}, "correcta": "C", "explicacion": "El informe arbitral se cumplimenta al finalizar el partido con todos los datos e incidentes y se denomina también acta arbitral.", "referencia": "Glosario / Informe arbitral", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-040", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es «interceptar»?", "opciones": {"A": "Impedir que el balón de un adversario llegue al destino pretendido cortando el pase.", "B": "Detener o desviar un balón dirigido a la portería con cualquier parte del cuerpo.", "C": "Arrebatar el balón a un adversario mediante una disputa."}, "correcta": "A", "explicacion": "Interceptar es impedir que el balón del adversario llegue al destino pretendido cortando el pase.", "referencia": "Glosario / Interceptar", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-041", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «lista del equipo»?", "opciones": {"A": "Documento oficial con los nombres, por lo general, de jugadores, suplentes y miembros del cuerpo técnico.", "B": "Formulario que rellena el árbitro con las alineaciones y sustituciones al final del partido.", "C": "Documento oficial con los nombres únicamente de los jugadores que comienzan el partido."}, "correcta": "A", "explicacion": "La lista del equipo es el documento oficial con los nombres, por lo general, de jugadores, suplentes y miembros del cuerpo técnico.", "referencia": "Glosario / Lista del equipo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-042", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una «salvada»?", "opciones": {"A": "Acción de un jugador para detener o desviar, o intentarlo, un balón dirigido a la portería o muy cerca de ella, con cualquier parte del cuerpo salvo manos y brazos (excepto el guardameta en su área).", "B": "Acción del guardameta para detener un balón dirigido a portería únicamente con las manos dentro de su propia área.", "C": "Acción de un jugador para detener o desviar un balón que se dirige a la portería, con cualquier parte del cuerpo, incluidas manos y brazos."}, "correcta": "A", "explicacion": "Salvada es la acción de detener o desviar un balón dirigido a la portería o muy cerca de ella con cualquier parte del cuerpo salvo manos y brazos (salvo el guardameta en su área).", "referencia": "Glosario / Salvada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 110}, {"id": "GL-043", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «simulación»?", "opciones": {"A": "Acción voluntaria de fingir una lesión, exclusivamente para retrasar la reanudación del juego.", "B": "Acción voluntaria que produce la impresión incorrecta o falsa de que ha sucedido algo que no ha sucedido, para obtener ventaja inmerecida.", "C": "Acción involuntaria que produce la impresión de haber sufrido una infracción, sin intención de obtener ventaja."}, "correcta": "B", "explicacion": "Simulación es la acción voluntaria que produce la impresión falsa de que ha sucedido algo que no ha sucedido, para obtener ventaja inmerecida.", "referencia": "Glosario / Simulación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 110}, {"id": "GL-044", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cuándo se comete una infracción de «sujetar»?", "opciones": {"A": "Siempre que un jugador toque el cuerpo o el uniforme del adversario, aunque no le dificulte.", "B": "Únicamente si el jugador usa los brazos y no otra parte del cuerpo para tocar al adversario.", "C": "Únicamente si el contacto de un jugador con el cuerpo o el uniforme del adversario dificulta el movimiento de este."}, "correcta": "C", "explicacion": "Sujetar se comete únicamente si el contacto con el cuerpo o el uniforme del adversario dificulta su movimiento.", "referencia": "Glosario / Sujetar", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 110}, {"id": "GL-045", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué diferencia hay entre «suspender temporalmente» y «suspender definitivamente» un partido?", "opciones": {"A": "Ambas suponen la conclusión del partido; la temporal es por causas meteorológicas y la definitiva por causas disciplinarias.", "B": "Temporalmente se detiene con intención de reanudarlo más adelante; definitivamente se da por concluido antes de consumirse el tiempo reglamentario.", "C": "Temporalmente se da por concluido el partido; definitivamente se detiene con intención de reanudarlo más adelante."}, "correcta": "B", "explicacion": "Suspender temporalmente es detener con intención de reanudar; definitivamente es dar por concluido el partido antes de tiempo.", "referencia": "Glosario / Suspender", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 111}, {"id": "GL-046", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define la «tanda de penales»?", "opciones": {"A": "Procedimiento para definir el resultado de un partido empatado en el que cada equipo lanza un penal por orden alterno hasta que uno marca un gol más con el mismo número de lanzamientos, salvo que en los cinco primeros uno ya no pueda igualar.", "B": "Procedimiento para desempatar un partido en el que solo los jugadores presentes en el terreno de juego al finalizar el encuentro lanzan un penal cada uno por turnos.", "C": "Procedimiento para definir un partido empatado en el que cada equipo lanza cinco penales seguidos, sin más lanzamientos posibles aunque persista la igualdad final."}, "correcta": "A", "explicacion": "La tanda es un procedimiento de desempate con lanzamientos alternos hasta que un equipo marca un gol más tras el mismo número de lanzamientos.", "referencia": "Glosario / Tanda de penales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 111}, {"id": "GL-047", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «tiempo adicional»?", "opciones": {"A": "Dos periodos extra de un máximo de quince minutos que se juegan al terminar un partido empatado.", "B": "Minutos añadidos al final de cada uno de los periodos para compensar el tiempo perdido por sustituciones, lesiones, sanciones disciplinarias, celebraciones, etc.", "C": "Minutos añadidos únicamente al final del segundo periodo para compensar las interrupciones."}, "correcta": "B", "explicacion": "El tiempo adicional compensa el tiempo perdido y se añade al final de cada periodo.", "referencia": "Glosario / Tiempo adicional", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-048", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «tiempo suplementario»?", "opciones": {"A": "Minutos añadidos al final de cada periodo del partido para compensar el tiempo perdido durante el mismo.", "B": "Procedimiento tras un empate que consiste en un único periodo extra de treinta minutos de duración.", "C": "Procedimiento tras un empate al final del tiempo reglamentario que consiste en dos periodos extra de un máximo de quince minutos cada uno, también llamado «prórroga»."}, "correcta": "C", "explicacion": "El tiempo suplementario es el procedimiento de desempate de dos periodos extra de un máximo de quince minutos (prórroga).", "referencia": "Glosario / Tiempo suplementario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-049", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «tiro libre rápido»?", "opciones": {"A": "Tiro libre ejecutado, con permiso del árbitro, justo después de detenerse el juego.", "B": "Tiro libre ejecutado tras una cuenta atrás de cinco segundos del árbitro.", "C": "Tiro libre ejecutado sin permiso del árbitro antes de que el balón esté inmóvil."}, "correcta": "A", "explicacion": "Tiro libre rápido es el ejecutado, con permiso del árbitro, justo después de detenerse el juego.", "referencia": "Glosario / Tiro libre rápido", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-050", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define la «ventaja»?", "opciones": {"A": "Concesión por la que el árbitro permite que el juego continúe tras una infracción o una reanudación incorrecta con el balón en juego, si beneficia al equipo adversario.", "B": "Concesión por la que el árbitro permite que el juego continúe tras cualquier infracción, sin tener en cuenta a quién beneficia.", "C": "Concesión por la que el árbitro detiene el juego tras una infracción y permite reanudar rápidamente al equipo perjudicado."}, "correcta": "A", "explicacion": "La ventaja permite continuar tras una infracción o reanudación incorrecta con balón en juego si beneficia al adversario.", "referencia": "Glosario / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 111}, {"id": "GL-051", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el «terreno de juego»?", "opciones": {"A": "Superficie delimitada únicamente por las líneas de banda y de meta, sin incluir las redes.", "B": "Superficie delimitada por las líneas de banda y de meta, incluida el área técnica.", "C": "Superficie delimitada por las líneas de banda y de meta y, de utilizarse, las redes de las porterías."}, "correcta": "C", "explicacion": "El terreno de juego es la superficie delimitada por las líneas de banda y de meta y, si se usan, las redes de las porterías.", "referencia": "Glosario / Terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-052", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cuál es la tarea del «árbitro asistente adicional»?", "opciones": {"A": "Situarse en la línea de meta cerca de la portería para ayudar al árbitro en acciones del área penal y en goles dudosos.", "B": "Sustituir a un árbitro asistente que no pueda continuar y ayudar en la supervisión del área técnica.", "C": "Asistir al VAR en la revisión de imágenes de televisión desde la sala de vídeo."}, "correcta": "A", "explicacion": "El árbitro asistente adicional se sitúa en la línea de meta para ayudar en el área penal y en decisiones de gol/no gol.", "referencia": "Glosario / Árbitro asistente adicional", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 112}, {"id": "GL-053", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el «asistente del árbitro asistente de vídeo (AVAR)»?", "opciones": {"A": "Miembro del equipo arbitral que asiste al árbitro desde una mitad de la línea de banda con banderín.", "B": "Árbitro o árbitro asistente en activo, o exárbitro, designado para asistir al VAR.", "C": "Técnico designado únicamente para manejar las repeticiones de televisión."}, "correcta": "B", "explicacion": "El AVAR es un árbitro, árbitro asistente o exárbitro designado para asistir al VAR.", "referencia": "Glosario / AVAR", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 112}, {"id": "GL-054", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «posición de reanudación»?", "opciones": {"A": "Ubicación de un jugador en la reanudación determinada siempre por la posición exacta de su cabeza en ese instante, con independencia de si está en el aire o en el suelo.", "B": "Ubicación del balón en la reanudación determinada por el punto exacto en el que se produjo la infracción, y no por la posición del jugador infractor.", "C": "Ubicación de un jugador en la reanudación determinada por la posición de los pies o la parte del cuerpo en contacto con el suelo; en el aire, por la proyección de los pies."}, "correcta": "C", "explicacion": "La posición de reanudación de un jugador se marca por sus pies o la parte del cuerpo en contacto con el suelo, y en el aire por la proyección de los pies.", "referencia": "Glosario / Posición de reanudación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Glosario", "pagina": 110}, {"id": "GL-055", "bloque": "reglas", "enunciado": "¿Qué confederación es la responsable del fútbol en Oceanía, según el Glosario?", "opciones": {"A": "La AFC.", "B": "La OFC.", "C": "La CAF."}, "correcta": "B", "explicacion": "El Glosario recoge la OFC como confederación de Oceanía.", "referencia": "Glosario / Confederación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 106}, {"id": "GL-056", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué entidad está compuesta por las cuatro federaciones británicas de fútbol y la FIFA?", "opciones": {"A": "La CONMEBOL, responsable del fútbol sudamericano.", "B": "El IFAB, responsable de las Reglas de Juego a escala mundial.", "C": "La UEFA, responsable de las competiciones europeas."}, "correcta": "B", "explicacion": "El IFAB está compuesto por las cuatro federaciones británicas y la FIFA y es responsable de las Reglas de Juego.", "referencia": "Glosario / Entidades futbolísticas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 106}, {"id": "GL-057", "bloque": "reglas", "regla": "Glosario", "articulo": null, "enunciado": "Según el Glosario, ¿qué es la «federación nacional de fútbol»?", "opciones": {"A": "La entidad responsable del fútbol en un país.", "B": "La entidad responsable del fútbol en un continente.", "C": "La entidad rectora del fútbol en el mundo."}, "correcta": "A", "explicacion": "El Glosario define la federación nacional de fútbol como la entidad responsable del fútbol en un país, distinta de la confederación (continente) y de la FIFA (a escala mundial).", "referencia": "Glosario / Entidades futbolísticas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "pagina": 106}, {"id": "GL-058", "bloque": "reglas", "regla": "Glosario", "articulo": null, "enunciado": "Según el Glosario, ¿qué significa «sancionar»?", "opciones": {"A": "Castigar una acción antirreglamentaria, habitualmente deteniendo el juego y concediendo un tiro libre o un penal al equipo contrario.", "B": "Mostrar tarjeta amarilla o roja a un jugador, con independencia de que se detenga o no el juego.", "C": "Comunicar por escrito al infractor la falta cometida una vez finalizado el partido."}, "correcta": "A", "explicacion": "El Glosario define «sancionar» como castigar una acción antirreglamentaria, habitualmente deteniendo el juego y concediendo un tiro libre o un penal al equipo contrario.", "referencia": "Glosario / Entidades futbolísticas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "pagina": 110}, {"id": "GL-059", "bloque": "reglas", "regla": "Glosario", "articulo": null, "enunciado": "Según el Glosario, ¿qué es una «señal» del equipo arbitral?", "opciones": {"A": "La indicación física del árbitro principal o de cualquier miembro del equipo arbitral, por lo general mediante un movimiento de la mano, del brazo, el silbato (árbitro principal) o del banderín (árbitro asistente).", "B": "Únicamente el toque de silbato del árbitro principal para detener o reanudar el juego.", "C": "La comunicación exclusiva entre el VAR y el árbitro principal a través del sistema de intercomunicación."}, "correcta": "A", "explicacion": "El Glosario define «señal» como la indicación física del árbitro principal o de cualquier miembro del equipo arbitral; por lo general implica un movimiento de la mano, del brazo o del silbato (árbitro principal), o del banderín (árbitro asistente).", "referencia": "Glosario / Entidades futbolísticas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "pagina": 110}, {"id": "GL-060", "bloque": "reglas", "regla": "Glosario", "articulo": null, "enunciado": "Dentro del Programa de calidad de la FIFA para productos, superficies de juego y tecnologías, ¿qué diferencia principal hay entre los sellos «FIFA Basic», «FIFA Quality» y «FIFA Quality Pro»?", "opciones": {"A": "El nivel de exigencia creciente en seguridad, precisión, durabilidad y rendimiento: Basic fija unos mínimos accesibles, Quality refuerza durabilidad y seguridad, y Quality Pro exige un rendimiento óptimo para el máximo nivel.", "B": "Únicamente el precio del producto homologado, sin relación alguna con criterios técnicos de rendimiento o seguridad.", "C": "El continente donde se fabrica el producto: Basic para productos europeos, Quality para americanos y Quality Pro para el resto del mundo."}, "correcta": "A", "explicacion": "El Programa de calidad de la FIFA establece tres sellos de exigencia creciente: FIFA Basic (criterios básicos y accesibles), FIFA Quality (mayor énfasis en durabilidad y seguridad) y FIFA Quality Pro (seguridad, precisión y rendimiento óptimos para el máximo nivel). FIFA Basic sustituye al antiguo International Match Standard (IMS).", "referencia": "Glosario / Entidades futbolísticas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "pagina": 110}, {"id": "VAR-001", "bloque": "reglas", "enunciado": "Un jugador marca un gol; un adversario solicita gesticulando la revisión del VAR por una falta previa y, por ello, el árbitro lo amonesta. Instantes después, el VAR anula el gol. ¿Debe el árbitro retirar la amonestación al no subir el gol al marcador?", "opciones": {"A": "No, la amonestación se mantiene aunque el gol se anule.", "B": "Sí, al anularse el gol la tarjeta debe anularse también.", "C": "Depende de si el jugador celebró el gol de forma provocadora o no."}, "correcta": "A", "explicacion": "La amonestación por solicitar de forma inapropiada la revisión del VAR se mantiene con independencia de que el gol acabe siendo anulado.", "referencia": "Regla 5 / Protocolo VAR", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 85}, {"id": "VAR-002", "bloque": "reglas", "enunciado": "¿En qué casos puede asistir el VAR al árbitro, según el Protocolo del VAR?", "opciones": {"A": "En cualquier decisión que el árbitro considere dudosa, incluidas las faltas sancionables con amonestación.", "B": "Solo en las decisiones de gol/no gol y de fuera de juego, con independencia de si el error es claro.", "C": "Únicamente en caso de error claro, obvio y manifiesto o incidente grave inadvertido en gol/no gol, penal/no penal, tarjeta roja directa y confusión de identidad."}, "correcta": "C", "explicacion": "El VAR solo puede asistir por error claro, obvio y manifiesto o incidente grave inadvertido en las categorías revisables.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 83}, {"id": "VAR-003", "bloque": "reglas", "enunciado": "Según el Protocolo del VAR, ¿puede el árbitro «omitir» una decisión y recurrir después al VAR para que la tome?", "opciones": {"A": "No, el árbitro siempre debe tomar una decisión inicial y no puede omitirla.", "B": "Sí, pero solo en jugadas de fuera de juego.", "C": "Sí, si la jugada es muy compleja, para evitar errores."}, "correcta": "A", "explicacion": "El árbitro no puede omitir una decisión y recurrir después al VAR; debe tomar siempre una decisión inicial.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 83}, {"id": "VAR-004", "bloque": "reglas", "enunciado": "¿Cuándo se modifica la decisión inicial del árbitro tras un chequeo del VAR?", "opciones": {"A": "Solo si la revisión demuestra claramente que constituyó un error claro, obvio y manifiesto.", "B": "Siempre que el VAR lo recomiende y el árbitro esté de acuerdo, aunque el error no sea claro.", "C": "Siempre que las imágenes muestren una decisión distinta a la que tomó el árbitro."}, "correcta": "A", "explicacion": "La decisión inicial no se modifica salvo que la revisión demuestre un error claro, obvio y manifiesto.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 84}, {"id": "VAR-005", "bloque": "reglas", "enunciado": "¿Quién puede iniciar una revisión según el Protocolo del VAR?", "opciones": {"A": "Solo el árbitro; el VAR y el resto del equipo arbitral únicamente pueden recomendarla.", "B": "El VAR, que puede imponerla al árbitro cuando detecta un error.", "C": "El capitán de cualquiera de los dos equipos, una vez por parte."}, "correcta": "A", "explicacion": "Solo el árbitro puede iniciar una revisión; el VAR y los demás miembros del equipo arbitral pueden recomendarla.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "VAR", "pagina": 84}, {"id": "VAR-006", "bloque": "reglas", "enunciado": "¿Quién toma la decisión final tras una revisión?", "opciones": {"A": "El VAR, cuando la revisión se basa únicamente en las imágenes analizadas en la sala de vídeo del estadio.", "B": "El árbitro o el VAR, según sea la decisión de carácter objetivo o de carácter subjetivo en ese momento.", "C": "Siempre el árbitro, sea a partir de la información del VAR o de la revisión en el terreno de juego."}, "correcta": "C", "explicacion": "La decisión final es siempre del árbitro.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "VAR", "pagina": 84}, {"id": "VAR-007", "bloque": "reglas", "enunciado": "¿Existe un tiempo máximo para el proceso de revisión?", "opciones": {"A": "Sí, un máximo de dos minutos por revisión.", "B": "No, porque la precisión es más importante que la rapidez.", "C": "Sí, un máximo de un minuto si es revisión basada únicamente en el VAR."}, "correcta": "B", "explicacion": "No hay límite de tiempo para la revisión, ya que la precisión es más importante que la rapidez.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 84}, {"id": "VAR-008", "bloque": "reglas", "enunciado": "Mientras el árbitro realiza una revisión, varios jugadores del equipo perjudicado le rodean para protestar. ¿Qué establece el Protocolo del VAR?", "opciones": {"A": "Que los jugadores y el cuerpo técnico no deben rodear al árbitro ni intentar influir en su decisión de revisar ni en el proceso.", "B": "Que los jugadores pueden rodear al árbitro durante la revisión, siempre que no lleguen a hablar directamente con él.", "C": "Que solo el capitán del equipo puede rodear al árbitro mientras dura el proceso de revisión de la jugada."}, "correcta": "A", "explicacion": "Los jugadores y el cuerpo técnico no deberán rodear al árbitro ni intentarán influir en su decisión ni en el proceso de revisión.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 84}, {"id": "VAR-009", "bloque": "reglas", "enunciado": "Durante el proceso de revisión, ¿dónde deben permanecer los jugadores y dónde los suplentes y el cuerpo técnico?", "opciones": {"A": "Los jugadores en sus áreas de penal; los suplentes y el cuerpo técnico, en el área técnica.", "B": "Los jugadores en el terreno de juego; los suplentes y el cuerpo técnico, fuera de él.", "C": "Todos en el terreno de juego, hasta que el árbitro adopte la decisión final."}, "correcta": "B", "explicacion": "Durante la revisión, los jugadores deben permanecer en el terreno y los suplentes y cuerpo técnico fuera del mismo.", "referencia": "Protocolo del VAR / Jugadores, suplentes y cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 87}, {"id": "VAR-010", "bloque": "reglas", "enunciado": "¿Debe el árbitro permanecer visible durante el proceso de revisión?", "opciones": {"A": "Sí, aunque solo si la revisión es en el terreno de juego.", "B": "No, puede retirarse al vestuario mientras se revisa.", "C": "Sí, para garantizar la transparencia."}, "correcta": "C", "explicacion": "El árbitro debe permanecer visible durante la revisión para garantizar la transparencia.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 84}, {"id": "VAR-011", "bloque": "reglas", "enunciado": "Si el juego prosigue tras un incidente que se revisa después, ¿se cancela la medida disciplinaria tomada tras ese incidente aunque se modifique la decisión inicial?", "opciones": {"A": "No, salvo la amonestación o expulsión por detener un ataque prometedor o evitar una ocasión manifiesta de gol.", "B": "Sí, en todos los casos, al modificarse la decisión inicial.", "C": "No, sin excepción alguna, aunque la sanción fuera por evitar una ocasión manifiesta de gol."}, "correcta": "A", "explicacion": "Si el juego prosigue tras el incidente, no se cancela la medida disciplinaria, salvo la amonestación o expulsión por detener un ataque prometedor o evitar una ocasión manifiesta de gol.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 84}, {"id": "VAR-012", "bloque": "reglas", "enunciado": "Si el juego se ha reanudado tras haberse detenido, ¿en qué casos puede el árbitro llevar a cabo una revisión?", "opciones": {"A": "En cualquier caso de penal no señalado o de gol anulado, con independencia del tiempo transcurrido desde la reanudación.", "B": "En cualquier tarjeta roja directa, aunque el juego ya se haya reanudado tras la decisión correspondiente.", "C": "Solo en confusión de identidad o posible expulsión por conducta violenta, escupir, morder o actuar de forma extremadamente ofensiva, insultante o humillante."}, "correcta": "C", "explicacion": "Reanudado el juego, solo se revisa por confusión de identidad o infracción de expulsión por conducta violenta, escupir, morder o actuar de forma extremadamente ofensiva.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 84}, {"id": "VAR-013", "bloque": "reglas", "enunciado": "¿Es necesario que los entrenadores o jugadores soliciten una revisión al VAR?", "opciones": {"A": "No, porque los VAR chequean automáticamente todas las situaciones o decisiones.", "B": "Sí, mediante la señal de la televisión al árbitro.", "C": "Sí, pero solo los capitanes de cada equipo."}, "correcta": "A", "explicacion": "No es necesario solicitar la revisión, pues el VAR chequea automáticamente las situaciones.", "referencia": "Protocolo del VAR / Principios", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "VAR", "pagina": 87}, {"id": "VAR-014", "bloque": "reglas", "enunciado": "¿Qué categorías de decisiones o incidentes pueden ser revisadas por el VAR según el Protocolo?", "opciones": {"A": "Gol/no gol, penal/no penal y tarjeta roja únicamente.", "B": "Gol/no gol, penal/no penal, tarjeta amarilla, fuera de juego y saque de esquina.", "C": "Gol/no gol, penal/no penal, tarjeta roja directa, confusión de identidad y, opcionalmente, saque de esquina claramente erróneo."}, "correcta": "C", "explicacion": "El árbitro solo puede recibir asistencia del VAR en las categorías señaladas, con el saque de esquina como opción de la competición.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 84}, {"id": "VAR-015", "bloque": "reglas", "enunciado": "El árbitro muestra la segunda tarjeta amarilla a un jugador tras una acción que claramente no era infracción. ¿Puede intervenir el VAR?", "opciones": {"A": "Sí, una tarjeta roja derivada de una segunda amonestación claramente incorrecta es revisable.", "B": "No, las amonestaciones nunca son revisables por el VAR.", "C": "Sí, pero solo si el jugador solicita la revisión."}, "correcta": "A", "explicacion": "El VAR puede revisar una tarjeta roja que resulte de una segunda amonestación claramente incorrecta.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 85}, {"id": "VAR-016", "bloque": "reglas", "enunciado": "El árbitro amonesta a un jugador que no cometió la infracción, confundiéndolo claramente con otro de los dos equipos que sí la cometió. ¿Qué puede revisarse?", "opciones": {"A": "La identidad del infractor; la infracción en sí solo si guarda relación con un gol, un penal o una tarjeta roja.", "B": "Nada, porque la amonestación no es revisable bajo ningún concepto una vez mostrada por el árbitro.", "C": "La infracción completa, en todos los casos, además de la identidad del jugador amonestado por error."}, "correcta": "A", "explicacion": "En la confusión de identidad solo se revisa la identidad del infractor.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 85}, {"id": "VAR-017", "bloque": "reglas", "enunciado": "Respecto al saque de esquina concedido de forma claramente errónea, ¿cuándo puede corregirse mediante VAR?", "opciones": {"A": "Si la competición lo permite y la decisión se puede modificar inmediatamente y sin retrasar la reanudación.", "B": "Solo si el saque no ha sido concedido por retrasar un saque de meta.", "C": "Siempre que el VAR lo detecte, aunque el saque ya se haya ejecutado."}, "correcta": "A", "explicacion": "Es una opción para las competiciones y solo si se puede modificar inmediatamente sin retrasar la reanudación.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 85}, {"id": "VAR-018", "bloque": "reglas", "enunciado": "Un saque de esquina claramente mal concedido se ejecuta rápidamente antes de que el VAR pueda advertirlo al árbitro. ¿Qué ocurre?", "opciones": {"A": "Se anula el saque y se reanuda con el saque de meta correcto.", "B": "Se revisa igualmente y se repite la jugada.", "C": "No se puede cambiar la decisión, porque el saque ya se ha ejecutado rápidamente."}, "correcta": "C", "explicacion": "Si el saque de esquina se ejecuta rápidamente, la decisión no se puede cambiar.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 85}, {"id": "VAR-019", "bloque": "reglas", "enunciado": "¿Cómo indica el árbitro que necesita retrasar la reanudación para un chequeo del VAR?", "opciones": {"A": "Levantando un brazo con la palma abierta hasta que el VAR le informe.", "B": "Dibujando con las manos un rectángulo en el aire hasta completar el chequeo.", "C": "Señalando claramente al auricular con un dedo y extendiendo la otra mano o el otro brazo, hasta completar el chequeo."}, "correcta": "C", "explicacion": "El árbitro señala al auricular con un dedo y extiende la otra mano o brazo, y lo mantiene hasta completar el chequeo.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 86}, {"id": "VAR-020", "bloque": "reglas", "enunciado": "¿Qué es un «chequeo silencioso»?", "opciones": {"A": "Un chequeo en el que el VAR se comunica con el árbitro únicamente mediante gestos, sin utilizar el sistema de audio.", "B": "Una revisión que el árbitro realiza sin necesidad de detener el desarrollo normal del juego en ningún momento.", "C": "Un chequeo en el que el VAR no detecta error claro, obvio y manifiesto, por lo que no suele comunicarse con el árbitro."}, "correcta": "C", "explicacion": "Si el chequeo no indica un error claro ni un incidente grave inadvertido, normalmente no hay comunicación: chequeo silencioso.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 86}, {"id": "VAR-021", "bloque": "reglas", "enunciado": "¿Cuándo hace el árbitro la «señal de la televisión» durante un proceso de revisión?", "opciones": {"A": "Solo cuando decide revisar la jugada en el área de revisión, no en revisiones basadas únicamente en el VAR.", "B": "Cuando detiene el juego para revisar y, de nuevo, al término del proceso, antes de comunicar la decisión final.", "C": "Únicamente al concluir el proceso de revisión, antes de comunicar la decisión final."}, "correcta": "B", "explicacion": "El árbitro hace la señal de la televisión al detener el juego para revisar y al término de la revisión, antes de comunicar la decisión final.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 87}, {"id": "VAR-022", "bloque": "reglas", "enunciado": "¿Qué tipo de revisión es apropiada, en general, para decisiones subjetivas como la intensidad de una falta o una mano?", "opciones": {"A": "No se pueden revisar decisiones subjetivas.", "B": "La revisión basada únicamente en el VAR.", "C": "La revisión en el terreno de juego."}, "correcta": "C", "explicacion": "Para las decisiones subjetivas es apropiado realizar una revisión en el terreno de juego.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 86}, {"id": "VAR-023", "bloque": "reglas", "enunciado": "¿Qué tipo de revisión suele ser apropiada para decisiones objetivas, como la posición de un jugador en fuera de juego o el lugar de una infracción?", "opciones": {"A": "Ninguna revisión, pues son decisiones del árbitro asistente.", "B": "La revisión en el terreno de juego, siempre.", "C": "La revisión basada únicamente en el VAR."}, "correcta": "C", "explicacion": "La revisión basada únicamente en el VAR suele ser apropiada para decisiones objetivas.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 86}, {"id": "VAR-024", "bloque": "reglas", "enunciado": "¿Se pueden modificar las decisiones de reanudación (saques de banda, saques de esquina, etc.) una vez que el juego se ha reanudado?", "opciones": {"A": "Sí, si el VAR advierte de un error claro, obvio y manifiesto.", "B": "No, por lo que no se pueden revisar.", "C": "Sí, dentro de los cinco segundos siguientes."}, "correcta": "B", "explicacion": "Las Reglas de Juego no permiten modificar decisiones de reanudación una vez reanudado el juego, por lo que no se pueden revisar.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 87}, {"id": "VAR-025", "bloque": "reglas", "enunciado": "Un jugador hace de forma exagerada la señal de la televisión ante el árbitro durante un partido con VAR. ¿Qué sanción corresponde?", "opciones": {"A": "Amonestación, por hacer de forma exagerada el gesto de la señal de televisión.", "B": "Advertencia verbal, siempre, sin que este gesto llegue a considerarse sancionable con tarjeta.", "C": "Expulsión, al considerar el gesto exagerado ante el árbitro como una falta de respeto grave."}, "correcta": "A", "explicacion": "Se amonesta a quien haga la señal de la televisión de manera exagerada o acceda al área de revisión.", "referencia": "Protocolo del VAR / Jugadores, suplentes y cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 87}, {"id": "VAR-026", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico accede a la sala de vídeo durante el partido. ¿Qué sanción corresponde?", "opciones": {"A": "Amonestación, al equiparar el acceso a la sala de vídeo con el acceso al área de revisión.", "B": "Advertencia verbal, sin que acceder a la sala de vídeo conlleve ninguna sanción disciplinaria.", "C": "Expulsión, por acceder a la sala de vídeo durante el partido."}, "correcta": "C", "explicacion": "Se expulsa a quien acceda a la sala de vídeo.", "referencia": "Protocolo del VAR / Jugadores, suplentes y cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "VAR", "pagina": 87}, {"id": "VAR-027", "bloque": "reglas", "enunciado": "Como norma general, ¿se invalida un partido por errores en el funcionamiento de la tecnología del VAR?", "opciones": {"A": "No, como norma general no se invalida el partido por ese motivo.", "B": "Sí, siempre que la competición haya sido informada del error.", "C": "Sí, siempre que el error afecte al resultado del partido."}, "correcta": "A", "explicacion": "Como norma general no se invalida un partido por errores en el funcionamiento de la tecnología de VAR.", "referencia": "Protocolo del VAR / Validez del partido", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 87}, {"id": "VAR-028", "bloque": "reglas", "enunciado": "¿Cómo puede hablar el VAR con el árbitro, según los aspectos prácticos del protocolo?", "opciones": {"A": "Hablando de forma continua con el árbitro, para que este esté siempre informado de cualquier incidencia detectada.", "B": "Solo a través del cuarto árbitro, que transmite la información recibida desde la sala de vídeo al árbitro principal.", "C": "Apretando previamente un botón, para evitar que el árbitro se distraiga con las conversaciones de la sala de vídeo."}, "correcta": "C", "explicacion": "El VAR debe apretar un botón antes de hablar con el árbitro para no distraerlo.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 85}, {"id": "VAR-029", "bloque": "reglas", "enunciado": "¿Quién puede entrar en la sala de vídeo o comunicarse con el VAR durante el partido?", "opciones": {"A": "Únicamente las personas autorizadas.", "B": "Los delegados de ambos equipos, sin restricción.", "C": "Cualquier miembro del equipo arbitral, sin restricción."}, "correcta": "A", "explicacion": "Durante el partido, solo las personas autorizadas pueden entrar en la sala de vídeo o comunicarse con el VAR, el AVAR o el técnico de repeticiones.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 85}, {"id": "VAR-030", "bloque": "reglas", "enunciado": "¿Cuándo está permitida la actuación de los VAR en un encuentro?", "opciones": {"A": "Cuando el organizador cumple los requisitos de implementación del Manual del VAR y ha recibido por escrito el permiso de la FIFA.", "B": "Siempre que ambos equipos lo acepten antes del partido, con independencia de los requisitos técnicos exigidos.", "C": "Siempre que la federación nacional lo autorice de forma verbal, sin necesidad de comunicación escrita alguna."}, "correcta": "A", "explicacion": "La actuación de los VAR exige cumplir los requisitos del Manual del VAR y contar con el permiso escrito de la FIFA.", "referencia": "Protocolo del VAR / Introducción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "VAR", "pagina": 83}, {"id": "VAR-031", "bloque": "reglas", "enunciado": "Un asistente no levanta el banderín para retrasar la señalización de una infracción en un ataque claro. El equipo atacante marca gol. ¿Qué debe hacer?", "opciones": {"A": "Levantar el banderín posteriormente, porque el equipo atacante marcó gol.", "B": "Levantarlo solo si el árbitro se lo pide.", "C": "No levantar el banderín, al haber dejado continuar el ataque."}, "correcta": "A", "explicacion": "Si el asistente retrasó el banderín, deberá levantarlo después si el equipo atacante marca gol, o se le concede penal, libre, esquina o banda, o mantiene la posesión.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "VAR", "pagina": 85}, {"id": "VAR-032", "bloque": "reglas", "enunciado": "¿Qué principio debe figurar en el reglamento de la competición respecto a quién puede sustituir a un VAR, un AVAR o un técnico de repeticiones que no pueda comenzar o continuar su labor?", "opciones": {"A": "Que solo personas con la cualificación necesaria podrán sustituirlos.", "B": "Que cualquier árbitro presente en el estadio podrá sustituirlos sin formación específica.", "C": "Que el delegado de la competición decidirá libremente quién los sustituye."}, "correcta": "A", "explicacion": "Solo aquellas personas con la cualificación necesaria podrán sustituir a un VAR, AVAR o técnico de repeticiones que no pueda comenzar o continuar su labor.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 87}, {"id": "VAR-033", "bloque": "reglas", "enunciado": "Si no se pudiera disponer de un sustituto cualificado para el VAR o para el técnico de repeticiones en cuestión, ¿qué debe hacerse?", "opciones": {"A": "Disputar o continuar el encuentro sin usar el sistema VAR.", "B": "Suspender definitivamente el partido hasta contar con un sustituto cualificado.", "C": "Continuar utilizando el VAR con el sustituto disponible, aunque no esté cualificado."}, "correcta": "A", "explicacion": "Si no se dispusiera de un sustituto cualificado para el VAR o el técnico de repeticiones, se deberá disputar o continuar el encuentro sin usar el sistema VAR.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 88}, {"id": "VAR-034", "bloque": "reglas", "enunciado": "Si no se pudiera disponer de un sustituto cualificado para el AVAR, ¿qué debe hacerse según el Protocolo del VAR?", "opciones": {"A": "Disputar o continuar el encuentro sin usar el sistema VAR, salvo que ambos equipos acuerden por escrito continuar solo con el VAR y el técnico de repeticiones.", "B": "Disputar o continuar el partido normalmente, ya que la ausencia del AVAR no afecta al funcionamiento del sistema.", "C": "Suspender definitivamente el partido en cualquier caso, sin posibilidad de acuerdo entre los equipos."}, "correcta": "A", "explicacion": "Sin sustituto cualificado para el AVAR, se jugará sin VAR, salvo que en circunstancias excepcionales ambos equipos acuerden por escrito continuar solo con el VAR y el técnico de repeticiones.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Protocolo del VAR", "pagina": 88}, {"id": "VAR-035", "bloque": "reglas", "enunciado": "Además de los errores tecnológicos, ¿por qué otro motivo no se invalidará, como norma general, un partido en el que se haya utilizado el VAR?", "opciones": {"A": "Por una decisión errónea en la que haya participado el VAR, puesto que este forma parte del equipo arbitral.", "B": "Por cualquier decisión errónea, siempre que el club afectado lo reclame formalmente.", "C": "Por una decisión errónea del VAR, salvo que dicha decisión afecte al resultado final del partido."}, "correcta": "A", "explicacion": "Como norma general no se invalidará el partido por decisiones erróneas en las que haya participado el VAR, puesto que este forma parte del equipo arbitral.", "referencia": "Protocolo del VAR / Validez del partido", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 87}, {"id": "VAR-036", "bloque": "reglas", "enunciado": "¿Se invalidará el partido, como norma general, si el equipo arbitral decide no revisar un incidente?", "opciones": {"A": "No, la decisión de no revisar un incidente no invalida, como norma general, el partido.", "B": "Sí, siempre que posteriormente se demuestre que el incidente merecía revisión.", "C": "Sí, salvo que el árbitro principal asuma personalmente la responsabilidad del error."}, "correcta": "A", "explicacion": "Como norma general, el partido no se invalidará por decisiones de no revisar un incidente.", "referencia": "Protocolo del VAR / Validez del partido", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 87}, {"id": "VAR-037", "bloque": "reglas", "enunciado": "Si el árbitro decide ver una repetición en vídeo durante una revisión, ¿quién selecciona el ángulo y la velocidad de reproducción?", "opciones": {"A": "El VAR selecciona el ángulo y la velocidad más apropiados, aunque el árbitro podrá solicitar otros adicionales o alternativos.", "B": "El árbitro selecciona siempre el ángulo y la velocidad, sin intervención del VAR.", "C": "El técnico de repeticiones decide el ángulo y la velocidad, sin que el árbitro pueda solicitar cambios."}, "correcta": "A", "explicacion": "El VAR seleccionará el ángulo y la velocidad más apropiados; el árbitro podrá solicitar otro ángulo o velocidad alternativos o adicionales.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Protocolo del VAR", "pagina": 85}, {"id": "VAR-038", "bloque": "reglas", "enunciado": "¿En qué situaciones está permitido que el árbitro asistente retrase la señalización de una infracción con el banderín o el silbato?", "opciones": {"A": "En situaciones de ataque muy claras, en las que un jugador esté a punto de marcar un gol o tenga un camino despejado hacia el área penal contraria.", "B": "En cualquier situación de ataque, con independencia de su claridad o de la cercanía a la portería contraria.", "C": "Únicamente cuando el árbitro se lo solicite expresamente antes de la jugada, no por iniciativa propia del asistente."}, "correcta": "A", "explicacion": "Solo estará permitido retrasar la señalización de una infracción en situaciones de ataque muy claras, en las que un jugador esté a punto de marcar un gol o tenga un camino despejado hacia el área penal contraria.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 85}, {"id": "VAR-039", "bloque": "reglas", "enunciado": "Dentro de la categoría de decisiones sobre gol/no gol revisables por el VAR, ¿qué aspecto adicional, distinto de la infracción del equipo atacante, puede comprobarse?", "opciones": {"A": "Si el balón estaba o no en juego antes de marcarse el gol.", "B": "La valoración táctica de la jugada que originó el ataque.", "C": "El estado físico del jugador que anotó el gol."}, "correcta": "A", "explicacion": "Entre los aspectos revisables en la categoría de gol/no gol se incluye si el balón estaba en juego antes de marcarse el gol.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 84}, {"id": "VAR-040", "bloque": "reglas", "enunciado": "Dentro de la categoría de decisiones sobre penal/no penal revisables por el VAR, ¿qué situación puede revisarse además de la concesión errónea de un penal?", "opciones": {"A": "Una infracción sancionable con penal que no haya sido sancionada.", "B": "La velocidad a la que se desplazaba el balón antes de la infracción.", "C": "El número de jugadores presentes dentro del área penal en el momento de la infracción."}, "correcta": "A", "explicacion": "También es revisable una infracción sancionable con penal que no haya sido sancionada por el árbitro.", "referencia": "Protocolo del VAR / Decisiones revisables", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 84}, {"id": "VAR-041", "bloque": "reglas", "enunciado": "Al revisar una posible infracción, ¿a qué velocidad de reproducción debe recurrirse, con carácter general, para comprobar la intensidad de una infracción o decidir si se ha cometido mano?", "opciones": {"A": "A velocidad normal.", "B": "Siempre a cámara lenta, para apreciar mejor el contacto.", "C": "A velocidad acelerada, para valorar la trayectoria completa de la jugada."}, "correcta": "A", "explicacion": "Se utilizará la velocidad normal para comprobar la intensidad de una infracción o decidir si se ha cometido una infracción por mano.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Protocolo del VAR", "pagina": 86}, {"id": "VAR-042", "bloque": "reglas", "enunciado": "¿Pueden las competiciones implantar un sistema en el que el árbitro explique y anuncie públicamente sus decisiones tras una revisión o una comprobación prolongada del VAR?", "opciones": {"A": "Sí, como se especifica en las directrices de la FIFA y en el Manual del VAR.", "B": "No, el árbitro nunca puede comunicar públicamente el resultado de una revisión.", "C": "Sí, pero únicamente si lo solicita expresamente el equipo perjudicado por la decisión inicial."}, "correcta": "A", "explicacion": "Las competiciones pueden implantar un sistema en el que el árbitro explique y anuncie las decisiones públicamente tras una revisión o comprobación prolongada, según las directrices de la FIFA y el Manual del VAR.", "referencia": "Protocolo del VAR / Procedimientos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Protocolo del VAR", "pagina": 87}, {"id": "VAR-043", "bloque": "reglas", "enunciado": "La Regla 6 establece que el reglamento de la competición debe estipular quién sustituirá a un miembro del equipo arbitral que no pueda continuar su labor. ¿A quién más se aplica esta previsión en los partidos con VAR?", "opciones": {"A": "También a los técnicos de repeticiones.", "B": "Únicamente al árbitro principal, no al resto del equipo arbitral de vídeo.", "C": "A ningún otro miembro del equipo arbitral de vídeo, que carece de previsión de sustitución."}, "correcta": "A", "explicacion": "En los partidos con VAR, la previsión de la Regla 6 sobre sustitución de un miembro del equipo arbitral se aplica también a los técnicos de repeticiones.", "referencia": "Protocolo del VAR / Aspectos prácticos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Protocolo del VAR", "pagina": 87}]</script>

<script>
// ============================================================
// EXAMEN DE ASCENSO ARBITRAL F11 - CTA/RFEF
// Motor de la aplicación
// ============================================================

const BANCO = JSON.parse(document.getElementById('data-banco').textContent);
const BANCO_REGLAS = BANCO.filter(q => q.bloque === 'reglas');
const BANCO_NORMATIVA = BANCO.filter(q => q.bloque === 'normativa');
const BANCO_POR_ID = {};
BANCO.forEach(q => { BANCO_POR_ID[q.id] = q; });

function ordenNatural(a,b){
  const na = parseInt((a.match(/\d+/)||[])[0],10), nb = parseInt((b.match(/\d+/)||[])[0],10);
  if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
  if(!isNaN(na) && isNaN(nb)) return -1;
  if(isNaN(na) && !isNaN(nb)) return 1;
  return a.localeCompare(b);
}
const TEMAS_REGLAS = Array.from(new Set(BANCO_REGLAS.map(q => q.regla || 'Otras'))).sort(ordenNatural);
const TEMAS_NORMATIVA = Array.from(new Set(BANCO_NORMATIVA.map(q => q.articulo || 'Otros'))).sort(ordenNatural);
function renderListaTemas(items, name, idBase){
  const LIMITE = 6;
  const visibles = items.slice(0, LIMITE);
  const resto = items.slice(LIMITE);
  const itemHtml = t => `<label class="nivel-opt"><input type="checkbox" name="${name}" value="${t.replace(/"/g,'&quot;')}" checked><span>${t}</span></label>`;
  return `
    <div class="nivel-grid" id="${idBase}Grid">${visibles.map(itemHtml).join('')}</div>
    ${resto.length ? `
    <div class="nivel-grid hidden" id="${idBase}GridResto">${resto.map(itemHtml).join('')}</div>
    <button type="button" class="btn-outline" data-toggle-resto="${idBase}GridResto" style="margin-top:6px;">Mostrar ${resto.length} más ▾</button>
    ` : ''}
  `;
}

const state = {
  config: null,
  examen: [],           // preguntas del examen actual (ya con opciones mezcladas)
  respuestas: {},        // idx -> letra seleccionada
  comprobadas: {},        // idx -> bool (modo estudio: ya comprobada)
  actual: 0,
  finalizado: false,
  ultimaConfig: null,     // para "repetir examen"
  ultimoExamen: null,
  restante: {},          // idx -> segundos restantes (solo modo examen)
  bloqueadas: {}         // idx -> true si el tiempo se agotó
};

// ---------- TEMPORIZADOR POR PREGUNTA (25-45 s, solo modo examen) ----------
let timerId = null;
function tiempoPregunta(q){
  const texto = [q.enunciado, q.opciones.A, q.opciones.B, q.opciones.C].join(' ').replace(/<[^>]*>/g,' ');
  const palabras = texto.split(/\s+/).filter(Boolean).length;
  // ~3 s por cada 10 palabras de lectura + 8 s para pensar y responder
  return Math.max(25, Math.min(45, Math.round(palabras*0.3 + 8)));
}
function pararTemporizador(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function iniciarTiempos(){
  state.restante = {}; state.bloqueadas = {};
  if(state.config && state.config.modoExamen) state.examen.forEach((q,i)=>{ state.restante[i] = tiempoPregunta(q); });
}
function arrancarTemporizador(){
  pararTemporizador();
  const idx = state.actual;
  if(!state.config.modoExamen || state.bloqueadas[idx]) return;
  const total = tiempoPregunta(state.examen[idx]);
  const pintar = ()=>{
    const box = document.getElementById('timerBox'); if(!box) return;
    const r = state.restante[idx];
    document.getElementById('timerTxt').textContent = '⏱ ' + r + ' s';
    document.getElementById('timerFill').style.width = (r/total*100)+'%';
    box.className = 'timer-box' + (r<=5 ? ' danger' : (r<=10 ? ' warn' : ''));
  };
  pintar();
  timerId = setInterval(()=>{
    state.restante[idx]--;
    pintar();
    if(state.restante[idx] <= 0){
      pararTemporizador();
      state.bloqueadas[idx] = true;
      if(idx < state.examen.length-1){ state.actual = idx+1; renderPregunta(); }
      else finalizarExamen();
    }
  }, 1000);
}

// Selección de N elementos totalmente al azar: se sortean N índices únicos
// dentro del rango [0, arr.length) del propio array (equivalente a sortear
// N números al azar dentro del rango de IDs de ese bloque) y se devuelven
// las preguntas en esas posiciones. Cada índice tiene la misma probabilidad
// de salir elegido; no hay ningún sesgo de orden ni de aparición.
function indicesAleatoriosUnicos(n, max){
  n = Math.min(n, max);
  const elegidos = new Set();
  while(elegidos.size < n){
    elegidos.add(Math.floor(Math.random() * max));
  }
  return Array.from(elegidos);
}
function shuffle(arr){
  // Devuelve el array reordenado al azar: se sortea, para cada posición,
  // un índice aleatorio único dentro del rango total (mismo principio que
  // indicesAleatoriosUnicos, aplicado a todo el array).
  const indices = indicesAleatoriosUnicos(arr.length, arr.length);
  return indices.map(i => arr[i]);
}

function pickRandom(arr, n){
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}

// Las preguntas "título del artículo" / "artículo con tal título" revelan (o son reveladas por)
// cualquier otra pregunta del mismo artículo, así que no pueden convivir en un mismo examen.
function claveArt(q){ return q.fuente + '|' + q.articulo; }
function esTipoArt(q){ return q.tipo === 'titulo_articulo' || q.tipo === 'numero_articulo'; }
function pickNormativa(pool, n, ocupadas){
  const elegidas = [];
  const usadasTipo = new Set();   // artículos con pregunta de título/número
  const usadasOtras = new Set();  // artículos con otra pregunta
  for(const q of shuffle(pool)){
    if(elegidas.length >= n) break;
    const k = claveArt(q);
    if(esTipoArt(q)){
      if(usadasTipo.has(k) || usadasOtras.has(k)) continue;
      usadasTipo.add(k);
    } else {
      if(usadasTipo.has(k)) continue;
      usadasOtras.add(k);
    }
    elegidas.push(q);
  }
  return elegidas;
}

// ---------- PANTALLA DE HISTORIAL ----------
function renderHistorial(){
  const h = getHistorial().slice().reverse(); // más reciente primero
  const filas = h.map(e=>{
    const fecha = new Date(e.fecha);
    const fechaTxt = fecha.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + fecha.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    return `<div class="stat-row"><span>${fechaTxt} ${e.esRepaso?'(repaso)':''} ${e.modoExamen?'📝':'📖'}</span><span><strong>${e.pct}%</strong> (${e.aciertos}/${e.total})</span></div>`;
  }).join('') || '<div class="info-text">Todavía no hay exámenes guardados. Completa un examen para empezar a ver tu progreso aquí.</div>';

  // Desglose acumulado de reglas más falladas (sumando todos los exámenes guardados)
  const acumulado = {};
  h.forEach(e=>{
    Object.entries(e.statsPorRegla || {}).forEach(([regla, s])=>{
      if(!acumulado[regla]) acumulado[regla] = {ok:0,total:0};
      acumulado[regla].ok += s.ok; acumulado[regla].total += s.total;
    });
  });
  const reglasOrdenadas = Object.entries(acumulado)
    .map(([regla,s])=>({regla, pct: s.total? (s.ok/s.total*100):0, ok:s.ok, total:s.total}))
    .sort((a,b)=> a.pct - b.pct)
    .slice(0,8);
  const reglasHtml = reglasOrdenadas.map(r=>`<div class="stat-row"><span>${r.regla}</span><span>${r.ok}/${r.total} (${r.pct.toFixed(0)}%)</span></div>`).join('') || '<div class="info-text">Sin datos suficientes todavía.</div>';

  app.innerHTML = `
    <div class="card">
      <h2>📊 Historial de exámenes</h2>
      <div class="info-text" style="margin-bottom:10px;">Guardado en este navegador. Se borra si limpias los datos de navegación.</div>
      ${filas}
    </div>
    <div class="card">
      <h2>Reglas donde más fallas (acumulado de todos tus exámenes)</h2>
      ${reglasHtml}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="btn-outline" id="btnVolverConfig" style="flex:1;">◀ VOLVER</button>
      <button class="btn-danger" id="btnBorrarHistorial" style="flex:1;" ${h.length===0?'disabled':''}>🗑 BORRAR HISTORIAL</button>
    </div>
  `;
  document.getElementById('btnVolverConfig').addEventListener('click', ()=>renderConfig());
  document.getElementById('btnBorrarHistorial').addEventListener('click', ()=>{
    if(confirm('¿Seguro que quieres borrar todo el historial de exámenes guardado en este navegador?')){
      clearHistorial();
      renderHistorial();
    }
  });
}

// ---------- BUSCADOR DE TEXTO LIBRE EN EL BANCO ----------
function normalizarTexto(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function buscarEnBanco(query){
  const q = normalizarTexto(query).trim();
  if(!q) return [];
  const terminos = q.split(/\s+/).filter(Boolean);
  return BANCO.filter(preg=>{
    const texto = normalizarTexto([
      preg.enunciado, preg.opciones.A, preg.opciones.B, preg.opciones.C,
      preg.explicacion, preg.regla, preg.articulo, preg.referencia
    ].filter(Boolean).join(' | '));
    return terminos.every(t => texto.includes(t));
  });
}
function pintarResultadosBuscador(query){
  const cont = document.getElementById('buscadorResultados');
  const contador = document.getElementById('buscadorContador');
  if(!cont) return;
  if(!query.trim()){
    contador.textContent = '';
    cont.innerHTML = '<div class="info-text">Escribe una palabra o frase (p. ej. «fuera de juego», «tanda de penales», «sala de vídeo») para buscar entre las 1175 preguntas del banco.</div>';
    window.__ultimaBusqueda = [];
    return;
  }
  const resultados = buscarEnBanco(query);
  window.__ultimaBusqueda = resultados;
  const LIMITE = 60;
  const mostrar = resultados.slice(0, LIMITE);
  contador.textContent = resultados.length === 0
    ? 'Sin resultados.'
    : `${resultados.length} resultado${resultados.length===1?'':'s'}${resultados.length>LIMITE?` (mostrando los primeros ${LIMITE}, afina la búsqueda para ver menos)`:''}.`;
  cont.innerHTML = mostrar.length === 0 ? '' : mostrar.map(q=>`
    <div class="review-item">
      <div class="tag">${q.id}</div>
      <div class="tag">${q.bloque==='reglas'?(q.regla||'Reglas'):(q.articulo||'Normativa')}</div>
      <div style="margin-top:8px;font-weight:600;">${q.enunciado}</div>
      <div style="margin-top:6px;font-size:.9rem;">Respuesta correcta: <strong>${q.correcta}) ${q.opciones[q.correcta]}</strong></div>
      <div class="explicacion-box" style="margin-top:8px;">${q.explicacion}</div>
    </div>
  `).join('');
}

const PDFS = ['ReglasDelJuego26-27.pdf','ResumenReglamentoCompeticiones.pdf','Resumen_Articulos_Bases_Competicion_20-30.pdf'];

function dbPdf(){ return new Promise((res,rej)=>{ const r=indexedDB.open('f11pdfs',1); r.onupgradeneeded=()=>r.result.createObjectStore('pdfs'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function guardarPdf(nombre, blob){ try{ const db=await dbPdf(); db.transaction('pdfs','readwrite').objectStore('pdfs').put(blob,nombre); }catch(e){} pdfUrls[nombre]=URL.createObjectURL(blob); }
async function cargarPdfsGuardados(){
  try{ const db=await dbPdf(); await Promise.all(PDFS.map(n=>new Promise(res=>{ const g=db.transaction('pdfs').objectStore('pdfs').get(n); g.onsuccess=()=>{ if(g.result) pdfUrls[n]=URL.createObjectURL(g.result); res(); }; g.onerror=()=>res(); }))); }catch(e){}

function actualizarFalladas(examen, respuestas){
  const falladas = new Set(getFalladas());
  examen.forEach((q,i)=>{
    const resp = respuestas[i];
    if(resp === q.correcta) falladas.delete(q.id);
    else falladas.add(q.id); // errores y sin responder van al pool de repaso
  });
  setFalladasArr(Array.from(falladas));
}
