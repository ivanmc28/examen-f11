en 3ª Federación) para Árbitro Asistente de 2ª Federación.", "referencia": "Art. 128", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-161", "bloque": "normativa", "regla": null, "articulo": "Art. 129", "enunciado": "Según el Art. 129, ¿a quién corresponde la interpretación de dudas en las competiciones estatales profesionales?", "opciones": {"A": "A la Junta Directiva de la RFEF.", "B": "Al Comité Técnico de Árbitros exclusivamente.", "C": "A cada club, de mutuo acuerdo entre ambos equipos."}, "correcta": "A", "explicacion": "El Art. 129 atribuye la interpretación de dudas en competiciones estatales profesionales a la Junta Directiva de la RFEF.", "referencia": "Art. 129", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-162", "bloque": "normativa", "regla": null, "articulo": "Art. 131", "enunciado": "Según el Art. 131, ¿qué deben garantizar los clubes para el correcto desarrollo de los partidos?", "opciones": {"A": "Corrección, servicios y presencia (o solicitud) de fuerza pública.", "B": "Únicamente la megafonía del estadio en correcto funcionamiento.", "C": "La presencia de un representante de la federación autonómica en el palco."}, "correcta": "A", "explicacion": "El Art. 131 exige a los clubes garantizar corrección, servicios y presencia o solicitud de fuerza pública.", "referencia": "Art. 131", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-163", "bloque": "normativa", "regla": null, "articulo": "Art. 135", "enunciado": "Además de la numeración de titulares y suplentes, ¿qué otras dos exigencias establece el Art. 135?", "opciones": {"A": "Enviar la relación de dorsales a la RFEF 10 días antes del inicio de la competición, y llevar el número en el pantalón con 10 cm de altura, abajo a la derecha.", "B": "Enviar la relación de dorsales el mismo día del partido, sin número en el pantalón.", "C": "No existen más exigencias además de la numeración de titulares y suplentes."}, "correcta": "A", "explicacion": "El Art. 135 exige remitir la relación de dorsales a la RFEF con 10 días de antelación, y llevar el número en el pantalón con 10 cm de altura, abajo a la derecha.", "referencia": "Art. 135", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-164", "bloque": "normativa", "regla": null, "articulo": "Art. 136", "enunciado": "Según el Art. 136, ¿qué datos debe recoger el acta arbitral?", "opciones": {"A": "Datos del partido, alineaciones y cargos, resultado y goleadores, sustituciones, amonestaciones/expulsiones, incidentes y estado de las instalaciones.", "B": "Únicamente el resultado final del partido.", "C": "Solo las amonestaciones y expulsiones producidas."}, "correcta": "A", "explicacion": "El Art. 136 exige que el acta recoja los datos del partido, alineaciones y cargos, resultado y goleadores, sustituciones, amonestaciones/expulsiones, incidentes y estado de las instalaciones.", "referencia": "Art. 136", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-165", "bloque": "normativa", "regla": null, "articulo": "Art. 137", "enunciado": "Según el Art. 137, ¿es necesaria la firma del acta en categorías con tramitación electrónica, y a quién se remite una copia adicional en 1ª/2ª División?", "opciones": {"A": "No es necesaria la firma, y se remite copia adicional a la Liga Nacional de Fútbol Profesional.", "B": "Sí, la firma siempre es obligatoria, y no se remite copia a ningún otro organismo.", "C": "No es necesaria la firma, y se remite copia adicional al club visitante únicamente."}, "correcta": "A", "explicacion": "El Art. 137 exime de la firma en categorías con tramitación electrónica, y prevé una copia adicional a la Liga Nacional de Fútbol Profesional (1ª/2ª División) o a la Liga Profesional de Fútbol Femenino (1ª División Femenina).", "referencia": "Art. 137", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-166", "bloque": "normativa", "regla": null, "articulo": "Art. 144", "enunciado": "Según el Art. 144, ¿cuál es el número máximo de suplentes con carácter general, salvo lo que fijen las Normas de cada competición?", "opciones": {"A": "5 suplentes.", "B": "7 suplentes.", "C": "9 suplentes."}, "correcta": "A", "explicacion": "El Art. 144 fija en 5 el número máximo de suplentes, salvo lo que determinen las Normas de cada competición (1ª/2ª División, Federación, Copas, Supercopa).", "referencia": "Art. 144", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-167", "bloque": "normativa", "regla": null, "articulo": "Art. 150", "enunciado": "Según el Art. 150, ¿quiénes pueden ocupar el banquillo de un equipo en fútbol 11?", "opciones": {"A": "Delegado/a, entrenador/a titular, hasta 2 auxiliares, especialista de porteros, preparador/a físico/a, médico/a, enfermero/a, fisioterapeuta, suplentes y sustituidos.", "B": "Únicamente el entrenador titular y los suplentes.", "C": "Cualquier persona acreditada por el club, sin límite de número."}, "correcta": "A", "explicacion": "El Art. 150 detalla que el banquillo puede incluir al delegado/a, entrenador/a titular, hasta 2 auxiliares, especialista de porteros, preparador/a físico/a, médico/a, enfermero/a, fisioterapeuta, suplentes y sustituidos.", "referencia": "Art. 150", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-168", "bloque": "normativa", "regla": null, "articulo": "Art. 151", "enunciado": "Según el Art. 151, ¿quién designa al delegado/a de campo o de pista para cada partido?", "opciones": {"A": "El club titular del terreno de juego o pabellón.", "B": "El árbitro principal, antes de cada partido.", "C": "El Comité Técnico de Árbitros de la RFEF."}, "correcta": "A", "explicacion": "El Art. 151 establece que el delegado/a de campo lo designa el club titular del terreno de juego o pabellón para cada partido.", "referencia": "Art. 151", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-169", "bloque": "normativa", "regla": null, "articulo": "Art. 152", "enunciado": "Según el Art. 152, ¿qué acceso tiene el/la Oficial Informador/a y qué debe hacer ante el equipo arbitral?", "opciones": {"A": "Tiene libre acceso a las dependencias de las instalaciones deportivas y debe identificarse ante el equipo arbitral y los delegados/as.", "B": "No tiene acceso a ninguna dependencia salvo el palco de autoridades.", "C": "Solo puede acceder al vestuario arbitral, sin necesidad de identificarse."}, "correcta": "A", "explicacion": "El Art. 152 concede al Oficial Informador/a libre acceso a las dependencias de las instalaciones, con la obligación de identificarse ante el equipo arbitral y los delegados/as.", "referencia": "Art. 152", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-170", "bloque": "normativa", "regla": null, "articulo": "Art. 153", "enunciado": "Según el Art. 153, ¿cuáles son las funciones de los/las delegados/as de los clubs?", "opciones": {"A": "Identificarse ante el árbitro, presentar licencias, cuidar el pago de derechos de arbitraje, firmar el acta e informar de incidencias.", "B": "Dirigir el calentamiento del equipo y elegir el once inicial.", "C": "Sustituir al árbitro en caso de lesión de este."}, "correcta": "A", "explicacion": "El Art. 153 asigna a los delegados/as las funciones de identificarse ante el árbitro, presentar licencias, cuidar el pago de derechos de arbitraje, firmar el acta e informar de incidencias.", "referencia": "Art. 153", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-171", "bloque": "normativa", "regla": null, "articulo": "Art. 154", "enunciado": "Según el Art. 154, ¿qué representación tienen los/las capitanes/as en el terreno de juego?", "opciones": {"A": "Son la única representación autorizada del equipo en el terreno de juego.", "B": "No tienen ninguna representación especial distinta a la de cualquier jugador.", "C": "Representan al equipo únicamente ante los medios de comunicación."}, "correcta": "A", "explicacion": "El Art. 154 establece que los/las capitanes/as son la única representación autorizada del equipo en el terreno de juego.", "referencia": "Art. 154", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-172", "bloque": "normativa", "regla": null, "articulo": "Art. 156", "enunciado": "Según el Art. 156, ¿qué debe hacer el árbitro antes y después del partido?", "opciones": {"A": "Antes: inspeccionar el terreno, los balones y las licencias, y ordenar la salida de los equipos. Después: redactar el acta de forma fiel, concisa, clara, objetiva y completa.", "B": "Antes: elegir el balón de la marca que prefiera. Después: no tiene ninguna obligación adicional.", "C": "Antes: nada, solo sale al terreno de juego a la hora fijada. Después: redactar el acta solo si hubo incidencias."}, "correcta": "A", "explicacion": "El Art. 156 obliga al árbitro, antes del partido, a inspeccionar terreno, balones y licencias, y ordenar la salida de los equipos; y después del partido, a redactar el acta de forma fiel, concisa, clara, objetiva y completa.", "referencia": "Art. 156", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-173", "bloque": "normativa", "regla": null, "articulo": "Art. 158", "enunciado": "Según el Art. 158, ¿cuáles son las causas de suspensión de los partidos?", "opciones": {"A": "Mal estado del terreno, inferioridad numérica, incidentes de público, insubordinación o retirada de un equipo, y fuerza mayor.", "B": "Únicamente la lluvia intensa, sin ninguna otra causa prevista.", "C": "Solo la falta de acuerdo entre los dos capitanes."}, "correcta": "A", "explicacion": "El Art. 158 recoge como causas de suspensión el mal estado del terreno, la inferioridad numérica, los incidentes de público, la insubordinación o retirada de un equipo, y la fuerza mayor.", "referencia": "Art. 158", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-174", "bloque": "normativa", "regla": null, "articulo": "Art. 175", "enunciado": "Según el Art. 175, ¿con qué debe contar el terreno de juego y las instalaciones deportivas?", "opciones": {"A": "Paso protegido a vestuarios, vestuarios independientes con agua caliente/fría, vallas de separación fijas, clínica de urgencia y zona de control antidopaje.", "B": "Únicamente vestuarios independientes, sin más exigencias.", "C": "Un marcador electrónico homologado por la RFEF."}, "correcta": "A", "explicacion": "El Art. 175 exige paso protegido a vestuarios, vestuarios independientes con agua caliente y fría, vallas de separación fijas, clínica de urgencia y zona de control antidopaje.", "referencia": "Art. 175", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-175", "bloque": "normativa", "regla": null, "articulo": "Art. 184", "enunciado": "Además de prohibir la publicidad de bebidas alcohólicas o tabaco, ¿qué más establece el Art. 184 sobre la publicidad en las prendas deportivas?", "opciones": {"A": "Solo puede incluir el emblema/símbolo de la marca comercial y, debajo, palabras o siglas alusivas, y no puede alterar los colores o emblemas del club.", "B": "Puede ocupar cualquier tamaño y posición en la equipación, sin restricción alguna.", "C": "Debe situarse exclusivamente en la parte trasera de la camiseta."}, "correcta": "A", "explicacion": "El Art. 184 limita la publicidad al emblema/símbolo de la marca y, debajo, palabras o siglas alusivas, sin que pueda alterar los colores o emblemas del club.", "referencia": "Art. 184", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RJ1-005", "bloque": "reglas", "enunciado": "¿En qué momento debe el árbitro comprobar el correcto funcionamiento de la DAG, según la Regla 1?", "opciones": {"A": "Antes del partido, según lo estipulado en el manual de pruebas.", "B": "Durante el descanso, antes de iniciar la segunda parte.", "C": "Únicamente si se produce una incidencia dudosa durante el partido."}, "correcta": "A", "explicacion": "Cuando se vaya a hacer uso de la DAG, el árbitro deberá comprobar su correcto funcionamiento antes del partido, según se estipula en el manual de pruebas.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-006", "bloque": "reglas", "enunciado": "Si se utiliza la DAG en competición, ¿a qué deben extenderse las garantías exigidas a los organizadores sobre el cumplimiento del Programa de calidad de la FIFA?", "opciones": {"A": "Al sistema completo, incluidos los posibles cambios autorizados en los marcos de las porterías o en la tecnología usada en los balones.", "B": "Únicamente al dispositivo instalado en la línea de meta, sin considerar cambios en porterías o balones.", "C": "Solo a la tecnología de los balones, sin incluir los marcos de las porterías."}, "correcta": "A", "explicacion": "Los organizadores deberán garantizar que el sistema, incluidos los posibles cambios autorizados en los marcos de las porterías o en la tecnología usada en los balones, cumpla con los requisitos del Programa de calidad de la FIFA.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-007", "bloque": "reglas", "enunciado": "¿Hasta cuándo se prohíbe la publicidad comercial en el terreno de juego una vez finalizado el descanso, según la Regla 1?", "opciones": {"A": "Desde que los equipos vuelven a entrar en el terreno de juego hasta el término del partido.", "B": "Únicamente durante los primeros 15 minutos de la segunda parte.", "C": "La prohibición cesa al reanudarse el juego tras el descanso."}, "correcta": "A", "explicacion": "La prohibición de publicidad rige también desde el momento en que los equipos vuelven a entrar en el terreno de juego hasta el término del partido.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-008", "bloque": "reglas", "enunciado": "¿A qué tipo de partidos se relaciona particularmente el área técnica, según la Regla 1?", "opciones": {"A": "A los disputados en estadios que cuentan con un área específica con asientos para el cuerpo técnico, los suplentes y los jugadores sustituidos.", "B": "Exclusivamente a los partidos de competiciones internacionales organizadas por la FIFA, sin extenderse a otras competiciones.", "C": "A todos los partidos, sin excepción, con independencia de las instalaciones y del banquillo disponible en cada estadio."}, "correcta": "A", "explicacion": "El área técnica se relaciona en particular con los partidos disputados en estadios que cuentan con un área específica con asientos para el cuerpo técnico, los suplentes y los jugadores sustituidos.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-009", "bloque": "reglas", "enunciado": "Además de identificarse antes del partido, ¿qué otra obligación general impone la Regla 1 a los ocupantes del área técnica?", "opciones": {"A": "Comportarse de un modo responsable.", "B": "Permanecer de pie durante todo el partido.", "C": "Portar una acreditación visible en todo momento, aunque ya se hayan identificado."}, "correcta": "A", "explicacion": "Los ocupantes del área técnica deberán identificarse antes del inicio del partido y, además, deberán comportarse de un modo responsable.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-010", "bloque": "reglas", "enunciado": "Un club solicita disputar sus partidos sobre una superficie completamente artificial. ¿Es posible según la Regla 1?", "opciones": {"A": "Sí, siempre que lo permita el reglamento de la competición.", "B": "No, el terreno de juego debe ser siempre una superficie completamente natural.", "C": "Sí, pero únicamente si lo autoriza expresamente la FIFA para cada partido concreto."}, "correcta": "A", "explicacion": "La Regla 1 permite una superficie completamente artificial si lo autoriza el reglamento de la competición.", "referencia": "Regla 1 / Superficie de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-011", "bloque": "reglas", "enunciado": "Un campo combina césped natural con fibras artificiales integradas en el mismo terreno. ¿Qué condición exige la Regla 1 para que este sistema híbrido sea válido?", "opciones": {"A": "Que el reglamento de la competición lo permita expresamente.", "B": "Que lo autorice el árbitro antes de cada partido concreto.", "C": "Que el club lo comunique a la federación con 15 días de antelación."}, "correcta": "A", "explicacion": "La combinación integrada de materiales artificiales y naturales (sistema híbrido) requiere que el reglamento de la competición lo permita.", "referencia": "Regla 1 / Superficie de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-012", "bloque": "reglas", "enunciado": "¿De qué color debe ser una superficie de juego completamente artificial según la Regla 1?", "opciones": {"A": "Verde.", "B": "Verde o azul, según decida el club.", "C": "Cualquier color, siempre que contraste con las líneas."}, "correcta": "A", "explicacion": "La Regla 1 exige que el color de las superficies artificiales sea verde.", "referencia": "Regla 1 / Superficie de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-013", "bloque": "reglas", "enunciado": "En partidos internacionales de competición de clubes disputados sobre superficie artificial, ¿qué debe cumplir dicha superficie según la Regla 1?", "opciones": {"A": "Los requisitos del Programa de calidad de la FIFA de césped artificial, salvo dispensa especial del IFAB.", "B": "Los requisitos que determine libremente la federación anfitriona del partido.", "C": "Únicamente el requisito del color verde, sin más exigencias técnicas."}, "correcta": "A", "explicacion": "Las superficies artificiales en partidos internacionales de clubes deben cumplir el Programa de calidad de la FIFA de césped artificial, salvo dispensa del IFAB.", "referencia": "Regla 1 / Superficie de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-014", "bloque": "reglas", "enunciado": "¿Qué forma debe tener el terreno de juego según la Regla 1?", "opciones": {"A": "Rectangular.", "B": "Rectangular u ovalada, según el reglamento de la competición.", "C": "Cuadrada, salvo excepciones autorizadas por el organizador."}, "correcta": "A", "explicacion": "El terreno de juego será rectangular, marcado con líneas continuas.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-015", "bloque": "reglas", "enunciado": "¿Cómo se denominan las dos líneas de demarcación más largas del terreno de juego?", "opciones": {"A": "Líneas de meta.", "B": "Líneas de banda.", "C": "Líneas centrales."}, "correcta": "B", "explicacion": "Las dos líneas de demarcación más largas se denominan líneas de banda; las más cortas, líneas de meta.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-016", "bloque": "reglas", "enunciado": "En una superficie artificial coexisten las líneas de demarcación de fútbol con las de otro deporte. ¿Qué exige la Regla 1 para que esto sea admisible?", "opciones": {"A": "Que las líneas del otro deporte sean de un color diferente y se distingan claramente de las de fútbol.", "B": "Que las líneas del otro deporte se borren antes de cada partido de fútbol.", "C": "Que ambos deportes utilicen exactamente el mismo grosor de línea para evitar confusión."}, "correcta": "A", "explicacion": "En superficies artificiales se permite la coexistencia con otras líneas siempre que sean de color diferente y se distingan claramente de las de fútbol.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-017", "bloque": "reglas", "enunciado": "¿Cuál es la anchura máxima permitida para las líneas que marcan el terreno de juego?", "opciones": {"A": "10 cm.", "B": "12 cm.", "C": "15 cm."}, "correcta": "B", "explicacion": "Todas las líneas deberán tener la misma anchura, como máximo 12 cm.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-018", "bloque": "reglas", "enunciado": "¿Qué anchura deben tener las líneas de meta en relación con los postes y el travesaño?", "opciones": {"A": "La misma anchura que los postes y el travesaño.", "B": "La mitad de la anchura de los postes y el travesaño.", "C": "El doble de la anchura de los postes y el travesaño."}, "correcta": "A", "explicacion": "Las líneas de meta tendrán la misma anchura que los postes y el travesaño.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-019", "bloque": "reglas", "enunciado": "Durante un partido, un jugador realiza marcas no autorizadas sobre el terreno de juego y el árbitro se percata de ello mientras el balón sigue en juego. ¿Cuándo debe amonestarlo?", "opciones": {"A": "De inmediato, deteniendo el juego en ese mismo instante.", "B": "En cuanto el balón deje de estar en juego.", "C": "Únicamente al finalizar el partido, reflejándolo en el acta."}, "correcta": "B", "explicacion": "Si el árbitro se percata de las marcas no autorizadas durante el partido, amonestará al infractor por conducta antideportiva en cuanto el balón deje de estar en juego.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-020", "bloque": "reglas", "enunciado": "¿Con qué material se puede realizar la marcación del terreno de juego según la Regla 1?", "opciones": {"A": "Únicamente con cal o pintura tradicional.", "B": "Con material artificial, siempre que no suponga un peligro.", "C": "Con cualquier material, sin restricción alguna sobre su seguridad."}, "correcta": "B", "explicacion": "Se podrá utilizar material artificial para la marcación de terrenos naturales si esto no supone un peligro.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 25}, {"id": "RJ1-021", "bloque": "reglas", "enunciado": "¿Cuáles son las dimensiones mínima y máxima de la línea de banda en partidos no internacionales?", "opciones": {"A": "Mínimo 90 m y máximo 120 m.", "B": "Mínimo 100 m y máximo 110 m.", "C": "Mínimo 45 m y máximo 90 m."}, "correcta": "A", "explicacion": "La Regla 1 fija la línea de banda entre 90 m (mínimo) y 120 m (máximo) en competiciones no internacionales.", "referencia": "Regla 1 / Dimensiones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-022", "bloque": "reglas", "enunciado": "¿Cuáles son las dimensiones mínima y máxima de la línea de meta en partidos no internacionales?", "opciones": {"A": "Mínimo 45 m y máximo 90 m.", "B": "Mínimo 64 m y máximo 75 m.", "C": "Mínimo 50 m y máximo 100 m."}, "correcta": "A", "explicacion": "La línea de meta debe medir entre 45 m (mínimo) y 90 m (máximo) en competiciones no internacionales.", "referencia": "Regla 1 / Dimensiones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-023", "bloque": "reglas", "enunciado": "Un organizador de competición no internacional fija un terreno de 95 m de línea de banda por 95 m de línea de meta. ¿Es reglamentario?", "opciones": {"A": "No, porque la línea de banda siempre debe ser de mayor longitud que la línea de meta.", "B": "Sí, ambas medidas están dentro de los límites permitidos y no existe más restricción.", "C": "No, porque la línea de meta no puede superar los 90 m bajo ninguna circunstancia."}, "correcta": "A", "explicacion": "La Regla 1 exige que la longitud de la línea de banda sea siempre superior a la de la línea de meta, con independencia de que ambas medidas estén dentro de rango.", "referencia": "Regla 1 / Dimensiones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-024", "bloque": "reglas", "enunciado": "¿Cuáles son las dimensiones mínima y máxima de la línea de banda para partidos internacionales?", "opciones": {"A": "Mínimo 100 m y máximo 110 m.", "B": "Mínimo 90 m y máximo 120 m.", "C": "Mínimo 95 m y máximo 115 m."}, "correcta": "A", "explicacion": "En partidos internacionales, la línea de banda debe medir entre 100 m (mínimo) y 110 m (máximo).", "referencia": "Regla 1 / Dimensiones en partidos internacionales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-025", "bloque": "reglas", "enunciado": "¿Cuáles son las dimensiones mínima y máxima de la línea de meta para partidos internacionales?", "opciones": {"A": "Mínimo 64 m y máximo 75 m.", "B": "Mínimo 45 m y máximo 90 m.", "C": "Mínimo 60 m y máximo 80 m."}, "correcta": "A", "explicacion": "En partidos internacionales, la línea de meta debe medir entre 64 m (mínimo) y 75 m (máximo).", "referencia": "Regla 1 / Dimensiones en partidos internacionales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-026", "bloque": "reglas", "enunciado": "¿Desde qué punto de referencia se toman las medidas del terreno de juego según la Regla 1?", "opciones": {"A": "Desde el exterior de las líneas de demarcación, ya que la línea forma parte del área que delimita.", "B": "Desde el centro exacto de cada línea de demarcación, tomando como referencia el punto medio de dicha línea.", "C": "Desde el interior de las líneas de demarcación, excluyendo expresamente la propia línea de las medidas del terreno."}, "correcta": "A", "explicacion": "Las medidas parten del exterior de las líneas de demarcación, puesto que la propia línea forma parte del área que delimita.", "referencia": "Regla 1 / Dimensiones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-027", "bloque": "reglas", "enunciado": "¿Cómo se mide la distancia del punto penal a la línea de meta?", "opciones": {"A": "Desde el centro del punto penal hasta el borde externo de la línea de meta.", "B": "Desde el borde interior del punto penal hasta el borde interior de la línea de meta.", "C": "Desde el centro del punto penal hasta el centro de la línea de meta, sin más precisión."}, "correcta": "A", "explicacion": "La distancia del punto penal se mide desde el centro de este hasta el borde externo de la línea de meta.", "referencia": "Regla 1 / Dimensiones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-028", "bloque": "reglas", "enunciado": "¿A qué distancia de cada poste de la portería se trazan las líneas perpendiculares que delimitan el área de meta?", "opciones": {"A": "A 5.5 m de la parte interior de cada poste.", "B": "A 16.5 m de la parte interior de cada poste.", "C": "A 6 m de la parte exterior de cada poste."}, "correcta": "A", "explicacion": "Las líneas del área de meta se trazan a 5.5 m de la parte interior de cada poste de la portería.", "referencia": "Regla 1 / Área de meta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-029", "bloque": "reglas", "enunciado": "¿Cuánto se adentran en el terreno de juego las líneas que delimitan el área de meta?", "opciones": {"A": "5.5 m.", "B": "16.5 m.", "C": "9.15 m."}, "correcta": "A", "explicacion": "Las líneas del área de meta se adentran 5.5 m en el terreno de juego antes de unirse con una línea paralela a la de meta.", "referencia": "Regla 1 / Área de meta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-030", "bloque": "reglas", "enunciado": "¿A qué distancia de cada poste de la portería se trazan las líneas perpendiculares que delimitan el área penal?", "opciones": {"A": "A 16.5 m de la parte interior de cada poste.", "B": "A 5.5 m de la parte interior de cada poste.", "C": "A 18 m de la parte exterior de cada poste."}, "correcta": "A", "explicacion": "Las líneas del área penal se trazan a 16.5 m de la parte interior de cada poste de la portería.", "referencia": "Regla 1 / Área penal", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-031", "bloque": "reglas", "enunciado": "¿A qué distancia, equidistante de ambos postes, se marca el punto penal dentro del área penal?", "opciones": {"A": "A 11 m de distancia.", "B": "A 9.15 m de distancia.", "C": "A 16.5 m de distancia."}, "correcta": "A", "explicacion": "El punto penal se marca a 11 m de distancia, equidistante de los dos postes.", "referencia": "Regla 1 / Área penal", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-032", "bloque": "reglas", "enunciado": "¿Con qué radio se traza el arco situado en el exterior del área penal, desde el centro del punto penal?", "opciones": {"A": "9.15 m.", "B": "11 m.", "C": "5.5 m."}, "correcta": "A", "explicacion": "El arco exterior del área penal se traza con un radio de 9.15 m desde el centro del punto penal.", "referencia": "Regla 1 / Área penal", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-033", "bloque": "reglas", "enunciado": "¿Con qué radio se marca el cuadrante que delimita el área de esquina?", "opciones": {"A": "1 m desde el banderín de esquina.", "B": "5.5 m desde el banderín de esquina.", "C": "9.15 m desde el banderín de esquina."}, "correcta": "A", "explicacion": "El área de esquina se marca trazando un cuadrante en el interior del terreno de juego con un radio de 1 m desde el banderín de esquina.", "referencia": "Regla 1 / Área de esquina", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-034", "bloque": "reglas", "enunciado": "¿Cuál es la altura mínima que debe tener el poste del banderín de esquina?", "opciones": {"A": "1.5 m.", "B": "1 m.", "C": "2 m."}, "correcta": "A", "explicacion": "El poste del banderín de esquina, no puntiagudo, debe tener una altura mínima de 1.5 m.", "referencia": "Regla 1 / Postes de banderines", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-035", "bloque": "reglas", "enunciado": "Un club instala postes de banderín de esquina de forma puntiaguda para mejorar su visibilidad. ¿Es reglamentario?", "opciones": {"A": "No, los postes de banderín de esquina no pueden ser puntiagudos.", "B": "Sí, siempre que la altura mínima de 1.5 m se respete igualmente.", "C": "Sí, siempre que el árbitro lo autorice antes del inicio del partido."}, "correcta": "A", "explicacion": "El poste del banderín de esquina es obligatorio, no puede ser puntiagudo y debe tener una terminación redondeada.", "referencia": "Regla 1 / Postes de banderines", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-036", "bloque": "reglas", "enunciado": "¿Es obligatorio colocar banderines en los extremos de la línea central del terreno de juego?", "opciones": {"A": "No, su colocación es opcional.", "B": "Sí, son obligatorios igual que los de las esquinas.", "C": "Sí, pero solo en competiciones profesionales."}, "correcta": "A", "explicacion": "A diferencia de los banderines de esquina (obligatorios), los banderines en los extremos de la línea central son opcionales.", "referencia": "Regla 1 / Postes de banderines", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-037", "bloque": "reglas", "enunciado": "Si se colocan banderines en los extremos de la línea central, ¿a qué distancia mínima de la línea de banda deben situarse y en qué posición respecto al terreno de juego?", "opciones": {"A": "A una distancia mínima de 1 m de la línea de banda, en el exterior del terreno de juego.", "B": "A una distancia mínima de 5.5 m de la línea de banda, en el interior del terreno de juego.", "C": "A una distancia mínima de 1.5 m de la línea de banda, sobre la propia línea de banda."}, "correcta": "A", "explicacion": "Los banderines opcionales de la línea central se colocan a una distancia mínima de 1 m de la línea de banda y en el exterior del terreno de juego.", "referencia": "Regla 1 / Postes de banderines", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-038", "bloque": "reglas", "enunciado": "¿Con qué radio se traza la circunferencia alrededor del punto central del terreno de juego?", "opciones": {"A": "9.15 m.", "B": "11 m.", "C": "16.5 m."}, "correcta": "A", "explicacion": "Alrededor del punto central se traza una circunferencia con un radio de 9.15 m, formando el círculo central.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-039", "bloque": "reglas", "enunciado": "¿A qué distancia del arco de esquina se pueden realizar marcaciones opcionales fuera del terreno de juego, en perpendicular a las líneas de meta y de banda?", "opciones": {"A": "9.15 m.", "B": "1 m.", "C": "5.5 m."}, "correcta": "A", "explicacion": "Se podrán realizar marcaciones fuera del terreno de juego, a 9.15 m del arco de esquina, en perpendicular a las líneas de meta y de banda.", "referencia": "Regla 1 / Marcación del terreno", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-040", "bloque": "reglas", "enunciado": "¿Hasta qué distancia se extiende el área técnica a cada lado del banquillo, según la Regla 1?", "opciones": {"A": "1 m a cada lado del banquillo.", "B": "5.5 m a cada lado del banquillo.", "C": "No existe límite lateral definido, queda a criterio del club."}, "correcta": "A", "explicacion": "El área técnica se extenderá únicamente 1 m a cada lado del banquillo.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-041", "bloque": "reglas", "enunciado": "¿Hasta qué distancia de la línea de banda se extiende el área técnica?", "opciones": {"A": "1 m de distancia de la línea de banda.", "B": "5.5 m de distancia de la línea de banda.", "C": "9.15 m de distancia de la línea de banda."}, "correcta": "A", "explicacion": "El área técnica se extenderá hasta 1 m de distancia de la línea de banda.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-042", "bloque": "reglas", "enunciado": "¿Quién determina el número de personas autorizadas a ocupar el área técnica?", "opciones": {"A": "El reglamento de la competición.", "B": "El árbitro principal, de forma discrecional antes de cada partido.", "C": "El delegado de campo del equipo local."}, "correcta": "A", "explicacion": "El número de personas autorizadas en el área técnica estará determinado por el reglamento de la competición.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-043", "bloque": "reglas", "enunciado": "El fisioterapeuta de un equipo abandona el área técnica y entra en el terreno de juego para atender a un jugador lesionado. ¿En qué circunstancia está permitido según la Regla 1?", "opciones": {"A": "Con el permiso del árbitro.", "B": "Sin necesidad de permiso, siempre que el balón esté fuera de juego.", "C": "Únicamente si lo autoriza previamente el delegado del equipo contrario."}, "correcta": "A", "explicacion": "Los ocupantes del área técnica deben permanecer dentro de sus límites salvo circunstancias especiales, como que el fisioterapeuta o el médico deba entrar en el terreno de juego con permiso del árbitro para atender a un jugador lesionado.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-044", "bloque": "reglas", "enunciado": "Durante un partido, dos miembros del cuerpo técnico del mismo equipo dan instrucciones tácticas a la vez desde el área técnica. ¿Es esto conforme a la Regla 1?", "opciones": {"A": "No, solamente una persona a la vez puede dar instrucciones tácticas desde el área técnica.", "B": "Sí, no existe ninguna limitación sobre el número de personas que pueden instruir simultáneamente.", "C": "Sí, siempre que ambas permanezcan sentadas en el banquillo mientras lo hacen."}, "correcta": "A", "explicacion": "La Regla 1 establece que solamente podrá dar instrucciones tácticas desde el área técnica una persona a la vez.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-045", "bloque": "reglas", "enunciado": "¿Qué obligación tienen los ocupantes del área técnica respecto a su identificación, según la Regla 1?", "opciones": {"A": "Deberán identificarse antes del inicio del partido, de conformidad con el reglamento de la competición.", "B": "No existe obligación de identificación, basta con estar incluidos en la lista del equipo.", "C": "Deben identificarse únicamente si el árbitro lo solicita expresamente durante el partido."}, "correcta": "A", "explicacion": "Los ocupantes del área técnica deberán identificarse antes del inicio del partido, de conformidad con el reglamento de la competición.", "referencia": "Regla 1 / Área técnica", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-046", "bloque": "reglas", "enunciado": "¿Cuál es la distancia reglamentaria entre la parte interior de los postes de la portería?", "opciones": {"A": "7.32 m.", "B": "7.34 m.", "C": "8 m."}, "correcta": "A", "explicacion": "La distancia entre la parte interior de los postes será de 7.32 m.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-047", "bloque": "reglas", "enunciado": "¿Cuál es la distancia reglamentaria entre el borde inferior del travesaño y el suelo?", "opciones": {"A": "2.44 m.", "B": "2.42 m.", "C": "2.50 m."}, "correcta": "A", "explicacion": "La distancia del borde inferior del travesaño al suelo será de 2.44 m.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-048", "bloque": "reglas", "enunciado": "¿De qué color deben ser los postes y el travesaño de la portería?", "opciones": {"A": "Blanco.", "B": "Blanco o amarillo, a elección del organizador.", "C": "El color corporativo del club local."}, "correcta": "A", "explicacion": "Los postes y el travesaño deberán ser de color blanco.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-049", "bloque": "reglas", "enunciado": "¿Cuál es la anchura máxima permitida para los postes y el travesaño de la portería?", "opciones": {"A": "12 cm.", "B": "10 cm.", "C": "15 cm."}, "correcta": "A", "explicacion": "Los postes y el travesaño deberán tener la misma anchura y espesor, como máximo 12 cm.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-050", "bloque": "reglas", "enunciado": "¿Qué formas se admiten reglamentariamente para los postes y el travesaño de la portería?", "opciones": {"A": "Cuadrada, rectangular, redonda, elíptica o una combinación de estas formas.", "B": "Únicamente cuadrada o rectangular, quedando excluidas las formas curvas.", "C": "Cualquier forma, sin restricción alguna, siempre que el material esté homologado."}, "correcta": "A", "explicacion": "Los postes y el travesaño deberán tener la misma forma, ya sea cuadrada, rectangular, redonda, elíptica o una combinación de estas formas, en ambas porterías.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-051", "bloque": "reglas", "enunciado": "Durante un partido, el travesaño de una portería se rompe. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Detener el juego hasta que el travesaño sea reparado o devuelto a su posición original.", "B": "Permitir que continúe el partido sin travesaño hasta el siguiente descanso.", "C": "Suspender el partido de forma inmediata y definitiva sin más comprobaciones."}, "correcta": "A", "explicacion": "Si el travesaño se rompiera o se saliera de su sitio, se detendrá el juego hasta que haya sido reparado o devuelto a su posición original.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-052", "bloque": "reglas", "enunciado": "Tras romperse el travesaño de una portería, el juego se detiene y finalmente puede repararse. ¿Cómo se reanuda el partido?", "opciones": {"A": "Con un balón a tierra.", "B": "Con un saque de meta a favor del equipo defensor.", "C": "Con un tiro libre indirecto a favor del equipo que estaba en posesión del balón."}, "correcta": "A", "explicacion": "El juego se reanudará con un balón a tierra una vez reparado o devuelto a su posición original el travesaño.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-053", "bloque": "reglas", "enunciado": "El travesaño de una portería se rompe durante el partido y resulta imposible repararlo ni sustituirlo reglamentariamente. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Suspender el partido.", "B": "Continuar el encuentro utilizando una cuerda tensada en su lugar.", "C": "Trasladar el partido a un campo alternativo sin necesidad de autorización adicional."}, "correcta": "A", "explicacion": "Si no fuera posible reparar el travesaño, se deberá suspender el partido, no estando permitido sustituirlo por una cuerda u otro material flexible o peligroso.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-054", "bloque": "reglas", "enunciado": "Un club, ante la rotura del travesaño, propone sustituirlo temporalmente por una cuerda tensada entre los postes. ¿Lo permite la Regla 1?", "opciones": {"A": "No, está expresamente prohibido sustituir el travesaño por una cuerda o material flexible o peligroso.", "B": "Sí, siempre que la cuerda esté correctamente tensada y no represente peligro.", "C": "Sí, pero únicamente en categorías no profesionales y con autorización del árbitro."}, "correcta": "A", "explicacion": "No está permitido colocar una cuerda ni ningún otro material flexible o peligroso para sustituir el travesaño.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-055", "bloque": "reglas", "enunciado": "¿Es obligatorio colocar redes en las porterías según la Regla 1?", "opciones": {"A": "No necesariamente; puede depender del reglamento de la competición, y si se usan deben cumplir determinadas condiciones.", "B": "Sí, son obligatorias en todas las categorías sin excepción, con independencia de lo que disponga cada reglamento.", "C": "No, las redes están expresamente prohibidas en todas las competiciones oficiales auspiciadas por la FIFA."}, "correcta": "A", "explicacion": "El uso de redes puede depender del reglamento de la competición; en caso de utilizarse, deben estar sujetas adecuadamente para no molestar al guardameta.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-056", "bloque": "reglas", "enunciado": "Si se colocan redes en la portería, ¿qué condición exige la Regla 1 respecto a su sujeción?", "opciones": {"A": "Que estén sujetas de manera adecuada para que no molesten al guardameta.", "B": "Que estén sujetas únicamente a los postes, sin fijarse al suelo.", "C": "Que sean del mismo color que los postes de la portería."}, "correcta": "A", "explicacion": "Las redes deberán estar sujetas de manera adecuada, para que no molesten al guardameta.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-057", "bloque": "reglas", "enunciado": "¿Qué exige la Regla 1 respecto al anclaje de las porterías, incluidas las portátiles?", "opciones": {"A": "Que estén ancladas firmemente en el suelo.", "B": "Que dispongan de ruedas para facilitar su desplazamiento durante el partido.", "C": "Que se revisen únicamente al inicio de cada temporada."}, "correcta": "A", "explicacion": "Por motivos de seguridad, las porterías, incluso las portátiles, deberán estar ancladas firmemente en el suelo.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-058", "bloque": "reglas", "enunciado": "¿Dónde se coloca la portería en el terreno de juego según la Regla 1?", "opciones": {"A": "En el centro de cada una de las dos líneas de meta.", "B": "En el centro de cada una de las dos líneas de banda.", "C": "En cualquier punto de la línea de meta, a criterio del organizador."}, "correcta": "A", "explicacion": "En el centro de cada una de las dos líneas de meta se colocará una portería.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-059", "bloque": "reglas", "enunciado": "¿Para qué finalidad puede emplearse un sistema de Detección Automática de Goles (DAG)?", "opciones": {"A": "Para verificar si se ha anotado un gol y apoyar la decisión del árbitro.", "B": "Para sustituir por completo la decisión del árbitro en cualquier incidencia del partido.", "C": "Para revisar faltas y expulsiones ocurridas fuera del área penal."}, "correcta": "A", "explicacion": "Los sistemas de DAG pueden usarse para verificar si se ha anotado un gol y apoyar la decisión del árbitro.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-060", "bloque": "reglas", "enunciado": "¿Qué debe regular el reglamento de la competición en relación con la DAG?", "opciones": {"A": "El uso de estos sistemas.", "B": "Únicamente el color del dispositivo instalado en la línea de meta.", "C": "El fabricante concreto que debe suministrar el sistema."}, "correcta": "A", "explicacion": "El uso de los sistemas de DAG debe estar regulado en el reglamento de la competición.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-061", "bloque": "reglas", "enunciado": "¿A qué se aplica exclusivamente el sistema DAG según sus principios?", "opciones": {"A": "Únicamente a la línea de meta, para determinar si se ha anotado un gol.", "B": "A todas las líneas del terreno de juego, para determinar salidas de balón.", "C": "A la línea de meta y a la línea de banda conjuntamente."}, "correcta": "A", "explicacion": "El sistema DAG se aplicará únicamente a la línea de meta y solo para determinar si se ha anotado un gol.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-062", "bloque": "reglas", "enunciado": "¿En qué plazo máximo debe el dispositivo DAG confirmar automáticamente si se ha anotado un gol?", "opciones": {"A": "Un segundo.", "B": "Tres segundos.", "C": "Cinco segundos."}, "correcta": "A", "explicacion": "El dispositivo deberá indicar y confirmar automáticamente la anotación de un gol en un tiempo máximo de un segundo.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-063", "bloque": "reglas", "enunciado": "¿A quién se transmite la información de la DAG cuando confirma un gol?", "opciones": {"A": "Solamente al equipo arbitral, aunque también se podrá transmitir a la sala de vídeo.", "B": "A todo el estadio a través de la pantalla gigante de forma automática.", "C": "Únicamente al delegado de campo del equipo local."}, "correcta": "A", "explicacion": "El dato se transmitirá solamente al equipo arbitral (reloj, vibración y señal visual, o auricular), y también se podrá transmitir a la sala de vídeo.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-064", "bloque": "reglas", "enunciado": "Antes de un partido en el que se va a utilizar la DAG, el árbitro comprueba su funcionamiento y detecta que no opera según lo dispuesto en el manual de pruebas. ¿Qué debe hacer?", "opciones": {"A": "No utilizar la DAG y comunicarlo a las autoridades competentes.", "B": "Utilizarla igualmente, dejando constancia de la incidencia en el acta del partido.", "C": "Posponer el inicio del partido hasta que el fabricante repare el sistema in situ."}, "correcta": "A", "explicacion": "Si el dispositivo no funcionara según lo dispuesto en el manual de pruebas, el árbitro no podrá utilizar la DAG y se lo comunicará a las autoridades competentes.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-065", "bloque": "reglas", "enunciado": "¿Qué requisito técnico deben cumplir los sistemas de DAG utilizados en competición según la Regla 1?", "opciones": {"A": "Los requisitos del Programa de calidad de la FIFA de sistemas de detección automática de goles.", "B": "Únicamente disponer de certificación del fabricante nacional correspondiente.", "C": "Ningún requisito específico, quedando a criterio del organizador de la competición."}, "correcta": "A", "explicacion": "Los organizadores deben garantizar que el sistema cumpla con los requisitos del Programa de calidad de la FIFA de sistemas de detección automática de goles.", "referencia": "Regla 1 / Detección automática de goles", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-066", "bloque": "reglas", "enunciado": "¿Se permite publicidad comercial, real o virtual, sobre el propio terreno de juego durante el tiempo que los equipos permanecen en él?", "opciones": {"A": "No, no se permite publicidad comercial alguna, ni real ni virtual, en el terreno de juego.", "B": "Sí, siempre que sea publicidad virtual y no física.", "C": "Sí, siempre que el patrocinador coincida con el patrocinador oficial de la competición."}, "correcta": "A", "explicacion": "No se permite publicidad comercial alguna, ya sea real o virtual, en el terreno de juego, desde que los equipos entran hasta que lo abandonan.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-067", "bloque": "reglas", "enunciado": "¿Está permitida la publicidad en las redes de la portería y en los postes de los banderines de esquina?", "opciones": {"A": "No, está expresamente prohibida la publicidad en las porterías, las redes y los banderines de esquina y sus postes.", "B": "Sí, siempre que sea de pequeño tamaño y no dificulte la visión del guardameta.", "C": "Sí, únicamente en los postes de los banderines de esquina, pero no en las redes."}, "correcta": "A", "explicacion": "Está prohibida la publicidad en las porterías, las redes, los banderines de esquina y sus postes.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-068", "bloque": "reglas", "enunciado": "¿Se puede fijar una cámara o un micrófono directamente sobre la red de la portería?", "opciones": {"A": "No, en las porterías, redes y banderines de esquina no se podrá fijar ningún material externo como cámaras o micrófonos.", "B": "Sí, siempre que el material esté homologado técnicamente por la federación organizadora de la competición.", "C": "Sí, únicamente si lo solicita la televisión oficial encargada de retransmitir el partido en cuestión."}, "correcta": "A", "explicacion": "En las porterías, las redes y los banderines de esquina (y sus postes) no se podrá fijar ningún material externo, como cámaras o micrófonos.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-069", "bloque": "reglas", "enunciado": "¿A qué distancia mínima de las líneas de demarcación del terreno de juego está prohibida la publicidad en el suelo?", "opciones": {"A": "1 m.", "B": "5.5 m.", "C": "9.15 m."}, "correcta": "A", "explicacion": "Está prohibida la publicidad en el suelo a una distancia de 1 m de las líneas de demarcación del terreno de juego.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-070", "bloque": "reglas", "enunciado": "¿A qué distancia mínima de las líneas de banda debe hallarse la publicidad vertical según la Regla 1?", "opciones": {"A": "Al menos 1 m de las líneas de banda.", "B": "Al menos 5.5 m de las líneas de banda.", "C": "Al menos 9.15 m de las líneas de banda."}, "correcta": "A", "explicacion": "La publicidad vertical deberá hallarse al menos a 1 m de las líneas de banda.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-071", "bloque": "reglas", "enunciado": "¿Desde qué momento hasta cuál se prohíbe la publicidad comercial en el terreno de juego durante la primera parte, según la Regla 1?", "opciones": {"A": "Desde que los equipos entran en el terreno de juego hasta que lo abandonan en el descanso.", "B": "Únicamente durante los minutos en que el balón está efectivamente en juego.", "C": "Desde el pitido inicial hasta el pitido final de la primera parte, sin incluir el calentamiento."}, "correcta": "A", "explicacion": "La prohibición rige desde el momento en que los equipos entran en el terreno de juego hasta que lo abandonan en el descanso del medio tiempo.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-072", "bloque": "reglas", "enunciado": "¿Está prohibida la publicidad comercial en el área técnica y en el área de revisión del VAR?", "opciones": {"A": "Sí, la prohibición de publicidad alcanza también al área técnica y al área de revisión.", "B": "No, en el área técnica y en el área de revisión la publicidad está permitida sin restricciones.", "C": "Solo está prohibida en el área técnica, pero permitida en el área de revisión."}, "correcta": "A", "explicacion": "La prohibición de publicidad comercial se extiende al terreno de juego, al área técnica y al área de revisión.", "referencia": "Regla 1 / Publicidad comercial", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-073", "bloque": "reglas", "enunciado": "Durante el tiempo de juego, ¿está permitida la reproducción de emblemas de clubes sobre el terreno de juego?", "opciones": {"A": "No, queda prohibida la reproducción real o virtual de logotipos o emblemas de clubes, entre otras entidades, sobre el terreno de juego durante el tiempo de juego.", "B": "Sí, siempre que se trate del emblema del club local únicamente, quedando prohibidos los del equipo visitante.", "C": "Sí, sin restricción alguna, ya que la prohibición solo alcanza a los emblemas de patrocinadores comerciales."}, "correcta": "A", "explicacion": "Durante el tiempo de juego, queda prohibida en el terreno de juego la reproducción real o virtual de logotipos o emblemas de la FIFA, confederaciones, federaciones, competiciones, clubes u otras entidades.", "referencia": "Regla 1 / Logotipos y emblemas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-074", "bloque": "reglas", "enunciado": "¿En qué elemento del terreno de juego sí están permitidos los logotipos o emblemas durante el tiempo de juego?", "opciones": {"A": "En los banderines de esquina.", "B": "En las redes de la portería.", "C": "En los postes y el travesaño de la portería."}, "correcta": "A", "explicacion": "Los logotipos y emblemas están prohibidos en el terreno de juego, las redes de portería, las porterías y los postes de los banderines de esquina, pero sí están permitidos en los banderines de esquina.", "referencia": "Regla 1 / Logotipos y emblemas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-075", "bloque": "reglas", "enunciado": "En un partido donde se utiliza el VAR, ¿qué instalaciones exige como mínimo la Regla 1?", "opciones": {"A": "Una sala de vídeo y al menos un área de revisión.", "B": "Únicamente un área de revisión, sin necesidad de sala de vídeo.", "C": "Dos salas de vídeo independientes conectadas entre sí."}, "correcta": "A", "explicacion": "En los partidos donde se utilice el VAR, se deberá contar con una sala de vídeo y al menos con un área de revisión.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-076", "bloque": "reglas", "enunciado": "¿Dónde puede estar ubicada la sala de vídeo utilizada por el VAR según la Regla 1?", "opciones": {"A": "En el mismo estadio, cerca de este, o en un emplazamiento más alejado.", "B": "Obligatoriamente dentro del propio estadio y en ningún otro lugar.", "C": "Exclusivamente en las instalaciones centrales de la federación organizadora."}, "correcta": "A", "explicacion": "La sala de vídeo estará ubicada en el mismo estadio, cerca de este o en un emplazamiento más alejado.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-077", "bloque": "reglas", "enunciado": "Un suplente, sin ser miembro del equipo arbitral, accede a la sala de vídeo durante el partido. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Expulsarlo, ya que será expulsado todo jugador, suplente, jugador sustituido o miembro del cuerpo técnico que acceda a la sala de vídeo.", "B": "Amonestarlo únicamente, dejando constancia del acceso en el acta del partido sin adoptar otra medida.", "C": "No tomar ninguna medida disciplinaria si el acceso fue breve y el suplente no llegó a intervenir en la revisión."}, "correcta": "A", "explicacion": "Será expulsado todo jugador, suplente, jugador sustituido o miembro del cuerpo técnico que acceda a la sala de vídeo.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-078", "bloque": "reglas", "enunciado": "¿Qué características debe cumplir el área de revisión del VAR según la Regla 1?", "opciones": {"A": "Estar situada en un lugar visible fuera del terreno de juego y claramente marcada.", "B": "Estar situada dentro del propio terreno de juego, junto a la línea de banda.", "C": "Estar situada en el área técnica de cualquiera de los dos equipos."}, "correcta": "A", "explicacion": "El área de revisión estará situada en un lugar visible fuera del terreno de juego y claramente marcada.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-079", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico entra en el área de revisión del VAR sin ser el árbitro. ¿Qué decisión debe tomar el árbitro según la Regla 1?", "opciones": {"A": "Amonestarlo, ya que se amonestará a todo jugador, suplente, jugador sustituido o miembro del cuerpo técnico que entre en el área de revisión.", "B": "Expulsarlo directamente, igual que si hubiera accedido a la sala de vídeo en lugar del área de revisión.", "C": "No adoptar ninguna medida disciplinaria, al tratarse de una zona exterior al terreno de juego propiamente dicho."}, "correcta": "A", "explicacion": "Se amonestará a todos aquellos jugadores, suplentes, jugadores sustituidos o miembros del cuerpo técnico que entren en el área de revisión.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-080", "bloque": "reglas", "enunciado": "Además de la distancia respecto a las líneas de banda, ¿a qué distancia de la línea de meta debe hallarse la publicidad vertical según la Regla 1?", "opciones": {"A": "A la misma distancia de la línea de meta que la profundidad de las redes de la portería.", "B": "A una distancia fija de 5.5 m de la línea de meta, con independencia de la profundidad de las redes.", "C": "A una distancia fija de 9.15 m de la línea de meta."}, "correcta": "A", "explicacion": "La publicidad vertical deberá hallarse, respecto a la línea de meta, a la misma distancia que la profundidad de las redes de la portería.", "referencia": "Regla 1.12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-081", "bloque": "reglas", "enunciado": "¿A qué distancia mínima de la red de la portería debe hallarse la publicidad vertical según la Regla 1?", "opciones": {"A": "1 m de la red de la portería.", "B": "5.5 m de la red de la portería.", "C": "No existe ninguna distancia mínima exigida respecto a la red de la portería."}, "correcta": "A", "explicacion": "La publicidad vertical deberá hallarse al menos a 1 m (1 yd) de la red de la portería.", "referencia": "Regla 1.12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-082", "bloque": "reglas", "enunciado": "Según la Regla 1, para partidos internacionales, ¿cuáles son los límites de longitud y anchura del terreno de juego?", "opciones": {"A": "Longitud máxima 110, mínima 105, y anchura máxima 74, mínima 64.", "B": "Longitud máxima 110, mínima 100, y anchura máxima 75, mínima 64.", "C": "Longitud máxima 120, mínima 90, y anchura máxima 90, mínima 45."}, "correcta": "B", "explicacion": "Para partidos internacionales, la Regla 1 fija longitud entre 100 y 110 m, y anchura entre 64 y 75 m.", "referencia": "Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-083", "bloque": "reglas", "enunciado": "Respecto a las redes de la meta, ¿cuál es la afirmación más completa y correcta según la Regla 1?", "opciones": {"A": "Son obligatorias, deben estar enganchadas a las porterías y al suelo, y no molestar al guardameta.", "B": "Pueden ser obligatorias o no según el reglamento de la competición; si se usan, deben estar enganchadas a las porterías y al suelo, sin molestar al guardameta.", "C": "No son obligatorias, pero deben estar enganchadas a las porterías y al suelo, sin molestar al guardameta."}, "correcta": "B", "explicacion": "El uso de redes depende del reglamento de la competición; en caso de utilizarse, deben cumplir las condiciones de sujeción y no molestar al guardameta.", "referencia": "Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 28}, {"id": "RJ1-084", "bloque": "reglas", "enunciado": "¿Se permite publicidad comercial en las redes de las porterías durante el tiempo de juego?", "opciones": {"A": "Sí, aunque con algunas excepciones.", "B": "No.", "C": "Depende exclusivamente del organizador de la competición, sin límite reglamentario."}, "correcta": "B", "explicacion": "La normativa de publicidad prohíbe la publicidad comercial en las redes de las porterías durante el tiempo de juego.", "referencia": "Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-085", "bloque": "reglas", "enunciado": "¿Cuáles son las dimensiones reglamentarias de la portería?", "opciones": {"A": "7,32 metros de longitud y 2,44 metros de alto.", "B": "7,32 metros de longitud y 2,42 metros de alto.", "C": "7,34 metros de longitud y 2,42 metros de alto."}, "correcta": "A", "explicacion": "Las dimensiones reglamentarias de la portería son 7,32 metros de longitud (ancho entre postes) y 2,44 metros de alto.", "referencia": "Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ1-086", "bloque": "reglas", "enunciado": "¿Qué elementos deben figurar obligatoriamente marcados en el terreno de juego según la Regla 1?", "opciones": {"A": "Únicamente las líneas de banda y de meta, sin que sea obligatorio marcar ningún otro elemento del terreno de juego.", "B": "Las líneas perimetrales, el círculo central, las áreas de penal y de meta, y el punto de penal, entre otros.", "C": "Solo el círculo central y el punto de penal, sin que sea obligatorio delimitar el resto de áreas del terreno."}, "correcta": "B", "explicacion": "La Regla 1 exige el marcado de las líneas perimetrales, círculo central, áreas de penal y de meta, punto de penal, arco del área, entre otros elementos.", "referencia": "Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 1", "pagina": 26}, {"id": "RJ2-001", "bloque": "reglas", "enunciado": "¿Pueden los capitanes proponer al árbitro el cambio de balón durante el transcurso del juego?", "opciones": {"A": "No, en ningún caso.", "B": "Sí, y el árbitro está obligado a comprobarlo y cambiarlo.", "C": "Sí, pero será potestad del árbitro atender o no la petición."}, "correcta": "C", "explicacion": "Los capitanes pueden proponer el cambio de balón, pero corresponde al árbitro decidir si atiende o no dicha petición.", "referencia": "Regla 2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-002", "bloque": "reglas", "enunciado": "¿Qué forma debe tener obligatoriamente el balón según la Regla 2?", "opciones": {"A": "Esférica.", "B": "Ovalada, para facilitar el control con el pie durante la ejecución de los saques y los pases largos.", "C": "Cualquier forma, siempre que esté fabricado con materiales adecuados y cumpla el peso reglamentario."}, "correcta": "A", "explicacion": "Los balones deberán ser esféricos.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-003", "bloque": "reglas", "enunciado": "¿Cuál es la circunferencia reglamentaria del balón?", "opciones": {"A": "Entre 68 y 70 cm.", "B": "Entre 64 y 66 cm.", "C": "Entre 70 y 72 cm."}, "correcta": "A", "explicacion": "La circunferencia del balón debe estar comprendida entre 68 y 70 cm.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-004", "bloque": "reglas", "enunciado": "¿Cuál es el peso reglamentario del balón al comienzo del partido?", "opciones": {"A": "Entre 410 y 450 g.", "B": "Entre 400 y 440 g.", "C": "Entre 420 y 460 g."}, "correcta": "A", "explicacion": "El balón debe tener un peso comprendido entre 410 y 450 g al comienzo del partido.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-005", "bloque": "reglas", "enunciado": "¿Cuál es la presión reglamentaria del balón al nivel del mar?", "opciones": {"A": "Entre 0.6 y 1.1 atmósferas.", "B": "Entre 0.4 y 0.9 atmósferas.", "C": "Entre 1.0 y 1.5 atmósferas."}, "correcta": "A", "explicacion": "La presión del balón debe ser equivalente a 0.6–1.1 atmósferas al nivel del mar.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-006", "bloque": "reglas", "enunciado": "Un delegado presenta un balón cuyo peso al inicio del partido es de 405 g, dentro de una circunferencia de 69 cm. ¿Es reglamentario?", "opciones": {"A": "No, porque el peso no alcanza el mínimo de 410 g exigido al comienzo del partido.", "B": "Sí, porque la circunferencia está dentro del rango permitido y eso es lo único determinante.", "C": "Sí, porque el peso solo se exige a partir de la segunda parte del encuentro."}, "correcta": "A", "explicacion": "El balón debe pesar entre 410 y 450 g al comienzo del partido; con 405 g queda por debajo del mínimo exigido.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-007", "bloque": "reglas", "enunciado": "En partidos de competición oficial organizados bajo los auspicios de la FIFA o las confederaciones, ¿qué deben cumplir los balones utilizados?", "opciones": {"A": "Los criterios del Programa de calidad de la FIFA de balones de fútbol y portar uno de sus sellos de calidad.", "B": "Únicamente las medidas de circunferencia y peso, sin necesidad de sello oficial alguno.", "C": "La aprobación específica de cada federación nacional, sin referencia a un programa de calidad FIFA."}, "correcta": "A", "explicacion": "Todos los balones utilizados en partidos de competición oficial de la FIFA o confederaciones deben cumplir los criterios del Programa de calidad de la FIFA de balones de fútbol y portar uno de sus sellos de calidad.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-008", "bloque": "reglas", "enunciado": "¿Qué indican los distintivos o sellos de calidad que puede portar un balón?", "opciones": {"A": "Que el balón ha sido examinado oficialmente y cumple los requisitos técnicos mínimos estipulados en la Regla 2.", "B": "Que el balón ha sido fabricado exclusivamente en un país autorizado por la FIFA.", "C": "Que el balón ha sido utilizado previamente en una competición oficial de la FIFA."}, "correcta": "A", "explicacion": "Estos distintivos indican que el balón ha sido examinado oficialmente y cumple los requisitos técnicos mínimos estipulados en la Regla 2 y aprobados por el IFAB.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-009", "bloque": "reglas", "enunciado": "¿Pueden las federaciones nacionales de fútbol exigir en sus competiciones el uso de balones con sello de calidad?", "opciones": {"A": "Sí, en las competiciones de las federaciones nacionales se podrá exigir el uso de balones que lleven uno de estos distintivos.", "B": "No, esa exigencia está reservada exclusivamente a la FIFA y a las confederaciones continentales de fútbol.", "C": "Sí, pero únicamente en las categorías profesionales masculinas de máximo nivel de cada federación."}, "correcta": "A", "explicacion": "En las competiciones de las federaciones nacionales de fútbol, se podrá exigir el uso de balones que lleven uno de estos distintivos de calidad.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-010", "bloque": "reglas", "enunciado": "En un partido de competición oficial bajo los auspicios de una federación nacional, ¿qué publicidad comercial está permitida en el balón?", "opciones": {"A": "Únicamente el logotipo o emblema de la competición o su organizador, y la marca registrada autorizada del fabricante.", "B": "Cualquier marca comercial, siempre que el club local lo autorice expresamente.", "C": "Ninguna publicidad de ningún tipo, incluyendo la del propio fabricante del balón."}, "correcta": "A", "explicacion": "Está prohibida toda publicidad comercial en el balón, con excepción del logotipo o emblema de la competición o su organizador y la marca registrada autorizada del fabricante.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-011", "bloque": "reglas", "enunciado": "¿Quién puede restringir el tamaño y el número de las marcas autorizadas del fabricante en el balón?", "opciones": {"A": "El reglamento de la competición.", "B": "Exclusivamente el propio fabricante del balón.", "C": "El árbitro principal, antes del inicio de cada partido."}, "correcta": "A", "explicacion": "El reglamento de la competición podrá restringir el tamaño y el número de dichas marcas.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 30}, {"id": "RJ2-012", "bloque": "reglas", "enunciado": "Durante el juego habitual, el balón pierde sus propiedades y no puede seguir utilizándose. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Detener el juego y reanudarlo con un balón a tierra.", "B": "Detener el juego y reanudarlo con un saque de banda a favor del equipo que tenía la posesión.", "C": "Permitir que el juego continúe hasta la siguiente interrupción natural."}, "correcta": "A", "explicacion": "Si el balón perdiera sus propiedades y no pudiera seguir utilizándose, se detendrá el juego y se reanudará con un balón a tierra.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-013", "bloque": "reglas", "enunciado": "El balón queda defectuoso durante la ejecución de un saque de esquina, antes de completarse correctamente. ¿Cómo procede el árbitro?", "opciones": {"A": "Se volverá a ejecutar el saque de esquina.", "B": "Se reanuda el juego con un balón a tierra en el lugar donde quedó defectuoso.", "C": "Se concede un saque de meta al equipo defensor por la anomalía del balón."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en un saque de esquina, se volverá a ejecutar dicho saque.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-014", "bloque": "reglas", "enunciado": "El balón queda defectuoso justo durante el lanzamiento de un tiro libre directo. ¿Cómo debe reanudarse el juego?", "opciones": {"A": "Se volverá a ejecutar el lanzamiento del tiro libre.", "B": "Se reanuda con balón a tierra en el lugar donde se produjo el defecto.", "C": "Se concede el mismo tiro libre al equipo contrario por la anomalía."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en el lanzamiento de un tiro libre, se volverá a ejecutar dicho lanzamiento.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-015", "bloque": "reglas", "enunciado": "Durante la ejecución de un tiro penal, el balón queda defectuoso mientras se desplaza hacia adelante, antes de tocar a un jugador, el travesaño o los postes. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Volver a ejecutar el lanzamiento del penal.", "B": "Conceder un balón a tierra a favor del guardameta dentro de su área de penal.", "C": "Dar por válido el resultado que hubiera tenido la trayectoria original del balón."}, "correcta": "A", "explicacion": "Si el balón, mientras se mueve hacia adelante, quedara defectuoso antes de tocar a un jugador, el travesaño o los postes durante un penal (o en la tanda de penales), se volverá a ejecutar dicho lanzamiento.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-016", "bloque": "reglas", "enunciado": "Durante una tanda de penales, el balón queda defectuoso mientras se dirige hacia la portería, antes de tocar cualquier elemento del juego. ¿Cómo se resuelve esta situación según la Regla 2?", "opciones": {"A": "Se vuelve a ejecutar el lanzamiento correspondiente de la tanda de penales.", "B": "El lanzamiento se contabiliza automáticamente como fallado.", "C": "Se concede el gol si la trayectoria del balón se dirigía claramente hacia la portería."}, "correcta": "A", "explicacion": "La Regla 2 establece que, si el balón quedara defectuoso antes de tocar a un jugador, el travesaño o los postes durante la tanda de penales, se volverá a ejecutar dicho lanzamiento.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-017", "bloque": "reglas", "enunciado": "¿Puede reemplazarse el balón durante el transcurso del partido por iniciativa propia de un equipo, sin más trámite?", "opciones": {"A": "No, el balón no podrá ser reemplazado durante el partido sin la autorización del árbitro.", "B": "Sí, cualquiera de los dos capitanes puede reemplazarlo libremente en cualquier momento.", "C": "Sí, siempre que el balón sustituto cumpla las especificaciones de la Regla 2, sin necesidad de autorización."}, "correcta": "A", "explicacion": "El balón no podrá ser reemplazado durante el transcurso del partido sin la autorización del árbitro.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-018", "bloque": "reglas", "enunciado": "Un jugador ejecuta correctamente un saque de banda, pero el balón resulta estar defectuoso ya en el momento del lanzamiento. ¿Cómo debe actuar el árbitro conforme a la Regla 2?", "opciones": {"A": "Se volverá a ejecutar el saque de banda con un balón en condiciones reglamentarias.", "B": "Se concede un balón a tierra a favor del equipo contrario en el lugar del saque.", "C": "El saque se da por válido y el juego continúa con normalidad."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en un saque de banda, se volverá a ejecutar dicho saque.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-019", "bloque": "reglas", "enunciado": "Durante un saque de meta correctamente ejecutado, el balón resulta estar defectuoso. ¿Qué determina la Regla 2 al respecto?", "opciones": {"A": "Se volverá a ejecutar el saque de meta.", "B": "Se concede un saque de esquina al equipo atacante como compensación.", "C": "El juego continúa sin más trámite, ya que el saque de meta ya se consideró ejecutado."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en un saque de meta, se volverá a ejecutar dicho saque.", "referencia": "Regla 2 / Sustitución de un balón defectuoso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-020", "bloque": "reglas", "enunciad
