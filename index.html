 jugadores sustituidos o a los miembros del cuerpo técnico.", "referencia": "Regla 12.4 / Tarjetas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-088", "bloque": "reglas", "enunciado": "¿Cuál es la finalidad de la tarjeta amarilla y de la tarjeta roja según la Regla 12.4?", "opciones": {"A": "La amarilla comunica una amonestación y la roja una expulsión.", "B": "La amarilla comunica una advertencia y la roja una amonestación grave.", "C": "La amarilla comunica una expulsión temporal y la roja una expulsión definitiva."}, "correcta": "A", "explicacion": "La tarjeta amarilla se utiliza para comunicar una amonestación y la tarjeta roja para comunicar una expulsión.", "referencia": "Regla 12.4 / Tarjetas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-089", "bloque": "reglas", "enunciado": "El árbitro ha decidido amonestar a un jugador. El equipo no infractor quiere ejecutar el libre rápido y no existe clara ocasión de gol. ¿Qué hace el árbitro?", "opciones": {"A": "Permite reanudar rápidamente y muestra la tarjeta en la siguiente interrupción.", "B": "No permite reanudar hasta haber mostrado la tarjeta.", "C": "Permite reanudar y no muestra la tarjeta, al haberse ganado ventaja."}, "correcta": "B", "explicacion": "Una vez decidida la amonestación, el juego no debe reanudarse hasta haber mostrado la tarjeta, salvo que el equipo no infractor quiera ejecutar rápido, tenga clara ocasión de gol y no se haya iniciado el procedimiento.", "referencia": "Regla 12.4 / Retrasar la reanudación para mostrar una tarjeta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-090", "bloque": "reglas", "enunciado": "El árbitro decide amonestar a un defensor y, cuando aún no ha iniciado el procedimiento de mostrar la tarjeta, el equipo atacante saca rápido el libre y dispone de una clara ocasión de gol. ¿Qué hace el árbitro?", "opciones": {"A": "Detiene el juego y muestra la tarjeta inmediatamente.", "B": "Renuncia a amonestar, porque el juego ya se reanudó.", "C": "Permite que el juego continúe y muestra la tarjeta en la siguiente interrupción."}, "correcta": "C", "explicacion": "Si el equipo no infractor quiere un libre rápido, hay clara ocasión de gol y el árbitro no ha iniciado el procedimiento, la tarjeta se mostrará en la siguiente interrupción.", "referencia": "Regla 12.4 / Retrasar la reanudación para mostrar una tarjeta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-091", "bloque": "reglas", "enunciado": "Un defensor impide con una falta una ocasión manifiesta de gol. El árbitro decide amonestarlo y el atacante ejecuta rápido el libre, con clara ocasión de gol, sin que el árbitro haya iniciado el procedimiento. ¿Qué se aplica?", "opciones": {"A": "El árbitro expulsa al infractor en la siguiente interrupción, al haberse evitado una ocasión manifiesta de gol.", "B": "El árbitro amonesta al infractor en la siguiente interrupción, ya que la infracción evitó una ocasión manifiesta de gol.", "C": "El árbitro no sanciona nada, por haberse reanudado rápido el juego y haberse beneficiado el equipo de la ventaja."}, "correcta": "B", "explicacion": "La tarjeta se mostrará en la siguiente interrupción del juego y, si con la infracción se evitó una ocasión manifiesta de gol, se amonestará al jugador.", "referencia": "Regla 12.4 / Retrasar la reanudación para mostrar una tarjeta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-092", "bloque": "reglas", "enunciado": "El árbitro concede ventaja tras una falta merecedora de amonestación y, más tarde, el balón sale fuera de juego. ¿Cuándo aplica la amonestación?", "opciones": {"A": "Al finalizar el partido, incluyéndola en el acta.", "B": "En cuanto el balón deje de estar en juego.", "C": "No la aplica, porque concedió ventaja."}, "correcta": "B", "explicacion": "Si el árbitro concede ventaja tras una infracción merecedora de amonestación, esta deberá aplicarse en cuanto el balón deje de estar en juego.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-093", "bloque": "reglas", "enunciado": "El árbitro concede ventaja tras una falta con la que se evitó una ocasión manifiesta de gol y el equipo atacante marca gol como consecuencia de la ventaja. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Ninguna medida disciplinaria para el infractor.", "B": "Amonesta al infractor por conducta antideportiva.", "C": "Expulsa al infractor."}, "correcta": "A", "explicacion": "Si el árbitro concede ventaja tras una infracción destinada a evitar una ocasión manifiesta de gol y el equipo atacante marca gol, no se produce sanción disciplinaria.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-094", "bloque": "reglas", "enunciado": "El árbitro concede ventaja tras una infracción que evitó una ocasión manifiesta de gol y el equipo atacante no consigue marcar. ¿Qué medida disciplinaria toma cuando el balón deja de estar en juego?", "opciones": {"A": "Expulsa al infractor por evitar una ocasión manifiesta de gol.", "B": "No toma medida alguna, al haber concedido ventaja.", "C": "Amonesta al infractor por conducta antideportiva."}, "correcta": "C", "explicacion": "Si con la infracción se evitó una ocasión manifiesta de gol y se concedió ventaja, el jugador será amonestado por conducta antideportiva, salvo que se marque gol como consecuencia de la ventaja.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-095", "bloque": "reglas", "enunciado": "El árbitro concede ventaja tras una infracción que solo interfirió en un ataque prometedor, y el atacante pierde el balón. ¿Qué sanción aplica al infractor?", "opciones": {"A": "Amonestación por conducta antideportiva.", "B": "Ninguna sanción disciplinaria.", "C": "Expulsión por evitar un ataque prometedor."}, "correcta": "B", "explicacion": "Al conceder ventaja, no se amonestará al jugador si con la infracción se interfirió en un ataque prometedor o se acabó evitando.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-096", "bloque": "reglas", "enunciado": "Un jugador comete una falta de juego brusco y grave cuando el equipo contrario tiene la ventaja, sin que exista ocasión manifiesta de gol. ¿Puede el árbitro conceder ventaja?", "opciones": {"A": "Sí, y expulsa al jugador cuando el balón deje de estar en juego en todos los casos.", "B": "No, no se debe conceder ventaja en el juego brusco y grave, salvo que se trate de una ocasión manifiesta de gol.", "C": "Sí, pero solo si el balón permanece en el campo del equipo infractor."}, "correcta": "B", "explicacion": "No se debe conceder ventaja en el juego brusco y grave, la conducta violenta o las faltas merecedoras de una segunda amonestación, a menos que se trate de una ocasión manifiesta de gol.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-097", "bloque": "reglas", "enunciado": "El árbitro concede ventaja ante una falta merecedora de expulsión por juego brusco y grave en una ocasión manifiesta de gol, y el infractor toca el balón al continuar la jugada. ¿Qué hace el árbitro?", "opciones": {"A": "Detiene el juego, expulsa al jugador y reanuda con libre indirecto, salvo que hubiera cometido una infracción más grave.", "B": "Deja seguir el juego y expulsa al jugador al finalizar la jugada.", "C": "Detiene el juego, amonesta al jugador y reanuda con balón a tierra."}, "correcta": "A", "explicacion": "Si el jugador que debe ser expulsado juega el balón, se lo disputa a un adversario o interfiere con él, el árbitro detiene el juego, lo expulsa y reanuda con libre indirecto, a menos que hubiera cometido una infracción más grave.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-098", "bloque": "reglas", "enunciado": "Un jugador recibe una amonestación por entrar en el terreno de juego sin permiso y, acto seguido, realiza una entrada temeraria. ¿Qué decide el árbitro?", "opciones": {"A": "Le muestra una segunda amonestación y, por tanto, la expulsión.", "B": "Le muestra una sola amonestación por ambas conductas.", "C": "Lo expulsa directamente sin mostrar la segunda amarilla."}, "correcta": "A", "explicacion": "Si un mismo jugador comete dos infracciones sancionables, incluso sucesivamente, se le debe amonestar dos veces.", "referencia": "Regla 12.4 / Doble amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-099", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿cuál de las siguientes acciones NO figura entre las infracciones de los jugadores sancionables con amonestación?", "opciones": {"A": "Mostrar desaprobación con palabras o acciones.", "B": "Insultar a un adversario.", "C": "No respetar la distancia reglamentaria en un balón a tierra."}, "correcta": "B", "explicacion": "Las acciones amonestables incluyen mostrar desaprobación, no respetar la distancia, entrar o abandonar el campo sin permiso, etc.; insultar (lenguaje ofensivo, insultante o humillante) es motivo de expulsión.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-100", "bloque": "reglas", "enunciado": "Un jugador no respeta la distancia reglamentaria en la ejecución de un saque de esquina. ¿Qué decide el árbitro?", "opciones": {"A": "Amonesta al jugador.", "B": "Expulsa al jugador.", "C": "Solo advierte verbalmente, siempre."}, "correcta": "A", "explicacion": "No respetar la distancia reglamentaria en un balón a tierra, saque de esquina, tiro libre o saque de banda es infracción sancionable con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-101", "bloque": "reglas", "enunciado": "Un jugador entra en el terreno de juego de manera deliberada y sin permiso del árbitro. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por entrar sin permiso.", "B": "Lo advierte verbalmente sin sanción disciplinaria.", "C": "Lo expulsa por conducta antideportiva."}, "correcta": "A", "explicacion": "Entrar o volver a entrar en el terreno de juego, o abandonarlo, de manera deliberada y sin permiso del árbitro es infracción sancionable con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-102", "bloque": "reglas", "enunciado": "Un jugador abandona el terreno de juego por la línea de banda, de manera deliberada y sin permiso del árbitro, sin motivo justificado. ¿Qué decide el árbitro?", "opciones": {"A": "No adopta medida disciplinaria, porque la salida no es infracción.", "B": "Lo expulsa por abandonar el terreno.", "C": "Lo amonesta, por abandonar el terreno de juego de manera deliberada y sin permiso del árbitro."}, "correcta": "C", "explicacion": "Abandonar el terreno de juego de manera deliberada y sin permiso del árbitro es motivo de amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-103", "bloque": "reglas", "enunciado": "Un equipo comete faltas de forma continuada a lo largo del partido y un jugador acumula varias infracciones de escasa gravedad. ¿Cuándo corresponde la amonestación por «infringir reiteradamente las Reglas de Juego»?", "opciones": {"A": "Cuando el árbitro considere que las infracciones son reiteradas, ya que la Regla no define un número concreto.", "B": "Cuando el jugador haya cometido exactamente tres infracciones, cifra que fija expresamente la Regla 12 para esta sanción.", "C": "Cuando el jugador haya cometido cinco infracciones o más, umbral que establece la Regla 12 para este tipo de amonestación."}, "correcta": "A", "explicacion": "La Regla 12.4 no define el número de infracciones ni establece otra indicación específica sobre lo que implica «infringir reiteradamente».", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-104", "bloque": "reglas", "enunciado": "Un jugador entra en el área de revisión del VAR durante el partido. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al equiparar el acceso al área de revisión con el acceso a la sala de vídeo.", "B": "Lo amonesta, ya que entrar en el área de revisión es una infracción sancionable con amonestación.", "C": "Lo advierte verbalmente, en todos los casos."}, "correcta": "B", "explicacion": "Entrar en el área de revisión es una infracción sancionable con amonestación para jugadores, suplentes y jugadores sustituidos.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-105", "bloque": "reglas", "enunciado": "Un jugador repite de manera insistente el gesto de la «revisión» del VAR (pantalla de televisión) ante el árbitro. ¿Qué decide este?", "opciones": {"A": "Lo expulsa, al considerar el gesto reiterado como una falta de respeto grave hacia el equipo arbitral.", "B": "Lo advierte y no toma más medidas, siempre.", "C": "Lo amonesta, por repetir de manera insistente un gesto que la Regla 12 sanciona expresamente."}, "correcta": "C", "explicacion": "Repetir de manera insistente el gesto de la «revisión» es infracción sancionable con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-106", "bloque": "reglas", "enunciado": "Un jugador entra en la sala de vídeo (sala de operaciones de vídeo) mientras el partido está en curso. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, ya que acceder a la sala de vídeo está sancionado con expulsión, a diferencia del área de revisión.", "B": "Lo amonesta, al tratarse de la misma sanción que corresponde por entrar en el área de revisión.", "C": "No adopta ninguna medida, ya que el acceso a la sala de vídeo solo está prohibido para los miembros del cuerpo técnico."}, "correcta": "A", "explicacion": "Entrar en la sala de vídeo es una infracción sancionable con expulsión, mientras que entrar en el área de revisión se sanciona con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-107", "bloque": "reglas", "enunciado": "Un suplente muestra desaprobación con palabras hacia una decisión del árbitro desde el banquillo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al considerar que mostrar desaprobación desde el banquillo agrava la sanción habitual.", "B": "No puede sancionarle, porque no está en el terreno de juego.", "C": "Lo amonesta, ya que los suplentes están sujetos a la misma sanción por mostrar desaprobación con palabras."}, "correcta": "C", "explicacion": "Se amonestará al suplente o jugador sustituido que muestre desaprobación con palabras o acciones.", "referencia": "Regla 12.4 / Amonestación de suplentes y sustituidos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-108", "bloque": "reglas", "enunciado": "Un suplente entra en el terreno de juego sin permiso del árbitro sin interferir en el juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al considerar que cualquier entrada sin permiso conlleva la máxima sanción disciplinaria.", "B": "Lo amonesta por entrar sin permiso, con independencia de que no llegara a interferir en el juego.", "C": "Solo lo advierte, porque no interfirió."}, "correcta": "B", "explicacion": "Se amonestará al suplente o jugador sustituido que entre o vuelva a entrar en el terreno de juego sin el permiso del árbitro.", "referencia": "Regla 12.4 / Amonestación de suplentes y sustituidos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-109", "bloque": "reglas", "enunciado": "Un jugador sustituido retrasa la reanudación del juego lanzando el balón lejos después de haber salido del campo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por retrasar la reanudación del juego.", "B": "Lo expulsa por conducta violenta.", "C": "No puede sancionarle, porque ya ha sido sustituido."}, "correcta": "A", "explicacion": "Se amonestará al suplente o jugador sustituido que retrase la reanudación del juego.", "referencia": "Regla 12.4 / Amonestación de suplentes y sustituidos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-110", "bloque": "reglas", "enunciado": "Un jugador finge una lesión con la intención de engañar al árbitro para que este detenga el juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por conducta antideportiva.", "B": "Lo advierte verbalmente y no lo sanciona.", "C": "Lo expulsa por conducta violenta."}, "correcta": "A", "explicacion": "Intentar engañar al árbitro, por ejemplo al fingir una lesión, es conducta antideportiva y se amonesta.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-111", "bloque": "reglas", "enunciado": "Un defensor comete una falta con la que interrumpe un ataque prometedor fuera de su área, sin que exista ocasión manifiesta de gol. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "No adopta medida disciplinaria, al no existir ocasión manifiesta de gol.", "B": "Amonesta al defensor por conducta antideportiva.", "C": "Expulsa al defensor por evitar una ocasión manifiesta de gol."}, "correcta": "B", "explicacion": "Cometer cualquier infracción con la que se interfiere en un ataque prometedor o se acaba evitando es conducta antideportiva y se amonesta.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-112", "bloque": "reglas", "enunciado": "Un defensor dentro de su área derriba a un atacante intentando jugar el balón, evitando una ocasión manifiesta de gol, y el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Expulsa al defensor, al considerar que se ha evitado una ocasión manifiesta de gol.", "B": "Amonesta al defensor, pese a haberse evitado una ocasión manifiesta de gol.", "C": "No adopta medida disciplinaria, por haber señalado penal."}, "correcta": "B", "explicacion": "Si el infractor pretendía jugar o disputar el balón y el árbitro señala penal, solo será amonestado, aunque se haya evitado una ocasión manifiesta de gol.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-113", "bloque": "reglas", "enunciado": "Un defensor, dentro de su área, toca el balón con la mano de manera involuntaria y evita con ello una ocasión manifiesta de gol; el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Expulsa al defensor.", "B": "Amonesta al defensor.", "C": "No adopta medida disciplinaria."}, "correcta": "B", "explicacion": "Cuando el jugador evita un gol o una ocasión manifiesta de gol con una infracción por mano involuntaria y el árbitro concede tiro penal, el jugador será amonestado.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-114", "bloque": "reglas", "enunciado": "Un defensor, fuera de su área, toca el balón con la mano de manera involuntaria y evita con ello una ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo y amonesta al defensor.", "B": "Concede libre indirecto sin sanción disciplinaria.", "C": "Concede libre directo y expulsa al defensor."}, "correcta": "C", "explicacion": "Se expulsa al jugador que evite mediante una infracción por mano involuntaria un gol o una ocasión manifiesta de gol fuera de su propia área penal.", "referencia": "Regla 12.4 / Infracciones sancionables con expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-115", "bloque": "reglas", "enunciado": "Un jugador de campo, dentro de su área, toca el balón con la mano de manera voluntaria y evita un gol prácticamente seguro; el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Amonesta al jugador.", "B": "No adopta medida disciplinaria.", "C": "Expulsa al jugador."}, "correcta": "C", "explicacion": "Se expulsa al jugador que evite un gol o una ocasión manifiesta de gol mediante una infracción por mano voluntaria, independientemente de dónde se produzca (salvo el guardameta en su propia área).", "referencia": "Regla 12.4 / Infracciones sancionables con expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-116", "bloque": "reglas", "enunciado": "Un delantero toca voluntariamente el balón con la mano al intentar marcar gol, aunque no lo consigue. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "Lo expulsa por conducta violenta.", "B": "No adopta medida disciplinaria, porque no marcó gol.", "C": "Lo amonesta por conducta antideportiva."}, "correcta": "C", "explicacion": "Tocar el balón con la mano al intentar marcar un gol, independientemente de que se consiga o no, es conducta antideportiva.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-117", "bloque": "reglas", "enunciado": "Un jugador que ha recibido permiso del árbitro para salir del terreno de juego juega el balón cuando este se está saliendo del campo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al tratarse de una reincidencia equivalente a una segunda amonestación en el mismo partido.", "B": "Lo amonesta por conducta antideportiva.", "C": "No adopta ninguna medida, porque tenía permiso para salir."}, "correcta": "B", "explicacion": "Jugar el balón cuando está saliendo del terreno de juego, después de haber recibido permiso para abandonarlo, es conducta antideportiva.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-118", "bloque": "reglas", "enunciado": "Un jugador imita burlonamente y de forma humillante los gestos de un adversario tras marcarle una ocasión, sin llegar a insultarlo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por lenguaje o acciones humillantes.", "B": "No adopta medida alguna, por no existir contacto ni palabras.", "C": "Lo amonesta por mostrar falta de respeto al espíritu del fútbol."}, "correcta": "C", "explicacion": "Mostrar falta de respeto al espíritu del fútbol es conducta antideportiva y se amonesta.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-119", "bloque": "reglas", "enunciado": "Durante un saque de esquina, un defensor grita y hace comentarios a un atacante para distraerle en el momento de la ejecución. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por lenguaje ofensivo.", "B": "Lo amonesta por conducta antideportiva.", "C": "No hay infracción, mientras no insulte."}, "correcta": "B", "explicacion": "Distraer con palabras y comentarios a un adversario durante el juego o en una reanudación es conducta antideportiva.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-120", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿cuál de las siguientes conductas NO se sanciona con amonestación por conducta antideportiva, sino con expulsión?", "opciones": {"A": "Escupir a un adversario.", "B": "Efectuar marcas no autorizadas en el terreno de juego.", "C": "Intentar engañar al árbitro simulando haber sido objeto de una infracción."}, "correcta": "A", "explicacion": "Escupir o morder a alguien es infracción sancionable con expulsión; las otras dos son conductas antideportivas que se amonestan.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-121", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿qué se dice sobre la celebración de un gol?", "opciones": {"A": "Está prohibida cualquier celebración hasta que el gol sea confirmado por el árbitro, incluso sin revisión del VAR.", "B": "Se permiten libremente las celebraciones coreografiadas, siempre que no superen un minuto de duración en total.", "C": "Los jugadores pueden celebrarlo sin extralimitarse; no se deben alentar las celebraciones coreografiadas ni las que ocasionen una pérdida de tiempo excesiva."}, "correcta": "C", "explicacion": "Los jugadores pueden celebrar el gol, pero sin extralimitarse; no se deben alentar las celebraciones coreografiadas y no deben ocasionar una pérdida de tiempo excesiva.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-122", "bloque": "reglas", "enunciado": "Un jugador traspasa los límites del terreno de juego para celebrar un gol, sin acercarse a los espectadores de forma que genere problemas de seguridad. ¿Debe ser amonestado por ello?", "opciones": {"A": "Sí, siempre, por salir del terreno de juego sin permiso.", "B": "Sí, pero solo si tarda más de diez segundos en regresar.", "C": "No, salvo que existan otros motivos; debe regresar al terreno de juego lo antes posible."}, "correcta": "C", "explicacion": "Traspasar los límites del terreno para celebrar un gol no se considera infracción sancionable con amonestación, pero los jugadores deben regresar tan pronto como sea posible.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-123", "bloque": "reglas", "enunciado": "Un jugador trepa a la valla perimetral para celebrar un gol acercándose a los espectadores y generando un problema de seguridad. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, por trepar a las vallas perimetrales generando un problema de seguridad.", "B": "Lo expulsa, al considerar la escalada a la valla como una conducta violenta hacia los espectadores.", "C": "No lo sanciona, porque es una celebración."}, "correcta": "A", "explicacion": "Se amonesta al jugador que trepe a las vallas perimetrales o se acerque a los espectadores generando problemas de seguridad.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-124", "bloque": "reglas", "enunciado": "Un jugador celebra un gol cubriéndose la cara con una máscara que llevaba escondida. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al considerar el uso de una máscara escondida como un engaño grave al árbitro.", "B": "Le advierte verbalmente, en todos los casos.", "C": "Lo amonesta, por cubrirse la cabeza o la cara con una máscara u otro artículo similar al celebrar."}, "correcta": "C", "explicacion": "Cubrirse la cabeza o la cara con una máscara o artículos similares al celebrar un gol es motivo de amonestación.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-125", "bloque": "reglas", "enunciado": "Un jugador celebra un gol cubriéndose la cabeza con su camiseta, sin quitársela del todo. ¿Qué decide el árbitro?", "opciones": {"A": "No adopta medida, porque no se ha quitado la camiseta por completo, solo se ha cubierto la cabeza con ella.", "B": "Lo amonesta, ya que cubrirse la cabeza con la camiseta se sanciona igual que quitársela del todo.", "C": "Lo expulsa, al considerar la celebración como conducta violenta."}, "correcta": "B", "explicacion": "Se amonesta a quien se quite la camiseta o se cubra la cabeza con ella al celebrar un gol.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-126", "bloque": "reglas", "enunciado": "Un jugador celebra un gol de forma exaltada y provocadora ante la grada rival, sin cometer otra infracción. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por conducta violenta.", "B": "No adopta medida, porque no hay contacto físico con ningún espectador durante la celebración.", "C": "Lo amonesta, al considerarse un gesto provocador hacia la grada rival aunque no llegue al insulto."}, "correcta": "C", "explicacion": "Actuar de forma provocadora o exaltada en la celebración de un gol es motivo de amonestación.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-127", "bloque": "reglas", "enunciado": "Un jugador celebra un gol quitándose la camiseta, pero después el VAR anula el gol por fuera de juego. ¿Debe mantener el árbitro la amonestación?", "opciones": {"A": "No, al anularse el gol se anula también la tarjeta.", "B": "Sí, incluso si el gol se anulara, se debe amonestar al jugador.", "C": "Solo si el árbitro no había mostrado aún la tarjeta."}, "correcta": "B", "explicacion": "Incluso si el gol se anulara, se deberá amonestar al jugador que realice acciones como quitarse la camiseta o cubrirse la cabeza con ella, trepar a las vallas, provocar o cubrirse el rostro.", "referencia": "Regla 12.4 / Celebración de un gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-128", "bloque": "reglas", "enunciado": "Tras detener el juego, el árbitro ve que un jugador lanza el balón lejos para retrasar la reanudación. ¿Qué decide?", "opciones": {"A": "Lo expulsa por conducta antideportiva.", "B": "Lo amonesta por retrasar la reanudación del juego.", "C": "Solo le advierte verbalmente, siempre."}, "correcta": "B", "explicacion": "Se amonesta al jugador que lance el balón lejos, lo retenga y lo lleve consigo, o provoque un enfrentamiento tocando el balón después de que el árbitro haya detenido el juego.", "referencia": "Regla 12.4 / Retrasar la reanudación del juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-129", "bloque": "reglas", "enunciado": "Un jugador retiene el balón entre sus manos y se lo lleva consigo después de que el árbitro haya detenido el juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al considerar que llevarse el balón tras la detención constituye una falta de respeto grave.", "B": "No hay infracción, al haberse detenido ya el juego.", "C": "Lo amonesta por retrasar la reanudación del juego, al llevarse el balón consigo tras la detención."}, "correcta": "C", "explicacion": "Retener el balón y llevárselo consigo después de detenido el juego es retrasar la reanudación y se amonesta.", "referencia": "Regla 12.4 / Retrasar la reanudación del juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-130", "bloque": "reglas", "enunciado": "Tras detenerse el juego, un defensor toca el balón con el pie para provocar un enfrentamiento con un atacante. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por conducta violenta.", "B": "No lo sanciona, porque el balón estaba detenido.", "C": "Lo amonesta por retrasar la reanudación del juego."}, "correcta": "C", "explicacion": "Provocar un enfrentamiento tocando el balón después de que el árbitro haya detenido el juego es retrasar la reanudación y se amonesta.", "referencia": "Regla 12.4 / Retrasar la reanudación del juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-131", "bloque": "reglas", "enunciado": "Un jugador ejecuta deliberadamente un tiro libre desde un lugar erróneo con el fin de forzar su repetición y perder tiempo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por retrasar la reanudación del juego.", "B": "Repite el libre sin sanción disciplinaria.", "C": "Lo expulsa por conducta antideportiva."}, "correcta": "A", "explicacion": "Ejecutar un tiro libre desde un lugar erróneo para forzar su repetición es una forma de retrasar la reanudación del juego y se amonesta.", "referencia": "Regla 12.4 / Retrasar la reanudación del juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-132", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿cuál de las siguientes infracciones de un jugador es sancionable con expulsión?", "opciones": {"A": "Recibir una segunda amonestación en el mismo partido.", "B": "Retrasar la reanudación del juego.", "C": "Mostrar desaprobación con palabras o acciones."}, "correcta": "A", "explicacion": "Recibir una segunda amonestación en el mismo partido implica expulsión; retrasar la reanudación y mostrar desaprobación se sancionan con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-133", "bloque": "reglas", "enunciado": "Un jugador insulta gravemente a un compañero de equipo con el balón en juego dentro del terreno de juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta y reanuda con libre directo.", "B": "Lo expulsa y reanuda con libre indirecto.", "C": "Lo advierte y reanuda con balón a tierra."}, "correcta": "B", "explicacion": "Emplear lenguaje ofensivo, insultante o humillante es motivo de expulsión; las infracciones de carácter verbal se sancionan con libre indirecto.", "referencia": "Regla 12.4 y 12.5 / Infracciones verbales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-134", "bloque": "reglas", "enunciado": "Un jugador expulsado, que debe abandonar el terreno de juego, permanece en el área técnica de su equipo mientras se reanuda el partido. ¿Qué exige la Regla?", "opciones": {"A": "Que se siente en el banquillo, pero sin participar.", "B": "Que permanezca en el área técnica, sin dirigir a sus compañeros.", "C": "Que abandone las inmediaciones del terreno de juego y del área técnica."}, "correcta": "C", "explicacion": "Los jugadores, suplentes o sustituidos expulsados deberán abandonar las inmediaciones del terreno de juego y del área técnica.", "referencia": "Regla 12.4 / Infracciones sancionables con expulsión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-135", "bloque": "reglas", "enunciado": "Un jugador en el área propia agarra a un atacante que iba a marcar y el árbitro señala penal. El defensor no intentó jugar el balón. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Amonesta al defensor, al considerar que trataba de disputar el balón.", "B": "Expulsa al defensor, por haber evitado una ocasión manifiesta de gol sin intención de jugar el balón.", "C": "No adopta medida disciplinaria, por haber concedido penal."}, "correcta": "B", "explicacion": "Si dentro del área se evita una ocasión manifiesta de gol y se señala penal, solo se amonesta si se pretendía jugar o disputar el balón; en el resto de acciones (agarrar, tirar, empujar, etc.) se expulsa.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-136", "bloque": "reglas", "enunciado": "Un defensor, dentro de su área, empuja a un atacante que iba a rematar solo ante la portería, sin posibilidad de jugar el balón; el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Amonesta al defensor.", "B": "No adopta medida disciplinaria.", "C": "Expulsa al defensor."}, "correcta": "C", "explicacion": "Empujar, agarrar o tirar de un atacante en un penal por ocasión manifiesta de gol, sin pretender jugar el balón, conlleva expulsión.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-137", "bloque": "reglas", "enunciado": "Un defensor, dentro de su área, no llega al balón y derriba al atacante que se dirigía solo hacia la portería; es imposible que pudiera jugar el balón. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "Expulsa al defensor y señala penal.", "B": "Amonesta al defensor y señala penal.", "C": "Señala penal sin sanción disciplinaria."}, "correcta": "A", "explicacion": "La imposibilidad de jugar el balón es una de las acciones en las que, tras evitar una ocasión manifiesta de gol con penal, el infractor debe ser expulsado.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-138", "bloque": "reglas", "enunciado": "Un defensor, fuera de su área, sujeta a un delantero que se dirigía solo hacia la portería, evitando una ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo y amonesta al defensor.", "B": "Concede libre indirecto y expulsa al defensor.", "C": "Concede libre directo y expulsa al defensor."}, "correcta": "C", "explicacion": "Evitar un gol o una ocasión manifiesta de gol de un adversario que se dirige a la portería del infractor mediante una infracción sancionable con libre es motivo de expulsión.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-139", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿cuál de los siguientes aspectos NO se debe tener en cuenta para valorar si existe una ocasión manifiesta de gol?", "opciones": {"A": "La distancia entre el lugar de la infracción y la portería.", "B": "La probabilidad de mantener o recuperar el balón.", "C": "El número de tarjetas que lleve el equipo infractor."}, "correcta": "C", "explicacion": "Los aspectos a tener en cuenta son la distancia a la portería, la dirección del juego, la probabilidad de mantener o recuperar el balón y la posición y número de defensores y atacantes.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-140", "bloque": "reglas", "enunciado": "¿Qué aspectos, además de la distancia a la portería, la dirección del juego y la probabilidad de mantener o recuperar el balón, incluye la Regla 12.4 para valorar una ocasión manifiesta de gol?", "opciones": {"A": "Únicamente la posición y el número de defensores.", "B": "La posición y el número de defensores y atacantes.", "C": "El resultado del partido en ese momento."}, "correcta": "B", "explicacion": "La lista de aspectos incluye la posición y el número de defensores y atacantes (se incorporan expresamente los atacantes).", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-141", "bloque": "reglas", "enunciado": "Un suplente entra en el terreno de juego sin permiso, intercepta con el pie un balón que iba hacia la portería y evita así un gol. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por entrar sin permiso y reanuda con libre indirecto.", "B": "Lo expulsa y reanuda con balón a tierra.", "C": "Lo expulsa y reanuda con libre directo o penal, según dónde se produjo la interferencia."}, "correcta": "C", "explicacion": "Quien entre sin autorización en el terreno de juego, interfiera y evite un gol o una ocasión manifiesta de gol comete una infracción merecedora de expulsión.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-142", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿cuándo se sanciona una entrada como «juego brusco y grave» (falta de extrema dureza)?", "opciones": {"A": "Cuando el jugador no tiene posibilidad de jugar el balón, aunque no exista fuerza excesiva ni riesgo para el rival.", "B": "Cuando la falta se comete fuera de la disputa del balón, con intención clara de dañar físicamente al adversario.", "C": "Cuando se pone en peligro la integridad física de un adversario o el jugador se emplea con fuerza excesiva o brutalidad en una disputa del balón."}, "correcta": "C", "explicacion": "Las entradas o disputas del balón que ponen en peligro la integridad física de un adversario o en las que el jugador emplea fuerza excesiva o brutalidad se sancionan como juego brusco y grave.", "referencia": "Regla 12.4 / Juego brusco y grave", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-143", "bloque": "reglas", "enunciado": "Un jugador arremete por el costado contra un adversario en la disputa del balón, con una pierna y fuerza excesiva, poniendo en peligro su integridad física. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo (o penal) y expulsa al jugador por juego brusco y grave.", "B": "Concede libre indirecto y amonesta al jugador.", "C": "Concede libre directo y amonesta al jugador por conducta antideportiva."}, "correcta": "A", "explicacion": "Todo jugador que arremeta contra un adversario en la disputa del balón de frente, por el costado o por detrás, con fuerza excesiva o poniendo en peligro su integridad, juega con excesiva dureza.", "referencia": "Regla 12.4 / Juego brusco y grave", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-144", "bloque": "reglas", "enunciado": "¿Qué diferencia, según la Regla 12.4, la conducta violenta del juego brusco y grave?", "opciones": {"A": "En la conducta violenta el jugador no está disputando el balón al adversario; en el juego brusco y grave sí hay disputa del balón.", "B": "En la conducta violenta la fuerza empleada es siempre menor que en el juego brusco y grave, según establece la Regla 12.", "C": "La conducta violenta solo puede cometerse contra jugadores adversarios, nunca contra compañeros ni otras personas."}, "correcta": "A", "explicacion": "Conducta violenta: emplearse con fuerza excesiva o brutalidad contra un adversario cuando no le está disputando el balón, o contra otras personas. Juego brusco y grave: en la disputa del balón.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-145", "bloque": "reglas", "enunciado": "Un jugador intenta golpear con el puño a un compañero de equipo con brutalidad durante el juego, pero este esquiva el golpe y no hay contacto. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por conducta antideportiva.", "B": "Lo expulsa por conducta violenta, aunque no haya contacto.", "C": "No lo sanciona, porque no hay contacto."}, "correcta": "B", "explicacion": "La conducta violenta lo es independientemente de si se produce o no contacto, cuando el jugador se emplea o tiene la intención de emplearse con fuerza excesiva o brutalidad.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-146", "bloque": "reglas", "enunciado": "Un jugador, sin disputar el balón, golpea deliberadamente con la mano a un adversario en la cara con fuerza apreciable. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por conducta antideportiva.", "B": "Lo expulsa por conducta violenta.", "C": "Concede libre directo sin sanción disciplinaria."}, "correcta": "B", "explicacion": "Golpear deliberadamente a un adversario en la cabeza o la cara con la mano o el brazo, sin disputar el balón, es conducta violenta a menos que la fuerza empleada sea insignificante.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-147", "bloque": "reglas", "enunciado": "Un jugador toca ligeramente con la mano la cara de un adversario sin disputar el balón, con una fuerza claramente insignificante. ¿Se considera conducta violenta?", "opciones": {"A": "No, porque la fuerza empleada es insignificante.", "B": "Sí, siempre que golpee en la cara sin disputa del balón.", "C": "Sí, pero solo si el adversario cae al suelo."}, "correcta": "A", "explicacion": "El golpeo deliberado a la cabeza o la cara con la mano o el brazo sin disputar el balón es conducta violenta a menos que la fuerza empleada sea insignificante.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-148", "bloque": "reglas", "enunciado": "Un jugador propina una patada con brutalidad a un recogepelotas con el balón en juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por conducta violenta.", "B": "Lo amonesta por conducta antideportiva.", "C": "No lo sanciona, por no ser un miembro de las listas."}, "correcta": "A", "explicacion": "La conducta violenta puede dirigirse contra un adversario, un compañero, un miembro del cuerpo técnico o arbitral, un espectador o cualquier otra persona.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-149", "bloque": "reglas", "enunciado": "Con el balón ya fuera de juego tras salir por la línea de banda, un jugador golpea con brutalidad a un adversario que no disputaba el balón. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa y concede libre directo en el lugar de la agresión.", "B": "Lo expulsa por conducta violenta y reanuda con el saque de banda ya concedido.", "C": "Lo amonesta y reanuda con balón a tierra."}, "correcta": "B", "explicacion": "Si el balón está detenido, se sanciona disciplinariamente la conducta violenta y el juego se reanuda según la decisión adoptada anteriormente.", "referencia": "Regla 12.4 y 12.5 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-150", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador muerde a un adversario durante una disputa. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo (o penal) y lo expulsa.", "B": "Concede libre directo (o penal) y lo amonesta.", "C": "Concede libre indirecto y lo expulsa."}, "correcta": "A", "explicacion": "Escupir o morder a alguien es infracción sancionable con expulsión y, con el balón en juego contra un adversario, con libre directo o penal.", "referencia": "Regla 12.1 y 12.4 / Escupir o morder", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-151", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico entra en el terreno de juego de manera respetuosa y pacífica, sin interferir en el juego. ¿Qué medida toma normalmente el árbitro?", "opciones": {"A": "Lo amonesta, al equiparar la entrada pacífica al terreno de juego con una infracción sancionable con tarjeta.", "B": "Le advierte (apercibimiento), al tratarse de una entrada respetuosa y pacífica en el terreno de juego.", "C": "Lo expulsa, al considerar cualquier entrada de un miembro del cuerpo técnico como una falta grave."}, "correcta": "B", "explicacion": "Entrar en el terreno de juego de manera respetuosa y pacífica suele dar lugar a una advertencia, aunque la reiteración o el carácter improcedente podrían suponer amonestación o expulsión.", "referencia": "Regla 12.4 / Advertencia a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-152", "bloque": "reglas", "enunciado": "El cuarto árbitro pide al entrenador que regrese al área técnica y este desoye la petición en una ocasión, sin más incidentes. ¿Qué medida es la habitual?", "opciones": {"A": "Una advertencia por no cooperar con el equipo arbitral.", "B": "Una amonestación inmediata, por desobedecer la indicación del cuarto árbitro.", "C": "Una expulsión directa, al considerar la desobediencia como falta grave."}, "correcta": "A", "explicacion": "No cooperar con un árbitro, por ejemplo al desoír una orden o petición del asistente o del cuarto árbitro, se sanciona por lo general con una advertencia.", "referencia": "Regla 12.4 / Advertencia a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-153", "bloque": "reglas", "enunciado": "Un entrenador expresa su desacuerdo con una decisión arbitral con un comentario de poca intensidad, sin faltar al respeto. ¿Qué medida es la habitual?", "opciones": {"A": "Una amonestación, al considerarse cualquier comentario de desacuerdo como conducta antideportiva sancionable.", "B": "Ninguna, porque el entrenador no puede ser sancionado por desacuerdo.", "C": "Una advertencia, al tratarse de un desacuerdo de poca intensidad expresado sin faltar al respeto."}, "correcta": "C", "explicacion": "El desacuerdo con una decisión (con palabras o actos) de poca intensidad conlleva, por lo general, una advertencia.", "referencia": "Regla 12.4 / Advertencia a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-154", "bloque": "reglas", "enunciado": "Un entrenador sale del área técnica de manera ocasional, sin cometer ninguna otra infracción. ¿Qué medida es la habitual?", "opciones": {"A": "Una amonestación, al considerarse cualquier salida del área técnica como una infracción sancionable.", "B": "Una advertencia, al tratarse de una salida ocasional sin que se cometa ninguna otra infracción.", "C": "Una expulsión, al equiparar la salida ocasional con una falta grave de disciplina."}, "correcta": "B", "explicacion": "Salir del área técnica de manera ocasional sin cometer ninguna otra infracción se sanciona por lo general con una advertencia.", "referencia": "Regla 12.4 / Advertencia a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-155", "bloque": "reglas", "enunciado": "Un entrenador ya advertido reiteradamente abandona una y otra vez los límites del área técnica de forma obvia y persistente. ¿Qué medida procede?", "opciones": {"A": "La amonestación, al persistir la conducta pese a las advertencias previas del árbitro.", "B": "Una nueva advertencia, ya que las salidas reiteradas del área técnica nunca se amonestan por sí solas.", "C": "La expulsión inmediata en todos los casos."}, "correcta": "A", "explicacion": "No respetar de manera obvia o persistente los límites del área técnica es motivo de amonestación; la reiteración de infracciones merecedoras de advertencia también puede acabar en amonestación.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-156", "bloque": "reglas", "enunciado": "Un entrenador retrasa la reanudación del juego reteniendo el balón cuando el saque de banda corresponde a su propio equipo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, por retener el balón con las manos para retrasar la reanudación de su propio equipo.", "B": "Lo expulsa, por retrasar la reanudación correspondiente a su propio equipo.", "C": "Le advierte, siempre, sin llegar nunca a amonestarlo por este tipo de conducta."}, "correcta": "A", "explicacion": "Retrasar la reanudación cuando le corresponde hacerlo a su equipo es motivo de amonestación; si corresponde al equipo adversario, es motivo de expulsión.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-157", "bloque": "reglas", "enunciado": "Un entrenador entra de manera premeditada al área técnica del equipo adversario, sin ánimo de confrontación. ¿Qué medida toma el árbitro?", "opciones": {"A": "Lo amonesta, por entrar de manera premeditada en el área técnica del equipo adversario.", "B": "Lo expulsa, al considerar que la entrada se realizó con ánimo de confrontación.", "C": "Le advierte verbalmente sin más consecuencias, al no existir ánimo de confrontación en la entrada."}, "correcta": "A", "explicacion": "Entrar de manera premeditada en el área técnica del equipo adversario, sin ánimo de confrontación, es motivo de amonestación; con ánimo de confrontación o agresivo, de expulsión.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-158", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico patea con rabia una botella tras una decisión arbitral, mostrando así su desaprobación. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al considerar la patada a la botella como una manifestación de conducta violenta.", "B": "Le advierte, siempre, sin llegar a amonestarlo por mostrar desaprobación de esta forma.", "C": "Lo amonesta, por mostrar desaprobación de forma exagerada."}, "correcta": "C", "explicacion": "Mostrar desaprobación con palabras o acciones, como lanzar o golpear con los pies botellas u otros objetos, es motivo de amonestación.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-159", "bloque": "reglas", "enunciado": "Un entrenador aplaude de forma sarcástica una decisión del árbitro, faltando al respeto al equipo arbitral. ¿Qué medida toma este?", "opciones": {"A": "Lo expulsa, al considerar el gesto como una actuación ofensiva o humillante hacia el equipo arbitral.", "B": "Le advierte, porque no hay contacto ni palabras dirigidas directamente al equipo arbitral.", "C": "Lo amonesta, por faltar al respeto al equipo arbitral mediante un gesto claramente sarcástico."}, "correcta": "C", "explicacion": "Actuar de modo que se falte al respeto a uno o varios miembros del equipo arbitral, por ejemplo aplaudiendo de forma sarcástica, es motivo de amonestación.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-160", "bloque": "reglas", "enunciado": "Un entrenador pide de manera insistente y con gestos exagerados que se muestre tarjeta a un adversario. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, por insistir de forma reiterada en que se sancione a un rival.", "B": "Le advierte, siempre, sin que ese comportamiento llegue a considerarse sancionable con tarjeta.", "C": "Lo amonesta, por pedir de manera insistente y con gestos exagerados que se sancione a un rival."}, "correcta": "C", "explicacion": "Pedir con gestos exagerados o de manera insistente que se muestre tarjeta es motivo de amonestación para el cuerpo técnico.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-161", "bloque": "reglas", "enunciado": "Un ayudante del entrenador repite de forma insistente el gesto de «revisión» del VAR desde el área técnica. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, por repetir de manera insistente el gesto de «revisión» desde el área técnica.", "B": "Lo expulsa, al tratarse de una reiteración equivalente a una segunda amonestación en el mismo partido.", "C": "Le advierte, siempre, sin llegar a amonestarlo por repetir ese gesto."}, "correcta": "A", "explicacion": "Repetir de forma insistente el gesto de «revisión» del VAR es motivo de amonestación para los miembros del cuerpo técnico.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-162", "bloque": "reglas", "enunciado": "Un entrenador retrasa la reanudación del juego cuando le corresponde hacerlo al equipo adversario, reteniendo el balón para que no se ejecute un saque de banda. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, por retrasar la reanudación correspondiente al equipo adversario.", "B": "Lo amonesta, al considerar esa retención del balón como una simple pérdida de tiempo menor.", "C": "Le advierte verbalmente, sin llegar a sancionarlo por retener el balón de esta forma."}, "correcta": "A", "explicacion": "Retrasar la reanudación del juego cuando le corresponde hacerlo al equipo adversario (reteniendo la pelota, alejándola con el pie, obstaculizando a un jugador, etc.) es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-163", "bloque": "reglas", "enunciado": "El preparador físico aleja el balón con el pie para que el equipo rival no pueda ejecutar rápido un saque de banda. ¿Qué medida toma el árbitro?", "opciones": {"A": "Lo amonesta, al asimilar este alejamiento del balón a una simple muestra de desaprobación.", "B": "Lo expulsa, por retrasar la reanudación correspondiente al equipo adversario alejando el balón.", "C": "Le advierte, sin llegar a expulsarlo por alejar el balón con el pie de esta manera."}, "correcta": "B", "explicacion": "Retrasar la reanudación cuando le corresponde al equipo adversario, por ejemplo alejando el balón con el pie, es motivo de expulsión para un miembro del cuerpo técnico.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-164", "bloque": "reglas", "enunciado": "Un entrenador abandona el área técnica de manera deliberada para protestar a uno de los árbitros. ¿Qué medida toma este?", "opciones": {"A": "Lo expulsa, por abandonar el área técnica de forma deliberada para protestar.", "B": "Lo amonesta, al asimilar la salida a un simple incumplimiento de los límites del área técnica.", "C": "Lo advierte, porque ha sido una única salida sin que se repita la conducta con posterioridad."}, "correcta": "A", "explicacion": "Abandonar el área técnica de forma deliberada para mostrar desacuerdo o protestar a uno de los árbitros, o para proceder de forma provocativa o exaltada, es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-165", "bloque": "reglas", "enunciado": "Un entrenador entra de manera agresiva y con ánimo de confrontación en el área técnica del equipo contrario. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, al asimilar la entrada agresiva con una entrada premeditada sin ánimo de confrontación.", "B": "Le advierte verbalmente, sin adoptar ninguna medida disciplinaria adicional por la entrada agresiva.", "C": "Lo expulsa, por entrar con ánimo de confrontación en el área técnica rival."}, "correcta": "C", "explicacion": "Entrar al área técnica del equipo adversario de manera agresiva o con ánimo de confrontación es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-166", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico lanza voluntariamente con la mano una botella al terreno de juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, al asimilar el lanzamiento a una simple muestra de desaprobación, como golpear una botella con el pie.", "B": "Lo expulsa, por lanzar voluntariamente un objeto al terreno de juego.", "C": "Le advierte, sin llegar a expulsarlo por lanzar voluntariamente un objeto al terreno de juego."}, "correcta": "B", "explicacion": "Lanzar voluntariamente con la mano o con el pie un objeto al terreno de juego es motivo de expulsión para un miembro del cuerpo técnico.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-167", "bloque": "reglas", "enunciado": "Durante el descanso, un entrenador entra en el terreno de juego para enfrentarse a uno de los árbitros. ¿Qué medida toma este?", "opciones": {"A": "Lo amonesta, porque el juego está detenido.", "B": "Lo expulsa, incluso siendo en el descanso.", "C": "Lo advierte, porque no hay partido en curso."}, "correcta": "B", "explicacion": "Entrar en el terreno de juego para enfrentarse a uno de los árbitros es motivo de expulsión, incluso si la acción se produce en el descanso o al finalizar el partido.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-168", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico entra en el terreno de juego durante una jugada e intenta obstaculizar a un jugador adversario. ¿Qué medida toma el árbitro?", "opciones": {"A": "Lo amonesta, al asimilar la entrada al terreno con un simple incumplimiento de los límites del área técnica.", "B": "Lo advierte, sin adoptar ninguna medida disciplinaria por intentar obstaculizar al jugador adversario.", "C": "Lo expulsa, por entrar en el terreno de juego para obstaculizar a un adversario."}, "correcta": "C", "explicacion": "Entrar en el terreno de juego para intervenir en el juego u obstaculizar a un jugador adversario o a uno de los árbitros es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-169", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico escupe a un recogepelotas del equipo contrario. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, por comportarse de manera agresiva con un recogepelotas.", "B": "Lo amonesta, al considerar que la agresión física solo se sanciona con expulsión cuando la víctima es un jugador o un árbitro.", "C": "No puede sancionarlo, porque el recogepelotas no figura en las listas oficiales del equipo."}, "correcta": "A", "explicacion": "Comportarse de manera agresiva o con intimidación física (p. ej. escupir o morder) con un jugador, suplente, miembro del cuerpo técnico adversario, árbitro, espectador o cualquier otra persona (recogepelotas, seguridad, etc.) es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-170", "bloque": "reglas", "enunciado": "Un entrenador que ya había sido amonestado en el partido vuelve a cometer una infracción merecedora de amonestación. ¿Qué decide el árbitro?", "opciones": {"A": "Le muestra una nueva amarilla y permanece en el área técnica.", "B": "Lo expulsa por recibir una segunda amonestación.", "C": "Le advierte, porque no puede ser expulsado por dos amarillas."}, "correcta": "B", "explicacion": "Recibir una segunda amonestación en el mismo partido es motivo de expulsión también para los miembros del cuerpo técnico.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-171", "bloque": "reglas", "enunciado": "Un entrenador se dirige al árbitro con lenguaje ofensivo e insultante desde el área técnica. ¿Qué decide este?", "opciones": {"A": "Lo expulsa, por emplear lenguaje ofensivo e insultante hacia el árbitro.", "B": "Lo amonesta, al asimilar el lenguaje empleado a una simple muestra de desaprobación hacia el árbitro.", "C": "Le advierte, sin llegar a amonestarlo por dirigirse al árbitro con lenguaje ofensivo e insultante."}, "correcta": "A", "explicacion": "Emplear lenguaje o actuar de modo ofensivo, insultante o humillante es motivo de expulsión.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-172", "bloque": "reglas", "enunciado": "Un entrenador entra en la sala de vídeo (área de operaciones VAR) durante el partido. ¿Qué medida toma el árbitro?", "opciones": {"A": "Lo amonesta, al equiparar la entrada en la sala de vídeo con la entrada en el área de revisión.", "B": "Le advierte, sin adoptar ninguna medida disciplinaria por entrar en la sala de vídeo durante el partido.", "C": "Lo expulsa, por entrar en la sala de vídeo durante el partido."}, "correcta": "C", "explicacion": "Entrar en la sala de vídeo es motivo de expulsión para los miembros del cuerpo técnico; entrar en el área de revisión, de amonestación.", "referencia": "Regla 12.4 / Expulsión de miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-173", "bloque": "reglas", "enunciado": "Un jugador lanza de forma temeraria un objeto (no el balón) contra un adversario, sin causarle daño. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "Lo expulsa por conducta violenta.", "B": "No adopta medida disciplinaria.", "C": "Lo amonesta por conducta antideportiva."}, "correcta": "C", "explicacion": "En las infracciones relacionadas con el lanzamiento de objetos, si es temeraria se amonesta al infractor por conducta antideportiva; si es con fuerza excesiva, se expulsa por conducta violenta.", "referencia": "Regla 12.4 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-174", "bloque": "reglas", "enunciado": "Un jugador lanza con fuerza excesiva el balón contra un suplente del equipo rival. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "Lo amonesta por conducta antideportiva.", "B": "No adopta medida disciplinaria, porque el balón no es un objeto.", "C": "Lo expulsa por conducta violenta."}, "correcta": "C", "explicacion": "En las infracciones relacionadas con el lanzamiento de objetos (o del balón), con fuerza excesiva se expulsa al infractor por conducta violenta.", "referencia": "Regla 12.4 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-175", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador lanza con la mano un objeto contra un adversario dentro del terreno de juego, fuera del área penal. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre indirecto desde el lugar donde estaba el lanzador.", "B": "Con libre directo desde el lugar donde el objeto golpeó o habría golpeado al adversario.", "C": "Con balón a tierra en el lugar donde cayó el objeto."}, "correcta": "B", "explicacion": "Si un jugador lanza un objeto contra un adversario, el juego se reanuda con libre directo desde el lugar donde el objeto golpeó o habría golpeado a la persona.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-176", "bloque": "reglas", "enunciado": "Un defensor lanza un objeto contra un adversario desde dentro de su propia área penal. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con tiro penal.", "B": "Con libre directo en el borde del área.", "C": "Con libre indirecto en el lugar del lanzamiento."}, "correcta": "A", "explicacion": "Se concederá tiro penal si la acción de lanzar el objeto tiene lugar dentro del área del infractor.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-177", "bloque": "reglas", "enunciado": "Un jugador, situado fuera del terreno de juego, lanza un objeto contra un árbitro asistente y este golpea en un punto fuera del campo. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con balón a tierra donde estaba el balón.", "B": "Con libre directo en el punto más cercano de la línea de demarcación.", "C": "Con libre indirecto en la línea de banda más cercana al banquillo."}, "correcta": "B", "explicacion": "Si el lugar donde el objeto golpeó o habría golpeado se encuentra fuera del terreno de juego, el libre directo se ejecutará en el punto más cercano de la línea de demarcación.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-178", "bloque": "reglas", "enunciado": "Un suplente lanza desde el banquillo una botella al terreno de juego, que interfiere en el juego al golpear el balón en movimiento. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con balón a tierra, por tratarse de un agente externo cuya interferencia no constituye infracción de ningún jugador.", "B": "Con libre indirecto desde el banquillo de suplentes, al considerarse ese el lugar donde se cometió la infracción.", "C": "Con libre directo (o penal) en el lugar donde el objeto interfirió en el juego o golpeó el balón."}, "correcta": "C", "explicacion": "Si un suplente, sustituido, expulsado o miembro del cuerpo técnico lanza un objeto al campo que interfiere en el juego o contacta con el balón, se concede libre directo (o penal) donde interfirió o golpeó.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-179", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico chuta un balón de repuesto al terreno de juego y este golpea a un jugador adversario. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con balón a tierra en el lugar del impacto, al no atribuirse la infracción a ningún jugador del terreno de juego.", "B": "Con libre indirecto en la línea de banda más cercana, al tratarse de una acción cometida fuera del terreno de juego.", "C": "Con libre directo (o penal) en el lugar donde el balón golpeó o habría golpeado al adversario."}, "correcta": "C", "explicacion": "Si un miembro del cuerpo técnico lanza o chuta un objeto al campo que contacta con un adversario, se reanuda con libre directo (o penal) en el lugar donde golpeó o habría golpeado.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-180", "bloque": "reglas", "enunciado": "Con el balón detenido, un jugador comete una infracción merecedora de expulsión. ¿Cómo se reanuda el juego tras expulsarlo?", "opciones": {"A": "Con libre directo desde el lugar de la infracción.", "B": "Con balón a tierra en el lugar de la infracción.", "C": "Según la decisión adoptada anteriormente."}, "correcta": "C", "explicacion": "Si el balón estuviera detenido, el partido se reanudará según la decisión adoptada anteriormente.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-181", "bloque": "reglas", "enunciado": "Según la Regla 12.5, con el balón en juego, ¿cómo se sancionan todas las infracciones de carácter verbal cometidas dentro del terreno de juego?", "opciones": {"A": "Con libre directo.", "B": "Con libre indirecto.", "C": "Con balón a tierra."}, "correcta": "B", "explicacion": "Se sancionarán con libre indirecto todas las infracciones de carácter verbal.", "referencia": "Regla 12.5 / Infracciones verbales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-182", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador comete una infracción de carácter físico contra un compañero de equipo dentro del terreno de juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo (o penal) a favor del equipo adversario.", "B": "Con libre indirecto a favor del equipo adversario.", "C": "Con balón a tierra."}, "correcta": "A", "explicacion": "Si un jugador comete una infracción de carácter físico dentro del campo contra un compañero, suplente, sustituido, expulsado, miembro del cuerpo técnico o del equipo arbitral, se concede libre directo o penal, según el caso.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-183", "bloque": "reglas", "enunciado": "Un espectador invade el terreno de juego y un jugador le da un empujón; el árbitro detiene el juego. ¿Cómo se reanuda?", "opciones": {"A": "Con libre directo a favor del equipo contrario.", "B": "Con libre indirecto en el lugar del empujón.", "C": "Con un balón a tierra."}, "correcta": "C", "explicacion": "Si un jugador comete una infracción sobre un agente externo, dentro o fuera del campo, y el árbitro detiene el juego, se reanuda con un balón a tierra.", "referencia": "Regla 12.5 / Infracción sobre un agente externo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-184", "bloque": "reglas", "enunciado": "Un jugador abandona el terreno de juego sin permiso del árbitro y agrede fuera del campo a un recogepelotas; el árbitro detiene el juego. ¿Cómo se reanuda?", "opciones": {"A": "Con libre indirecto desde el punto de la línea de demarcación por el que el jugador salió del campo.", "B": "Con balón a tierra donde estaba el balón, al no considerarse la agresión cometida fuera del campo como infracción sancionable.", "C": "Con libre directo en el lugar de la agresión, aunque esta se haya producido fuera de los límites del terreno de juego."}, "correcta": "A", "explicacion": "Si la infracción es sobre un agente externo y el jugador ha abandonado el campo sin permiso, el árbitro concede libre indirecto desde el punto de la línea por el que salió.", "referencia": "Regla 12.5 / Infracción sobre un agente externo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-185", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador en el terreno de juego comete una infracción física contra un miembro del cuerpo técnico adversario que está fuera del campo. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo desde el punto de la línea de demarcación más cercano al lugar de la infracción.", "B": "Con libre indirecto en el lugar donde se encontraba el balón.", "C": "Con balón a tierra en el punto más cercano de la línea de banda."}, "correcta": "A", "explicacion": "Si un jugador comete una infracción contra un miembro del cuerpo técnico adversario fuera del campo, se reanuda con libre desde el punto de la línea de demarcación más cercano al lugar de la infracción.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-186", "bloque": "reglas", "enunciado": "Con el balón en juego, un suplente que calienta junto a la línea de banda agrede a un jugador adversario que está fuera del campo. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con balón a tierra donde estaba el balón, al tratarse de una agresión cometida por un suplente fuera del terreno de juego.", "B": "Con libre directo desde el punto de la línea de demarcación más cercano a la infracción.", "C": "Con libre indirecto desde el centro del campo, al no poder ejecutarse el libre directo desde fuera del terreno de juego."}, "correcta": "B", "explicacion": "Si un suplente comete una infracción contra un jugador adversario fuera del terreno de juego, se reanuda con libre desde el punto de la línea de demarcación más cercano al lugar donde se produjo la infracción.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-187", "bloque": "reglas", "enunciado": "Un suplente entra en el terreno de juego sin permiso e interfiere con la evolución de un adversario, sin que se evite gol. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo (o penal) desde donde se produjo la interferencia.", "B": "Con balón a tierra en el lugar de la interferencia.", "C": "Con libre indirecto en el centro del campo."}, "correcta": "A", "explicacion": "Cuando un suplente interfiere en la evolución de un adversario, se reanuda con libre en el lugar donde se produjo la interferencia; será penal si es una infracción sancionable con libre directo dentro del área del infractor.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-188", "bloque": "reglas", "enunciado": "Un suplente entra en su propia área penal sin permiso y derriba a un atacante que iba a rematar. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo en el borde del área.", "B": "Con libre indirecto dentro del área.", "C": "Con tiro penal."}, "correcta": "C", "explicacion": "Se señalará tiro penal si se trata de una infracción sancionable con libre directo cometida dentro del área del infractor.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-189", "bloque": "reglas", "enunciado": "Un jugador que está fuera del terreno de juego recibiendo atención médica empuja con fuerza a un suplente de su propio equipo, con el balón en juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo a favor del equipo adversario desde el punto más cercano.", "B": "Con balón a tierra en el punto más cercano de la línea de banda.", "C": "Con libre indirecto desde el punto de la línea de demarcación más cercano al lugar de la infracción."}, "correcta": "C", "explicacion": "Si la infracción la comete un jugador situado fuera del campo contra otro jugador, suplente, sustituido o miembro del cuerpo técnico de su propio equipo, se reanuda con libre indirecto desde el punto de la línea de demarcación más cercano.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-190", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador comete una infracción de carácter físico contra
