o": "¿Se permite colocar balones adicionales alrededor del terreno de juego durante el partido?", "opciones": {"A": "Sí, siempre que cumplan las especificaciones de la Regla 2 y su uso lo supervise el árbitro.", "B": "No, solamente puede haber un único balón en las inmediaciones del terreno de juego.", "C": "Sí, sin ninguna condición ni supervisión adicional por parte del árbitro."}, "correcta": "A", "explicacion": "Se podrán colocar balones adicionales alrededor del terreno de juego, siempre que cumplan las especificaciones de la Regla 2 y su uso lo supervise el árbitro.", "referencia": "Regla 2 / Balones adicionales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-021", "bloque": "reglas", "enunciado": "¿Quién debe supervisar el uso de los balones adicionales colocados alrededor del terreno de juego?", "opciones": {"A": "El árbitro.", "B": "El delegado de campo del equipo local, que responde ante la RFEF por el estado de esos balones.", "C": "El cuarto árbitro exclusivamente, sin intervención del árbitro principal en la supervisión de esos balones."}, "correcta": "A", "explicacion": "El uso de los balones adicionales debe estar supervisado por el árbitro.", "referencia": "Regla 2 / Balones adicionales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-022", "bloque": "reglas", "enunciado": "¿Qué requisito deben cumplir los balones adicionales colocados alrededor del terreno de juego?", "opciones": {"A": "Cumplir las especificaciones estipuladas en la Regla 2.", "B": "Ser de un color distinto al balón oficial en juego, para diferenciarlos.", "C": "Ser proporcionados exclusivamente por la organización de la competición."}, "correcta": "A", "explicacion": "Los balones adicionales deben cumplir las especificaciones estipuladas en la Regla 2, igual que el balón en juego.", "referencia": "Regla 2 / Balones adicionales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-023", "bloque": "reglas", "enunciado": "El balón resulta estar defectuoso justo durante la ejecución del saque inicial. ¿Cómo debe proceder el árbitro?", "opciones": {"A": "Se volverá a ejecutar el saque inicial.", "B": "Se reanuda el juego con un balón a tierra en el punto central.", "C": "El juego continúa con normalidad, ya que el saque inicial ya se considera efectuado."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en un saque de inicio, de meta, de esquina o de banda, o en el lanzamiento de un tiro libre o penal, se volverá a ejecutar el saque o el lanzamiento.", "referencia": "Regla 2.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-024", "bloque": "reglas", "enunciado": "El balón queda defectuoso justo durante el lanzamiento de un tiro libre indirecto. ¿Cómo debe reanudarse el juego?", "opciones": {"A": "Se volverá a ejecutar el lanzamiento del tiro libre indirecto.", "B": "Se reanuda con un balón a tierra en el lugar donde se hallaba el balón.", "C": "Se concede el mismo tiro libre, pero de forma directa, al equipo que lo iba a ejecutar."}, "correcta": "A", "explicacion": "Si el balón quedara defectuoso en el lanzamiento de un tiro libre (directo o indirecto), se volverá a ejecutar dicho lanzamiento.", "referencia": "Regla 2.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 2", "pagina": 31}, {"id": "RJ2-025", "bloque": "reglas", "regla": "Regla 2", "articulo": null, "enunciado": "¿Cuál de las siguientes combinaciones recoge correctamente las tres medidas reglamentarias que debe cumplir el balón al comienzo del partido: circunferencia, peso y presión?", "opciones": {"A": "Circunferencia entre 68 y 70 cm, peso entre 410 y 450 g y presión entre 0,6 y 1,1 atmósferas.", "B": "Circunferencia entre 68 y 70 cm, peso entre 400 y 440 g y presión entre 0,6 y 1,1 atmósferas.", "C": "Circunferencia entre 64 y 66 cm, peso entre 410 y 450 g y presión entre 1,0 y 1,5 atmósferas."}, "correcta": "A", "explicacion": "El balón debe tener una circunferencia comprendida entre 68 y 70 cm, un peso comprendido entre 410 y 450 g y una presión equivalente a 0,6-1,1 atmósferas (600-1100 g/cm²) al nivel del mar. Las opciones B y C alteran, respectivamente, el peso y la circunferencia junto con la presión.", "referencia": "Regla 2 / Características y medidas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "pagina": 30}, {"id": "RJ3-001", "bloque": "reglas", "enunciado": "Un suplente entra al terreno de juego sin permiso del árbitro y marca un gol; el árbitro se percata antes de que se reanude el juego. ¿Qué decisión toma?", "opciones": {"A": "Anula el gol, amonesta por entrar sin permiso y reanuda con tiro libre directo desde el lugar de la interferencia a favor del equipo defensor.", "B": "Anula el gol, amonesta y reanuda con tiro libre directo desde el área de meta a favor del equipo defensor.", "C": "Anula el gol, amonesta por conducta antideportiva y reanuda con balón a tierra desde el área de meta."}, "correcta": "A", "explicacion": "Entrar al terreno de juego sin autorización del árbitro se sanciona con amonestación, anulación del gol si procede, y tiro libre directo a favor del equipo defensor desde el lugar donde se produjo la interferencia.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-002", "bloque": "reglas", "enunciado": "Un jugador que va a ser sustituido se niega a abandonar el terreno de juego. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Lo amonesta por conducta antideportiva.", "B": "Lo amonesta por retardar la reanudación del juego.", "C": "No toma medida disciplinaria y continúa el partido con normalidad."}, "correcta": "B", "explicacion": "Negarse a abandonar el terreno cuando va a ser sustituido se sanciona con amonestación por retardar la reanudación del juego.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-003", "bloque": "reglas", "enunciado": "El preparador físico, situado en la zona de calentamiento, detiene el balón antes de que salga del campo, sin intención de interferir en el juego. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Tiro libre directo o penal a favor del equipo contrario, y expulsión del preparador físico.", "B": "Tiro libre indirecto en el lugar de la infracción, sin amonestación.", "C": "Tiro libre directo o penal a favor del equipo contrario, y amonestación al preparador físico por entrar al terreno de juego sin permiso."}, "correcta": "B", "explicacion": "Detener el balón sin intención de interferir, desde fuera del terreno, se sanciona con tiro libre indirecto en el lugar de la infracción, sin sanción disciplinaria si no hubo intención de interferir.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-004", "bloque": "reglas", "enunciado": "Un equipo presenta solo nueve jugadores nombrados en el saque inicial. ¿Pueden incorporarse al partido los dos jugadores que faltaban una vez comenzado?", "opciones": {"A": "Sí, siempre que el árbitro conociera sus nombres antes del comienzo y las reglas de la competición lo permitan.", "B": "No, deben estar presentes obligatoriamente antes del comienzo del encuentro, sin excepción alguna prevista en las Reglas de Juego.", "C": "Queda a la total discrecionalidad del árbitro decidirlo bajo su criterio, sin que las reglas de la competición condicionen esa decisión."}, "correcta": "A", "explicacion": "Los jugadores pueden incorporarse una vez comenzado el partido si el árbitro conocía sus nombres previamente y el reglamento de la competición lo permite.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-005", "bloque": "reglas", "enunciado": "Un jugador incluido en la lista del equipo es expulsado mientras realiza el calentamiento, 20 minutos antes del comienzo del partido. ¿Qué ocurre?", "opciones": {"A": "El equipo empieza el partido con un jugador menos.", "B": "No se puede expulsar a ningún jugador antes del saque inicial.", "C": "En su lugar juega un suplente, y no se cuenta como sustitución."}, "correcta": "C", "explicacion": "Si la expulsión se produce antes del inicio del partido, el jugador expulsado puede ser reemplazado por un suplente sin que compute como sustitución.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-006", "bloque": "reglas", "enunciado": "Un suplente que está calentando detrás de la portería entra al terreno de juego e impide con el pie una oportunidad manifiesta de gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Lo amonesta y reanuda con tiro libre directo o penal.", "B": "Lo expulsa y reanuda con tiro libre directo o penal.", "C": "Lo expulsa y reanuda con tiro libre indirecto."}, "correcta": "B", "explicacion": "Impedir una ocasión manifiesta de gol mediante la entrada ilegal de un suplente se sanciona con expulsión y tiro libre directo o penal según el lugar de la infracción.", "referencia": "Regla 3 / Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-007", "bloque": "reglas", "enunciado": "¿Puede comenzar un partido un equipo con menos de 7 jugadores?", "opciones": {"A": "Sí, si lo permite el reglamento de la competición.", "B": "No, en ningún caso.", "C": "Sí, únicamente en partidos amistosos."}, "correcta": "B", "explicacion": "La Regla 3 exige un mínimo de 7 jugadores por equipo para poder comenzar el partido, sin excepciones por tipo de competición.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-008", "bloque": "reglas", "enunciado": "Un guardameta y un jugador de campo intercambian su puesto sin avisar al árbitro. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Permite que el juego continúe y apercibe verbalmente a ambos cuando el balón deje de estar en juego.", "B": "Permite que el juego continúe y amonesta a ambos cuando el balón deje de estar en juego.", "C": "Detiene el juego, reanuda con tiro libre indirecto y amonesta a ambos por el cambio no autorizado."}, "correcta": "B", "explicacion": "El intercambio de puesto entre guardameta y jugador de campo sin autorización se sanciona, en la siguiente interrupción, con amonestación a ambos jugadores, sin necesidad de detener el juego en el momento.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-009", "bloque": "reglas", "enunciado": "¿Cuál es el número mínimo de futbolistas necesario, según la Regla 3, para que un equipo pueda continuar un partido ya iniciado sin darlo por finalizado?", "opciones": {"A": "6 jugadores.", "B": "7 jugadores.", "C": "8 jugadores."}, "correcta": "B", "explicacion": "El mínimo de 7 jugadores exigido para iniciar un partido es también el umbral por debajo del cual el partido no puede continuar.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-010", "bloque": "reglas", "enunciado": "¿Cuántos suplentes pueden figurar como máximo en el acta según las Reglas de Juego, salvo que la competición module ese número?", "opciones": {"A": "5 suplentes, cifra fija que establecen las propias Reglas de Juego con independencia del reglamento de cada competición.", "B": "El número que determine el reglamento de la competición, ya que las Reglas de Juego remiten a este aspecto.", "C": "12 suplentes en todos los casos, al ser el límite máximo que autorizan las Reglas de Juego para cualquier competición."}, "correcta": "B", "explicacion": "Las Reglas de Juego dejan a criterio del reglamento de cada competición el número máximo de suplentes inscribibles en el acta.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-011", "bloque": "reglas", "enunciado": "¿Puede un jugador expulsado ser sustituido por otro jugador de la plantilla ya iniciado el partido?", "opciones": {"A": "Sí, si aún quedan sustituciones disponibles.", "B": "No, un jugador expulsado nunca puede ser sustituido.", "C": "Sí, pero solo si la expulsión se produjo en la primera mitad."}, "correcta": "B", "explicacion": "Un jugador expulsado no puede ser reemplazado por otro; el equipo continúa el partido con un jugador menos.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-012", "bloque": "reglas", "enunciado": "¿Es obligatorio que el capitán de un equipo lleve un brazalete distintivo?", "opciones": {"A": "Sí, en todas las categorías sin excepción, con un diseño único fijado directamente por las Reglas de Juego.", "B": "Sí, es una obligación general, pero su diseño puede quedar sujeto al reglamento de la competición.", "C": "No es obligatorio en ninguna categoría, quedando su uso a la libre elección de cada capitán antes del partido."}, "correcta": "B", "explicacion": "El capitán debe llevar un brazalete distintivo; su diseño concreto (colores, inscripciones) puede quedar sujeto a lo que autorice el reglamento de cada competición.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-013", "bloque": "reglas", "enunciado": "Durante una sustitución, ¿por dónde debe entrar el jugador suplente al terreno de juego, con carácter general?", "opciones": {"A": "Por cualquier punto de la línea de banda que le resulte más cómodo.", "B": "Por la línea de banda correspondiente a la línea media, salvo excepciones autorizadas por el árbitro.", "C": "Únicamente por la zona donde se encuentre el banquillo de su equipo, sin restricción de línea."}, "correcta": "B", "explicacion": "Con carácter general, el suplente entra por la línea de banda a la altura de la línea media, salvo que el árbitro autorice otra ubicación.", "referencia": "Regla 3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-014", "bloque": "reglas", "enunciado": "¿Cuál es el número máximo de jugadores con que puede disputar un partido cada equipo, según la Regla 3?", "opciones": {"A": "Once, uno de los cuales será el guardameta.", "B": "Doce, incluyendo un segundo guardameta suplente en el terreno.", "C": "Once, sin que sea obligatorio que uno de ellos sea el guardameta."}, "correcta": "A", "explicacion": "Disputarán los partidos dos equipos, cada uno con un máximo de once jugadores, uno de los cuales será el guardameta.", "referencia": "Regla 3 / Número de jugadores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-015", "bloque": "reglas", "enunciado": "¿Puede comenzar un partido un equipo que dispone únicamente de seis jugadores?", "opciones": {"A": "No, el partido no comenzará si uno de los equipos dispone de menos de siete jugadores.", "B": "Sí, siempre que el reglamento de la competición lo autorice expresamente.", "C": "Sí, siempre que el equipo rival dé su conformidad antes del saque inicial."}, "correcta": "A", "explicacion": "El partido no comenzará ni proseguirá si uno de los equipos dispone de menos de siete jugadores.", "referencia": "Regla 3 / Número de jugadores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-016", "bloque": "reglas", "enunciado": "Durante un partido en curso, un equipo se queda con seis jugadores porque varios abandonaron voluntariamente el terreno de juego. ¿Debe el árbitro detener el juego de inmediato?", "opciones": {"A": "No necesariamente; el árbitro no está obligado a detener el juego y podrá otorgar ventaja, aunque el partido no podrá reanudarse cuando el balón deje de estar en juego.", "B": "Sí, debe detener el juego de inmediato en cuanto detecte que el equipo tiene menos de siete jugadores en el campo.", "C": "No, el juego debe continuar sin ninguna restricción posterior, incluidas todas las reanudaciones que se produzcan después."}, "correcta": "A", "explicacion": "Si un equipo acaba con menos de siete jugadores por abandono voluntario, el árbitro no está obligado a detener el juego y podrá otorgar ventaja, pero el partido no deberá reanudarse una vez que el balón no esté en juego si el equipo no cuenta con siete jugadores como mínimo.", "referencia": "Regla 3 / Número de jugadores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-017", "bloque": "reglas", "enunciado": "Si el reglamento de la competición exige dar a conocer el nombre de todos los jugadores y suplentes antes del saque inicial, y un equipo comienza con menos de once jugadores, ¿quién podrá incorporarse posteriormente al llegar?", "opciones": {"A": "Únicamente los jugadores y suplentes que figuren en la alineación inicial facilitada.", "B": "Cualquier jugador de la plantilla, aunque no figurase en la alineación inicial.", "C": "Solo el guardameta titular, si no estuviera presente al inicio del encuentro."}, "correcta": "A", "explicacion": "En ese supuesto, únicamente los jugadores y suplentes que figuren en la alineación inicial podrán participar en el partido en cuanto lleguen.", "referencia": "Regla 3 / Número de jugadores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-018", "bloque": "reglas", "enunciado": "En partidos de competición oficial de la FIFA, las confederaciones o las federaciones nacionales, ¿cuál es el número máximo de suplentes que se podrá utilizar?", "opciones": {"A": "Cinco.", "B": "Tres.", "C": "Siete."}, "correcta": "A", "explicacion": "En los partidos de competición oficial se podrá utilizar un máximo de cinco suplentes.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-019", "bloque": "reglas", "enunciado": "En una competición del primer equipo de la máxima categoría donde el reglamento permite un máximo de cinco sustituciones, ¿cuántas oportunidades de sustitución dispone cada equipo, sin contar el descanso?", "opciones": {"A": "Un máximo de tres oportunidades.", "B": "Un máximo de cinco oportunidades.", "C": "Un máximo de dos oportunidades."}, "correcta": "A", "explicacion": "Ambos equipos dispondrán de un máximo de tres oportunidades para proceder con las sustituciones, además de las que puedan realizar durante el descanso.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-020", "bloque": "reglas", "enunciado": "Ambos equipos solicitan realizar una sustitución exactamente al mismo tiempo. ¿Cómo afecta esto al número de oportunidades de sustitución de cada uno?", "opciones": {"A": "Se restará una oportunidad de sustitución a cada uno de los equipos.", "B": "No se descuenta ninguna oportunidad a ninguno de los dos equipos por coincidir en el tiempo.", "C": "Se descuentan dos oportunidades al equipo que lo solicitó primero."}, "correcta": "A", "explicacion": "Si ambos equipos realizan una sustitución al mismo tiempo, se restará una oportunidad de sustitución a cada uno de ellos.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-021", "bloque": "reglas", "enunciado": "Un equipo solicita y realiza tres sustituciones distintas en el mismo momento en que el juego está detenido. ¿Cuántas oportunidades de sustitución consume?", "opciones": {"A": "Una sola oportunidad de sustitución.", "B": "Tres oportunidades de sustitución, una por cada cambio.", "C": "Dos oportunidades de sustitución."}, "correcta": "A", "explicacion": "Si un equipo solicita o realiza múltiples sustituciones en el mismo momento en que el juego está detenido, estas contarán como una sola oportunidad de sustitución.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-022", "bloque": "reglas", "enunciado": "Un equipo no ha agotado el número máximo de suplentes ni de oportunidades de sustitución al finalizar el tiempo reglamentario. ¿Qué ocurre con esos suplentes u oportunidades si el partido llega a la prórroga?", "opciones": {"A": "El equipo podrá disponer de los suplentes o las oportunidades restantes durante la prórroga.", "B": "Se pierden automáticamente al finalizar el tiempo reglamentario, sin posibilidad de utilizarlos.", "C": "Solo podrá emplear la mitad de las oportunidades restantes durante la prórroga."}, "correcta": "A", "explicacion": "Si los equipos no hubieran utilizado el número máximo de suplentes o no hubieran agotado el número máximo de oportunidades, durante la prórroga podrán disponer de los suplentes o las oportunidades restantes.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-023", "bloque": "reglas", "enunciado": "Cuando el reglamento de la competición autoriza el empleo de un suplente adicional durante la prórroga, ¿qué oportunidad adicional reciben los equipos?", "opciones": {"A": "Una oportunidad de sustitución adicional cada uno.", "B": "Dos oportunidades de sustitución adicionales cada uno.", "C": "Ninguna oportunidad adicional, solo el derecho a inscribir un suplente más sin poder usarlo."}, "correcta": "A", "explicacion": "Cuando el reglamento autorice un suplente más durante la prórroga, los dos equipos contarán con una oportunidad de sustitución adicional.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-024", "bloque": "reglas", "enunciado": "¿Cuentan como oportunidad de sustitución los cambios realizados en el intervalo de cambio de campo entre las dos partes de la prórroga?", "opciones": {"A": "No, esas sustituciones no contarán como oportunidades de sustitución.", "B": "Sí, cuentan igual que cualquier sustitución realizada durante el juego.", "C": "Solo cuentan si se realiza más de un cambio en ese intervalo."}, "correcta": "A", "explicacion": "Podrán realizarse sustituciones en el intervalo de cambio de campos a la conclusión de la primera parte de la prórroga, y estas sustituciones no contarán como oportunidades de sustitución.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-025", "bloque": "reglas", "enunciado": "¿Qué debe estipular el reglamento de la competición en relación con el número máximo de suplentes que podrán inscribirse?", "opciones": {"A": "Un número de tres a un máximo de quince.", "B": "Un número fijo de cinco suplentes en todos los casos.", "C": "Un número de cinco a un máximo de veinte."}, "correcta": "A", "explicacion": "El reglamento de la competición deberá estipular el número máximo de suplentes que podrán inscribirse, de tres a un máximo de quince.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-026", "bloque": "reglas", "enunciado": "En partidos de selecciones nacionales absolutas, ¿cuál es el número máximo de suplentes que se podrán utilizar salvo acuerdo distinto entre los equipos?", "opciones": {"A": "Un máximo de ocho.", "B": "Un máximo de cinco.", "C": "Un máximo de once."}, "correcta": "A", "explicacion": "En partidos de selecciones nacionales absolutas se podrá utilizar un máximo de ocho suplentes, a menos que los equipos acuerden utilizar más, hasta un máximo de once.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-027", "bloque": "reglas", "enunciado": "En partidos de selecciones nacionales absolutas, si ambos equipos acuerdan utilizar más de ocho suplentes, ¿cuál es el límite máximo permitido y qué requisito debe cumplirse?", "opciones": {"A": "Un máximo de once suplentes, debiendo informar al árbitro antes del partido.", "B": "Un máximo de quince suplentes, sin necesidad de informar previamente al árbitro.", "C": "Un máximo de diez suplentes, comunicándolo únicamente al finalizar el encuentro."}, "correcta": "A", "explicacion": "Si los equipos acuerdan utilizar más sustituciones, el máximo será de once, debiendo informar al árbitro antes del partido.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-028", "bloque": "reglas", "enunciado": "En partidos distintos de competición oficial FIFA/confederaciones/federaciones y de selecciones nacionales absolutas, si no se informa al árbitro ni se llega a un acuerdo antes del inicio sobre el número de suplentes, ¿cuántos suplentes podrá utilizar cada equipo como máximo?", "opciones": {"A": "Un máximo de seis suplentes.", "B": "Un máximo de cinco suplentes.", "C": "Un número ilimitado de suplentes."}, "correcta": "A", "explicacion": "Si el árbitro no ha sido informado o no se ha llegado a un acuerdo antes del inicio del partido, a cada equipo se le permitirá utilizar como máximo seis suplentes.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-029", "bloque": "reglas", "enunciado": "¿En qué categorías está permitido el uso de sustituciones ilimitadas según la Regla 3?", "opciones": {"A": "En fútbol juvenil, de veteranos, de personas con discapacidad y fútbol base, si lo aprueba la federación, confederación o FIFA.", "B": "En cualquier categoría, sin necesidad de aprobación específica de ninguna federación, confederación ni de la FIFA.", "C": "Únicamente en fútbol base, con independencia de cualquier aprobación federativa previa a la competición."}, "correcta": "A", "explicacion": "El uso de sustituciones ilimitadas está permitido exclusivamente en fútbol juvenil, de veteranos, de personas con discapacidad y fútbol base, siempre que lo apruebe la federación nacional, la confederación o la FIFA.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-030", "bloque": "reglas", "enunciado": "¿Qué permite el protocolo de sustituciones adicionales permanentes contenido en el apartado de Observaciones y adaptaciones?", "opciones": {"A": "Que las competiciones autoricen sustituciones adicionales permanentes por conmoción cerebral.", "B": "Que cualquier jugador lesionado pueda ser sustituido sin límite de veces.", "C": "Que se elimine el límite de suplentes inscritos en el acta del partido."}, "correcta": "A", "explicacion": "Las competiciones pueden permitir sustituciones adicionales permanentes por conmoción cerebral, de acuerdo con el protocolo correspondiente.", "referencia": "Regla 3 / Número de sustituciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-031", "bloque": "reglas", "enunciado": "¿Qué documento debe entregarse al árbitro antes del comienzo del partido en relación con las sustituciones?", "opciones": {"A": "La lista de suplentes.", "B": "Únicamente el nombre del capitán de cada equipo.", "C": "La lista completa de la plantilla del club para toda la temporada."}, "correcta": "A", "explicacion": "Antes del comienzo del partido, deberá entregarse al árbitro la lista de suplentes.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-032", "bloque": "reglas", "enunciado": "Un jugador no figuraba en la lista de suplentes entregada al árbitro antes del partido. ¿Podrá participar posteriormente como sustituto?", "opciones": {"A": "No, aquellos cuyo nombre no haya sido facilitado en ese momento no podrán participar en el partido.", "B": "Sí, siempre que se comunique verbalmente al árbitro durante el descanso.", "C": "Sí, siempre que el equipo contrario no se oponga expresamente."}, "correcta": "A", "explicacion": "Aquellos jugadores cuyo nombre no haya sido facilitado en la lista de suplentes en el momento oportuno no podrán participar en el partido.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-033", "bloque": "reglas", "enunciado": "¿Qué debe hacerse antes de efectuar cualquier sustitución, según el procedimiento de la Regla 3?", "opciones": {"A": "Informar al árbitro antes de efectuar la sustitución.", "B": "Esperar a que el balón salga por la línea de banda, sin necesidad de informar previamente.", "C": "Comunicarlo únicamente al capitán del equipo contrario."}, "correcta": "A", "explicacion": "Para sustituir a un jugador se deberá informar al árbitro antes de efectuar la sustitución.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-034", "bloque": "reglas", "enunciado": "¿Por dónde debe abandonar el terreno de juego, con carácter general, el jugador que va a ser sustituido?", "opciones": {"A": "Por el punto más cercano de la línea delimitadora del campo, salvo indicación distinta del árbitro.", "B": "Obligatoriamente por la línea central, igual que el suplente que entra.", "C": "Por cualquier punto que elija libremente el propio jugador sustituido."}, "correcta": "A", "explicacion": "El jugador que va a ser sustituido abandonará el terreno de juego por el punto más cercano de la línea delimitadora del campo, salvo que el árbitro le indique otra cosa (por ejemplo, por razones de seguridad o lesión).", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-035", "bloque": "reglas", "enunciado": "¿En qué plazo máximo debe abandonar el terreno de juego el jugador sustituido desde que se muestra el tablero de sustituciones o el árbitro señala que puede efectuarse el cambio?", "opciones": {"A": "Diez segundos.", "B": "Treinta segundos.", "C": "Cinco segundos."}, "correcta": "A", "explicacion": "El jugador sustituido deberá estar fuera del terreno de juego en el plazo máximo de diez segundos, salvo que esta disposición no se pudiera cumplir por razones de seguridad o lesión.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 33}, {"id": "RJ3-036", "bloque": "reglas", "enunciado": "Se producen varias sustituciones durante la misma oportunidad de cambio. ¿Desde qué momento se cuenta el plazo de diez segundos para que los jugadores sustituidos abandonen el terreno de juego?", "opciones": {"A": "Desde el momento en que se indique la última sustitución de ese grupo.", "B": "Desde el momento en que se indique la primera sustitución de ese grupo.", "C": "El plazo se cuenta de forma independiente para cada jugador sustituido, desde su propia señal individual."}, "correcta": "A", "explicacion": "Si se producen varias sustituciones durante la misma oportunidad, todos los jugadores sustituidos deberán salir del terreno de juego en el plazo de diez segundos a partir de la última sustitución indicada.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-037", "bloque": "reglas", "enunciado": "Un jugador que debe ser sustituido se niega a abandonar el terreno de juego cuando se le indica. ¿Qué ocurre con el partido según la Regla 3?", "opciones": {"A": "El partido continuará.", "B": "El árbitro debe suspender el partido de inmediato.", "C": "Se concede un tiro libre indirecto al equipo contrario por la negativa."}, "correcta": "A", "explicacion": "Si un jugador que debe ser sustituido se negara a salir del terreno de juego, el partido continuará.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-038", "bloque": "reglas", "enunciado": "¿Por dónde debe entrar el suplente al terreno de juego, con carácter general?", "opciones": {"A": "Por la línea central.", "B": "Por la línea de meta más cercana a su banquillo.", "C": "Por cualquier punto de la línea de banda a su elección."}, "correcta": "A", "explicacion": "El suplente solamente podrá entrar al terreno de juego, entre otras condiciones, por la línea central.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-039", "bloque": "reglas", "enunciado": "¿En qué momento se considera que una sustitución es efectiva, es decir, cuándo el jugador que sale pasa a ser jugador sustituido y el suplente pasa a ser jugador?", "opciones": {"A": "Cuando el suplente entra en el terreno de juego.", "B": "Cuando el árbitro autoriza verbalmente la sustitución, aunque el suplente aún no haya entrado.", "C": "Cuando el jugador que sale abandona por completo las inmediaciones del terreno de juego."}, "correcta": "A", "explicacion": "Las sustituciones serán efectivas cuando el suplente entre en el terreno de juego; desde ese momento, el que se retira pasa a ser jugador sustituido y el suplente se convierte en jugador.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-040", "bloque": "reglas", "enunciado": "Un jugador sustituido, que no llega a entrar de nuevo en el terreno de juego, comete una falta de respeto hacia el árbitro desde la zona de banquillo. ¿Está sometido a la autoridad del árbitro?", "opciones": {"A": "Sí, tanto los jugadores sustituidos como los suplentes están sometidos a la autoridad del árbitro, independientemente de que lleguen a jugar o no.", "B": "No, una vez sustituido deja de estar sometido a la autoridad disciplinaria del árbitro durante el resto del encuentro.", "C": "Solo está sometido a dicha autoridad mientras permanece sentado en el banquillo oficial del equipo."}, "correcta": "A", "explicacion": "Tanto los jugadores sustituidos como los suplentes están sometidos a la autoridad del árbitro, independientemente de que lleguen a jugar o no.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-041", "bloque": "reglas", "enunciado": "Un jugador sustituido no logra abandonar el terreno de juego dentro del plazo de diez segundos exigido, sin que existan razones de seguridad o lesión que lo justifiquen. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Amonestarlo únicamente si retrasa excesivamente la reanudación del juego más allá de los diez segundos, y de todas formas debe salir del terreno de juego.", "B": "Cancelar automáticamente la sustitución y permitir que el jugador continúe en el terreno de juego sin salir de él.", "C": "Expulsar directamente al jugador por incumplir el plazo reglamentario de salida establecido en la Regla 3."}, "correcta": "A", "explicacion": "Si el jugador sustituido no sale en el plazo máximo de diez segundos, deberá salir de todas formas y solo recibirá amonestación si retrasa excesivamente la reanudación del juego durante más de diez segundos.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-042", "bloque": "reglas", "enunciado": "Si el jugador sustituido no abandona el terreno de juego en el plazo exigido, ¿puede el suplente entrar de inmediato una vez el jugador sale?", "opciones": {"A": "No, el suplente no podrá entrar todavía; solo podrá hacerlo con permiso del árbitro en la primera interrupción tras transcurrir un minuto desde la reanudación.", "B": "Sí, el suplente puede entrar de inmediato en cuanto el jugador sustituido abandona por completo el terreno de juego.", "C": "Sí, pero únicamente si el árbitro no ha amonestado previamente al jugador que ha sido sustituido."}, "correcta": "A", "explicacion": "El suplente no podrá entrar en el terreno de juego todavía; el juego se reanudará y el suplente podrá entrar únicamente con permiso del árbitro durante la primera interrupción del juego, transcurrido un minuto desde la reanudación.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-043", "bloque": "reglas", "enunciado": "Se produce una sustitución durante el descanso del medio tiempo sin que se informe al árbitro correctamente, y el suplente inscrito juega igualmente. ¿Qué consecuencia establece la Regla 3?", "opciones": {"A": "El suplente podrá seguir jugando, no se tomará ninguna medida disciplinaria y se informará de la incidencia a las autoridades competentes.", "B": "El suplente debe abandonar el terreno de forma inmediata en cuanto se detecte la irregularidad.", "C": "El equipo pierde automáticamente una oportunidad de sustitución adicional como sanción."}, "correcta": "A", "explicacion": "Si no se informara al árbitro de una sustitución realizada durante el descanso, el suplente podrá seguir jugando, no se tomará ninguna medida disciplinaria y se informará de la incidencia a las autoridades competentes.", "referencia": "Regla 3 / Procedimiento de sustitución", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-044", "bloque": "reglas", "enunciado": "¿Bajo qué dos condiciones puede un jugador de campo intercambiar su puesto por el del guardameta, según la Regla 3?", "opciones": {"A": "Que se informe al árbitro antes del cambio y que este se efectúe mientras el juego esté detenido.", "B": "Que lo autorice el capitán del equipo contrario y que el guardameta titular esté lesionado.", "C": "Que se produzca durante el descanso y que ambos jugadores lleven el mismo dorsal."}, "correcta": "A", "explicacion": "El cambio de guardameta requiere que se informe al árbitro antes de realizarse y que se efectúe mientras el juego esté detenido.", "referencia": "Regla 3 / Cambio del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-045", "bloque": "reglas", "enunciado": "Un jugador de campo y el guardameta intercambian su puesto sin informar previamente al árbitro, y el juego continúa con normalidad. ¿Qué decisión toma el árbitro en cuanto el balón deje de estar en juego?", "opciones": {"A": "Permitirá que prosiga el juego y amonestará a ambos jugadores en cuanto el balón deje de estar en juego.", "B": "Detendrá inmediatamente el juego y expulsará a ambos jugadores por la irregularidad.", "C": "Anulará cualquier jugada posterior hasta que se produzca la siguiente interrupción natural."}, "correcta": "A", "explicacion": "Si el cambio de puesto con el guardameta se produce sin autorización del árbitro, este permitirá que prosiga el juego y amonestará a ambos jugadores en cuanto el balón deje de estar en juego.", "referencia": "Regla 3 / Cambio del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-046", "bloque": "reglas", "enunciado": "El intercambio no autorizado de puesto entre un jugador de campo y el guardameta se produce justo antes del descanso del medio tiempo. ¿Debe el árbitro amonestar a ambos jugadores en cuanto el balón deje de estar en juego?", "opciones": {"A": "No necesariamente; si el cambio se produjo durante el descanso o en periodos similares de interrupción prolongada, no se aplica la amonestación en esos términos.", "B": "Sí, siempre debe amonestarlos en la primera interrupción del juego, sin excepción alguna prevista por la Regla 3.", "C": "No, en ningún caso corresponde amonestación por este tipo de cambio de puesto entre jugadores."}, "correcta": "A", "explicacion": "La amonestación se aplica en cuanto el balón deje de estar en juego, excepto si el cambio se produjo durante el descanso del medio tiempo (incluido el de la prórroga) o entre el final del partido y el inicio del tiempo suplementario o la tanda de penales.", "referencia": "Regla 3 / Cambio del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-047", "bloque": "reglas", "enunciado": "Un suplente inscrito como tal juega desde el inicio del partido en lugar de un jugador previamente inscrito como titular, sin que el árbitro haya sido informado. ¿Qué medida se adopta según la Regla 3?", "opciones": {"A": "El árbitro permitirá que el suplente siga jugando, no se adoptarán sanciones disciplinarias y el jugador inscrito como titular podrá pasar a ser suplente.", "B": "El suplente debe abandonar inmediatamente el terreno de juego en cuanto se detecte la irregularidad cometida.", "C": "El equipo pierde automáticamente una oportunidad de sustitución como consecuencia directa de la infracción cometida."}, "correcta": "A", "explicacion": "En este supuesto, el árbitro permitirá que el suplente siga jugando, no se adoptarán sanciones disciplinarias, el jugador inscrito como titular podrá pasar a ser suplente y no se reducirá el número de sustituciones.", "referencia": "Regla 3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-048", "bloque": "reglas", "enunciado": "Se produce una infracción distinta de la Regla 3 relativa a jugadores y sustituciones (por ejemplo, un cambio irregular no contemplado específicamente). ¿Cómo se reanuda el juego con carácter general?", "opciones": {"A": "Se amonestará a los jugadores implicados y se reanudará el juego con un tiro libre indirecto desde el lugar donde se hallaba el balón cuando el juego fue detenido.", "B": "Se amonestará a los jugadores implicados y se reanudará con un tiro libre directo a favor del equipo contrario.", "C": "No se aplica sanción disciplinaria alguna y el juego se reanuda directamente con un balón a tierra."}, "correcta": "A", "explicacion": "En caso de cualquier otra infracción de la Regla 3, se amonestará a los jugadores implicados y se reanudará el juego con un tiro libre indirecto desde el lugar donde se hallaba el balón cuando el juego fue detenido.", "referencia": "Regla 3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-049", "bloque": "reglas", "enunciado": "Un jugador es expulsado antes de la entrega de la lista del equipo al árbitro. ¿Puede figurar en dicha lista posteriormente?", "opciones": {"A": "No, no podrá figurar en ningún puesto dentro de la lista del equipo.", "B": "Sí, siempre que se inscriba como suplente y no como titular.", "C": "Sí, siempre que el club presente una alegación aceptada por el árbitro."}, "correcta": "A", "explicacion": "Si un jugador es expulsado antes de la entrega de la lista del equipo, no podrá figurar en ningún puesto dentro de dicha lista.", "referencia": "Regla 3 / Jugadores y suplentes expulsados", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-050", "bloque": "reglas", "enunciado": "Un jugador, ya inscrito en la lista del equipo, es expulsado después de dicha inscripción pero antes del saque inicial. ¿Puede ser sustituido por un suplente?", "opciones": {"A": "Sí, puede ser sustituido por un suplente, cuyo puesto no podrá ser ocupado por otro jugador, y no se reduce el número de sustituciones permitidas.", "B": "No, en ningún caso puede ser sustituido una vez inscrito en la lista oficial del equipo antes del saque inicial.", "C": "Sí, pero esa sustitución reduce el número total de sustituciones permitidas al equipo durante el partido."}, "correcta": "A", "explicacion": "Tras ser inscrito en la lista del equipo y antes del saque inicial, el jugador expulsado puede ser sustituido por un suplente, cuyo puesto no podrá ser ocupado por otro jugador, sin que se reduzca el número de sustituciones permitidas.", "referencia": "Regla 3 / Jugadores y suplentes expulsados", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-051", "bloque": "reglas", "enunciado": "Un jugador titular es expulsado inmediatamente después del saque inicial del partido. ¿Puede ser sustituido por un suplente?", "opciones": {"A": "No, tras el saque inicial el jugador expulsado no podrá ser sustituido.", "B": "Sí, siempre que se realice dentro de los primeros cinco minutos de juego.", "C": "Sí, siempre que el equipo disponga todavía de oportunidades de sustitución."}, "correcta": "A", "explicacion": "Tras el saque inicial, el jugador expulsado no podrá ser sustituido.", "referencia": "Regla 3 / Jugadores y suplentes expulsados", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-052", "bloque": "reglas", "enunciado": "Un jugador designado como suplente es expulsado antes de llegar a entrar en el terreno de juego. ¿Puede ser sustituido por otro suplente?", "opciones": {"A": "No, no podrá sustituirse a un jugador designado como suplente que sea expulsado antes o después del saque inicial.", "B": "Sí, siempre que otro suplente no utilizado ocupe su lugar en la lista.", "C": "Sí, únicamente si la expulsión se produjo antes del saque inicial del partido."}, "correcta": "A", "explicacion": "No podrá sustituirse a aquel jugador designado como suplente que sea expulsado, ni antes ni después del saque inicial.", "referencia": "Regla 3 / Jugadores y suplentes expulsados", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-053", "bloque": "reglas", "enunciado": "¿Quiénes se consideran miembros del cuerpo técnico según la Regla 3?", "opciones": {"A": "El entrenador y los demás integrantes de la lista del equipo, a excepción de los jugadores y los suplentes.", "B": "Únicamente el entrenador principal del equipo, sin incluir a ningún otro miembro del cuerpo técnico.", "C": "Cualquier persona acreditada por el club, incluidos los propios jugadores y los suplentes inscritos en acta."}, "correcta": "A", "explicacion": "Los miembros del cuerpo técnico son el entrenador y los demás integrantes de la lista del equipo, a excepción de los jugadores y los suplentes.", "referencia": "Regla 3 / Personas no autorizadas en el terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-054", "bloque": "reglas", "enunciado": "¿Cómo se define a una persona no inscrita en la lista del equipo como jugador, suplente o miembro del cuerpo técnico?", "opciones": {"A": "Como agente externo.", "B": "Como persona no autorizada, sin más calificación específica.", "C": "Como delegado de campo, salvo que se acredite lo contrario."}, "correcta": "A", "explicacion": "Toda persona no inscrita en la lista del equipo como jugador, suplente o miembro del cuerpo técnico será considerada como agente externo.", "referencia": "Regla 3 / Personas no autorizadas en el terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-055", "bloque": "reglas", "enunciado": "Un suplente entra en el terreno de juego sin permiso del árbitro, pero sin interferir en absoluto en el desarrollo del juego. ¿Debe el árbitro detener el juego de inmediato?", "opciones": {"A": "No, solo detendrá el juego si esa persona interfiere en el juego.", "B": "Sí, debe detener el juego de inmediato en cuanto detecte la entrada no autorizada.", "C": "No, en ningún caso se detiene el juego por la entrada de una persona no autorizada."}, "correcta": "A", "explicacion": "Si un suplente entra en el terreno de juego, el árbitro detendrá el juego únicamente si esta persona interfiere en el juego.", "referencia": "Regla 3 / Personas no autorizadas en el terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-056", "bloque": "reglas", "enunciado": "El juego se detiene porque un miembro del cuerpo técnico entró e interfirió en el juego. ¿Cómo se reanuda?", "opciones": {"A": "Con un tiro libre directo o un tiro penal, según el lugar de la infracción.", "B": "Con un tiro libre indirecto en el lugar donde se hallaba el balón.", "C": "Con un balón a tierra en el lugar de la interferencia."}, "correcta": "A", "explicacion": "Si la interferencia fue causada por un miembro del cuerpo técnico, suplente, jugador sustituido o jugador expulsado, se reanudará el juego con un libre directo o un tiro penal.", "referencia": "Regla 3 / Personas no autorizadas en el terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-057", "bloque": "reglas", "enunciado": "El juego se detiene porque un agente externo (por ejemplo, un espectador) interfirió en el juego. ¿Cómo se reanuda?", "opciones": {"A": "Con un balón a tierra.", "B": "Con un tiro libre directo a favor del equipo perjudicado.", "C": "Con un saque de banda en el lugar de la interferencia."}, "correcta": "A", "explicacion": "Si la interferencia fue causada por un agente externo, se reanudará el juego con un balón a tierra.", "referencia": "Regla 3 / Personas no autorizadas en el terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-058", "bloque": "reglas", "enunciado": "Un jugador que necesita autorización del árbitro para regresar al terreno de juego reingresa sin dicho permiso, sin interferir en el juego ni en la labor del equipo arbitral. ¿Debe el árbitro detener el juego inmediatamente?", "opciones": {"A": "No necesariamente; no lo detendrá de inmediato si el jugador no interfiere en el juego o en la labor de un miembro del equipo arbitral, o si pudiera concederse ventaja.", "B": "Sí, siempre debe detener el juego de inmediato en cuanto el jugador reingresa sin permiso del árbitro, aunque no llegue a interferir en la jugada ni en la labor de ningún miembro del equipo arbitral.", "C": "No, en ningún caso corresponde detener el juego por este motivo, con independencia de si el jugador interfiere o no en la jugada o en la labor del equipo arbitral en ese momento."}, "correcta": "A", "explicacion": "El árbitro no detendrá el juego inmediatamente si el jugador que reingresa sin autorización no interfiere en el juego ni en la labor del equipo arbitral, o si pudiera concederse ventaja.", "referencia": "Regla 3 / Jugador fuera del terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-059", "bloque": "reglas", "enunciado": "Un jugador reingresa al terreno de juego sin la autorización requerida del árbitro. ¿Qué sanción disciplinaria le corresponde?", "opciones": {"A": "Será amonestado por entrar en el terreno de juego sin autorización.", "B": "Será expulsado directamente por la infracción cometida.", "C": "No recibe ninguna sanción disciplinaria, solo se detiene el juego si interfiere."}, "correcta": "A", "explicacion": "El árbitro amonestará al jugador por entrar en el terreno de juego sin autorización.", "referencia": "Regla 3 / Jugador fuera del terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-060", "bloque": "reglas", "enunciado": "El árbitro detiene el juego por la interferencia de un jugador que reingresó sin autorización. ¿Cómo se reanuda si sí se produjo dicha interferencia?", "opciones": {"A": "Con un libre directo desde el punto donde se produjo la interferencia.", "B": "Con un libre indirecto desde el lugar donde se hallaba el balón cuando se detuvo el juego.", "C": "Con un balón a tierra en el punto de la interferencia."}, "correcta": "A", "explicacion": "Si el árbitro detiene el juego por esta causa, lo reanudará con un libre directo desde el punto donde se produjo la interferencia.", "referencia": "Regla 3 / Jugador fuera del terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-061", "bloque": "reglas", "enunciado": "El árbitro detiene el juego por el reingreso no autorizado de un jugador, pero no se produjo ninguna interferencia. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un libre indirecto desde el lugar donde se hallaba el balón cuando el juego fue detenido.", "B": "Con un libre directo desde el punto por donde reingresó el jugador.", "C": "Con un balón a tierra en el punto por donde reingresó el jugador."}, "correcta": "A", "explicacion": "Si no se produjo ninguna interferencia, el juego se reanudará con un libre indirecto desde el lugar donde se hallaba el balón cuando fue detenido.", "referencia": "Regla 3 / Jugador fuera del terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-062", "bloque": "reglas", "enunciado": "Durante el desarrollo normal de la jugada, un jugador cruza una línea de demarcación del terreno de juego como parte de la acción del juego. ¿Comete alguna infracción?", "opciones": {"A": "No, no cometerá infracción alguna aquel jugador que, como parte de la acción del juego, cruce una línea de demarcación.", "B": "Sí, siempre debe ser amonestado por abandonar momentáneamente el terreno de juego.", "C": "Sí, salvo que el árbitro le hubiera autorizado previamente ese movimiento concreto."}, "correcta": "A", "explicacion": "No cometerá infracción alguna aquel jugador que, como parte de la acción del juego, cruce una línea de demarcación.", "referencia": "Regla 3 / Jugador fuera del terreno de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-063", "bloque": "reglas", "enunciado": "Tras anotarse un gol y antes de reanudarse el juego, el árbitro constata que un miembro del cuerpo técnico del equipo que marcó el gol estaba en el terreno de juego interfiriendo en el juego. ¿Debe anularse el gol?", "opciones": {"A": "Sí, el árbitro deberá anular el gol, reanudando con un tiro libre directo desde la posición de la persona no autorizada.", "B": "No, el gol es válido siempre que la persona no autorizada perteneciera al propio equipo que marcó.", "C": "Sí, pero la reanudación será con balón a tierra en el punto donde estaba la persona no autorizada."}, "correcta": "A", "explicacion": "Si la persona no autorizada era un jugador, suplente, jugador sustituido, jugador expulsado o miembro del cuerpo técnico del equipo que marcó el gol, este se anulará y se reanudará con un tiro libre directo desde la posición de dicha persona.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-064", "bloque": "reglas", "enunciado": "Tras anotarse un gol y antes de reanudarse el juego, el árbitro constata que un agente externo interfirió en el juego durante la jugada del gol, sin encajar en el supuesto de persona vinculada al equipo anotador. ¿Cómo procede?", "opciones": {"A": "Anula el gol y reanuda el juego con balón a tierra.", "B": "Anula el gol y reanuda con un tiro libre directo a favor del equipo que no marcó.", "C": "Da por válido el gol, ya que un agente externo no puede motivar su anulación."}, "correcta": "A", "explicacion": "Si la interferencia en la jugada del gol fue causada por un agente externo (y no se produce el supuesto anterior de persona vinculada al equipo anotador), se anulará el gol y se reanudará con balón a tierra.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-065", "bloque": "reglas", "enunciado": "El balón se dirige hacia la portería y una persona no autorizada interfiere, pero esa interferencia no impide que un defensor pudiera haber jugado el balón, y finalmente el balón entra en la portería. ¿Se concede el gol?", "opciones": {"A": "Sí, se concede el gol si el balón entra en la portería, incluso si hubo contacto con el balón, salvo que la interferencia fuera causada por un miembro del equipo atacante.", "B": "No, el gol se anula siempre que haya existido cualquier tipo de interferencia, sea cual sea su origen concreto.", "C": "Sí, pero únicamente si la persona no autorizada no llegó a tocar el balón en ningún momento de la jugada."}, "correcta": "A", "explicacion": "Si el balón va a entrar en la portería y la interferencia no impide que un defensor juegue el balón, se concederá el gol si el balón entra (incluso con contacto), a menos que la interferencia fuese causada por un miembro del equipo atacante.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-066", "bloque": "reglas", "enunciado": "Tras anotarse un gol y antes de reanudarse el juego, el árbitro constata que la persona no autorizada en el terreno de juego era un miembro del cuerpo técnico del equipo que recibió el gol. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Conceder el gol, ordenando además que la persona no autorizada salga del terreno de juego.", "B": "Anular el gol y reanudar con un tiro libre directo a favor del equipo que lo recibió.", "C": "Anular el gol y reanudar con balón a tierra en el punto de la interferencia."}, "correcta": "A", "explicacion": "El árbitro deberá conceder el gol si la persona no autorizada era un jugador, suplente, jugador sustituido, jugador expulsado o miembro del cuerpo técnico del equipo que recibió el gol, ordenando que dicha persona salga del terreno de juego.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-067", "bloque": "reglas", "enunciado": "Se comprueba que había un agente externo en el terreno de juego cuando se marcó un gol, pero dicho agente no interfirió en absoluto en la jugada. ¿Debe anularse el gol?", "opciones": {"A": "No, el árbitro deberá conceder el gol, ya que se trata de un agente externo que no interfirió en el juego.", "B": "Sí, se anula igualmente por la mera presencia de una persona no autorizada en el terreno de juego.", "C": "Depende de si el agente externo estaba más cerca del equipo atacante o del defensor en el momento del gol."}, "correcta": "A", "explicacion": "El árbitro deberá conceder el gol si la persona no autorizada era un agente externo que no interfirió en el juego.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 36}, {"id": "RJ3-068", "bloque": "reglas", "enunciado": "Después de marcarse un gol y ya reanudado el juego, el árbitro constata que había una persona no autorizada en el terreno de juego en el momento del gol, que ya ha abandonado el terreno. ¿Puede anularse el gol en ese momento?", "opciones": {"A": "No, una vez reanudado el juego el gol ya no se podrá anular.", "B": "Sí, el gol se anula siempre que se detecte antes de que finalice esa misma parte del partido.", "C": "Sí, pero solo si la persona no autorizada pertenecía al equipo que marcó el gol."}, "correcta": "A", "explicacion": "Si, después de reanudarse el juego, el árbitro constata que había una persona no autorizada cuando se marcó el gol, este ya no se podrá anular.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 35}, {"id": "RJ3-069", "bloque": "reglas", "enunciado": "Tras reanudarse el juego después de un gol, el árbitro constata que la persona no autorizada seguía todavía en el terreno de juego. ¿Qué debe hacer, dado que el gol ya no puede anularse?", "opciones": {"A": "Detener el juego, ordenar que la persona no autorizada salga del terreno de juego y reanudar con un balón a tierra o un tiro libre, según proceda.", "B": "No adoptar ninguna medida, ya que el gol no puede anularse y la situación queda resuelta sin más trámite.", "C": "Suspender el partido hasta que la persona no autorizada sea identificada y expulsada del recinto deportivo."}, "correcta": "A", "explicacion": "Si la persona no autorizada estuviera todavía en el terreno de juego, el árbitro deberá detener el juego, ordenar que salga del terreno de juego y reanudar con un balón a tierra o un tiro libre, según proceda.", "referencia": "Regla 3 / Gol marcado con una persona no autorizada", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 3", "pagina": 36}, {"id": "RJ3-070", "bloque": "reglas", "enunciado": "¿Qué distintivo debe llevar el capitán del equipo sobre el terreno de juego según la Regla 3?", "opciones": {"A": "Un brazalete para su identificación.", "B": "Un dorsal de color distinto al del resto del equipo.", "C": "Una banda en el pantalón de color contrastado."}, "correcta": "A", "explicacion": "Cada equipo tendrá un capitán sobre el terreno de juego, que llevará un brazalete para su identificación.", "referencia": "Regla 3 / Capitán del equipo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 36}, {"id": "RJ3-071", "bloque": "reglas", "enunciado": "¿Goza el capitán del equipo de alguna categoría especial o privilegio frente al árbitro según la Regla 3?", "opciones": {"A": "No, no goza de categoría especial o privilegio alguno, aunque sí tiene cierto grado de responsabilidad sobre el comportamiento de su equipo.", "B": "Sí, tiene derecho a solicitar la revisión de cualquier decisión arbitral durante el partido.", "C": "Sí, es la única persona autorizada a dirigirse al árbitro en cualquier momento del encuentro."}, "correcta": "A", "explicacion": "El capitán del equipo no gozará de categoría especial o privilegio alguno, pero tendrá cierto grado de responsabilidad en lo concerniente al comportamiento de su equipo.", "referencia": "Regla 3 / Capitán del equipo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 36}, {"id": "RJ3-072", "bloque": "reglas", "enunciado": "¿Qué pueden implantar las competiciones respecto a quién puede acercarse al árbitro durante el partido?", "opciones": {"A": "Pautas para que solo el capitán pueda acercarse al árbitro, conforme a lo previsto en Observaciones y adaptaciones.", "B": "La obligación de que únicamente el entrenador pueda dirigirse al árbitro en cualquier momento.", "C": "La prohibición absoluta de que cualquier jugador se dirija al árbitro durante el partido."}, "correcta": "A", "explicacion": "Las competiciones podrán implantar las pautas para que solo el capitán pueda acercarse al árbitro, contenidas en el apartado de Observaciones y adaptaciones.", "referencia": "Regla 3 / Capitán del equipo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 36}, {"id": "RJ3-073", "bloque": "reglas", "enunciado": "Además de las tres oportunidades de sustitución previstas, ¿pueden los equipos realizar sustituciones adicionales durante el descanso?", "opciones": {"A": "Sí, además de esas tres oportunidades, ambos equipos podrán realizar sustituciones durante el descanso.", "B": "No, las sustituciones realizadas durante el descanso consumen una de las tres oportunidades disponibles.", "C": "No, durante el descanso no está permitido efectuar ninguna sustitución."}, "correcta": "A", "explicacion": "Además de las tres oportunidades de sustitución, los equipos podrán realizar sustituciones durante el descanso, sin que estas consuman ninguna de dichas oportunidades.", "referencia": "Regla 3.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 3", "pagina": 32}, {"id": "RJ3-074", "bloque": "reglas", "enunciado": "El árbitro señala que un equipo puede efectuar una sustitución, pero el balón todavía está en juego en ese momento. ¿Puede el suplente entrar ya al terreno de juego?", "opciones": {"A": "No, el suplente solamente podrá entrar al terreno de juego mientras el juego esté detenido.", "B": "Sí, puede entrar en cualquier momento en cuanto reciba la señal del árbitro, esté el balón en juego o no.", "C": "Sí, siempre que entre por la línea central y no interfiera en la jugada en curso."}, "correcta": "A", "explicacion": "El suplente solamente podrá entrar al terreno de juego mientras el juego esté detenido.", "referencia": "Regla 3.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-075", "bloque": "reglas", "enunciado": "Con el juego detenido, el suplente se dispone a entrar al terreno de juego, pero el jugador al que va a reemplazar todavía no lo ha abandonado. ¿Puede entrar ya el suplente?", "opciones": {"A": "No, el suplente solamente podrá entrar después de que el jugador al que deba reemplazar haya abandonado el terreno de juego.", "B": "Sí, ambos jugadores pueden coincidir brevemente dentro del terreno de juego durante el cambio.", "C": "Sí, siempre que el suplente entre por la línea central, independientemente de si el otro jugador ya ha salido."}, "correcta": "A", "explicacion": "El suplente solamente podrá entrar al terreno de juego después de que el jugador al que deba reemplazar haya abandonado el terreno de juego.", "referencia": "Regla 3.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 34}, {"id": "RJ3-076", "bloque": "reglas", "enunciado": "Se cumplen todas las condiciones para la sustitución (juego detenido, jugador sustituido ya fuera del campo, entrada por la línea central), pero el árbitro todavía no ha dado la señal. ¿Puede el suplente entrar igualmente?", "opciones": {"A": "No, el suplente solamente podrá entrar al terreno de juego tras recibir la señal del árbitro.", "B": "Sí, si el resto de condiciones ya se cumplen, no es necesario esperar ninguna señal adicional del árbitro.", "C": "Sí, siempre que lo autorice el cuarto árbitro en lugar del árbitro principal."}, "correcta": "A", "explicacion": "Entre las condiciones exigidas para que el suplente pueda entrar al terreno de juego se encuentra recibir la señal del árbitro.", "referencia": "Regla 3.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 3", "pagina": 34}, {"id": "RJ4-001", "bloque": "reglas", "enunciado": "Un jugador sale del terreno de juego porque su camiseta está manchada de sangre. ¿En qué condiciones puede regresar al terreno de juego?", "opciones": {"A": "Únicamente cuando el juego esté detenido y lo autorice el árbitro tras revisar su indumentaria un miembro del equipo arbitral.", "B": "Con la sola autorización verbal de su entrenador, sin que sea necesario que el juego esté detenido ni que se revise su indumentaria.", "C": "Automáticamente en cuanto se cambie la camiseta, sin necesidad de revisión de su indumentaria ni de autorización del árbitro."}, "correcta": "A", "explicacion": "El jugador solo puede reingresar con el juego detenido, tras revisión de su indumentaria por un miembro del equipo arbitral y con autorización del árbitro.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-002", "bloque": "reglas", "enunciado": "Un jugador que había salido del terreno de juego para arreglar su camiseta manchada de sangre reingresa sin que el juego esté detenido y sin permiso del árbitro. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Deja que el juego continúe sin más, ya que un jugador puede reingresar en cualquier momento sin permiso, siempre que no interfiera en la jugada.", "B": "Amonesta al jugador y concede tiro libre indirecto en el lugar donde estaba el balón cuando se detiene el juego, salvo interferencia, en cuyo caso será directo o penal desde el lugar de la interferencia.", "C": "Expulsa directamente al jugador por reingresar sin autorización, y reanuda el juego con un tiro libre directo a favor del equipo contrario."}, "correcta": "B", "explicacion": "Reingresar sin autorización conlleva amonestación y tiro libre indirecto donde estaba el balón al detenerse el juego, salvo que hubiera interferencia, que se sanciona con directo o penal desde el lugar de la interferencia.", "referencia": "Regla 3 / Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 4", "pagina": 40}, {"id": "RJ4-003", "bloque": "reglas", "enunciado": "Antes del partido, el delegado local comunica que el capitán llevará un brazalete con los colores de la bandera nacional y la letra 'C'. ¿Qué debe decidir el árbitro?", "opciones": {"A": "Permitirlo si cumple las estipulaciones de la Regla 4 sobre el equipamiento.", "B": "No permitirlo, porque el brazalete solo puede tener un color.", "C": "Permitirlo únicamente si lo autoriza expresamente el reglamento de la competición."}, "correcta": "C", "explicacion": "El uso de brazaletes de capitán con diseños o colores concretos queda sujeto a lo que permita el reglamento de la propia competición.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-004", "bloque": "reglas", "enunciado": "¿Dónde pueden aparecer los eslóganes autorizados, mensajes e imágenes en las prendas deportivas, según la Regla 4?", "opciones": {"A": "Únicamente en el frontal de la camiseta y el pantalón, o en el brazalete.", "B": "Únicamente en el frontal de la camiseta o en el brazalete.", "C": "Únicamente en el frontal del pantalón o en las mangas."}, "correcta": "A", "explicacion": "Los eslóganes, mensajes e imágenes autorizados solo pueden aparecer en el frontal de la camiseta, en el frontal del pantalón o en el brazalete.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-005", "bloque": "reglas", "enunciado": "¿Se permite a los jugadores llevar accesorios de joyería durante un partido?", "opciones": {"A": "Sí, sin restricciones.", "B": "No, está prohibido.", "C": "No, salvo que sean de bisutería."}, "correcta": "B", "explicacion": "La Regla 4 prohíbe a los jugadores llevar cualquier tipo de joyería durante el partido, por motivos de seguridad.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-006", "bloque": "reglas", "enunciado": "Durante la revisión de indumentaria previa al partido, ¿puede el árbitro exigir que se retire un elemento no reglamentario del uniforme?", "opciones": {"A": "Sí, forma parte de sus obligaciones antes del partido inspeccionar la indumentaria de los jugadores.", "B": "No, esa función corresponde exclusivamente al delegado de campo.", "C": "No, la revisión de indumentaria solo puede hacerla el cuarto árbitro."}, "correcta": "A", "explicacion": "Entre las obligaciones del árbitro antes del partido está inspeccionar el terreno, los balones y también verificar que el equipamiento de los jugadores cumple la normativa.", "referencia": "Regla 4 / Regla 5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-007", "bloque": "reglas", "enunciado": "Un jugador sale al terreno de juego con espinilleras que no ofrecen un grado de protección razonable. ¿Qué debe hacer el árbitro?", "opciones": {"A": "No puede intervenir, la elección del equipamiento es libre.", "B": "Debe impedir que el jugador participe hasta que corrija el equipamiento defectuoso.", "C": "Solo puede amonestarlo, pero debe dejarlo jugar."}, "correcta": "B", "explicacion": "El árbitro debe verificar que el equipamiento obligatorio, incluidas las espinilleras, ofrece una protección razonable antes de permitir la participación del jugador.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-008", "bloque": "reglas", "enunciado": "¿Puede un jugador llevar una camiseta interior de un color distinto a la manga principal de la camiseta de juego?", "opciones": {"A": "Sí, sin restricción de color, ya que las Reglas de Juego no regulan el color de las prendas interiores bajo la camiseta.", "B": "Debe coincidir sustancialmente con el color principal de la manga de la camiseta.", "C": "Está prohibida cualquier prenda interior bajo la camiseta, deba o no coincidir su color con el de la manga principal."}, "correcta": "B", "explicacion": "La Regla 4 exige que la camiseta interior coincida, en su color principal, con el color dominante de la manga de la camiseta de juego.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-009", "bloque": "reglas", "enunciado": "¿Puede un jugador jugar con el torso desnudo si pierde la camiseta accidentalmente durante una jugada?", "opciones": {"A": "Sí, puede continuar jugando sin camiseta hasta la siguiente interrupción.", "B": "No, debe detenerse el juego y no puede continuar sin la camiseta correspondiente.", "C": "Sí, siempre que lo autorice el delegado de campo."}, "correcta": "B", "explicacion": "El equipamiento básico obligatorio incluye la camiseta; un jugador no puede continuar en el terreno de juego sin ella.", "referencia": "Regla 4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-010", "bloque": "reglas", "enunciado": "¿Está permitido que un jugador lleve equipamiento u objetos peligrosos durante el partido?", "opciones": {"A": "No, los jugadores no deberán llevar equipamiento ni objetos peligrosos.", "B": "Sí, siempre que el árbitro lo autorice expresamente antes del inicio del partido.", "C": "Sí, siempre que el objeto no supere un determinado tamaño reglamentario."}, "correcta": "A", "explicacion": "Los jugadores no deberán llevar equipamiento ni objetos peligrosos.", "referencia": "Regla 4 / Seguridad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-011", "bloque": "reglas", "enunciado": "Un jugador lleva un accesorio no peligroso pero desea cubrirlo únicamente con cinta adhesiva para evitar quitárselo. ¿Es suficiente esta medida según la Regla 4?", "opciones": {"A": "No, los jugadores tienen la obligación de quitarse las prendas u objetos peligrosos; no basta con cubrirlos con cinta adhesiva ni otros métodos.", "B": "Sí, cubrir el objeto con cinta adhesiva es una alternativa válida a retirarlo por completo del cuerpo.", "C": "Sí, siempre que la cinta adhesiva utilizada sea del mismo color que la prenda que se pretende cubrir."}, "correcta": "A", "explicacion": "No basta con cubrir con cinta adhesiva u otros métodos los objetos peligrosos; el jugador tiene la obligación de quitárselos.", "referencia": "Regla 4 / Seguridad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-012", "bloque": "reglas", "enunciado": "¿En qué momento se debe inspeccionar a los jugadores titulares respecto a su equipamiento?", "opciones": {"A": "Antes del inicio del partido.", "B": "Únicamente durante el descanso del medio tiempo.", "C": "Solo si el árbitro detecta una irregularidad visible durante el juego."}, "correcta": "A", "explicacion": "Se deberá inspeccionar a los jugadores antes del inicio del partido y a los suplentes antes de que entren en el terreno de juego.", "referencia": "Regla 4 / Seguridad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-013", "bloque": "reglas", "enunciado": "Un jugador lleva un accesorio prohibido y no puede o no quiere quitárselo cuando el árbitro se lo ordena. ¿Qué debe indicarle el árbitro?", "opciones": {"A": "Que salga del terreno de juego en la próxima detención del juego.", "B": "Que continúe jugando de todos modos, dejando constancia en el acta del partido.", "C": "Que sea expulsado inmediatamente sin más trámite."}, "correcta": "A", "explicacion": "Si el jugador no puede o no quiere acatar la orden de quitarse el objeto, el árbitro deberá ordenarle que salga del terreno de juego en la próxima detención del juego.", "referencia": "Regla 4 / Seguridad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-014", "bloque": "reglas", "enunciado": "Un jugador se niega a quitarse un objeto peligroso cuando el árbitro se lo ordena, o vuelve a ponérselo tras haberlo retirado. ¿Qué sanción disciplinaria corresponde?", "opciones": {"A": "Deberá ser amonestado, ya que negarse a acatar la orden constituye conducta antideportiva.", "B": "Deberá ser expulsado, al tratarse de una reincidencia equivalente a una segunda amonestación en el mismo partido.", "C": "No corresponde sanción disciplinaria alguna, solo debe salir del terreno."}, "correcta": "A", "explicacion": "Deberá amonestarse a todo jugador que rehúse acatar esta regla o que vuelva a ponerse el objeto o prenda prohibidos.", "referencia": "Regla 4 / Seguridad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-015", "bloque": "reglas", "enunciado": "¿Cuáles son las prendas que componen el equipamiento obligatorio de un jugador según la Regla 4?", "opciones": {"A": "Camiseta con mangas, pantalones cortos, medias, espinilleras y calzado de fútbol.", "B": "Camiseta con o sin mangas, pantalones cortos, medias y calzado de fútbol, sin exigencia de espinilleras.", "C": "Camiseta con mangas, pantalones largos, medias y calzado de fútbol."}, "correcta": "A", "explicacion": "El equipamiento obligatorio se compone de camiseta con mangas, pantalones cortos, medias, espinilleras y calzado de fútbol.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-016", "bloque": "reglas", "enunciado": "Un jugador coloca cinta adhesiva en la parte exterior de sus medias. ¿Qué exige la Regla 4 respecto al color de dicha cinta?", "opciones": {"A": "Que sea del mismo color que la parte de las medias sobre la que se use o que cubra.", "B": "Que sea de color blanco en todos los casos, independientemente del color de las medias.", "C": "Que sea de un color diferente al de las medias, para facilitar su identificación visual."}, "correcta": "A", "explicacion": "Si se coloca cinta adhesiva o cualquier otro material en la parte exterior de las medias, deberá ser del mismo color que la parte de las medias sobre la que se use o que cubra.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-017", "bloque": "reglas", "enunciado": "¿Quién es responsable del tamaño y la adecuación de las espinilleras de un jugador?", "opciones": {"A": "El propio jugador.", "B": "El delegado de campo del equipo.", "C": "El árbitro, en la inspección previa al partido."}, "correcta": "A", "explicacion": "Los jugadores serán responsables del tamaño y la adecuación de sus espinilleras.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id"
