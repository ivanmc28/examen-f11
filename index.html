de juego o de la Regla 12.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-041", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego permanece inmóvil dentro de la portería y obstruye claramente el campo visual del guardameta cuando el balón entra. ¿Qué decide el árbitro?", "opciones": {"A": "No concede gol y sanciona con un tiro libre indirecto por fuera de juego.", "B": "Concede gol y amonesta al atacante, al considerar que la obstrucción visual no invalida el tanto conseguido.", "C": "Concede gol, al estar inmóvil entre los postes y no haber tocado el balón en ningún momento de la jugada."}, "correcta": "A", "explicacion": "El gol se concede salvo que el jugador cometa infracción por fuera de juego o de la Regla 12; obstruir claramente al guardameta es interferir en un adversario.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-042", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego recibe el balón tras un disparo de un compañero que rebota en el poste, sacando ventaja de dicha posición. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, al no haber jugado el balón el compañero.", "B": "Sanciona fuera de juego con un tiro libre indirecto.", "C": "Concede un saque de meta a favor del equipo defensor."}, "correcta": "B", "explicacion": "Se sanciona al jugador en fuera de juego que saca ventaja al jugar el balón que ha rebotado en un poste o travesaño.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-043", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego juega un balón que ha rebotado en un miembro del equipo arbitral tras un disparo de un compañero. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, pues el balón tocó a un árbitro.", "B": "Concede un balón a tierra.", "C": "Sanciona fuera de juego con un tiro libre indirecto."}, "correcta": "C", "explicacion": "Se sanciona al jugador que saca ventaja al jugar o interferir cuando el balón haya rebotado en un miembro del equipo arbitral.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-044", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego recibe el balón tras una salvada del guardameta a un disparo de un compañero, y marca gol. ¿Qué decide el árbitro?", "opciones": {"A": "Anula el gol y sanciona con un tiro libre indirecto por fuera de juego.", "B": "Concede el gol, al haber jugado el balón el guardameta.", "C": "Concede el gol solo si el guardameta lo tocó con las manos."}, "correcta": "A", "explicacion": "El jugador en fuera de juego saca ventaja cuando el balón ha sido salvado por un adversario.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-045", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego recibe el balón de un defensor que lo toca deliberadamente con la mano. ¿Qué decide el árbitro?", "opciones": {"A": "No sanciona fuera de juego, sino la mano voluntaria del defensor.", "B": "Permite que el juego continúe sin sanción.", "C": "Sanciona fuera de juego, por ser previo a la mano."}, "correcta": "A", "explicacion": "Un jugador en fuera de juego no ha sacado ventaja cuando recibe el balón de un adversario que juega voluntariamente el balón, incluida la mano voluntaria.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-046", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego realiza claramente una acción que afecta a la posibilidad de un adversario de jugar el balón. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe si no llega a tocar el balón.", "B": "Concede un tiro libre directo por obstaculizar.", "C": "Sanciona fuera de juego con un tiro libre indirecto."}, "correcta": "C", "explicacion": "Interferir en el juego de un adversario incluye realizar una acción que afecte claramente a su posibilidad de jugar el balón.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-047", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego intenta claramente jugar un balón cercano con una acción que tiene un impacto en un adversario. ¿Qué decide el árbitro?", "opciones": {"A": "Sanciona fuera de juego con un tiro libre indirecto.", "B": "Permite que el juego continúe, pues no disputa el balón.", "C": "Concede un tiro libre directo por juego peligroso."}, "correcta": "A", "explicacion": "Interferir en el juego de un adversario incluye intentar jugar claramente un balón cercano con una acción que tenga impacto en un adversario.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-048", "bloque": "reglas", "enunciado": "Un defensor toca el balón con un contacto ligero por un movimiento instintivo, sin tiempo para coordinar su acción, y el balón llega a un atacante en posición de fuera de juego, que lo juega. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, pues el defensor jugó el balón de forma voluntaria al desviarlo hacia el atacante.", "B": "Sanciona fuera de juego, pues no se considera que el defensor haya jugado voluntariamente el balón.", "C": "Concede un balón a tierra, al no poder determinarse con claridad si el defensor jugó o no el balón de forma voluntaria."}, "correcta": "B", "explicacion": "Un contacto ligero o instintivo, sin tiempo de coordinación, no es una acción voluntaria del defensor.", "referencia": "Regla 11.2 / Voluntariedad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-049", "bloque": "reglas", "enunciado": "Un balón llega desde lejos, a poca velocidad y con trayectoria previsible, y un defensor lo despeja de forma imprecisa hacia un atacante en posición de fuera de juego. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un balón a tierra.", "B": "Sanciona fuera de juego, al ser un despeje impreciso.", "C": "Permite que el juego continúe, pues el defensor jugó voluntariamente el balón."}, "correcta": "C", "explicacion": "La imprecisión del despeje no invalida la voluntariedad; los criterios indican que el defensor tenía posibilidad de controlar el balón.", "referencia": "Regla 11.2 / Voluntariedad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-050", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego es objeto de una falta cuando ya estaba jugando o intentando jugar el balón. ¿Qué infracción se penaliza?", "opciones": {"A": "Ninguna de las dos, se reanuda con balón a tierra.", "B": "La infracción por fuera de juego, por ser previa a la falta.", "C": "La falta cometida contra el jugador en fuera de juego."}, "correcta": "B", "explicacion": "Si se comete una infracción contra un jugador en fuera de juego que ya está jugando o intentando jugar el balón, se penaliza el fuera de juego.", "referencia": "Regla 11.2 / Interferencia", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-051", "bloque": "reglas", "enunciado": "¿Qué momento se tiene en cuenta para determinar la posición de fuera de juego de un jugador?", "opciones": {"A": "El momento en que el balón sale del pie del compañero, según el último punto de contacto.", "B": "El momento en que el balón toca o es jugado por un compañero, según el primer punto de contacto.", "C": "El momento en que el jugador recibe el balón de su compañero."}, "correcta": "B", "explicacion": "Únicamente se sanciona la posición del jugador en el momento en que el balón toca o es jugado por un compañero, teniendo en cuenta el primer punto de contacto.", "referencia": "Regla 11.2 / Infracción por fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-052", "bloque": "reglas", "enunciado": "Un atacante en posición de fuera de juego interfiere en el juego dentro del área de meta del equipo defensor. ¿Desde dónde ejecuta el equipo defensor el tiro libre indirecto?", "opciones": {"A": "Desde cualquier punto del área de meta.", "B": "Únicamente desde el lugar exacto de la infracción.", "C": "Desde el punto más cercano de la línea del área de meta paralela a la línea de meta."}, "correcta": "A", "explicacion": "Los tiros libres a favor del equipo defensor en su área de meta pueden ejecutarse desde cualquier punto de dicha área.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 61}, {"id": "RJ12-001", "bloque": "reglas", "enunciado": "Dos jugadores de equipos distintos cometen una infracción simultánea entre ellos con el balón en juego. ¿Con qué criterios decide el árbitro cuál sancionar?", "opciones": {"A": "En función de la sanción, la reanudación, la gravedad física y las repercusiones tácticas.", "B": "Únicamente en función de quién tocó el balón primero.", "C": "Sancionará siempre al jugador visitante por criterio de prudencia."}, "correcta": "A", "explicacion": "Ante infracciones simultáneas, el árbitro sanciona la más grave atendiendo a sanción, reanudación, gravedad física y repercusiones tácticas.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-002", "bloque": "reglas", "enunciado": "Un jugador sale del terreno de juego con la intención de agredir a un espectador. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Expulsarlo y reanudar con balón a tierra donde se encontraba el balón.", "B": "Expulsarlo y reanudar con tiro libre indirecto sobre la línea de demarcación por donde abandonó el terreno de juego.", "C": "Expulsarlo y reanudar con tiro libre indirecto donde se encontraba el balón."}, "correcta": "B", "explicacion": "La conducta violenta fuera del terreno de juego se sanciona con expulsión y reanudación mediante tiro libre indirecto en la línea de demarcación por donde salió el jugador.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-003", "bloque": "reglas", "enunciado": "Un jugador que se encuentra fuera del terreno de juego recibiendo atención médica da una patada con fuerza excesiva a un miembro del cuerpo técnico de su propio equipo, mientras el balón está en juego. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Tiro libre indirecto a favor del equipo adversario desde la línea de demarcación más cercana, y expulsión.", "B": "Tiro libre directo o penal a favor del equipo adversario desde la línea de demarcación más cercana, y expulsión.", "C": "Balón a tierra a favor del equipo adversario desde la línea de demarcación más cercana, y expulsión."}, "correcta": "B", "explicacion": "La conducta violenta fuera del terreno de juego contra cualquier persona, con el balón en juego, se sanciona con expulsión y tiro libre directo o penal desde el punto de la línea de demarcación más próximo al lugar de la infracción.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 71}, {"id": "RJ12-004", "bloque": "reglas", "enunciado": "En los últimos minutos de partido, el guardameta controla el balón con las manos durante más de 8 segundos por tercera vez consecutiva, sin que el árbitro hubiera indicado previamente la cuenta atrás con el brazo levantado. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Deja que el juego continúe, al tratarse de un error del propio equipo arbitral.", "B": "Decreta saque de esquina y advierte al portero, sin amonestar.", "C": "Decreta saque de esquina y amonesta al portero por retrasar la reanudación del juego."}, "correcta": "B", "explicacion": "Si el árbitro no ha realizado el procedimiento de cuenta atrás visible, corresponde conceder el saque de esquina sin amonestación, limitándose a advertir al guardameta, dado el fallo del propio equipo arbitral en el procedimiento.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-005", "bloque": "reglas", "enunciado": "Un guardameta, presionado por un adversario tras una cesión voluntaria de un compañero, comete una pifia al intentar despejar el balón con el pie y termina cogiéndolo con las manos. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto en contra del equipo del guardameta, desde el lugar donde coge el balón con las manos.", "B": "Concede tiro penal y expulsa al guardameta por evitar una ocasión manifiesta de gol.", "C": "Deja que el juego continúe, al no cometerse ninguna infracción."}, "correcta": "A", "explicacion": "Tras una cesión voluntaria de un compañero, coger el balón con las manos constituye infracción, sancionable con tiro libre indirecto desde el lugar donde se produce, sin sanción disciplinaria adicional en este supuesto.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-006", "bloque": "reglas", "enunciado": "Dos jugadores del mismo equipo se golpean entre sí con fuerza excesiva mientras el balón está en juego, sin que exista disputa por el balón. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Detiene el juego, expulsa a ambos por juego brusco grave y reanuda con tiro libre directo a favor del equipo adversario.", "B": "Detiene el juego, expulsa a ambos por conducta violenta y reanuda con tiro libre directo o penal a favor del adversario en el lugar de la infracción.", "C": "Detiene el juego, expulsa a ambos por conducta violenta y reanuda con tiro libre indirecto a favor del adversario en el lugar de la infracción."}, "correcta": "B", "explicacion": "Golpearse entre compañeros con fuerza excesiva sin disputa del balón se califica como conducta violenta, sancionándose con expulsión de ambos y tiro libre directo o penal (si procede) a favor del adversario.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-007", "bloque": "reglas", "enunciado": "Un jugador realiza un pase a un compañero que está en posición de fuera de juego; un adversario intercepta el pase golpeando el balón con la mano de forma intencionada, desviando su trayectoria. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Sanciona la mano y amonesta al defensor por evitar un ataque prometedor.", "B": "Sanciona la mano y no toma medida disciplinaria contra el defensor.", "C": "Sanciona el fuera de juego, por ser previo a la infracción de mano."}, "correcta": "B", "explicacion": "Al ser el jugador atacante beneficiario del pase quien estaba en posición de fuera de juego, la mano intencionada del defensor se sanciona sin necesidad de medida disciplinaria adicional en este supuesto concreto.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-008", "bloque": "reglas", "enunciado": "¿Puede el capitán de un equipo protestar oficialmente una decisión del árbitro?", "opciones": {"A": "No, ni el capitán ni ningún otro jugador tienen derecho a protestar una decisión del árbitro.", "B": "Sí, si considera que hay un error claro, puede pedir que se rectifique.", "C": "Sí, tiene autoridad para exigir explicación de cada decisión."}, "correcta": "A", "explicacion": "Ningún jugador, ni siquiera el capitán, tiene derecho reglamentario a protestar las decisiones del árbitro, sin perjuicio del respeto debido.", "referencia": "Regla 5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-009", "bloque": "reglas", "enunciado": "Un jugador sufre una entrada temeraria que conlleva amonestación al infractor; un compañero del jugador afectado ejecuta rápidamente el tiro libre para ganar ventaja, existiendo una clara ocasión de gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "No permite la reanudación hasta hacer sonar el silbato después de amonestar.", "B": "Permite la reanudación rápida por existir clara ocasión de gol, y amonesta al infractor en la siguiente interrupción.", "C": "Permite la reanudación rápida y no amonesta después, por haberse beneficiado ya de la ventaja."}, "correcta": "B", "explicacion": "Ante una clara ocasión de gol y sin haber iniciado el procedimiento de tarjeta, el árbitro puede aplicar ventaja permitiendo la reanudación rápida, y amonestar igualmente al infractor en la siguiente interrupción.", "referencia": "Regla 5 / Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-010", "bloque": "reglas", "enunciado": "En los últimos minutos del partido, el guardameta controla el balón con las manos durante más de 8 segundos, habiendo sido correctamente avisado con la cuenta atrás del árbitro. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Tiro libre indirecto a favor del equipo contrario, con amonestación al guardameta.", "B": "Saque de esquina, sin amonestación.", "C": "Saque de esquina, con amonestación al guardameta por retrasar la puesta en juego."}, "correcta": "C", "explicacion": "Si se supera el tiempo permitido tras el aviso correcto de cuenta atrás, se concede saque de esquina y se amonesta al guardameta por retrasar la reanudación del juego.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-011", "bloque": "reglas", "enunciado": "Un jugador insulta a otro jugador, al árbitro, a un asistente o al cuarto árbitro, con el balón en juego y dentro del terreno de juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con tiro libre directo o penal donde se cometió la infracción.", "B": "Con tiro libre indirecto donde estaba el balón cuando se detuvo el juego.", "C": "Con tiro libre indirecto donde se cometió la infracción."}, "correcta": "C", "explicacion": "El lenguaje ofensivo, injurioso o insultante se sanciona con tiro libre indirecto en el lugar donde se cometió la infracción, junto a la expulsión correspondiente.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-012", "bloque": "reglas", "enunciado": "Durante una tanda de penaltis, un guardameta ya amonestado en el tiempo reglamentario se encara con el lanzador adversario, sin llegar al insulto ni a la amenaza. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Amonesta al guardameta por segunda vez y lo expulsa en consecuencia, al conservarse la amonestación previa del tiempo reglamentario.", "B": "Amonesta al guardameta sin expulsarlo, ya que las amonestaciones previas a la tanda se eliminan.", "C": "Expulsa directamente al guardameta, al considerarse su actitud como conducta violenta durante la tanda de penaltis."}, "correcta": "B", "explicacion": "Al iniciarse la tanda de penaltis, las amonestaciones del tiempo reglamentario y prórroga se eliminan a efectos de doble amonestación durante la propia tanda.", "referencia": "Regla 12 / Anexo tandas de penaltis", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-013", "bloque": "reglas", "enunciado": "Un jugador con el balón, siendo sujetado por un adversario, consigue pasar el balón a un compañero que continúa el ataque. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Detiene el juego y amonesta al defensor por conducta antideportiva.", "B": "Deja que el juego continúe y debe amonestar obligatoriamente al defensor en la siguiente interrupción.", "C": "Deja que el juego continúe y, en la siguiente interrupción, amonesta o no según la gravedad, sin obligación automática."}, "correcta": "C", "explicacion": "Si el ataque continúa pese a la sujeción, se aplica ventaja y, en la siguiente interrupción, el árbitro decide si amonesta según la gravedad de la infracción, sin ser obligatorio automáticamente.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-014", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador agrede físicamente al árbitro. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Tiro libre indirecto donde se produjo la agresión, y expulsión.", "B": "Tiro libre directo o penal, y expulsión.", "C": "Tiro libre indirecto donde estaba el balón al detenerse el juego, y amonestación."}, "correcta": "B", "explicacion": "Agredir al árbitro constituye conducta violenta grave, sancionada con expulsión y tiro libre directo o penal según el lugar de la infracción.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-015", "bloque": "reglas", "enunciado": "¿Contra quién puede cometerse conducta violenta según las Reglas de Juego?", "opciones": {"A": "Contra cualquier persona, si se emplea fuerza excesiva o brutalidad y no hay disputa del balón.", "B": "Únicamente contra jugadores contrarios, cuando no hay disputa del balón.", "C": "Únicamente contra jugadores contrarios, haya o no disputa del balón, y contra el resto de personas en cualquier momento."}, "correcta": "C", "explicacion": "La conducta violenta puede cometerse contra un adversario o compañero con o sin disputa del balón, y contra cualquier otra persona en cualquier momento del partido.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-016", "bloque": "reglas", "enunciado": "Un defensor comete una entrada con exceso de fuerza sobre un rival, intentando disputarle el balón, sin intención de lesionar pero poniendo en peligro su integridad, dentro del área. ¿Qué tipo de infracción es y cómo se sanciona con carácter general?", "opciones": {"A": "Juego brusco grave: expulsión y tiro penal.", "B": "Conducta antideportiva: amonestación y tiro libre indirecto.", "C": "Falta simple: solo tiro libre directo, sin sanción disciplinaria."}, "correcta": "A", "explicacion": "Una entrada con exceso de fuerza que pone en peligro la integridad del rival, aunque sea disputando el balón, se califica como juego brusco grave: expulsión y, si es dentro del área, tiro penal.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-017", "bloque": "reglas", "enunciado": "Un jugador simula una falta dentro del área para intentar engañar al árbitro y conseguir un tiro penal injustificado. ¿Qué sanción corresponde?", "opciones": {"A": "Amonestación por conducta antideportiva (simulación) y tiro libre indirecto a favor del equipo contrario.", "B": "Expulsión directa por conducta violenta, al considerarse la simulación una falta de extrema gravedad contra el árbitro.", "C": "No existe sanción específica para la simulación, por lo que el árbitro debe dejar que el juego continúe con normalidad."}, "correcta": "A", "explicacion": "La simulación de una falta o incidente para engañar al árbitro se sanciona como conducta antideportiva: amonestación y tiro libre indirecto a favor del equipo contrario en el lugar de la simulación.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-018", "bloque": "reglas", "enunciado": "Un jugador celebra un gol quitándose la camiseta. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Ninguna sanción, es una celebración habitual que no está contemplada como infracción en la Regla 12.", "B": "Amonestarlo por conducta antideportiva.", "C": "Expulsarlo directamente, al equiparar quitarse la camiseta con una conducta violenta hacia el árbitro."}, "correcta": "B", "explicacion": "Quitarse la camiseta al celebrar un gol está tipificado como conducta sancionable con amonestación.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-019", "bloque": "reglas", "enunciado": "Un jugador celebra un gol adentrándose en la zona de espectadores de forma no violenta ni provocadora. ¿Debe ser amonestado?", "opciones": {"A": "Sí, siempre que salga del terreno de juego para celebrar, con independencia de la duración o la actitud mostrada.", "B": "No necesariamente; salir del terreno de juego para celebrar un gol no conlleva amonestación automática si no hay conducta provocadora o excesiva demora.", "C": "Sí, cualquier salida del terreno de juego se sanciona con amonestación obligatoria, aunque no haya provocación ni demora."}, "correcta": "B", "explicacion": "La normativa no exige amonestar automáticamente por salir a celebrar un gol; se sanciona cuando hay demora excesiva, provocación o entra en conflicto con el público.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-020", "bloque": "reglas", "enunciado": "Un jugador impide deliberadamente que el balón entre en su propia portería mediante una mano, evitando un gol prácticamente seguro. ¿Cómo se sanciona?", "opciones": {"A": "Tiro penal y expulsión por evitar un gol mediante infracción sancionable con tiro libre o penal.", "B": "Tiro libre indirecto y amonestación, al tratarse de una infracción cometida dentro de la propia área penal del infractor.", "C": "Solo tiro penal, sin sanción disciplinaria, al entender que se trata de una acción instintiva de defensa de la portería."}, "correcta": "A", "explicacion": "Impedir con la mano de forma deliberada un gol prácticamente seguro se sanciona con tiro penal (si es dentro del área) y expulsión.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-021", "bloque": "reglas", "enunciado": "Un jugador realiza una entrada por detrás sobre un rival sin ninguna posibilidad de jugar el balón, con fuerza moderada. ¿Cómo se califica normalmente esta conducta?", "opciones": {"A": "Falta simple sancionable con tiro libre directo, con o sin amonestación según la intensidad.", "B": "Siempre conducta violenta con expulsión automática.", "C": "No es sancionable si el balón ya no estaba cerca del jugador."}, "correcta": "A", "explicacion": "Una entrada sin opción al balón se sanciona como falta directa, pudiendo conllevar amonestación (imprudencia) o expulsión (temeridad o fuerza excesiva) según la intensidad empleada.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-022", "bloque": "reglas", "enunciado": "¿Qué diferencia, según la graduación habitual de las faltas, a una entrada 'imprudente' de una entrada 'con fuerza excesiva o brutalidad'?", "opciones": {"A": "No hay diferencia; ambas se sancionan igual con amonestación.", "B": "La imprudencia se amonesta; la fuerza excesiva o brutalidad conlleva expulsión.", "C": "La imprudencia conlleva expulsión y la fuerza excesiva solo amonestación."}, "correcta": "B", "explicacion": "La graduación de la intensidad de las infracciones distingue la imprudencia (amonestación) de la fuerza excesiva o brutalidad (expulsión, ya sea juego brusco grave o conducta violenta).", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-023", "bloque": "reglas", "enunciado": "Un jugador escupe a un adversario durante el partido, con el balón en juego. ¿Cómo se sanciona esta conducta?", "opciones": {"A": "Amonestación por conducta antideportiva, al no considerarse la acción de escupir lo suficientemente grave para expulsar.", "B": "Expulsión por conducta violenta y tiro libre directo o penal donde se cometió la infracción.", "C": "No es sancionable si no hay contacto físico directo, ya que la acción de escupir exige que el jugador llegue a alcanzar al adversario."}, "correcta": "B", "explicacion": "Escupir a otra persona se considera conducta violenta y se sanciona con expulsión, además del tiro libre directo o penal correspondiente al lugar de la infracción.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-024", "bloque": "reglas", "enunciado": "Un jugador hace un gesto de burla claramente provocador hacia la afición rival tras marcar un gol, sin llegar a insultar. ¿Debe ser amonestado?", "opciones": {"A": "No, los gestos de celebración están siempre permitidos.", "B": "Sí, los gestos provocadores hacia el público se sancionan con amonestación por conducta antideportiva.", "C": "Solo se sanciona si hay contacto físico con algún espectador."}, "correcta": "B", "explicacion": "Los gestos provocadores dirigidos a la afición, aunque no lleguen al insulto explícito, se sancionan con amonestación por conducta antideportiva.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-025", "bloque": "reglas", "enunciado": "Un jugador retiene con las manos a un adversario que lleva el balón, impidiéndole avanzar, sin que llegue a perder el control del balón. ¿Cómo se sanciona esta acción?", "opciones": {"A": "No es sancionable si el atacante conserva el control del balón, ya que la retención sin pérdida de balón no constituye infracción.", "B": "Se sanciona con tiro libre directo (o penal si es en el área) por retención, con posible amonestación según la interferencia con una ocasión clara.", "C": "Se sanciona únicamente con tiro libre indirecto, con independencia del lugar del terreno donde se produzca la retención."}, "correcta": "B", "explicacion": "Retener a un adversario con las manos constituye infracción sancionable con tiro libre directo o penal, e incluso amonestación o expulsión si impide una ocasión clara de gol.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-026", "bloque": "reglas", "enunciado": "Un jugador hace uso de un lenguaje o gestos ofensivos, injuriosos o groseros hacia el público, sin dirigirse a ninguna persona en concreto. ¿Qué decisión toma el árbitro?", "opciones": {"A": "No es sancionable si no hay un destinatario concreto.", "B": "Expulsión y reanudación según el lugar donde se produjo la conducta.", "C": "Solo un aviso verbal sin sanción disciplinaria."}, "correcta": "B", "explicacion": "El uso de lenguaje o gestos ofensivos, injuriosos o groseros se sanciona con expulsión, independientemente de que el destinatario sea una persona concreta o el público en general.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-027", "bloque": "reglas", "enunciado": "Un jugador recibe una segunda amonestación en el mismo partido. ¿Qué consecuencia tiene?", "opciones": {"A": "Ninguna adicional, se limita a la segunda tarjeta amarilla mostrada.", "B": "Expulsión automática por doble amonestación.", "C": "Solo se le aplica una sanción económica, sin expulsión."}, "correcta": "B", "explicacion": "La segunda amonestación en el mismo partido conlleva la expulsión automática del jugador (tarjeta amarilla-roja).", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-028", "bloque": "reglas", "enunciado": "Un jugador de campo, tras convertirse en guardameta mediante un cambio autorizado por el árbitro, toca el balón con la mano dentro de su propia área. ¿Es sancionable?", "opciones": {"A": "No, si el cambio de guardameta fue debidamente comunicado y autorizado.", "B": "Sí, siempre es sancionable con independencia de la autorización.", "C": "Solo es sancionable si el cambio se hizo en la segunda parte."}, "correcta": "A", "explicacion": "Si el cambio de guardameta se comunica y autoriza correctamente por el árbitro, el nuevo guardameta puede usar las manos dentro de su área sin infracción.", "referencia": "Regla 3 / Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-029", "bloque": "reglas", "enunciado": "Un jugador impide con la mano, de forma no deliberada pero haciéndose el cuerpo más grande de manera antinatural, que el balón llegue a un rival en una ocasión clara. ¿Cómo se valora esta acción según el criterio de manos?", "opciones": {"A": "No es sancionable si no hay intención deliberada bajo ningún concepto, aunque el cuerpo ocupe más espacio de forma antinatural.", "B": "Puede sancionarse como mano si el jugador hace que su cuerpo ocupe más espacio de forma antinatural, aunque no haya intención de tocar el balón.", "C": "Solo se sanciona si el jugador es el guardameta, ya que el resto de jugadores no están sujetos a este criterio de manos."}, "correcta": "B", "explicacion": "El criterio de manos sanciona también cuando el jugador hace que su cuerpo sea más grande de forma antinatural, incluso sin intención deliberada de tocar el balón.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-030", "bloque": "reglas", "enunciado": "¿Se sanciona como mano el toque del balón con el brazo pegado de forma natural al cuerpo durante un movimiento normal?", "opciones": {"A": "Sí, siempre que el balón toque el brazo se sanciona.", "B": "No necesariamente; se atiende a si la posición del brazo es natural para ese movimiento concreto.", "C": "Solo se sanciona si el brazo está por debajo del hombro."}, "correcta": "B", "explicacion": "El criterio de manos exige valorar si la posición del brazo es consecuencia natural del movimiento del jugador, no sancionándose automáticamente por el mero contacto.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-031", "bloque": "reglas", "enunciado": "Según la Regla 12.1, ¿cuál de las siguientes acciones NO figura entre las faltas que se sancionan con libre directo cuando se cometen de manera imprudente, temeraria o con fuerza excesiva?", "opciones": {"A": "Saltar encima de un adversario, siempre que se realice con la intención clara de disputar el balón en disputa aérea.", "B": "Golpear a un adversario o intentarlo, cabezazos incluidos, aunque se produzca sin contacto directo con el rival.", "C": "Obstaculizar el avance de un adversario cuando el balón no está a distancia de juego."}, "correcta": "C", "explicacion": "La lista de la Regla 12.1 es: cargar, saltar encima, dar una patada o intentarlo, empujar, golpear o intentarlo, hacer una entrada o disputar el balón y poner la zancadilla o intentarlo. Obstaculizar sin contacto se castiga con libre indirecto.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-032", "bloque": "reglas", "enunciado": "¿Cuál de las siguientes definiciones corresponde a una acción «imprudente»?", "opciones": {"A": "Aquella que entraña daño físico, no necesariamente grave, sin tener en cuenta el riesgo o las consecuencias para el adversario.", "B": "Aquella en la que el jugador se excede en la fuerza y la impetuosidad empleadas o pone en peligro la integridad física del adversario.", "C": "Aquella en la que el jugador muestra falta de atención o de consideración o actúa sin precaución al disputar un balón a un adversario."}, "correcta": "C", "explicacion": "«Imprudente» es la acción en la que se muestra falta de atención o de consideración, o se actúa sin precaución al disputar un balón. No será necesaria una sanción disciplinaria.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-033", "bloque": "reglas", "enunciado": "¿Cuál de las siguientes definiciones corresponde a una acción «temeraria»?", "opciones": {"A": "Aquella en la que el jugador actúa sin precaución al disputar un balón, sin que exista necesidad de sanción disciplinaria.", "B": "Aquella en la que el jugador realiza una acción que entraña daño físico, no necesariamente grave, sin tener en cuenta el riesgo o las consecuencias para su adversario.", "C": "Aquella en la que el jugador emplea fuerza excesiva o pone en peligro la integridad física de su adversario."}, "correcta": "B", "explicacion": "«Temeraria» es la acción que entraña daño físico (no necesariamente grave) sin tener en cuenta el riesgo o las consecuencias para el adversario, por lo que el jugador deberá ser amonestado.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-034", "bloque": "reglas", "enunciado": "Según la Regla 12.1, ¿qué medida disciplinaria corresponde a una falta cometida «con el uso de una fuerza excesiva»?", "opciones": {"A": "La expulsión del jugador.", "B": "La amonestación del jugador.", "C": "Ninguna sanción disciplinaria si el balón estaba a distancia de juego."}, "correcta": "A", "explicacion": "«Con uso de fuerza excesiva» es la acción en la que el jugador se excede en la fuerza y la impetuosidad empleada o pone en peligro la integridad física del adversario, por lo que deberá ser expulsado.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-035", "bloque": "reglas", "enunciado": "Un defensor llega tarde a un balón dividido y derriba a un atacante actuando sin precaución, pero sin excederse en la fuerza ni entrañar daño físico. ¿Cómo se califica y qué decide el árbitro?", "opciones": {"A": "Falta temeraria: concede libre directo y amonesta al defensor.", "B": "Falta con fuerza excesiva: concede libre directo y expulsa al defensor.", "C": "Falta imprudente: concede libre directo sin sanción disciplinaria."}, "correcta": "C", "explicacion": "Una acción en la que el jugador actúa sin precaución al disputar el balón es imprudente y se castiga con libre directo, sin que sea necesaria una sanción disciplinaria.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-036", "bloque": "reglas", "enunciado": "Un jugador realiza una entrada sobre un rival sin tener en cuenta el riesgo para él, con posibilidad de causarle daño físico, aunque sin excederse en la fuerza. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre directo (o penal si fue en su área) y amonesta al jugador por conducta antideportiva.", "B": "Concede libre directo (o penal si fue en su área) sin sanción disciplinaria.", "C": "Concede libre directo (o penal si fue en su área) y expulsa al jugador por juego brusco y grave."}, "correcta": "A", "explicacion": "Cometer de manera temeraria una infracción sancionable con libre directo es conducta antideportiva y se amonesta al infractor.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-037", "bloque": "reglas", "enunciado": "Un jugador, en la disputa del balón, entra a un adversario con las dos piernas por delante, a la altura de la rodilla y con los tacos en alto, poniendo en peligro su integridad física. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre directo (o penal) y amonesta al jugador por conducta antideportiva.", "B": "Concede libre directo (o penal) y expulsa al jugador por juego brusco y grave.", "C": "Concede libre directo (o penal) y advierte verbalmente al jugador."}, "correcta": "B", "explicacion": "Las entradas que ponen en peligro la integridad física del adversario o en las que el jugador emplea fuerza excesiva o brutalidad se sancionan como juego brusco y grave (expulsión).", "referencia": "Regla 12.1 y 12.4 / Juego brusco y grave", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-038", "bloque": "reglas", "enunciado": "Un jugador intenta dar una patada a un adversario de manera imprudente, pero este la esquiva y no llega a producirse contacto. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo, ya que intentar dar una patada figura entre las faltas sancionables.", "B": "Concede libre indirecto, al no existir contacto físico.", "C": "Deja seguir el juego, al no haberse producido contacto."}, "correcta": "A", "explicacion": "La Regla 12.1 incluye «dar una patada o intentarlo»: el intento de infracción también se sanciona con libre directo aunque no haya contacto.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-039", "bloque": "reglas", "enunciado": "Un jugador intenta poner la zancadilla a un adversario que lleva el balón, pero no lo consigue y el adversario continúa su jugada. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre directo (o aplica ventaja si procede), porque intentar poner la zancadilla es falta.", "B": "Deja seguir el juego, porque sin contacto entre los jugadores no puede sancionarse ninguna infracción por zancadilla.", "C": "Concede libre indirecto por juego peligroso, al no haberse producido contacto físico entre ambos jugadores."}, "correcta": "A", "explicacion": "Poner la zancadilla o intentarlo figura entre las faltas sancionables con libre directo.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-040", "bloque": "reglas", "enunciado": "En una disputa por el balón, un jugador salta encima de un adversario de manera imprudente. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un libre indirecto, por tratarse de una falta sin balón.", "B": "Con un libre directo (o un penal si la infracción fue en el área del infractor).", "C": "Con un balón a tierra, por producirse en una disputa."}, "correcta": "B", "explicacion": "Saltar encima de un adversario de manera imprudente, temeraria o con fuerza excesiva se castiga con libre directo, o con penal si se comete en el área del infractor.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-041", "bloque": "reglas", "enunciado": "Un jugador empuja de manera imprudente a un adversario dentro del terreno de juego, con el balón en juego, y sin que exista ocasión manifiesta de gol. ¿Qué decisión adopta el árbitro?", "opciones": {"A": "Concede libre indirecto y amonesta al jugador.", "B": "Concede libre directo y amonesta siempre al jugador.", "C": "Concede libre directo y no adopta medida disciplinaria."}, "correcta": "C", "explicacion": "Empujar de manera imprudente es falta sancionable con libre directo; la imprudencia no requiere sanción disciplinaria.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-042", "bloque": "reglas", "enunciado": "Según la Regla 12.1, ¿cómo se penaliza una falta cometida por un jugador que implique contacto físico?", "opciones": {"A": "Con un libre indirecto.", "B": "Con un libre directo solo si el árbitro aprecia fuerza excesiva.", "C": "Con un libre directo."}, "correcta": "C", "explicacion": "La Regla 12.1 establece que, en caso de que la falta cometida implique contacto físico, se penalizará con un libre directo.", "referencia": "Regla 12.1 / Faltas sancionables con libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-043", "bloque": "reglas", "enunciado": "Un defensor agarra por la camiseta a un delantero fuera del área penal para impedir que se gire, sin que exista ocasión manifiesta de gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre indirecto.", "B": "Concede balón a tierra.", "C": "Concede libre directo."}, "correcta": "C", "explicacion": "Sujetar a un adversario se sanciona con libre directo (o penal si ocurre dentro del área del infractor).", "referencia": "Regla 12.1 / Sujetar a un adversario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-044", "bloque": "reglas", "enunciado": "Un defensor comienza a sujetar a un adversario fuera del área penal y continúa sujetándolo cuando ambos entran dentro de la misma. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Señala tiro penal.", "B": "Concede libre directo en el punto donde comenzó la sujeción.", "C": "Concede libre indirecto a la entrada del área."}, "correcta": "A", "explicacion": "Si un defensor comienza a sujetar a un adversario fuera del área y continúa sujetándolo dentro de ella, el árbitro señalará tiro penal.", "referencia": "Regla 12.4 / Ventaja y sujeción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-045", "bloque": "reglas", "enunciado": "Un jugador se interpone en el camino de un adversario y llega a obstaculizarlo mediante contacto físico cuando el balón no está a distancia de juego. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre directo.", "B": "Concede libre indirecto.", "C": "Deja seguir el juego, porque el balón no está a distancia de juego."}, "correcta": "A", "explicacion": "Obstaculizar a un adversario mediante contacto físico es falta sancionable con libre directo; sin contacto físico sería libre indirecto.", "referencia": "Regla 12.1 / Obstaculizar mediante contacto físico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-046", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador situado en el terreno de juego escupe a un suplente del equipo rival que calienta junto a la línea de banda. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto donde se encontraba el balón y amonesta al jugador.", "B": "Concede balón a tierra y expulsa al jugador.", "C": "Concede libre directo desde el punto de la línea de demarcación más cercano y expulsa al jugador."}, "correcta": "C", "explicacion": "Escupir a alguien que figura en las listas de los equipos se sanciona con libre directo y expulsión; si la víctima está fuera del campo, se ejecuta desde el punto de la línea de demarcación más cercano a la infracción.", "referencia": "Regla 12.1 y 12.5 / Escupir o morder", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-047", "bloque": "reglas", "enunciado": "Según la Regla 12.1, ¿a quién debe alcanzar la acción de morder o escupir para sancionarse con libre directo?", "opciones": {"A": "Únicamente a un jugador del equipo adversario, sin que la infracción se extienda a ningún otro miembro del equipo.", "B": "Únicamente a un miembro del equipo arbitral, sin que la infracción alcance a jugadores ni suplentes de ningún equipo.", "C": "A alguien que figure en las listas de los equipos o sea miembro del equipo arbitral."}, "correcta": "C", "explicacion": "La Regla 12.1 recoge morder o escupir a alguien que figure en las listas de los equipos o sea miembro del equipo arbitral.", "referencia": "Regla 12.1 / Escupir o morder", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-048", "bloque": "reglas", "enunciado": "Un jugador lanza su bota contra el balón en juego para desviarlo de su trayectoria. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre indirecto desde el lugar donde se encontraba el jugador.", "B": "Con balón a tierra en el lugar donde el objeto golpeó el balón.", "C": "Con libre directo desde el lugar donde el objeto golpeó o habría golpeado el balón."}, "correcta": "C", "explicacion": "Lanzar un objeto contra el balón se castiga con libre directo desde el lugar donde el objeto golpeó o habría golpeado el balón (penal si es dentro del área del infractor).", "referencia": "Regla 12.1 y 12.5 / Lanzar un objeto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-049", "bloque": "reglas", "enunciado": "Un jugador golpea el balón con una espinillera que sostiene en la mano. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un libre directo o un tiro penal, según dónde se cometa.", "B": "Con un libre indirecto desde el lugar del contacto.", "C": "Con un balón a tierra, al no tratarse de una parte del cuerpo."}, "correcta": "A", "explicacion": "Si un jugador contacta con el balón con un objeto que lleva en la mano (bota, espinillera, etc.), se reanuda con libre directo o penal.", "referencia": "Regla 12.5 / Objeto en la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-050", "bloque": "reglas", "enunciado": "A efectos de determinar las infracciones por mano, ¿dónde se sitúa el límite superior del brazo?", "opciones": {"A": "En el punto inferior de la axila.", "B": "En la línea del hombro.", "C": "En la mitad del bíceps."}, "correcta": "A", "explicacion": "Para determinar con claridad las infracciones por mano, el límite superior del brazo coincide con el punto inferior de la axila.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-051", "bloque": "reglas", "enunciado": "Un defensor gira el cuerpo y mueve el brazo en dirección al balón para desviar un centro, dentro de su propia área, sin que exista ocasión manifiesta de gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre indirecto por juego peligroso.", "B": "Deja seguir el juego, porque no hay ocasión manifiesta de gol.", "C": "Concede tiro penal, por haber tocado el balón voluntariamente con la mano."}, "correcta": "C", "explicacion": "Comete infracción el jugador que toca el balón de manera voluntaria con la mano o el brazo, por ejemplo haciendo un movimiento en dirección al balón con estas partes del cuerpo.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-052", "bloque": "reglas", "enunciado": "Un defensor toca con la mano de forma voluntaria, dentro de su área, un centro peligroso e impide un ataque prometedor, pero no una ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede penal y amonesta al defensor por conducta antideportiva.", "B": "Concede penal y expulsa al defensor.", "C": "Concede penal sin sanción disciplinaria."}, "correcta": "A", "explicacion": "Tocar el balón con la mano para obstaculizar o impedir que progrese un ataque prometedor es conducta antideportiva y se amonesta.", "referencia": "Regla 12.4 / Amonestaciones por conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-053", "bloque": "reglas", "enunciado": "Al saltar en un centro lateral, el brazo de un defensor está extendido hacia arriba, separado del cuerpo, de forma que no se justifica por el movimiento de su cuerpo, y el balón le golpea en él. ¿Qué decide el árbitro?", "opciones": {"A": "Sanciona infracción por mano, porque el brazo está en posición antinatural y hace que el cuerpo ocupe más espacio.", "B": "No sanciona, porque el contacto es accidental y no hay intención, con independencia de la posición del brazo.", "C": "Sanciona libre indirecto por juego peligroso, al considerar que el brazo extendido constituye un riesgo para el rival."}, "correcta": "A", "explicacion": "Cometerá infracción el jugador que toque el balón con la mano o el brazo cuando su posición sea antinatural y consiga que el cuerpo ocupe más espacio, aunque el contacto no sea voluntario.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-054", "bloque": "reglas", "enunciado": "Un delantero marca gol de cabeza, pero el balón antes le había golpeado accidentalmente en el brazo y entra directamente en la portería. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Anula el gol y concede libre directo al equipo defensor.", "B": "Concede el gol, porque el contacto fue accidental.", "C": "Anula el gol y concede un saque de meta."}, "correcta": "A", "explicacion": "Comete infracción por mano el jugador que marque gol en la portería adversaria directamente con la mano o el brazo, incluso de forma accidental.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-055", "bloque": "reglas", "enunciado": "Un atacante recibe un balón que le golpea accidentalmente en el brazo y, inmediatamente después, marca gol con el pie. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede el gol, al no haber sido voluntario el contacto con el brazo.", "B": "Anula el gol y concede libre directo al equipo defensor.", "C": "Anula el gol y reanuda con balón a tierra."}, "correcta": "B", "explicacion": "Comete infracción el jugador que marque gol inmediatamente después de que el balón le toque en la mano o el brazo, incluso de manera accidental.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 63}, {"id": "RJ12-056", "bloque": "reglas", "enunciado": "El guardameta sale de su área y toca voluntariamente el balón con las manos, impidiendo una ocasión manifiesta de gol de un delantero. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo donde se produjo la infracción y expulsa al guardameta.", "B": "Concede libre indirecto y amonesta al guardameta.", "C": "Concede libre directo sin sanción disciplinaria, por ser el guardameta."}, "correcta": "A", "explicacion": "El guardameta está sujeto a las mismas restricciones que cualquier jugador fuera de su área; la mano voluntaria que evita una ocasión manifiesta de gol se sanciona con expulsión salvo que sea el guardameta en su propia área.", "referencia": "Regla 12.1 y 12.4 / Guardameta y mano fuera del área", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-057", "bloque": "reglas", "enunciado": "El guardameta recoge con las manos, dentro de su área, un balón que le llega directamente de un saque de banda ejecutado por un compañero. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo contrario, sin sanción disciplinaria.", "B": "Concede libre directo al equipo contrario y amonesta al guardameta.", "C": "Deja seguir el juego, porque el guardameta está dentro de su área."}, "correcta": "A", "explicacion": "El guardameta no puede tocar con las manos un balón que reciba directamente de un saque de banda de su equipo; se concede libre indirecto y no hay sanción disciplinaria.", "referencia": "Regla 12.2 / Infracciones del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-058", "bloque": "reglas", "enunciado": "El guardameta, dentro de su área, suelta el balón con las manos y, antes de que lo toque ningún otro jugador, lo vuelve a coger con las manos. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede libre directo al equipo contrario.", "B": "Concede libre indirecto al equipo contrario.", "C": "Concede saque de esquina."}, "correcta": "B", "explicacion": "Se concede libre indirecto si el guardameta toca el balón con las manos o brazos después de soltarlo y antes de que lo toque otro jugador.", "referencia": "Regla 12.2 / Infracciones del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-059", "bloque": "reglas", "enunciado": "Tras un saque de meta ejecutado correctamente por el guardameta, el balón queda en su área y este lo toca de nuevo con la mano antes de que lo toque otro jugador, desviando un balón que se dirigía a portería y evitando un gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto y expulsa al guardameta.", "B": "Concede libre indirecto y amonesta al guardameta.", "C": "Concede libre indirecto sin sanción disciplinaria, por estar en su área."}, "correcta": "A", "explicacion": "Si la infracción consiste en jugar el balón por segunda vez tras reanudarse el juego y antes de que lo toque otro jugador, se sanciona al guardameta si con ella evita un gol o una ocasión manifiesta de gol.", "referencia": "Regla 12.1 / Segundo toque del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-060", "bloque": "reglas", "enunciado": "Un defensor comete una falta imprudente sobre un atacante dentro de su propia área penal. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un libre directo en el borde del área.", "B": "Con un libre indirecto dentro del área.", "C": "Con un tiro penal."}, "correcta": "C", "explicacion": "Las infracciones sancionables con libre directo cometidas por un jugador dentro de su propia área se sancionan con tiro penal.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-061", "bloque": "reglas", "enunciado": "Un atacante empuja de manera imprudente al guardameta rival dentro del área de penal de este. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un libre directo a favor del equipo defensor.", "B": "Con un tiro penal a favor del equipo atacante.", "C": "Con un libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "La falta del atacante es sancionable con libre directo y se concede al equipo contrario en el lugar de la infracción; el penal solo se señala si el infractor es un defensor en su propia área.", "referencia": "Regla 12.1 y 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-062", "bloque": "reglas", "enunciado": "Según la Regla 12, ¿qué se considera «juego peligroso»?", "opciones": {"A": "Toda acción con contacto físico que se realice con fuerza excesiva contra un adversario, sin más matices adicionales.", "B": "Toda acción con el pie a la altura de la cintura o superior, con independencia de que haya adversarios cerca del jugador.", "C": "Toda acción que, al intentar jugar el balón, suponga riesgo de lesión, incluso para el propio jugador, o impida que un adversario cercano juegue el balón por temor a lesionarse."}, "correcta": "C", "explicacion": "El juego peligroso es cualquier acción que, al intentar jugar el balón, entrañe riesgo de lesión (incluso para uno mismo) o que impida que un adversario cercano juegue el balón por temor a lesionarse.", "referencia": "Regla 12.2 / Juego peligroso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-063", "bloque": "reglas", "enunciado": "Un jugador remata de chilena dentro del área sin que haya ningún adversario cerca y sin entrañar peligro para nadie. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto por juego peligroso, al considerar que cualquier volea acrobática entraña un riesgo excesivo.", "B": "Deja seguir el juego, porque las voleas acrobáticas están permitidas mientras no entrañen peligro para el adversario.", "C": "Concede libre directo por patada alta, entendiendo que el remate de chilena constituye siempre una infracción grave."}, "correcta": "B", "explicacion": "Están permitidas las voleas acrobáticas (remates de chilena o tijera) siempre que no entrañen ningún peligro para el adversario.", "referencia": "Regla 12.2 / Juego peligroso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-064", "bloque": "reglas", "enunciado": "Un jugador intenta un remate de tijera cuando un adversario cercano retira la cabeza por temor a ser golpeado, sin llegar a producirse contacto. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo por patada.", "B": "Concede libre indirecto por juego peligroso.", "C": "Deja seguir el juego, porque no ha habido contacto."}, "correcta": "B", "explicacion": "Es juego peligroso la acción que impide que un adversario cercano juegue el balón por temor a lesionarse, aunque no haya contacto; se sanciona con libre indirecto.", "referencia": "Regla 12.2 / Juego peligroso", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-065", "bloque": "reglas", "enunciado": "Según la Regla 12, ¿qué significa «obstaculizar el avance de un adversario sin que exista contacto»?", "opciones": {"A": "Impedir al adversario recibir el balón mediante una carga legal cuando el balón está a distancia de juego.", "B": "Interponerse en el camino del adversario para obstruir, bloquear, ralentizar o forzar a cambiar de dirección cuando el balón no está a distancia de juego.", "C": "Retener al adversario con los brazos o el cuerpo para que no llegue al balón."}, "correcta": "B", "explicacion": "Obstaculizar es interponerse en el camino del adversario para obstruir, bloquear, ralentizar o forzar a cambiar de dirección cuando el balón no está a distancia de juego de los jugadores involucrados.", "referencia": "Regla 12.2 / Obstaculizar sin contacto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-066", "bloque": "reglas", "enunciado": "Con el balón a diez metros y fuera de la distancia de juego de ambos, un defensor se interpone deliberadamente en la carrera de un atacante para bloquearlo, sin llegar a tocarlo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo.", "B": "Concede libre indirecto.", "C": "Deja seguir el juego, porque no hay contacto."}, "correcta": "B", "explicacion": "Obstaculizar el avance de un adversario sin que exista contacto físico se sanciona con libre indirecto.", "referencia": "Regla 12.2 / Obstaculizar sin contacto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-067", "bloque": "reglas", "enunciado": "Un defensor permanece quieto en su posición y un atacante que corre choca contra él cuando el balón no estaba a distancia de juego. ¿Qué decide el árbitro?", "opciones": {"A": "No sanciona al defensor: encontrarse en el camino de un adversario no es lo mismo que interponerse en su camino.", "B": "Concede libre indirecto por obstaculizar el avance sin contacto, al haberse producido el choque entre ambos jugadores.", "C": "Concede libre directo por obstaculizar mediante contacto físico, al haber chocado el atacante contra el defensor."}, "correcta": "A", "explicacion": "Todos los jugadores tienen derecho a guardar su posición en el terreno de juego; encontrarse en el camino de un adversario no es lo mismo que interponerse en su camino.", "referencia": "Regla 12.2 / Obstaculizar sin contacto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-068", "bloque": "reglas", "enunciado": "Un jugador protege el balón, que está a distancia de juego, colocándose entre este y su adversario sin retenerlo con los brazos ni con el cuerpo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto por obstaculizar el avance.", "B": "Concede libre directo por obstaculizar mediante contacto.", "C": "Deja seguir el juego, porque no hay infracción."}, "correcta": "C", "explicacion": "Los jugadores pueden proteger el balón colocándose entre este y un adversario mientras el balón esté a distancia de juego y no retengan a su adversario con los brazos o el cuerpo.", "referencia": "Regla 12.2 / Proteger el balón", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-069", "bloque": "reglas", "enunciado": "Un jugador protege el balón, a distancia de juego, interponiéndose ante su adversario y extendiendo los brazos para retenerlo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto por obstaculizar sin contacto.", "B": "Concede libre directo por sujetar a un adversario.", "C": "Deja seguir el juego, porque el balón está a distancia de juego."}, "correcta": "B", "explicacion": "Proteger el balón solo es lícito si el jugador no retiene al adversario con los brazos o el cuerpo; si lo retiene, comete la infracción de sujetar (libre directo).", "referencia": "Regla 12.2 / Proteger el balón", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-070", "bloque": "reglas", "enunciado": "Un jugador protege el balón, que está a distancia de juego, y su adversario le carga con el hombro de forma reglamentaria para disputárselo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al jugador que protegía el balón.", "B": "Deja seguir el juego, porque el adversario puede cargar dentro de los márgenes permitidos.", "C": "Concede libre directo al jugador que protegía el balón."}, "correcta": "B", "explicacion": "Si el balón se halla a distancia de juego, el adversario puede cargar contra el jugador que lo protege dentro de los márgenes permitidos por las Reglas de Juego.", "referencia": "Regla 12.2 / Proteger el balón", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-071", "bloque": "reglas", "enunciado": "Un jugador reclama a gritos al árbitro tras una decisión, mostrando su desaprobación con palabras, con el balón en juego y dentro del terreno de juego. ¿Cómo se sanciona?", "opciones": {"A": "Con libre indirecto a favor del equipo contrario y amonestación del jugador.", "B": "Con libre directo a favor del equipo contrario y amonestación del jugador.", "C": "Con balón a tierra y advertencia verbal."}, "correcta": "A", "explicacion": "Mostrar desaprobación con palabras es infracción sancionable con libre indirecto (todas las infracciones de carácter verbal) y amonestación.", "referencia": "Regla 12.2 y 12.4 / Desaprobación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-072", "bloque": "reglas", "enunciado": "Un atacante se interpone físicamente en la trayectoria del guardameta, que sostiene el balón en las manos y está en proceso de soltarlo para sacarlo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo a favor del equipo defensor.", "B": "Concede libre indirecto a favor del equipo defensor.", "C": "Concede saque de meta."}, "correcta": "B", "explicacion": "Se concede libre indirecto si un jugador impide que el guardameta saque el balón con la mano, lo juegue o lo intente jugar cuando está en proceso de soltarlo.", "referencia": "Regla 12.2 / Impedir que el guardameta suelte el balón", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-073", "bloque": "reglas", "enunciado": "Un atacante intenta jugar con el pie el balón que el guardameta acaba de soltar con la mano, sin llegar a tocarlo. ¿Qué decide el árbitro?", "opciones": {"A": "Deja seguir el juego, porque no llega a tocar el balón.", "B": "Concede libre directo a favor del equipo defensor.", "C": "Concede libre indirecto a favor del equipo defensor."}, "correcta": "C", "explicacion": "Impedir que el guardameta juegue el balón o intentar jugarlo cuando el guardameta está en proceso de soltarlo se sanciona con libre indirecto, aunque no llegue a tocarlo.", "referencia": "Regla 12.2 / Impedir que el guardameta suelte el balón", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-074", "bloque": "reglas", "enunciado": "Un defensor levanta el balón con el pie con la intención de cedérselo al guardameta con el pecho para que este lo coja con las manos. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo contrario y amonesta al defensor por conducta antideportiva.", "B": "Concede libre directo al equipo contrario y amonesta al defensor.", "C": "Deja seguir el juego, porque el guardameta no ha tocado el balón con las manos."}, "correcta": "A", "explicacion": "Iniciar una acción que trate de burlar la Regla deliberadamente para hacer llegar el balón al guardameta con la cabeza, el pecho, la rodilla, etc. se sanciona con libre indirecto y amonestación, independientemente de que el guardameta toque el balón con la mano.", "referencia": "Regla 12.2 y 12.4 / Burlar la Regla", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-075", "bloque": "reglas", "enunciado": "Un defensor cede el balón de cabeza a su guardameta durante el juego, de manera espontánea y sin ninguna estratagema previa, y este lo coge con las manos. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo contrario.", "B": "Deja seguir el juego, porque no hay ardid para burlar la Regla.", "C": "Concede libre directo al equipo contrario."}, "correcta": "B", "explicacion": "La infracción existe cuando se inicia una acción deliberada para burlar la Regla; una cesión de cabeza sin esa intención no es infracción.", "referencia": "Regla 12.2 / Burlar la Regla", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-076", "bloque": "reglas", "enunciado": "Un defensor cede el balón con el pie de forma clara a su guardameta, que lo coge con las manos dentro de su área. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo contrario, sin sanción disciplinaria.", "B": "Concede libre directo al equipo contrario y amonesta al guardameta.", "C": "Deja seguir el juego, porque el guardameta está dentro de su área."}, "correcta": "A", "explicacion": "El guardameta no puede tocar con las manos un balón que un compañero le ceda con el pie; se concede libre indirecto sin sanción disciplinaria.", "referencia": "Regla 12.2 / Infracciones del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-077", "bloque": "reglas", "enunciado": "Un defensor cede el balón con la rodilla a su guardameta, de forma espontánea y sin ánimo de burlar la Regla, y este lo coge con las manos dentro de su área. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo contrario, al considerar que toda cesión con la rodilla equivale a una cesión con el pie.", "B": "Concede libre directo al equipo contrario, al entender que la cesión con la rodilla constituye siempre una infracción grave.", "C": "Deja seguir el juego, porque la cesión no ha sido con el pie ni con ardid."}, "correcta": "C", "explicacion": "La infracción del guardameta por cesión se limita a la cesión con el pie, salvo que exista acción deliberada para burlar la Regla.", "referencia": "Regla 12.2 / Infracciones del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-078", "bloque": "reglas", "enunciado": "El guardameta lanza el balón al aire con las manos dentro de su área, lo deja botar y lo vuelve a coger con las manos antes de que lo toque otro jugador, sin superar los ocho segundos. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto por tocarlo de nuevo con las manos tras soltarlo, al haber quedado el balón fuera de su control.", "B": "Deja seguir el juego, porque lanzar el balón al aire o hacerlo botar es controlarlo, no soltarlo.", "C": "Concede libre directo por juego peligroso, al considerar que botar el balón dentro del área constituye una infracción."}, "correcta": "B", "explicacion": "Un guardameta controla el balón cuando lo retiene, lo sostiene con las manos abiertas y extendidas, lo hace rebotar en el suelo o lo lanza al aire; por tanto, no lo ha soltado y no comete infracción si no supera los ocho segundos.", "referencia": "Regla 12.3 / Control del balón del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-079", "bloque": "reglas", "enunciado": "¿Cuándo se considera, según la Regla 12.3, que el guardameta controla el balón con las manos o los brazos?", "opciones": {"A": "Únicamente cuando lo retiene con ambas manos pegado al pecho, sin que otras formas de sujeción cuenten como control.", "B": "Únicamente cuando lo sujeta con las manos entre su cuerpo y el suelo y lo deja de mover por completo.", "C": "Cuando lo retiene en las manos o brazos, lo sostiene con las manos abiertas y extendidas, o lo hace rebotar en el suelo o lo lanza al aire."}, "correcta": "C", "explicacion": "El guardameta controla el balón cuando lo retiene en manos o brazos (o entre mano/brazo y una superficie), lo sostiene con las manos abiertas y extendidas, o lo hace rebotar o lo lanza al aire.", "referencia": "Regla 12.3 / Control del balón del guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-080", "bloque": "reglas", "enunciado": "El guardameta sostiene el balón sobre la palma de su mano abierta y extendida durante más de ocho segundos, dentro de su área, sin que nadie se lo dispute. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto al equipo adversario.", "B": "Amonesta al guardameta y reanuda con balón a tierra.", "C": "Concede saque de esquina al equipo adversario."}, "correcta": "C", "explicacion": "Sostener el balón con las manos abiertas y extendidas es controlarlo; si supera los ocho segundos, se concede saque de esquina.", "referencia": "Regla 12.3 / Ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-081", "bloque": "reglas", "enunciado": "El guardameta retiene durante más de ocho segundos el balón atrapado entre su mano y el suelo, dentro de su área. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de esquina al equipo adversario.", "B": "Concede libre indirecto al equipo adversario.", "C": "Deja seguir el juego, porque el balón está en contacto con el suelo."}, "correcta": "A", "explicacion": "Retener el balón entre la mano o el brazo y una superficie (el suelo, su propio cuerpo) es controlarlo y, pasados ocho segundos, se concede saque de esquina.", "referencia": "Regla 12.3 / Ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-082", "bloque": "reglas", "enunciado": "El guardameta hace botar el balón en el suelo de su área durante nueve segundos sin soltarlo definitivamente. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de esquina al equipo adversario.", "B": "Deja seguir el juego, porque el balón no ha sido retenido.", "C": "Concede libre indirecto al equipo adversario."}, "correcta": "A", "explicacion": "Hacer rebotar el balón en el suelo o lanzarlo al aire cuenta como controlarlo con las manos, por lo que se computan los ocho segundos.", "referencia": "Regla 12.3 / Ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-083", "bloque": "reglas", "enunciado": "Según la Regla 12.3, ¿quién decide cuándo el guardameta controla el balón y empieza la cuenta de los ocho segundos?", "opciones": {"A": "El árbitro asistente más cercano al guardameta, quien se lo comunica de inmediato al árbitro principal.", "B": "El árbitro, que además efectuará con la mano alzada la cuenta atrás de los últimos cinco segundos.", "C": "El cuarto árbitro, que supervisa el tiempo de posesión del guardameta desde la línea de banda."}, "correcta": "B", "explicacion": "El árbitro decidirá cuándo el guardameta controla el balón y empiezan a contar los ocho segundos de retención.", "referencia": "Regla 12.3 / Cuenta de ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-084", "bloque": "reglas", "enunciado": "¿Cómo debe efectuar el árbitro la cuenta atrás de los ocho segundos del guardameta según la Regla 12.3?", "opciones": {"A": "Con el silbato, tras los ocho segundos completos.", "B": "Con la mano alzada, contando hacia atrás los últimos cinco segundos.", "C": "Con la mano alzada, contando hacia atrás los últimos tres segundos."}, "correcta": "B", "explicacion": "El árbitro efectuará con la mano alzada la cuenta atrás de los últimos cinco segundos.", "referencia": "Regla 12.3 / Cuenta de ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-085", "bloque": "reglas", "enunciado": "Mientras el guardameta controla el balón con las manos o los brazos dentro de su área, ¿puede un adversario disputárselo?", "opciones": {"A": "Sí, siempre que lo haga sin usar fuerza excesiva.", "B": "No, ningún adversario podrá disputárselo mientras el guardameta lo controle.", "C": "Sí, pero solo con el pie y una vez transcurridos cinco segundos."}, "correcta": "B", "explicacion": "La Regla 12.3 establece que, mientras el guardameta controle el balón con las manos o los brazos, ningún adversario podrá disputárselo.", "referencia": "Regla 12.3 / Adversarios y guardameta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-086", "bloque": "reglas", "enunciado": "El guardameta controla el balón con las manos fuera de su área penal durante más de ocho segundos. ¿Qué decide el árbitro?", "opciones": {"A": "Sanciona la infracción por mano fuera del área con libre directo, no con saque de esquina.", "B": "Concede saque de esquina al equipo adversario, aplicando el mismo criterio que si la retención fuera dentro del área.", "C": "Concede libre indirecto al equipo adversario, al tratarse de una simple retención excesiva del balón con las manos."}, "correcta": "A", "explicacion": "El saque de esquina por retención se concede solo si el guardameta está dentro de su propia área; fuera de ella está sujeto a las restricciones de cualquier jugador respecto a la mano.", "referencia": "Regla 12.3 / Ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-087", "bloque": "reglas", "enunciado": "Según la Regla 12.4, ¿a quién se le pueden mostrar tarjetas amarillas o rojas?", "opciones": {"A": "A jugadores, suplentes, jugadores sustituidos y miembros del cuerpo técnico.", "B": "Únicamente a los jugadores y suplentes.", "C": "A cualquier persona presente en el recinto, incluidos delegados y auxiliares."}, "correcta": "A", "explicacion": "Solo se podrán mostrar tarjetas amarillas o rojas a los jugadores, a los suplentes, a los
