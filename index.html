function getVistas(){ return leerJSON('f11_vistas', []).filter(id => !!BANCO_POR_ID[id]); }
function marcarVistas(ids){
  if(!ids || ids.length === 0) return;
  const v = new Set(getVistas());
  ids.forEach(id => v.add(id));
  guardarJSON('f11_vistas', Array.from(v));
}
function calcularCobertura(){
  const vistasSet = new Set(getVistas());
  const totalVistas = BANCO.filter(q => vistasSet.has(q.id)).length;
  const reglasVistas = BANCO_REGLAS.filter(q => vistasSet.has(q.id)).length;
  const normativaVistas = BANCO_NORMATIVA.filter(q => vistasSet.has(q.id)).length;
  const porTema = {};
  BANCO_REGLAS.forEach(q=>{
    const key = q.regla || 'Otras';
    if(!porTema[key]) porTema[key] = {vistas:0, total:0};
    porTema[key].total++;
    if(vistasSet.has(q.id)) porTema[key].vistas++;
  });
  return {
    total: BANCO.length, totalVistas,
    reglasTotal: BANCO_REGLAS.length, reglasVistas,
    normativaTotal: BANCO_NORMATIVA.length, normativaVistas,
    porTema
  };
}

// ---------- GUARDADO AUTOMÁTICO DEL EXAMEN EN CURSO ----------
const CLAVE_PROGRESO = 'f11_progreso';
function guardarProgreso(){
  if(!state.examen || state.examen.length === 0 || state.finalizado){ borrarProgreso(); return; }
  guardarJSON(CLAVE_PROGRESO, {
    examen: state.examen,
    respuestas: state.respuestas,
    comprobadas: state.comprobadas,
    actual: state.actual,
    config: state.config,
    restante: state.restante,
    bloqueadas: state.bloqueadas,
    ultimaConfig: state.ultimaConfig,
    guardadoEn: new Date().toISOString()
  });
}
function hayProgresoGuardado(){
  const p = leerJSON(CLAVE_PROGRESO, null);
  return !!(p && p.examen && p.examen.length > 0);
}
function continuarProgreso(){
  const p = leerJSON(CLAVE_PROGRESO, null);
  if(!p || !p.examen || p.examen.length === 0) return false;
  state.examen = p.examen;
  state.respuestas = p.respuestas || {};
  state.comprobadas = p.comprobadas || {};
  state.actual = p.actual || 0;
  state.config = p.config || {modoExamen:false};
  state.restante = p.restante || {};
  state.bloqueadas = p.bloqueadas || {};
  state.ultimaConfig = p.ultimaConfig || null;
  state.finalizado = false;
  renderPregunta();
  return true;
}
function borrarProgreso(){ try{ localStorage.removeItem(CLAVE_PROGRESO); }catch(e){} }

function calcularStats(examen, respuestas){
  let aciertos=0, errores=0, sinResponder=0;
  const statsPorBloque = {reglas:{ok:0,total:0}, normativa:{ok:0,total:0}};
  const statsPorRegla = {};
  const statsPorNivel = {1:{ok:0,total:0},2:{ok:0,total:0},3:{ok:0,total:0},4:{ok:0,total:0}};
  examen.forEach((q, i)=>{
    const resp = respuestas[i];
    statsPorBloque[q.bloque].total++;
    statsPorNivel[q.dificultad].total++;
    if(resp === q.correcta) statsPorNivel[q.dificultad].ok++;
    if(q.bloque==='reglas'){
      const key = q.regla || 'Otras';
      if(!statsPorRegla[key]) statsPorRegla[key] = {ok:0,total:0};
      statsPorRegla[key].total++;
    }
    if(resp === undefined){ sinResponder++; }
    else if(resp === q.correcta){
      aciertos++;
      statsPorBloque[q.bloque].ok++;
      if(q.bloque==='reglas'){ statsPorRegla[q.regla||'Otras'].ok++; }
    } else { errores++; }
  });
  const total = examen.length;
  const pct = total ? ((aciertos/total)*100).toFixed(1) : '0.0';
  return {total, aciertos, errores, sinResponder, pct, statsPorBloque, statsPorRegla, statsPorNivel};
}

// Genera un examen a partir de una lista concreta de IDs (repasar falladas / marcadas)
function generarExamenDesdeIds(ids, modoExamen){
  let preguntas = ids.map(id => BANCO_POR_ID[id]).filter(Boolean);
  if(preguntas.length === 0) return false;
  preguntas = shuffle(preguntas).map(q=>{
    const letras = ['A','B','C'];
    const mezcladas = shuffle(letras);
    const nuevasOpciones = {};
    let nuevaCorrecta = null;
    mezcladas.forEach((letraOriginal, idx)=>{
      const letraNueva = letras[idx];
      nuevasOpciones[letraNueva] = q.opciones[letraOriginal];
      if(letraOriginal === q.correcta) nuevaCorrecta = letraNueva;
    });
    return Object.assign({}, q, {opciones: nuevasOpciones, correcta: nuevaCorrecta});
  });
  state.examen = preguntas;
  state.respuestas = {}; state.comprobadas = {}; state.actual = 0; state.finalizado = false;
  state.config = {modoExamen: !!modoExamen, esRepaso: true, total: preguntas.length};
  state.ultimaConfig = null;
  state.ultimoExamen = preguntas;
  marcarVistas(preguntas.map(q=>q.id));
  iniciarTiempos();
  renderPregunta();
  return true;
}
function urlDesdeRuta(fuente, pag){
  let r = carpetaDocs().trim().replace(/^["']|["']$/g,'').replace(/\\/g,'/');
  if(!r){
    if(/^https?:$/.test(location.protocol)) return encodeURI(fuente)+'#page='+pag;   // PDF alojado en la propia web
    return null;
  }
  if(/\.pdf$/i.test(r)) r = r.replace(/\/[^\/]*$/,'');   // si pegó la ruta de un PDF, quitar el nombre
  r = r.replace(/\/+$/,'');
  const base = /^[A-Za-z]:/.test(r) ? 'file:///'+r : (r.startsWith('/') ? 'file://'+r : 'file:///'+r);
  return encodeURI(base+'/'+fuente)+'#page='+pag;
}

const NIVELES_NOMBRE = {1:'Básica',2:'Media',3:'Alta',4:'Experta'};
function leerNiveles(){
  return Array.from(document.querySelectorAll('input[name=nivel]:checked')).map(x=>parseInt(x.value,10));
}
function bancoFiltrado(bloque, niveles, temas){
  return BANCO.filter(q => q.bloque === bloque && niveles.includes(q.dificultad) &&
    (temas === null || temas === undefined || temas.includes(bloque==='reglas' ? (q.regla||'Otras') : (q.articulo||'Otros'))));
}

function leerNumPreguntas(){
  const sel = document.getElementById('numPreguntas').value;
  if(sel === 'custom'){
    const v = parseInt(document.getElementById('customNum').value, 10);
    return v;
  }
  return parseInt(sel, 10);
}

function onGenerarClick(){
  const total = leerNumPreguntas();
  if(!total || total < 1){
    renderConfig('Introduce un número de preguntas válido.');
    return;
  }
  const niveles = leerNiveles();
  if(niveles.length === 0){
    renderConfig('Selecciona al menos un nivel de dificultad.');
    return;
  }
  const distModo = document.getElementById('distModo').value; // 'simple'|'rangos'|'reglas'|'articulos'
  const modoAvanzado = distModo !== 'simple';
  const modo = document.getElementById('modoSeleccionado').value; // 'examen' | 'estudio' | 'flashcard'
  const soloNoVistas = document.getElementById('soloNoVistas').value === '1';

  let nReglas, nNormativa;
  let temasReglas = null, temasNorm = null;

  if(!modoAvanzado){
    // MODO SIMPLE: máximo 20% de artículos (normativa), resto reglas.
    let pN = parseInt(document.getElementById('pctArticulosSimple').value,10);
    if(isNaN(pN) || pN < 0) pN = 0;
    if(pN > 20) pN = 20;
    nNormativa = Math.round(total * pN / 100);
    nReglas = total - nNormativa;
  } else {
    const av = distModo;
    if(av === 'reglas'){
      nReglas = total; nNormativa = 0;
    } else if(av === 'articulos'){
      nReglas = 0; nNormativa = total;
    } else {
      const rMin = parseInt(document.getElementById('rangoReglasMin').value,10);
      const rMax = parseInt(document.getElementById('rangoReglasMax').value,10);
      const nMin = parseInt(document.getElementById('rangoNormMin').value,10);
      const nMax = parseInt(document.getElementById('rangoNormMax').value,10);
      if([rMin,rMax,nMin,nMax].some(v=>isNaN(v)) || rMin>rMax || nMin>nMax){
        renderConfig('Revisa los rangos: los mínimos no pueden ser mayores que los máximos.');
        return;
      }
      // Buscar combinaciones válidas donde reglas+normativa = total
      const combinaciones = [];
      for(let r=rMin; r<=rMax; r++){
        const n = total - r;
        if(n >= nMin && n <= nMax) combinaciones.push([r,n]);
      }
      if(combinaciones.length === 0){
        renderConfig('No existe ninguna combinación de rangos válida cuya suma sea igual al número total de preguntas. Ajusta los rangos o el total.');
        return;
      }
      const elegido = combinaciones[Math.floor(Math.random()*combinaciones.length)];
      nReglas = elegido[0]; nNormativa = elegido[1];
    }

    temasReglas = Array.from(document.querySelectorAll('input[name=temaRegla]:checked')).map(x=>x.value);
    temasNorm = Array.from(document.querySelectorAll('input[name=temaArticulo]:checked')).map(x=>x.value);
    if(av === 'reglas' && temasReglas.length === 0){
      renderConfig('Marca al menos una Regla de Juego para poder generar el examen.');
      return;
    }
    if(av === 'articulos' && temasNorm.length === 0){
      renderConfig('Marca al menos un artículo para poder generar el examen.');
      return;
    }
    if(av === 'rangos' && temasReglas.length === 0 && temasNorm.length === 0){
      renderConfig('Marca al menos un tema (regla o artículo) para poder generar el examen.');
      return;
    }
  }

  let poolReglas = bancoFiltrado('reglas', niveles, temasReglas);
  let poolNormativa = bancoFiltrado('normativa', niveles, temasNorm);
  if(soloNoVistas){
    const vistas = new Set(getVistas());
    poolReglas = poolReglas.filter(q=>!vistas.has(q.id));
    poolNormativa = poolNormativa.filter(q=>!vistas.has(q.id));
  }
  const dispR = poolReglas.length;
  const dispN = poolNormativa.length;

  // Si se piden más preguntas de las disponibles, se ajusta automáticamente
  // al máximo posible en lugar de mostrar un error.
  if(nReglas > dispR) nReglas = dispR;
  if(nNormativa > dispN) nNormativa = dispN;

  if(nReglas + nNormativa === 0){
    const nombres = niveles.map(n=>NIVELES_NOMBRE[n]).join(', ');
    renderConfig(`No hay ninguna pregunta disponible con la dificultad y temas seleccionados (${nombres})${soloNoVistas ? ' que además no hayas visto ya' : ''}. Marca más niveles, más temas${soloNoVistas ? ' o desmarca "solo no vistas"' : ''}.`);
    return;
  }

  generarExamen(nReglas, nNormativa, modo, niveles, temasReglas, temasNorm, soloNoVistas);
}

function onSimulacroClick(){
  const total = 40;
  const rMin=30, rMax=35, nMin=5, nMax=10;
  const combinaciones = [];
  for(let r=rMin; r<=rMax; r++){
    const n = total - r;
    if(n >= nMin && n <= nMax) combinaciones.push([r,n]);
  }
  const elegido = combinaciones[Math.floor(Math.random()*combinaciones.length)];
  generarExamen(elegido[0], elegido[1], 'examen', [1,2,3,4], null, null, false);
}

function generarExamen(nReglas, nNormativa, modo, niveles, temasReglas, temasNorm, soloNoVistas){
  niveles = niveles && niveles.length ? niveles : [1,2,3,4];
  if(temasReglas === undefined) temasReglas = null;
  if(temasNorm === undefined) temasNorm = null;
  const modoExamen = modo === 'examen';
  const modoFlashcard = modo === 'flashcard';
  let poolReglas = bancoFiltrado('reglas', niveles, temasReglas);
  let poolNormativa = bancoFiltrado('normativa', niveles, temasNorm);
  if(soloNoVistas){
    const vistas = new Set(getVistas());
    poolReglas = poolReglas.filter(q=>!vistas.has(q.id));
    poolNormativa = poolNormativa.filter(q=>!vistas.has(q.id));
  }
  const seleccionReglas = pickRandom(poolReglas, nReglas);
  const seleccionNormativa = pickNormativa(poolNormativa, nNormativa);
  let seleccion = shuffle(seleccionReglas.concat(seleccionNormativa));

  // Mezclar orden de opciones A/B/C para cada pregunta
  seleccion = seleccion.map(q=>{
    const letras = ['A','B','C'];
    const mezcladas = shuffle(letras);
    const nuevasOpciones = {};
    let nuevaCorrecta = null;
    mezcladas.forEach((letraOriginal, idx)=>{
      const letraNueva = letras[idx];
      nuevasOpciones[letraNueva] = q.opciones[letraOriginal];
      if(letraOriginal === q.correcta) nuevaCorrecta = letraNueva;
    });
    return Object.assign({}, q, {opciones: nuevasOpciones, correcta: nuevaCorrecta});
  });

  state.examen = seleccion;
  state.respuestas = {};
  state.comprobadas = {};
  state.actual = 0;
  state.finalizado = false;
  state.config = {modoExamen, modoFlashcard, nReglas, nNormativa, total: nReglas+nNormativa, niveles, temasReglas, temasNorm, soloNoVistas: !!soloNoVistas};
  state.ultimaConfig = state.config;
  state.ultimoExamen = seleccion;
  marcarVistas(seleccion.map(q=>q.id));
  iniciarTiempos();

  renderPregunta();
}

function repetirExamen(){
  if(!state.ultimoExamen) return;
  state.examen = state.ultimoExamen;
  state.respuestas = {};
  state.comprobadas = {};
  state.actual = 0;
  state.finalizado = false;
  iniciarTiempos();
  renderPregunta();
}

function nuevoExamenMismaConfig(){
  if(!state.ultimaConfig){ renderConfig(); return; }
  const c = state.ultimaConfig;
  const modo = c.modoFlashcard ? 'flashcard' : (c.modoExamen ? 'examen' : 'estudio');
  generarExamen(c.nReglas, c.nNormativa, modo, c.niveles, c.temasReglas, c.temasNorm, c.soloNoVistas);
}

// ---------- PANTALLA DE PREGUNTA ----------
function renderPregunta(){

  const opcionesHtml = ['A','B','C'].map(letra=>{

      if(letra === q.correcta) cls += ' correcta';
      else if(letra === seleccionActual) cls += ' incorrecta';
    }
    return `<button class="${cls}" data-letra="${letra}" ${bloq?'disabled':''}>

    <div class="card">
      <div class="q-header">
        <span class="badge">Pregunta ${idx+1} / ${total}</span>

      state.respuestas[idx] = btn.dataset.letra;
      renderPregunta();

    state.comprobadas[idx] = true;

    });

}

function renderResultados(){
  const total = state.examen.length;
  let aciertos=0, errores=0, sinResponder=0;
  const statsPorBloque = {reglas:{ok:0,total:0}, normativa:{ok:0,total:0}};
  const statsPorRegla = {};
  const statsPorNivel = {1:{ok:0,total:0},2:{ok:0,total:0},3:{ok:0,total:0},4:{ok:0,total:0}};

  state.examen.forEach((q, i)=>{
    const resp = state.respuestas[i];
    statsPorBloque[q.bloque].total++;
    statsPorNivel[q.dificultad].total++;
    if(resp === q.correcta) statsPorNivel[q.dificultad].ok++;
    if(q.bloque==='reglas'){
      const key = q.regla || 'Otras';
      if(!statsPorRegla[key]) statsPorRegla[key] = {ok:0,total:0};
      statsPorRegla[key].total++;
    }
    if(resp === undefined){ sinResponder++; }
    else if(resp === q.correcta){
      aciertos++;
      statsPorBloque[q.bloque].ok++;
      if(q.bloque==='reglas'){ statsPorRegla[q.regla||'Otras'].ok++; }
    } else {
      errores++;
    }
  });

  const pct = ((aciertos/total)*100).toFixed(1);

  const reviewHtml = state.examen.map((q,i)=>{
    const resp = state.respuestas[i];
    const acierto = resp === q.correcta;
    const cls = resp===undefined ? 'blank' : (acierto ? 'ok' : 'ko');
    return `
      <div class="review-item ${cls}">
        <div class="tag">Pregunta ${i+1}</div>

        <div class="explicacion-box" style="margin-top:8px;">
          <strong>Explicación:</strong> ${q.explicacion}<br>
          <div class="info-text" style="margin-top:4px;">Referencia: ${q.referencia || q.regla || q.articulo || '-'} · Fuente: ${q.fuente}</div>
          <div style="margin-top:6px;">${linkFuenteHtml(q)}</div>
        </div>
      </div>
    `;
  }).join('');

  const reglasStatsHtml = Object.keys(statsPorRegla).sort().map(k=>{
    const s = statsPorRegla[k];
    return `<div class="stat-row"><span>${k}</span><span>${s.ok}/${s.total}</span></div>`;
  }).join('');

  app.innerHTML = `

      <div class="big-number">${pct}%</div>

    <div class="card">
      <h2>Estadísticas por bloque</h2>

      <div class="stat-row"><span>📋 Normativa RFEF</span><span>${statsPorBloque.normativa.ok}/${statsPorBloque.normativa.total}</span></div>
      <h2 style="margin-top:16px;">Estadísticas por dificultad</h2>

// ---------- ATAJOS DE TECLADO ----------
document.addEventListener('keydown', function(e){
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if(!state.examen || state.examen.length === 0 || state.finalizado) return;

  const idx = state.actual;
  const total = state.examen.length;
  const modoFlashcard = !!(state.config && state.config.modoFlashcard);
  const modoExamenBool = !!(state.config && state.config.modoExamen);

  if(modoFlashcard){
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar'){
      e.preventDefault();
      if(!state.comprobadas[idx]){ state.comprobadas[idx] = true; renderPregunta(); }
      else if(idx < total-1){ state.actual++; renderPregunta(); }
      return;
    }
    if(e.key === 'ArrowRight' && idx < total-1){ e.preventDefault(); state.actual++; renderPregunta(); return; }
    if(e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); state.actual--; renderPregunta(); return; }
    return;
  }

  const mapaLetra = {'1':'A','2':'B','3':'C','a':'A','b':'B','c':'C'};
  const letra = mapaLetra[e.key.toLowerCase()];
  if(letra && !state.bloqueadas[idx]){
    if(!modoExamenBool && state.comprobadas[idx]) return; // ya comprobada en estudio: no se puede cambiar
    e.preventDefault();
    state.respuestas[idx] = letra;
    renderPregunta();
    return;
  }
  if(e.key === 'ArrowRight' && idx < total-1){ e.preventDefault(); state.actual++; renderPregunta(); return; }
  if(e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); state.actual--; renderPregunta(); return; }
  if(e.key === 'Enter'){
    e.preventDefault();
    if(!modoExamenBool && !state.comprobadas[idx] && state.respuestas[idx] !== undefined){
      state.comprobadas[idx] = true; renderPregunta(); return;
    }
    if(idx < total-1){ state.actual++; renderPregunta(); }
    return;
  }
});

  b.id = 'avisoActualizar';
  b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2000;background:var(--primary);color:#fff;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.35);flex-wrap:wrap;';
  b.innerHTML = '<span style="font-size:.9rem;">🔄 Hay una versión nueva de la app. Termina tu examen y actualiza cuando quieras.</span><button id="btnActualizarYa" style="background:#fff;color:var(--primary);padding:8px 14px;">Actualizar ahora</button>';
  document.body.appendChild(b);
  document.getElementById('btnActualizarYa').addEventListener('click', ()=>aplicarActualizacion(ver));
}
async function comprobarActualizacion(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch('index.html?_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/APP_VERSION = '(\d{8}-\d{6})'/);
    if(!m || m[1] === APP_VERSION) return;
    if(hayExamenEnCurso()) mostrarAvisoActualizacion(m[1]);   // no interrumpir un examen: el progreso queda guardado
    else aplicarActualizacion(m[1]);
  }catch(e){}
}
setTimeout(comprobarActualizacion, 2500);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    comprobarActualizacion();
    if('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r=>r && r.update()).catch(()=>{});
  }
});
setInterval(comprobarActualizacion, 5*60*1000);

// ---------- INSTALAR COMO APP (service worker) ----------
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{}); });
}

// ---------- BOTÓN INSTALAR APP ----------
(function(){
  const btn = document.getElementById('btnInstalar');
  if(!btn) return;
  const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(yaInstalada || !/^https?:$/.test(location.protocol)) return;
  let evInstalar = null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); evInstalar = e; btn.style.display = 'inline-block'; });
  window.addEventListener('appinstalled', ()=>{ btn.style.display = 'none'; });
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(esIOS) btn.style.display = 'inline-block';
  btn.addEventListener('click', async e=>{
    e.preventDefault();
    if(evInstalar){ evInstalar.prompt(); try{ await evInstalar.userChoice; }catch(_){} evInstalar = null; return; }
    if(esIOS){ alert('Para instalarla en iPhone/iPad:\n\n1. Abre esta página en Safari.\n2. Pulsa el botón Compartir (el cuadrado con la flecha hacia arriba).\n3. Elige "Añadir a pantalla de inicio".\n4. Pulsa "Añadir".'); return; }
    alert('Para instalarla: abre el menú del navegador (⋮) y elige "Instalar aplicación" o "Añadir a pantalla de inicio".');
  });
})();

// ---------- ARRANQUE ----------
// Aviso antes de cerrar/recargar la pestaña si hay un examen sin terminar.
// (El progreso ya se guarda solo, pero esto evita cierres accidentales.)
window.addEventListener('beforeunload', function(e){
  const examenActivo = state.examen && state.examen.length > 0 && !state.finalizado;
  if(examenActivo){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

renderConfig();

</script>
