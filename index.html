uego26-27.pdf", "dificultad": 4, "regla": "Regla 9", "pagina": 56}, {"id": "RJ9-004", "bloque": "reglas", "enunciado": "El balón rebota en el poste de la portería y regresa al terreno de juego sin haber atravesado la línea de meta. ¿Sigue el balón en juego?", "opciones": {"A": "No, se detiene el juego automáticamente en cuanto el balón toca cualquier parte de la estructura de la portería.", "B": "Sí, el balón sigue en juego mientras no haya atravesado por completo la línea de meta o de banda, ni el árbitro haya detenido el juego.", "C": "Depende de si toca antes al guardameta, ya que ese contacto previo es lo que determina si el balón sigue en juego."}, "correcta": "B", "explicacion": "El balón permanece en juego tras rebotar en los postes o el travesaño, siempre que no haya cruzado completamente la línea correspondiente ni el árbitro haya detenido el juego.", "referencia": "Regla 9", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-005", "bloque": "reglas", "enunciado": "El balón sale del terreno de juego tras tocar a un espectador que había invadido el campo. ¿Cómo se reanuda el juego, si el árbitro considera que el espectador actuó como agente externo?", "opciones": {"A": "Con balón a tierra en el lugar donde tocó por última vez a un jugador, ya que un agente externo interfiere el juego.", "B": "Con saque de banda o de meta/esquina según por dónde salió, sin considerar la interferencia del espectador en la jugada.", "C": "Con tiro libre indirecto a favor del equipo perjudicado, ejecutado desde el lugar donde el espectador tocó el balón."}, "correcta": "A", "explicacion": "Cuando un agente externo (incluido un espectador que invade el terreno) toca el balón interfiriendo el juego, se reanuda con balón a tierra en el lugar donde se produjo el contacto.", "referencia": "Regla 9", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-006", "bloque": "reglas", "enunciado": "¿Cuándo el balón habrá dejado de estar en juego por haber salido del terreno de juego?", "opciones": {"A": "Cuando haya atravesado completamente la línea de meta o de banda, ya sea por el suelo o por el aire.", "B": "Cuando la mayor parte del balón haya sobrepasado la línea de banda, aunque no la haya atravesado por completo.", "C": "Únicamente cuando haya atravesado la línea de banda por el suelo, no así cuando lo haga por el aire."}, "correcta": "A", "explicacion": "El balón no estará en juego cuando haya atravesado completamente la línea de meta o de banda, ya sea por el suelo o por el aire.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-007", "bloque": "reglas", "enunciado": "Además de salir del terreno de juego, ¿en qué otro caso general el balón no estará en juego?", "opciones": {"A": "Cuando el balón toque a cualquier miembro del equipo arbitral, en cualquier circunstancia.", "B": "Cuando el balón rebote en el poste o el travesaño y permanezca en el terreno de juego.", "C": "Cuando el juego haya sido detenido por el árbitro."}, "correcta": "C", "explicacion": "El balón no estará en juego cuando el juego haya sido detenido por el árbitro.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-008", "bloque": "reglas", "enunciado": "El balón toca a un árbitro asistente, permanece en el terreno de juego y, a raíz de ese contacto, un equipo inicia un ataque prometedor. ¿Sigue el balón en juego?", "opciones": {"A": "Sí, el balón sigue en juego en todo caso mientras permanezca dentro del terreno de juego tras el contacto.", "B": "Sí, salvo que el ataque prometedor termine directamente en gol, en cuyo caso el juego se detiene retroactivamente.", "C": "No, el balón deja de estar en juego, ya que se cumple uno de los supuestos en los que el contacto con un miembro del equipo arbitral detiene el juego."}, "correcta": "C", "explicacion": "El balón no estará en juego cuando toque a un miembro del equipo arbitral, permanezca en el terreno de juego y, entre otros supuestos, un equipo inicie un ataque prometedor.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-009", "bloque": "reglas", "enunciado": "El balón toca al árbitro principal, permanece en el terreno de juego y entra directamente en la portería. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Se concederá el gol, ya que el balón permaneció en el terreno de juego en todo momento tras el contacto.", "B": "Se concederá el gol únicamente si el contacto con el árbitro fue accidental y no evitable por su parte.", "C": "El balón habrá dejado de estar en juego, por lo que no se concederá el gol y se reanudará con un balón a tierra."}, "correcta": "C", "explicacion": "El balón no estará en juego cuando toque a un miembro del equipo arbitral, permanezca en el terreno de juego y entre directamente en la portería; el juego se reanudará con un balón a tierra.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-010", "bloque": "reglas", "enunciado": "El balón toca a un árbitro asistente, permanece en el terreno de juego, y como consecuencia de ello el equipo que tenía la posesión la pierde a favor del equipo contrario. ¿Sigue el balón en juego?", "opciones": {"A": "No, el balón deja de estar en juego, al haber cambiado el equipo en posesión del balón tras el contacto.", "B": "Sí, ya que un simple cambio de posesión no está previsto como supuesto de balón fuera de juego.", "C": "Sí, el balón sigue en juego siempre que el cambio de posesión no derive directamente en un gol."}, "correcta": "A", "explicacion": "El balón no estará en juego cuando toque a un miembro del equipo arbitral, permanezca en el terreno de juego y el equipo en posesión del balón cambie.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-011", "bloque": "reglas", "enunciado": "¿Cómo se reanudará el juego en los supuestos en los que el balón deja de estar en juego por contacto con un miembro del equipo arbitral?", "opciones": {"A": "Con un tiro libre indirecto a favor del equipo que tuviera la posesión antes del contacto.", "B": "Con un balón a tierra.", "C": "Con un saque de banda a favor del equipo más próximo al lugar donde se produjo el contacto."}, "correcta": "B", "explicacion": "En todos los casos en los que el balón no esté en juego por contacto con un miembro del equipo arbitral en las circunstancias previstas, el juego se reanudará con un balón a tierra.", "referencia": "Regla 9.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-012", "bloque": "reglas", "enunciado": "El balón toca a un árbitro asistente, permanece en el terreno de juego, pero ningún equipo inicia un ataque prometedor, no entra directamente en la portería y la posesión no cambia. ¿Sigue el balón en juego?", "opciones": {"A": "Sí, el balón estará en juego en el resto de situaciones en las que entre en contacto con un miembro del equipo arbitral.", "B": "No, cualquier contacto del balón con un miembro del equipo arbitral detiene automáticamente el juego.", "C": "No, salvo que el árbitro decida expresamente que el juego continúe pese al contacto producido."}, "correcta": "A", "explicacion": "El balón estará en juego en el resto de situaciones en las que entre en contacto con un miembro del equipo arbitral, siempre que no se produzcan los supuestos que lo dejan fuera de juego.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-013", "bloque": "reglas", "enunciado": "Un disparo a portería rebota en el poste y el balón permanece dentro del terreno de juego. ¿Sigue el balón en juego?", "opciones": {"A": "No, salvo que el rebote se produzca en el travesaño y no en los postes laterales de la portería.", "B": "No, el rebote en el poste detiene el juego, debiendo reanudarse con un balón a tierra en el lugar del rebote.", "C": "Sí, el balón estará en juego cuando rebote en un poste, en el travesaño o en el banderín de esquina y permanezca en el terreno de juego."}, "correcta": "C", "explicacion": "El balón estará en juego cuando rebote en un poste o un travesaño, o en el banderín de esquina, y permanezca en el terreno de juego.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-014", "bloque": "reglas", "enunciado": "¿Qué ocurre si el balón rebota en el banderín de esquina y permanece en el terreno de juego?", "opciones": {"A": "El juego se detiene y debe reanudarse con un saque de esquina a favor del equipo atacante.", "B": "El balón sigue en juego, igual que si rebotara en un poste o en el travesaño.", "C": "El juego se detiene y debe reanudarse con un balón a tierra en el punto donde se produjo el rebote."}, "correcta": "B", "explicacion": "El balón estará en juego cuando rebote en un poste o un travesaño o en el banderín de esquina y permanezca en el terreno de juego.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-015", "bloque": "reglas", "enunciado": "Un suplente que se encuentra junto a la línea de banda, sin intención de interferir de forma antirreglamentaria, toca un balón que está claramente a punto de salir del campo. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Sancionará la acción con un tiro libre indirecto, sin imponer sanción disciplinaria.", "B": "No adoptará ninguna medida, al considerarse el balón fuera del terreno de juego en el momento del contacto.", "C": "Amonestará al suplente por conducta antideportiva y concederá un tiro libre indirecto al equipo contrario."}, "correcta": "A", "explicacion": "Si un suplente, sin intención de interferir de forma antirreglamentaria, toca un balón que está claramente a punto de salir del campo, la acción se sancionará con un tiro libre indirecto, sin sanción disciplinaria.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-016", "bloque": "reglas", "enunciado": "Un jugador que se encuentra temporalmente fuera del terreno de juego por una lesión toca, sin intención de interferir antirreglamentariamente, un balón que está claramente a punto de salir del campo. ¿Cómo debe actuar el árbitro?", "opciones": {"A": "Concederá un tiro libre directo a favor del equipo contrario, al tratarse de una interferencia de un jugador ajeno al juego.", "B": "Concederá un tiro libre indirecto a favor del equipo contrario, sin sanción disciplinaria para el jugador.", "C": "Amonestará al jugador por conducta antideportiva, además de conceder un tiro libre indirecto al equipo contrario."}, "correcta": "B", "explicacion": "Si un jugador temporalmente fuera del terreno de juego (por lesión, ajuste de equipamiento, etc.) toca sin intención antirreglamentaria un balón que está claramente a punto de salir del campo, se sancionará con un tiro libre indirecto, sin sanción disciplinaria.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-017", "bloque": "reglas", "enunciado": "Un jugador que ha sido expulsado y permanece junto al banquillo toca, sin intención de interferir de forma antirreglamentaria, un balón que está claramente a punto de salir del campo. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Expulsará también al miembro del cuerpo técnico responsable de su supervisión, además de conceder tiro libre indirecto.", "B": "No podrá sancionar la acción, ya que el jugador expulsado no forma parte del desarrollo del juego.", "C": "Sancionará la acción con un tiro libre indirecto a favor del equipo contrario, sin sanción disciplinaria adicional."}, "correcta": "C", "explicacion": "Entre las personas cuyo contacto no intencionado con un balón a punto de salir se sanciona con tiro libre indirecto y sin sanción disciplinaria se incluye a los jugadores expulsados.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-018", "bloque": "reglas", "enunciado": "¿Qué sanción disciplinaria conlleva que un miembro del cuerpo técnico toque, sin intención de interferir de forma antirreglamentaria, un balón que está claramente a punto de salir del campo?", "opciones": {"A": "Conlleva la amonestación obligatoria del miembro del cuerpo técnico implicado en la acción.", "B": "No conlleva ninguna sanción disciplinaria, únicamente un tiro libre indirecto.", "C": "Conlleva la expulsión del miembro del cuerpo técnico y de un jugador de su equipo a elección del árbitro."}, "correcta": "B", "explicacion": "La acción se sancionará con un tiro libre indirecto; no habrá sanción disciplinaria.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-019", "bloque": "reglas", "enunciado": "Un jugador que ha sido sustituido y permanece junto al banquillo toca, sin intención de interferir de forma antirreglamentaria, un balón que está claramente a punto de salir del campo. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario, sin sanción disciplinaria.", "B": "Concede un tiro libre directo a favor del equipo adversario y amonesta al jugador sustituido.", "C": "Detiene el juego y lo reanuda con un balón a tierra."}, "correcta": "A", "explicacion": "Si un jugador sustituido, sin intención de interferir de forma antirreglamentaria, toca un balón que está claramente a punto de salir del campo, se sanciona con tiro libre indirecto y sin sanción disciplinaria.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 9", "pagina": 55}, {"id": "RJ9-020", "bloque": "reglas", "enunciado": "Un disparo a portería rebota en el travesaño y el balón permanece dentro del terreno de juego. ¿Sigue el balón en juego?", "opciones": {"A": "No, el rebote en el travesaño detiene el juego y debe reanudarse con un balón a tierra en el lugar del rebote.", "B": "Sí, el balón estará en juego cuando rebote en el travesaño (al igual que en un poste o en el banderín de esquina) y permanezca en el terreno de juego.", "C": "No, salvo que el árbitro considere que no hubo intención de generar ventaja con el rebote."}, "correcta": "B", "explicacion": "El balón estará en juego cuando rebote en un poste, en el travesaño o en el banderín de esquina y permanezca en el terreno de juego.", "referencia": "Regla 9.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 9", "pagina": 55}, {"id": "RJ10-001", "bloque": "reglas", "enunciado": "¿Cuándo se considera que se ha marcado un gol según la Regla 10?", "opciones": {"A": "Cuando el balón atraviesa la línea de meta entre los postes y bajo el travesaño, siempre que no se haya cometido antes ninguna infracción por el equipo atacante.", "B": "Cuando el balón toca la red exterior de la portería, sin necesidad de que llegue a atravesar la línea de meta.", "C": "Cuando el árbitro considera que hubo una ocasión clara, aunque el balón no haya llegado a cruzar la línea de meta."}, "correcta": "A", "explicacion": "El gol se produce cuando el balón atraviesa por completo la línea de meta, entre los postes y bajo el travesaño, sin infracción previa del equipo atacante.", "referencia": "Regla 10", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-002", "bloque": "reglas", "enunciado": "¿Cuándo se considerará válido un gol?", "opciones": {"A": "Cuando el balón haya atravesado la línea de meta, con independencia de si el equipo que marca cometió previamente alguna infracción.", "B": "Cuando el balón haya atravesado completamente la línea de meta entre los postes y por debajo del travesaño, sin infracción previa del equipo que marca.", "C": "Cuando la mayor parte del balón haya sobrepasado la línea de meta entre los postes, sin necesidad de que la haya atravesado por completo."}, "correcta": "B", "explicacion": "Se considerará válido un gol cuando el balón haya atravesado completamente la línea de meta entre los postes y por debajo del travesaño, siempre que el equipo que marcó no haya cometido previamente una infracción.", "referencia": "Regla 10.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-003", "bloque": "reglas", "enunciado": "El guardameta lanza el balón con la mano y este entra directamente en la portería contraria. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concederá gol válido, al haber entrado el balón directamente en la portería.", "B": "Concederá un saque de meta.", "C": "Concederá un saque de esquina a favor del equipo que sufrió la acción."}, "correcta": "B", "explicacion": "Si el guardameta lanza el balón con la mano y este entra en la portería contraria directamente, se concederá saque de meta.", "referencia": "Regla 10.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-004", "bloque": "reglas", "enunciado": "El árbitro señala gol antes de que el balón haya traspasado completamente la línea de meta. ¿Cómo debe reanudarse el juego al advertir el error?", "opciones": {"A": "Con un balón a tierra.", "B": "Con un saque de meta a favor del equipo defensor, al no haber entrado completamente el balón en la portería.", "C": "Manteniendo el gol como válido, al haber sido ya señalado por el árbitro en el momento de la jugada."}, "correcta": "A", "explicacion": "Si el árbitro señalara un gol antes de que el balón hubiera traspasado completamente la línea de meta, el juego se reanudará con un balón a tierra.", "referencia": "Regla 10.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-005", "bloque": "reglas", "enunciado": "¿Qué equipo será declarado ganador de un partido?", "opciones": {"A": "El que haya recibido menos tarjetas y sanciones disciplinarias a lo largo del partido.", "B": "El que haya marcado el mayor número de goles.", "C": "El que haya tenido mayor posesión del balón durante el encuentro, con independencia del resultado."}, "correcta": "B", "explicacion": "El equipo que haya marcado el mayor número de goles será el ganador.", "referencia": "Regla 10.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-006", "bloque": "reglas", "enunciado": "¿Qué ocurre si ambos equipos marcan el mismo número de goles o no marca ninguno?", "opciones": {"A": "Se declarará ganador al equipo visitante, salvo que el reglamento de la competición disponga otra cosa.", "B": "Se procederá automáticamente a la tanda de penales, sin necesidad de que lo exija el reglamento de la competición.", "C": "El partido terminará en empate."}, "correcta": "C", "explicacion": "Si ambos equipos marcan el mismo número de goles o no marcan ninguno, el partido terminará en empate.", "referencia": "Regla 10.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-007", "bloque": "reglas", "enunciado": "¿Cuáles son los procedimientos permitidos para determinar un vencedor cuando el reglamento de la competición exige que haya un ganador tras un partido empatado?", "opciones": {"A": "Únicamente la tanda de penales, ya que es el único procedimiento admitido por las Reglas de Juego para desempatar un partido.", "B": "La regla de goles marcados fuera de casa, dos periodos de tiempo suplementario de igual duración que no excedan los 15 minutos cada uno, y la tanda de penales.", "C": "El resultado del partido de ida, la posición en la clasificación general y, en último caso, un sorteo por moneda."}, "correcta": "B", "explicacion": "Se permitirán únicamente los siguientes procedimientos para determinar el vencedor: la regla de goles marcados fuera de casa, dos periodos de tiempo suplementario que no excedan los 15 minutos cada uno, y la tanda de penales.", "referencia": "Regla 10.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-008", "bloque": "reglas", "enunciado": "¿Pueden combinarse varios de los procedimientos previstos para determinar un equipo ganador tras un empate?", "opciones": {"A": "Solo pueden combinarse la regla de goles fuera de casa y la tanda de penales, no así el tiempo suplementario.", "B": "No, el reglamento de la competición debe optar por uno solo de los procedimientos, sin posibilidad de combinarlos.", "C": "Sí, se podrán combinar varios de los procedimientos previstos."}, "correcta": "C", "explicacion": "Se podrán combinar varios de los procedimientos previstos para determinar el vencedor tras un partido empatado.", "referencia": "Regla 10.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 56}, {"id": "RJ10-009", "bloque": "reglas", "enunciado": "¿Cuándo se ejecutará la tanda de penales?", "opciones": {"A": "Inmediatamente después del descanso del tiempo suplementario, sin esperar a la finalización del partido.", "B": "Una vez terminado el partido.", "C": "Durante el tiempo añadido del segundo periodo del tiempo suplementario, antes de que finalice el encuentro."}, "correcta": "B", "explicacion": "La tanda de penales se ejecutará una vez terminado el partido y, a menos que se estipule algo diferente, se aplicarán las Reglas de Juego correspondientes.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-010", "bloque": "reglas", "enunciado": "Un jugador fue expulsado durante el tiempo reglamentario del partido. ¿Puede participar en la tanda de penales?", "opciones": {"A": "No, los jugadores expulsados a lo largo del partido no podrán participar en la tanda de penales.", "B": "Sí, ya que las sanciones del tiempo reglamentario no tienen efecto sobre la tanda de penales.", "C": "Sí, siempre que la expulsión se hubiera producido antes del inicio del tiempo suplementario."}, "correcta": "A", "explicacion": "Los jugadores expulsados a lo largo del partido no podrán participar en la tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-011", "bloque": "reglas", "enunciado": "Un jugador fue amonestado durante el partido antes de llegar a la tanda de penales. ¿Se tiene en cuenta dicha amonestación durante la tanda?", "opciones": {"A": "No, las advertencias y amonestaciones impuestas durante el encuentro no se tendrán en consideración en la tanda de penales.", "B": "Sí, una segunda amonestación durante la tanda implicará automáticamente su expulsión, sumándose a la anterior.", "C": "Sí, aunque solo a efectos estadísticos, sin que afecte a la posibilidad de participar en la tanda de penales."}, "correcta": "A", "explicacion": "Las advertencias y amonestaciones impuestas a jugadores y miembros del cuerpo técnico durante el encuentro no se tendrán en consideración en la tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-012", "bloque": "reglas", "enunciado": "¿Cómo decide el árbitro, con carácter general, en qué portería se desarrollará la tanda de penales?", "opciones": {"A": "Elegirá siempre la portería que se hubiera utilizado durante el segundo tiempo del partido, sin realizar sorteo alguno.", "B": "Mediante un sorteo con el lanzamiento de una moneda al aire, salvo que deban tenerse en cuenta otras consideraciones como el estado del terreno o la seguridad.", "C": "Elegirá la portería más próxima al banquillo del equipo que resultara ganador del sorteo inicial de campo."}, "correcta": "B", "explicacion": "El árbitro realizará un sorteo mediante moneda para decidir la portería en la que se desarrollará la tanda, salvo que otras consideraciones como el estado del terreno o la seguridad lo impidan.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-013", "bloque": "reglas", "enunciado": "Tras decidir la portería, ¿cómo se determina qué equipo ejecuta el primer lanzamiento de la tanda de penales?", "opciones": {"A": "Ejecutará primero el equipo visitante, salvo acuerdo expreso en contrario entre ambos capitanes.", "B": "Ejecutará primero el equipo que hubiera marcado el primer gol del partido, sin necesidad de nuevo sorteo.", "C": "El árbitro realizará un nuevo sorteo con una moneda y el equipo favorecido decidirá si ejecuta el primer o el segundo lanzamiento."}, "correcta": "C", "explicacion": "El árbitro realizará un nuevo sorteo mediante moneda, y el equipo que resulte favorecido decidirá si ejecuta el primer o el segundo lanzamiento.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-014", "bloque": "reglas", "enunciado": "¿Qué jugadores están autorizados, con carácter general, a participar en la tanda de penales?", "opciones": {"A": "Cualquier jugador de la convocatoria, incluidos los sustituidos a lo largo del partido antes de la tanda.", "B": "Aquellos que al final del partido se encuentren en el terreno de juego, o que estén momentáneamente fuera por lesión, cambios de equipamiento, etc.", "C": "Únicamente los once jugadores que hubieran comenzado el partido, con independencia de sustituciones o lesiones."}, "correcta": "B", "explicacion": "Solamente estarán autorizados a participar aquellos jugadores que al final del partido se encuentren en el terreno de juego, o momentáneamente fuera del mismo por lesión, cambios de equipamiento, etc.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-015", "bloque": "reglas", "enunciado": "¿Quién decide el orden en el que cada equipo ejecutará sus lanzamientos en la tanda de penales?", "opciones": {"A": "El árbitro, que fija el orden de lanzamiento en función del sorteo inicial de la tanda de penales.", "B": "El equipo que gane el sorteo para elegir portería, que también decide el orden de ambos equipos.", "C": "Cada equipo decide su propio orden, sin necesidad de informar de él al árbitro con antelación."}, "correcta": "C", "explicacion": "Cada uno de los equipos se encargará de decidir el orden en el que ejecutará los lanzamientos, sin que se informe del mismo al árbitro.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-016", "bloque": "reglas", "enunciado": "Al finalizar el partido, el Equipo A cuenta con más jugadores en el terreno de juego que el Equipo B. ¿Qué debe hacer el árbitro antes de la tanda de penales?", "opciones": {"A": "El Equipo B deberá incorporar jugadores adicionales desde el banquillo hasta igualar el número del Equipo A.", "B": "El Equipo A deberá reducir su número de jugadores para igualarlo al del equipo rival, informando al árbitro del nombre y número de los jugadores excluidos.", "C": "El árbitro suspenderá definitivamente el partido, al no existir igualdad numérica entre ambos equipos."}, "correcta": "B", "explicacion": "Si un equipo tiene más jugadores que su adversario al finalizar el partido, deberá reducir su número para igualarlo, informando al árbitro del nombre y número de los jugadores excluidos.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-017", "bloque": "reglas", "enunciado": "Un guardameta no se encuentra en condiciones de continuar antes de la tanda de penales y su equipo ya ha utilizado el número máximo de sustituciones. ¿Por quién puede ser reemplazado?", "opciones": {"A": "No podrá ser reemplazado en ningún caso, debiendo su equipo afrontar la tanda con un jugador de campo en la portería.", "B": "Por un miembro del cuerpo técnico debidamente inscrito en el acta del partido.", "C": "Por un jugador excluido para igualar el número de jugadores con el equipo rival."}, "correcta": "C", "explicacion": "Un guardameta que no pueda continuar podrá ser reemplazado por un jugador excluido para igualar el número, o, si el equipo no ha agotado sus sustituciones, por un suplente designado en la lista oficial.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 57}, {"id": "RJ10-018", "bloque": "reglas", "enunciado": "Un guardameta ya ha ejecutado un lanzamiento en la tanda de penales y a continuación queda fuera de condiciones para continuar. ¿Puede su suplente ejecutar lanzamientos posteriores?", "opciones": {"A": "Sí, el suplente puede ejecutar de inmediato los lanzamientos restantes en sustitución del guardameta.", "B": "Sí, pero únicamente el lanzamiento inmediatamente posterior, no los siguientes en caso de prórroga de la tanda.", "C": "No, si el guardameta hubiera ejecutado ya un lanzamiento, el suplente no podrá ejecutarlo hasta la siguiente tanda de penales."}, "correcta": "C", "explicacion": "Si el guardameta hubiera ejecutado ya un lanzamiento, el suplente no podrá ejecutar el tiro hasta la siguiente tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-019", "bloque": "reglas", "enunciado": "¿Quiénes pueden permanecer en el terreno de juego durante el desarrollo de la tanda de penales?", "opciones": {"A": "Todos los jugadores de la convocatoria de ambos equipos, sin ninguna restricción durante la tanda.", "B": "Únicamente los jugadores autorizados para participar en la tanda y los miembros del equipo arbitral.", "C": "Los jugadores autorizados para participar y, además, un miembro del cuerpo técnico de cada equipo."}, "correcta": "B", "explicacion": "Solamente podrán permanecer en el terreno de juego los jugadores autorizados para participar en la tanda de penales y los miembros del equipo arbitral.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-020", "bloque": "reglas", "enunciado": "¿Dónde deben permanecer los jugadores autorizados que no son el lanzador ni los dos guardametas?", "opciones": {"A": "En sus respectivos banquillos de suplentes, junto al resto del equipo técnico.", "B": "Fuera del terreno de juego, en la zona de calentamiento habilitada por la organización.", "C": "En el interior del círculo central."}, "correcta": "C", "explicacion": "Todos los jugadores autorizados para participar en la tanda, excepto el lanzador y los dos guardametas, deberán permanecer en el interior del círculo central.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-021", "bloque": "reglas", "enunciado": "¿Dónde debe situarse el guardameta del equipo que ejecuta el lanzamiento durante la tanda de penales?", "opciones": {"A": "Dentro del área penal, junto al punto de penal, para poder intervenir en caso de rechace.", "B": "En el terreno de juego, fuera del área penal, en la intersección de la línea de meta con la línea de demarcación del área penal.", "C": "En el interior del círculo central junto al resto de jugadores autorizados que no ejecutan el lanzamiento."}, "correcta": "B", "explicacion": "El guardameta del equipo ejecutor del lanzamiento deberá permanecer en el terreno de juego, fuera del área penal, en la intersección de la línea de meta con la línea de demarcación del área penal.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-022", "bloque": "reglas", "enunciado": "¿Puede un jugador autorizado a participar en la tanda de penales intercambiar su puesto con el guardameta?", "opciones": {"A": "Sí, pero únicamente antes de que comience la tanda de penales, no una vez iniciada esta.", "B": "Sí, cualquiera de los jugadores autorizados para participar en la tanda de penales podrá intercambiar su puesto con el guardameta.", "C": "No, el intercambio de puesto con el guardameta solo está permitido durante el tiempo reglamentario del partido."}, "correcta": "B", "explicacion": "Cualquiera de los jugadores autorizados para participar en la tanda de penales podrá intercambiar su puesto con el guardameta.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-023", "bloque": "reglas", "enunciado": "¿Cuándo se considerará que un penal de la tanda se ha completado?", "opciones": {"A": "Únicamente cuando el balón entre en la portería o sea claramente despejado fuera del terreno de juego.", "B": "Cuando el guardameta toque el balón, con independencia de si este continúa moviéndose después del contacto.", "C": "Cuando el balón deje de moverse, deje de estar en juego, o el árbitro detenga el juego por una infracción."}, "correcta": "C", "explicacion": "Se considerará que el penal se ha completado cuando el balón deje de moverse, deje de estar en juego o el árbitro detenga el juego por una infracción.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-024", "bloque": "reglas", "enunciado": "Durante la tanda de penales, el lanzador golpea el balón de manera involuntaria con los dos pies simultáneamente y el balón entra en la portería. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Se registrará como fallado y se amonestará al lanzador por la irregularidad cometida.", "B": "Se concederá el gol como válido, al haber entrado el balón en la portería tras el lanzamiento.", "C": "Se volverá a ejecutar el tiro."}, "correcta": "C", "explicacion": "Si el lanzador golpea el balón de manera involuntaria con los dos pies simultáneamente y el balón entrara en la portería, se volverá a ejecutar el tiro.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-025", "bloque": "reglas", "enunciado": "Durante la tanda de penales, tras golpear el balón de forma involuntaria con los dos pies a la vez, el lanzamiento no acaba en gol. ¿Cómo se registra?", "opciones": {"A": "Se registrará como fallado.", "B": "Se repetirá el lanzamiento en todo caso, al tratarse de una irregularidad en la ejecución del tiro.", "C": "Se concederá un nuevo intento adicional al final de la ronda de cinco lanzamientos de ese equipo."}, "correcta": "A", "explicacion": "Si el lanzamiento no acabara en gol tras golpear el balón con los dos pies simultáneamente, se registrará como fallado.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-026", "bloque": "reglas", "enunciado": "En la tanda de penales, un guardameta comete una infracción y, como resultado, se debe repetir el lanzamiento por primera vez en la tanda. ¿Qué decisión disciplinaria toma el árbitro con dicho guardameta?", "opciones": {"A": "Le amonestará directamente desde la primera infracción, sin previa advertencia verbal.", "B": "No tomará ninguna medida, ya que la única consecuencia prevista es la repetición del lanzamiento.", "C": "Le advertirá por tratarse de la primera infracción, amonestándolo en caso de reincidencia."}, "correcta": "C", "explicacion": "Si el guardameta cometiera una infracción que obligue a repetir el lanzamiento, se le advertirá por la primera infracción y se le amonestará en caso de reincidencia.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-027", "bloque": "reglas", "enunciado": "En la tanda de penales, el lanzador comete una infracción después de que el árbitro haya dado la señal para ejecutar el lanzamiento. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Se dará por completada la tanda de penales, al no poder continuarse tras una infracción del propio lanzador.", "B": "Se registrará el lanzamiento como fallado y se amonestará al lanzador.", "C": "Se repetirá el lanzamiento sin más consecuencias disciplinarias para el jugador infractor."}, "correcta": "B", "explicacion": "Si el lanzador es penalizado por una infracción cometida después de que el árbitro haya dado la señal para ejecutar el lanzamiento, se registrará como fallado y se amonestará al lanzador.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-028", "bloque": "reglas", "enunciado": "Antes de que ambos equipos hayan ejecutado sus cinco lanzamientos, un equipo ha marcado ya más goles de los que el adversario podría anotar con sus lanzamientos restantes. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Suspenderá la tanda temporalmente para consultar con el resto del equipo arbitral antes de darla por finalizada.", "B": "Dará por terminada la tanda de penales.", "C": "Continuará la tanda hasta que ambos equipos completen sus cinco lanzamientos, con independencia del resultado."}, "correcta": "B", "explicacion": "Si, antes de que ambos equipos hayan ejecutado sus cinco tiros, uno hubiera marcado más goles que los que el adversario pudiera anotar con sus cinco lanzamientos, se dará por terminada la tanda.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-029", "bloque": "reglas", "enunciado": "Tras ejecutar ambos equipos sus cinco lanzamientos, el marcador de la tanda de penales sigue empatado. ¿Cómo continúa la tanda?", "opciones": {"A": "Se proseguirá con los tiros penales hasta que un equipo haya marcado un gol más que el otro tras ejecutar el mismo número de lanzamientos.", "B": "Se declarará empatado el partido de forma definitiva, sin continuar con más lanzamientos de la tanda.", "C": "Se repetirán únicamente los dos últimos lanzamientos de cada equipo hasta obtener un resultado distinto."}, "correcta": "A", "explicacion": "Si, tras ejecutar ambos equipos sus cinco lanzamientos, el marcador siguiera empatado, se proseguirá con los tiros penales hasta que un equipo haya marcado un gol más que el otro tras el mismo número de lanzamientos.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-030", "bloque": "reglas", "enunciado": "En la ronda de desempate posterior a los cinco primeros lanzamientos de cada equipo, ¿pueden los equipos cambiar el orden de sus lanzadores?", "opciones": {"A": "Sí, la regla del gol de más se aplicará también a la secuencia posterior de tiros, y los equipos podrán cambiar el orden de los lanzadores.", "B": "Sí, pero únicamente el equipo que ejecute en segundo lugar podrá modificar el orden de sus lanzadores.", "C": "No, el orden establecido en la primera ronda de cinco lanzamientos debe mantenerse durante toda la tanda."}, "correcta": "A", "explicacion": "La regla de decidir por un gol más tras el mismo número de lanzamientos también es aplicable a la secuencia posterior, y los equipos podrán cambiar el orden de los lanzadores.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-031", "bloque": "reglas", "enunciado": "Durante la tanda de penales, un jugador abandona brevemente el terreno de juego y no regresa a tiempo para ejecutar su lanzamiento cuando le corresponde. ¿Debe retrasarse la tanda para esperarle?", "opciones": {"A": "No, pero en tal caso se pasará directamente al siguiente equipo sin registrar el lanzamiento como fallado ni como marcado.", "B": "Sí, la tanda debe esperar razonablemente a que el jugador regrese antes de continuar con el siguiente lanzamiento.", "C": "No, la tanda no deberá retrasarse porque un jugador abandone el terreno de juego; si no regresa a tiempo, se registrará su lanzamiento como fallado."}, "correcta": "C", "explicacion": "La tanda no deberá retrasarse porque un jugador abandone el terreno de juego; si dicho jugador no regresara a tiempo para ejecutar el lanzamiento, se registrará como fallado.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-032", "bloque": "reglas", "enunciado": "¿Pueden amonestarse o expulsarse jugadores, suplentes o miembros del cuerpo técnico durante la tanda de penales?", "opciones": {"A": "No, durante la tanda de penales no se pueden imponer nuevas sanciones disciplinarias bajo ningún concepto.", "B": "Solo se puede amonestar, pero en ningún caso expulsar, a jugadores durante el desarrollo de la tanda de penales.", "C": "Sí, se podrá amonestar o expulsar a jugadores, suplentes, jugadores sustituidos o miembros del cuerpo técnico."}, "correcta": "C", "explicacion": "Se podrá amonestar o expulsar a jugadores, suplentes, jugadores sustituidos o miembros del cuerpo técnico durante la tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-033", "bloque": "reglas", "enunciado": "Se expulsa a un guardameta durante la tanda de penales. ¿Por quién debe ser sustituido?", "opciones": {"A": "Su equipo deberá continuar la tanda sin guardameta, con el hueco de su portería sin cubrir.", "B": "Por un jugador autorizado para participar en la tanda.", "C": "Por cualquier suplente de la convocatoria, aunque no estuviera autorizado a participar en la tanda."}, "correcta": "B", "explicacion": "Si se expulsara a un guardameta durante la tanda, este deberá ser sustituido por un jugador autorizado para participar en la tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-034", "bloque": "reglas", "enunciado": "Salvo en el caso del guardameta, ¿se puede sustituir a un jugador que sí está en condiciones de continuar jugando durante la tanda de penales?", "opciones": {"A": "No, a excepción del guardameta, no se podrá sustituir a ningún jugador que esté en condiciones de continuar jugando.", "B": "Sí, cada equipo dispone de una sustitución adicional exclusivamente para la tanda de penales.", "C": "Sí, siempre que el jugador sustituido no haya ejecutado todavía ningún lanzamiento en la tanda."}, "correcta": "A", "explicacion": "A excepción del guardameta, no se podrá sustituir a ningún jugador que no esté en condiciones de continuar jugando.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-035", "bloque": "reglas", "enunciado": "Durante la tanda de penales, un equipo se queda con menos de siete jugadores tras varias expulsiones. ¿Debe el árbitro suspender definitivamente el partido?", "opciones": {"A": "Sí, salvo que ambos equipos acuerden expresamente continuar la tanda de penales pese a la inferioridad numérica.", "B": "No, el árbitro no suspenderá definitivamente el partido aunque un equipo se quedara con menos de siete jugadores.", "C": "Sí, deberá suspender definitivamente el partido en cuanto un equipo cuente con menos de siete jugadores."}, "correcta": "B", "explicacion": "El árbitro no suspenderá definitivamente el partido aunque un equipo se quedara con menos de siete jugadores durante la tanda de penales.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-036", "bloque": "reglas", "enunciado": "Durante una tanda de penaltis, un equipo se queda con menos de 7 jugadores disponibles. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Ordenar que el equipo adversario reduzca su número de lanzadores hasta igualarlo con el del equipo mermado, y continuar la tanda.", "B": "Suspender definitivamente el partido, al no poder continuarse la tanda de penaltis con menos de siete jugadores.", "C": "Continuar la tanda con normalidad sin igualar el número de lanzadores de ambos equipos participantes."}, "correcta": "A", "explicacion": "Si un equipo llega a la tanda de penaltis con menos de 7 jugadores, se reduce el número de lanzadores del equipo contrario para igualar la cifra, continuando la tanda hasta que haya un vencedor.", "referencia": "Anexo tandas de penaltis", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 10", "pagina": 58}, {"id": "RJ10-037", "bloque": "reglas", "regla": "Regla 10", "articulo": null, "enunciado": "En la tanda de penales, antes de que un jugador pueda ejecutar un segundo lanzamiento, ¿qué debe haber ocurrido?", "opciones": {"A": "Que todos los jugadores autorizados de su equipo hayan ejecutado ya un primer lanzamiento.", "B": "Que hayan transcurrido las cinco primeras rondas, sin importar quién haya lanzado en cada una.", "C": "Que el capitán del equipo lo autorice expresamente ante el árbitro antes de cada nuevo turno."}, "correcta": "A", "explicacion": "Cada uno de los lanzamientos deberá ejecutarlo un jugador diferente; antes de que un jugador pueda ejecutar un segundo penal, todos los jugadores seleccionados para participar en la tanda deben haber ejecutado ya un primer lanzamiento.", "referencia": "Regla 10.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "pagina": 58}, {"id": "RJ11-001", "bloque": "reglas", "enunciado": "En una disputa por un balón aéreo, un defensor cae accidentalmente fuera del terreno de juego junto a la portería. El balón rechazado es rematado por un atacante hacia portería, y el guardameta ve interferido su campo visual por otro atacante situado delante de él, entrando el balón en la portería. ¿Debe anularse el gol por fuera de juego?", "opciones": {"A": "Sí, se anula por interferencia en un adversario, ya que el defensor fuera del terreno cuenta como si estuviera en la línea de meta a efectos de fuera de juego.", "B": "No, el gol es válido, ya que el defensor que cae fuera del terreno de juego de forma accidental deja de contar a efectos de fuera de juego.", "C": "Sí, se anula porque el defensor, al estar fuera de forma accidental, deja de contar para el fuera de juego y el atacante queda adelantado."}, "correcta": "A", "explicacion": "Un jugador que sale accidentalmente del terreno de juego se considera situado en la línea de banda o de meta más próxima a efectos de fuera de juego, por lo que procede anular el gol por interferencia.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-002", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego y un compañero que no lo está corren ambos hacia el balón; finalmente juega el balón el compañero que no estaba en posición antirreglamentaria. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Interrumpe el juego y concede tiro libre indirecto donde se jugó el balón.", "B": "Interrumpe el juego y concede tiro libre indirecto por la posición de fuera de juego del otro jugador.", "C": "Deja que el juego continúe, salvo que el jugador en posición de fuera de juego interfiera con un adversario."}, "correcta": "C", "explicacion": "Estar en posición de fuera de juego no constituye infracción por sí sola; solo se sanciona si el jugador interviene interfiriendo en el juego, en un adversario o obtiene ventaja de esa posición.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-003", "bloque": "reglas", "enunciado": "Cuando el guardameta lanza el balón con las manos, ¿qué se tiene en cuenta para determinar el fuera de juego?", "opciones": {"A": "El primer punto de contacto al 'jugar' o 'tocar' el balón.", "B": "El último punto de contacto en el momento de lanzarlo con la mano.", "C": "El primer o último contacto, según cada situación concreta."}, "correcta": "B", "explicacion": "Cuando el guardameta lanza el balón con la mano, para el fuera de juego se toma en cuenta el último punto de contacto del guardameta con el balón.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-004", "bloque": "reglas", "enunciado": "Un atacante se encuentra exactamente a la misma altura que el guardameta, siendo este el último defensor. ¿Existe posición de fuera de juego?", "opciones": {"A": "No.", "B": "Sí.", "C": "No, porque tiene un adversario entre él y la línea de meta."}, "correcta": "A", "explicacion": "Estar a la misma altura que el penúltimo o último adversario no constituye posición de fuera de juego, ya que se exige estar más cerca de la línea de meta contraria que dicho adversario.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-005", "bloque": "reglas", "enunciado": "Un jugador se encuentra en posición de fuera de juego pero no interviene en el juego de ningún modo, ni interfiere a un adversario ni obtiene ventaja de dicha posición. ¿Debe sancionarse?", "opciones": {"A": "Sí, siempre que esté en posición de fuera de juego cuando el balón sea jugado por un compañero.", "B": "No, la posición de fuera de juego no es sancionable por sí sola si no interviene activamente.", "C": "Solo si se encuentra en el área penal contraria."}, "correcta": "B", "explicacion": "Estar en posición de fuera de juego no constituye infracción en sí misma; se exige intervención activa (jugar el balón, interferir a un adversario u obtener ventaja) para sancionarla.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-006", "bloque": "reglas", "enunciado": "Un atacante recibe el balón directamente de un saque de banda estando en posición adelantada respecto a los defensores. ¿Puede sancionarse fuera de juego?", "opciones": {"A": "Sí, se sanciona igual que en juego normal.", "B": "No, no existe fuera de juego en un saque de banda.", "C": "Solo si el saque de banda lo ejecuta un compañero situado en su propio campo."}, "correcta": "B", "explicacion": "La Regla 11 excluye expresamente el fuera de juego cuando el jugador recibe el balón directamente de un saque de banda.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-007", "bloque": "reglas", "enunciado": "¿Existe posición de fuera de juego si un jugador recibe el balón directamente de un saque de esquina?", "opciones": {"A": "Sí, se aplica el fuera de juego con normalidad.", "B": "No, el saque de esquina es una de las excepciones al fuera de juego.", "C": "Solo si el ejecutor del córner es el propio guardameta."}, "correcta": "B", "explicacion": "El saque de esquina, junto con el saque de meta y el de banda, es una excepción reglamentaria a la sanción de fuera de juego.", "referencia": "Regla 11", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-008", "bloque": "reglas", "enunciado": "¿Constituye infracción por sí misma estar en posición de fuera de juego?", "opciones": {"A": "Sí, cualquier jugador en posición de fuera de juego debe ser sancionado de forma automática.", "B": "Sí, salvo que el jugador se encuentre en su propia mitad del terreno de juego en el momento del pase.", "C": "No, el hecho de estar en posición de fuera de juego no constituye infracción."}, "correcta": "C", "explicacion": "El hecho de estar en posición de fuera de juego no constituye infracción por sí mismo.", "referencia": "Regla 11.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-009", "bloque": "reglas", "enunciado": "¿Qué dos condiciones deben cumplirse para que un jugador se encuentre en posición de fuera de juego?", "opciones": {"A": "Que se encuentre en cualquier parte del terreno de juego y más cerca de la portería rival que el último adversario.", "B": "Que su cabeza, tronco o pierna estén en la mitad de campo contraria y más cerca de la línea de meta rival que el balón y el penúltimo adversario.", "C": "Que su cabeza, tronco, pierna o brazo estén en la mitad de campo contraria y más cerca de la portería rival que el balón."}, "correcta": "B", "explicacion": "Un jugador está en posición de fuera de juego cuando su cabeza, tronco o pierna se encuentran en la mitad del campo contraria y más cerca de la línea de meta rival que el balón y el penúltimo adversario.", "referencia": "Regla 11.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-010", "bloque": "reglas", "enunciado": "¿Se tienen en cuenta las manos o los brazos de los jugadores para determinar la posición de fuera de juego?", "opciones": {"A": "No, no se tendrán en consideración las manos ni los brazos, tampoco en el caso de los guardametas.", "B": "Solo se tienen en cuenta los brazos, pero no las manos, de los jugadores de campo, excluyendo a los guardametas.", "C": "Sí, se tienen en cuenta tanto las manos como los brazos de todos los jugadores, incluidos los guardametas."}, "correcta": "A", "explicacion": "A la hora de determinar si un jugador está en posición de fuera de juego, no se tendrán en consideración las manos ni los brazos de los jugadores, tampoco en el caso de los guardametas.", "referencia": "Regla 11.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-011", "bloque": "reglas", "enunciado": "¿Dónde se sitúa el límite superior del brazo a efectos de determinar el fuera de juego?", "opciones": {"A": "Coincide con la línea del hombro del jugador, incluyendo por tanto todo el brazo en su totalidad.", "B": "Coincide con el codo del jugador, quedando el antebrazo excluido de la consideración corporal.", "C": "Coincide con el punto inferior de la axila."}, "correcta": "C", "explicacion": "Con el fin de determinar con claridad las infracciones por fuera de juego, el límite superior del brazo coincide con el punto inferior de la axila.", "referencia": "Regla 11.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-012", "bloque": "reglas", "enunciado": "¿Está en posición de fuera de juego un jugador que se encuentra exactamente a la misma altura que el penúltimo adversario?", "opciones": {"A": "Depende de si el jugador está más cerca de la línea de banda o del centro del terreno de juego en ese momento.", "B": "Sí, siempre que se encuentre más adelantado que el balón en el momento en que este es jugado por un compañero.", "C": "No, no estará en fuera de juego aquel jugador que se encuentre a la misma altura que el penúltimo adversario o que los dos últimos adversarios."}, "correcta": "C", "explicacion": "No estará en fuera de juego aquel jugador que se encuentre a la misma altura que el penúltimo adversario o que los dos últimos adversarios.", "referencia": "Regla 11.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-013", "bloque": "reglas", "enunciado": "¿En qué momento se sanciona a un jugador que se encuentra en posición de fuera de juego?", "opciones": {"A": "En el momento en que el jugador toca físicamente el balón, con independencia de cuándo se lo hubiera jugado un compañero.", "B": "En el momento en que el balón toca o es jugado por un compañero de equipo, siempre que participe de forma activa en el juego.", "C": "En el momento en que el árbitro asistente levanta el banderín, aunque el balón aún no haya sido jugado por ningún compañero."}, "correcta": "B", "explicacion": "Únicamente se sancionará a un jugador en posición de fuera de juego en el momento en que el balón toca o es jugado por un compañero, si llega a participar en el juego de forma activa.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-014", "bloque": "reglas", "enunciado": "¿Cuál de las siguientes NO es una de las formas en que un jugador en posición de fuera de juego participa de forma activa en el juego?", "opciones": {"A": "Impedir que un adversario juegue el balón, al obstruir claramente su campo visual.", "B": "Permanecer estático y alejado del balón, sin intervenir de ninguna manera en la jugada en curso.", "C": "Interferir en el juego, al jugar o tocar un balón pasado o tocado por un compañero."}, "correcta": "B", "explicacion": "Un jugador en posición de fuera de juego participa activamente cuando interfiere en el juego, impide que el adversario juegue el balón o le disputa el balón, entre otras acciones; permanecer estático sin intervenir no constituye participación activa.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-015", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego disputa el balón a un adversario tras el pase de un compañero. ¿Se sanciona esta acción?", "opciones": {"A": "No, disputar el balón no está previsto como una forma de participación activa en el juego según la Regla 11.", "B": "Sí, disputar el balón a un adversario es una de las formas de participar activamente en el juego que se sanciona.", "C": "Solo se sanciona si el jugador llega a tocar efectivamente el balón durante la disputa con el adversario."}, "correcta": "B", "explicacion": "Un jugador en posición de fuera de juego que participa activamente disputándole el balón a un adversario debe ser sancionado.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-016", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego obstruye claramente el campo visual de un adversario, impidiendo que este pueda jugar el balón. ¿Se sanciona esta acción?", "opciones": {"A": "No, esta situación únicamente se sanciona como falta ordinaria conforme a la Regla 12, no como fuera de juego.", "B": "Sí, impedir que el adversario juegue el balón obstruyendo claramente su campo visual es una forma de participación activa sancionable.", "C": "No, la obstrucción del campo visual solo se sanciona si además el jugador llega a tocar el balón directamente."}, "correcta": "B", "explicacion": "Un jugador en posición de fuera de juego que impide que juegue o pueda jugar el balón un adversario, al obstruir claramente su campo visual, participa activamente en el juego y debe ser sancionado.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-017", "bloque": "reglas", "enunciado": "Un balón es desviado por un adversario y llega hasta un jugador que se encontraba en posición de fuera de juego, quien saca ventaja de dicha posición. ¿Se sanciona la acción?", "opciones": {"A": "Sí, sacar ventaja de la posición de fuera de juego cuando el balón ha sido desviado o rebotado en un adversario también se sanciona.", "B": "No, únicamente se sanciona el fuera de juego cuando el balón procede directamente de un pase de un compañero, sin desvíos.", "C": "No, si el balón procede de un desvío o rebote en un adversario, la posición de fuera de juego deja de ser sancionable."}, "correcta": "A", "explicacion": "Se considerará que un jugador saca ventaja de la posición de fuera de juego cuando juegue el balón o interfiera en el juego de un adversario después de que el balón haya sido desviado o haya rebotado en un adversario.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-018", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego recibe el balón directamente de un adversario que lo juega voluntariamente. ¿Se considera que ha sacado ventaja de dicha posición?", "opciones": {"A": "No, salvo que se trate de una «salvada» por parte de ese adversario.", "B": "Sí, pero únicamente si el jugador estaba claramente más adelantado que el penúltimo defensor en ese momento.", "C": "Sí, siempre que el jugador reciba el balón directamente de cualquier adversario, se considerará que sacó ventaja."}, "correcta": "A", "explicacion": "Se considerará que un jugador en posición de fuera de juego no ha sacado ventaja cuando reciba el balón de un adversario que lo juega voluntariamente, incluida la mano voluntaria, a menos que se trate de una «salvada».", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-019", "bloque": "reglas", "enunciado": "¿Qué se entiende por una «salvada» a efectos del fuera de juego?", "opciones": {"A": "Una intervención del guardameta con las manos dentro de su propia área penal, sea cual sea la trayectoria del balón, considerándose salvada cualquier parada realizada allí.", "B": "Una acción de un jugador cuyo fin es detener o desviar (o intentarlo) un balón que va en dirección a la portería o muy cerca de ella, con cualquier parte del cuerpo excepto manos o brazos, salvo el guardameta en su propia área.", "C": "Cualquier despeje realizado por un defensor en su propia área penal, con independencia de la dirección que tome el balón tras el contacto del jugador."}, "correcta": "B", "explicacion": "Una «salvada» es una acción de un jugador cuyo fin es detener o desviar el balón, o intentarlo, cuando va en dirección a la portería o muy cerca de ella, con cualquier parte del cuerpo salvo las manos o los brazos, a menos que sea el guardameta en su propia área.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-020", "bloque": "reglas", "enunciado": "¿Qué implica que un jugador juegue «voluntariamente» el balón, a efectos de la Regla 11?", "opciones": {"A": "Que el balón proceda de un compañero de equipo, sin que sea posible jugar voluntariamente un balón de un adversario.", "B": "Que el balón le llegue a gran velocidad y logre tocarlo, con independencia de si consigue controlarlo.", "C": "Que tenga la posibilidad de controlarlo y pase a un compañero, recupere la posesión, o despeje con el pie o de cabeza."}, "correcta": "C", "explicacion": "Jugar «voluntariamente» el balón implica que el jugador tiene la posibilidad de controlarlo y pasa a un compañero, recupera la posesión, o despeja con el pie o de cabeza.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-021", "bloque": "reglas", "enunciado": "Un defensor intenta despejar el balón de forma voluntaria, pero el pase resulta impreciso y no logra su objetivo. ¿Invalida esto la voluntariedad de la acción a efectos del fuera de juego?", "opciones": {"A": "No, el hecho de que el pase, el intento de recuperar la posesión o el despeje sea impreciso o no logre su objetivo no invalida la voluntariedad de la acción.", "B": "Depende de si el balón termina llegando finalmente a un jugador en posición de fuera de juego tras el despeje.", "C": "Sí, un pase impreciso deja de considerarse una acción voluntaria y por tanto no exime del fuera de juego al atacante."}, "correcta": "A", "explicacion": "El hecho de que el pase, el intento de recuperar la posesión o el despeje del jugador sea impreciso o no logre su objetivo no invalida la voluntariedad de la acción.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-022", "bloque": "reglas", "enunciado": "¿Cuál de los siguientes NO es uno de los criterios empleados para valorar si un jugador tiene la posibilidad de controlar el balón y, por tanto, actúa de forma «voluntaria»?", "opciones": {"A": "Que el jugador tenga tiempo para coordinar sus movimientos, sin recurrir a una acción instintiva.", "B": "Que el balón llegue desde lejos y el jugador lo vea claramente.", "C": "Que el balón se mueva a gran velocidad, dificultando cualquier previsión de su trayectoria."}, "correcta": "C", "explicacion": "Entre los criterios para valorar la voluntariedad se incluyen que el balón llegue desde lejos y se vea claramente, que no se mueva a gran velocidad, que se pueda prever su trayectoria y que el jugador tenga tiempo para coordinar sus movimientos; que el balón se mueva a gran velocidad no facilita la voluntariedad, sino lo contrario.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-023", "bloque": "reglas", "enunciado": "¿Existe infracción por fuera de juego cuando un jugador recibe el balón directamente de un saque de meta?", "opciones": {"A": "Sí, el saque de meta está sujeto a las mismas reglas de fuera de juego que cualquier otra reanudación del juego.", "B": "No, no existirá infracción por fuera de juego cuando un jugador reciba un balón que proceda directamente de un saque de meta.", "C": "Depende de si el jugador se encuentra en posición de fuera de juego en el momento en que se ejecuta el saque."}, "correcta": "B", "explicacion": "No existirá infracción por fuera de juego cuando un jugador reciba un balón que proceda directamente de un saque de meta, un saque de banda o un saque de esquina.", "referencia": "Regla 11.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-024", "bloque": "reglas", "enunciado": "¿Existe infracción por fuera de juego cuando un jugador recibe el balón directamente de un saque de banda?", "opciones": {"A": "Sí, el saque de banda es la única reanudación que sí está sujeta a sanción por fuera de juego directo.", "B": "Sí, salvo que el jugador se encuentre en su propia mitad del terreno de juego en el momento del saque.", "C": "No, es una de las reanudaciones desde las que no puede sancionarse el fuera de juego cuando el balón procede directamente de ella."}, "correcta": "C", "explicacion": "No existirá infracción por fuera de juego cuando un jugador reciba un balón que proceda directamente de un saque de banda.", "referencia": "Regla 11.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-025", "bloque": "reglas", "enunciado": "¿Existe infracción por fuera de juego cuando un jugador recibe el balón directamente de un saque de esquina?", "opciones": {"A": "Depende de si el saque de esquina se ejecuta desde el lado izquierdo o derecho del terreno de juego.", "B": "No, es una de las tres reanudaciones desde las que el balón puede llegar directamente sin que exista infracción por fuera de juego.", "C": "Sí, siempre que el jugador se encuentre más adelantado que el penúltimo defensor en el momento del saque."}, "correcta": "B", "explicacion": "No existirá infracción por fuera de juego cuando un jugador reciba un balón que proceda directamente de un saque de esquina.", "referencia": "Regla 11.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-026", "bloque": "reglas", "enunciado": "Un jugador que se encuentra en posición de fuera de juego se sitúa en la trayectoria de un adversario e interfiere en el movimiento de este hacia el balón, afectando a su capacidad de disputarlo. ¿Cómo debe sancionarse?", "opciones": {"A": "No se sancionará ninguna infracción, ya que el jugador no llegó a tocar el balón en ningún momento de la jugada.", "B": "Se sancionará como falta conforme a la Regla 12, al tratarse de una obstrucción física y no de fuera de juego.", "C": "Se considerará infracción por fuera de juego."}, "correcta": "C", "explicacion": "Si un jugador que sale de una posición de fuera de juego, o que se encuentra en dicha posición, interfiere en el movimiento de un adversario hacia el balón y afecta a su capacidad de jugarlo o disputarlo, se considerará infracción por fuera de juego.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-027", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego se coloca en la trayectoria de un adversario e impide su avance, por ejemplo obstaculizándole el paso, sin que ello afecte a su capacidad de jugar el balón. ¿Cómo se sanciona esta acción?", "opciones": {"A": "Se sancionará siempre como infracción por fuera de juego, con independencia de si afecta o no a la disputa del balón.", "B": "No se sancionará ninguna infracción, al no tratarse de una interferencia directa sobre el balón.", "C": "Deberá penalizarse la infracción en virtud de la Regla 12, no como fuera de juego."}, "correcta": "C", "explicacion": "Si el jugador se coloca en la trayectoria de un adversario e impide su avance, por ejemplo obstaculizándole el paso, sin afectar a su capacidad de jugar o disputar el balón, deberá penalizarse la infracción en virtud de la Regla 12.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-028", "bloque": "reglas", "enunciado": "Un jugador en posición de fuera de juego se desplaza hacia el balón con intención de jugarlo y, antes de tocarlo o disputárselo a un adversario, es objeto de una falta. ¿Qué infracción debe sancionar el árbitro?", "opciones": {"A": "La infracción por fuera de juego, al encontrarse el jugador en dicha posición en el momento de la falta.", "B": "La falta cometida contra él, por haberse producido antes de la infracción por fuera de juego.", "C": "Ninguna de las dos infracciones, al anularse mutuamente por haberse producido de forma casi simultánea."}, "correcta": "B", "explicacion": "Si un jugador en posición de fuera de juego se desplaza hacia el balón con intención de jugarlo y es objeto de una falta antes de jugarlo o disputárselo, se penalizará dicha falta por haberse cometido antes de la infracción por fuera de juego.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-029", "bloque": "reglas", "enunciado": "Se comete una infracción contra un jugador en posición de fuera de juego que ya está jugando o intentando jugar el balón, o disputándoselo a un adversario. ¿Qué infracción debe sancionar el árbitro?", "opciones": {"A": "La falta cometida contra el jugador, al tratarse de la acción más grave e inmediatamente perceptible.", "B": "Ambas infracciones simultáneamente, concediendo doble sanción disciplinaria al equipo defensor.", "C": "La infracción por fuera de juego, por ser previa a la falta cometida sobre el jugador."}, "correcta": "C", "explicacion": "Si se comete una infracción contra un jugador en posición de fuera de juego que ya está jugando o intentando jugar el balón, o disputándoselo a un adversario, se penalizará la infracción por fuera de juego por ser previa a la falta.", "referencia": "Regla 11.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 60}, {"id": "RJ11-030", "bloque": "reglas", "enunciado": "Un jugador está en posición de fuera de juego cuando su compañero le pasa el balón y recibe, interfiriendo así en el juego. ¿Dónde se ejecuta el tiro libre indirecto?", "opciones": {"A": "En el punto medio entre el pasador y el jugador en fuera de juego.", "B": "En el lugar donde se produjo la infracción por fuera de juego.", "C": "En el lugar donde estaba el pasador en el momento del pase."}, "correcta": "B", "explicacion": "El árbitro concede libre indirecto en el lugar donde se produjo la infracción por fuera de juego.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-031", "bloque": "reglas", "enunciado": "¿Dónde se ejecuta el libre indirecto por infracción de fuera de juego si el jugador infractor participó en el juego desde su propio campo?", "opciones": {"A": "En el lugar donde se produjo la infracción, incluso si el jugador infractor se encontraba en su propio campo.", "B": "En el lugar donde estaba el balón en el momento del pase.", "C": "En el centro del campo, por estar el infractor en su propio campo."}, "correcta": "A", "explicacion": "El libre indirecto se concede en el lugar donde se produjo la infracción, incluso si el infractor se encontraba en su propio campo.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-032", "bloque": "reglas", "enunciado": "Un jugador que se encuentra exactamente sobre la línea central recibe un pase en profundidad de un compañero, con el penúltimo adversario en su propio campo. ¿Está en posición de fuera de juego?", "opciones": {"A": "Sí, porque la línea central pertenece a la mitad del terreno de juego del adversario.", "B": "Sí, si el balón está más cerca de la línea de meta contraria que él.", "C": "No, porque la línea central se excluye de la mitad del terreno de juego del adversario."}, "correcta": "C", "explicacion": "La posición de fuera de juego exige estar en la mitad del terreno del adversario, excluyendo la línea central.", "referencia": "Regla 11.1 / Posición de fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-033", "bloque": "reglas", "enunciado": "Un atacante tiene el brazo extendido por delante del último defensor en el momento del pase, pero su cabeza, tronco y piernas están detrás. ¿Está en posición de fuera de juego?", "opciones": {"A": "No, porque no se tienen en cuenta las manos ni los brazos.", "B": "Sí, si el brazo supera el punto inferior de la axila.", "C": "Sí, porque el brazo se considera parte del cuerpo para este cálculo."}, "correcta": "A", "explicacion": "No se tienen en cuenta manos ni brazos para determinar la posición de fuera de juego.", "referencia": "Regla 11.1 / Posición de fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-034", "bloque": "reglas", "enunciado": "Un atacante adelanta el pie unos centímetros respecto al penúltimo defensor en el momento del pase, con el resto de su cuerpo por detrás de este y el balón detrás de él. ¿Está en posición de fuera de juego?", "opciones": {"A": "No, porque solo cuentan la cabeza y el tronco del jugador a efectos de determinar la posición de fuera de juego.", "B": "No, porque el pie no se tiene en cuenta salvo que el jugador llegue a jugar el balón con él en la jugada.", "C": "Sí, porque el pie forma parte de la pierna y se encuentra más cerca de la línea de meta contraria."}, "correcta": "C", "explicacion": "Cuentan la cabeza, el tronco o la pierna (pie incluido), total o parcialmente.", "referencia": "Regla 11.1 / Posición de fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-035", "bloque": "reglas", "enunciado": "Un atacante está a la misma altura que los dos últimos adversarios en el momento del pase. ¿Está en posición de fuera de juego?", "opciones": {"A": "No, porque está a la misma altura que los dos últimos adversarios.", "B": "Sí, porque no supera a ninguno de los dos defensores.", "C": "Sí, si el balón está más cerca de la línea de meta que él."}, "correcta": "A", "explicacion": "No estará en fuera de juego quien se encuentre a la misma altura que el penúltimo adversario o los dos últimos adversarios.", "referencia": "Regla 11.1 / Posición de fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 11", "pagina": 59}, {"id": "RJ11-036", "bloque": "reglas", "enunciado": "Un defensor sale del terreno de juego sin permiso del árbitro mientras el juego continúa. A efectos de determinar el fuera de juego, ¿cómo se considera a ese defensor?", "opciones": {"A": "Situado en la línea de meta o de banda, hasta que se detenga el juego o su equipo juegue el balón hacia la línea central y quede fuera de su área.", "B": "Situado en el punto de la línea de banda por el que salió, sin ningún límite de tiempo establecido por la Regla 11.", "C": "Como si no estuviera en el campo, por lo que no cuenta en absoluto para determinar el fuera de juego."}, "correcta": "A", "explicacion": "A efectos del fuera de juego, el defensor que sale sin autorización se considera en la línea de meta o banda hasta que se detenga el juego o se cumpla la condición de la Regla.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-037", "bloque": "reglas", "enunciado": "Un defensor abandona premeditadamente el terreno de juego para dejar en fuera de juego a un atacante. ¿Qué medida adopta el árbitro?", "opciones": {"A": "Lo amonesta en cuanto el balón deje de estar en juego.", "B": "No adopta medida disciplinaria, al haber salido por la línea de banda.", "C": "Lo expulsa en cuanto el balón deje de estar en juego."}, "correcta": "A", "explicacion": "Si el defensor ha abandonado premeditadamente el terreno, deberá ser amonestado en cuanto el balón deje de estar en juego.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-038", "bloque": "reglas", "enunciado": "Un atacante sale del terreno de juego para no participar activamente y vuelve a entrar por la línea de meta participando en la jugada antes de que se detenga el juego y sin que el defensor haya despejado hacia la línea central. ¿Cómo se le considera?", "opciones": {"A": "Sin posición de fuera de juego, pues volvió a entrar desde la línea de meta.", "B": "Situado en la línea de meta a efectos de determinar el fuera de juego.", "C": "En fuera de juego automáticamente, por haber salido del terreno."}, "correcta": "B", "explicacion": "Si vuelve a entrar por la línea de meta y participa antes de detenerse el juego o de que el defensor juegue el balón hacia la línea central, se le considera en la línea de meta.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-039", "bloque": "reglas", "enunciado": "Un atacante sale deliberadamente del terreno de juego, vuelve a entrar sin autorización del árbitro, no es sancionado por fuera de juego y obtiene una ventaja con ello. ¿Qué medida toma el árbitro?", "opciones": {"A": "Lo expulsa.", "B": "No adopta medida disciplinaria.", "C": "Lo amonesta."}, "correcta": "C", "explicacion": "Se amonesta al jugador que salga premeditadamente, vuelva a entrar sin autorización, no sea sancionado por fuera de juego y obtenga ventaja.", "referencia": "Regla 11.4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 11", "pagina": 61}, {"id": "RJ11-040", "bloque": "reglas", "enunciado": "Un atacante permanece inmóvil entre los postes, dentro de la portería, cuando el balón entra en ella, sin interferir en el guardameta ni cometer infracción alguna. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de meta.", "B": "Concede gol.", "C": "Concede un tiro libre indirecto por fuera de juego."}, "correcta": "B", "explicacion": "Si un atacante permanece inmóvil entre los postes y dentro de la portería cuando entra el balón, se concede gol salvo infracción por fuera
