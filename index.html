: "RJ4-018", "bloque": "reglas", "enunciado": "¿Qué requisito deben cumplir las espinilleras respecto a su cobertura visual sobre el cuerpo del jugador?", "opciones": {"A": "Deberán quedar cubiertas por las medias.", "B": "Deberán quedar completamente a la vista, sin cubrirse por ninguna otra prenda.", "C": "Deberán quedar cubiertas por el pantalón corto en su totalidad."}, "correcta": "A", "explicacion": "Las espinilleras deberán quedar cubiertas por las medias.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-019", "bloque": "reglas", "enunciado": "El brazalete de capitán que no siga el modelo decretado por el organizador de la competición, ¿qué características debe cumplir según la Regla 4?", "opciones": {"A": "Ser de un solo color, pudiendo incorporar la palabra «capitán», la letra «C» o su traducción a otro idioma.", "B": "Poder combinar libremente varios colores, siempre que incluya la letra «C».", "C": "Ser necesariamente del mismo color que la camiseta del equipo, sin más restricciones."}, "correcta": "A", "explicacion": "El capitán llevará el brazalete que decrete el organizador o, en su defecto, un brazalete de un solo color que también puede incorporar la palabra «capitán», la letra «C» o una traducción, siempre de un único color.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-020", "bloque": "reglas", "enunciado": "Un jugador pierde accidentalmente una bota durante una jugada. ¿Cuándo debe, como máximo, volver a colocársela?", "opciones": {"A": "Lo más pronto posible, no más tarde de que el balón vuelva a dejar de estar en juego.", "B": "En cualquier momento posterior, sin límite temporal, mientras el balón esté en juego.", "C": "Únicamente en la siguiente interrupción del juego por causa distinta."}, "correcta": "A", "explicacion": "El jugador que pierda accidentalmente una bota o espinillera deberá volver a colocársela lo más pronto posible, no más tarde de que el balón vuelva a dejar de estar en juego.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-021", "bloque": "reglas", "enunciado": "Un jugador pierde accidentalmente una espinillera y, antes de volver a colocársela, juega el balón y marca un gol. ¿Es válido ese gol?", "opciones": {"A": "Sí, el gol será válido.", "B": "No, el gol debe anularse por incumplimiento del equipamiento obligatorio.", "C": "Solo será válido si el jugador se disculpa y se recoloca la espinillera de inmediato."}, "correcta": "A", "explicacion": "Si antes de volver a calzarse o de colocarse de nuevo la espinillera el jugador jugara el balón o marcara un gol, el gol será válido.", "referencia": "Regla 4 / Equipamiento obligatorio", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-022", "bloque": "reglas", "enunciado": "¿Qué exige la Regla 4 respecto a los colores de los dos equipos que disputan un partido?", "opciones": {"A": "Que vistan colores que los diferencien entre sí y del equipo arbitral.", "B": "Que vistan colores idénticos a los de la temporada anterior, salvo autorización expresa.", "C": "Que vistan colores que coincidan con los oficiales de la competición, sin más matices."}, "correcta": "A", "explicacion": "Los dos equipos vestirán colores que los diferencien entre sí y del equipo arbitral.", "referencia": "Regla 4 / Colores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-023", "bloque": "reglas", "enunciado": "¿Qué exige la Regla 4 respecto al color de la camiseta de los guardametas?", "opciones": {"A": "Que los diferencie de los demás jugadores y del equipo arbitral.", "B": "Que coincida obligatoriamente con el color principal de su propio equipo.", "C": "Que sea siempre de color negro, salvo excepciones autorizadas por la competición."}, "correcta": "A", "explicacion": "Los guardametas vestirán colores que los diferencien de los demás jugadores y del equipo arbitral.", "referencia": "Regla 4 / Colores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-024", "bloque": "reglas", "enunciado": "Las camisetas de los dos guardametas resultan ser del mismo color y ninguno de ellos dispone de una camiseta de repuesto de otro color. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Autorizar que se juegue el partido.", "B": "Suspender el partido hasta que uno de los clubes consiga una camiseta alternativa.", "C": "Obligar a que uno de los dos guardametas sea sustituido por un jugador de campo."}, "correcta": "A", "explicacion": "Si las camisetas de ambos guardametas fueran del mismo color y ninguno dispusiera de una de repuesto de otro color, el árbitro autorizará que se juegue el partido.", "referencia": "Regla 4 / Colores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-025", "bloque": "reglas", "enunciado": "¿Qué opción de color se permite para las camisetas interiores de los jugadores según la Regla 4?", "opciones": {"A": "Un único color igual al color principal de las mangas de la camiseta, o bien estampadas replicando exactamente dichas mangas.", "B": "Cualquier color, sin ninguna relación exigida con el color de las mangas de la camiseta.", "C": "Únicamente el color blanco, independientemente del color de la equipación."}, "correcta": "A", "explicacion": "Las camisetas interiores podrán ser de un único color igual al color principal de las mangas, o bien estampadas o de varios colores siempre que repliquen exactamente las mangas de la camiseta.", "referencia": "Regla 4 / Colores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-026", "bloque": "reglas", "enunciado": "Si se usan mallas térmicas, ¿qué color deben tener y qué exige la Regla 4 respecto a los jugadores de un mismo equipo?", "opciones": {"A": "El color principal de los pantalones cortos o su parte inferior, y todos los jugadores del equipo deberán llevarlas del mismo color.", "B": "Cualquier color a elección individual de cada jugador, sin necesidad de coincidencia entre compañeros.", "C": "El mismo color que las medias, con independencia del color del pantalón."}, "correcta": "A", "explicacion": "Las mallas térmicas deberán ser del color principal de los pantalones cortos o de su parte inferior, y los jugadores del mismo equipo deberán llevarlas del mismo color.", "referencia": "Regla 4 / Colores", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-027", "bloque": "reglas", "enunciado": "¿Se permite el uso de equipamiento protector como rodilleras y coderas, siempre que no sea peligroso?", "opciones": {"A": "Sí, se permite equipamiento protector no peligroso fabricado con materiales blandos, ligeros y acolchados.", "B": "No, únicamente se permite el uso de espinilleras como protección adicional.", "C": "Sí, pero solo si lo autoriza expresamente la federación nacional para cada competición."}, "correcta": "A", "explicacion": "Se permite equipamiento protector no peligroso, como guantes, protectores de cabeza, máscaras faciales, rodilleras y coderas, fabricado con materiales blandos, ligeros y acolchados.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-028", "bloque": "reglas", "enunciado": "¿Pueden los guardametas utilizar pantalones largos según la Regla 4?", "opciones": {"A": "Sí, los guardametas podrán utilizar pantalones largos.", "B": "No, todos los jugadores, incluidos los guardametas, deben usar exclusivamente pantalón corto.", "C": "Sí, pero únicamente en competiciones de categorías inferiores."}, "correcta": "A", "explicacion": "También están permitidas las gorras para guardametas y las gafas de protección; los guardametas podrán utilizar pantalones largos.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-029", "bloque": "reglas", "enunciado": "Un jugador usa un protector de cabeza (distinto de una gorra de guardameta). ¿Qué exige la Regla 4 respecto a su color?", "opciones": {"A": "Que sea de color negro o del color principal de la camiseta, siempre que los jugadores de un mismo equipo usen el mismo color.", "B": "Que sea siempre de color blanco, sin excepción, con independencia del color de la camiseta del equipo.", "C": "Que coincida con el color de las espinilleras utilizadas por ese mismo jugador durante el partido."}, "correcta": "A", "explicacion": "Los protectores de cabeza deberán ser de color negro o del color principal de la camiseta, siempre que los jugadores del mismo equipo usen el mismo color.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-030", "bloque": "reglas", "enunciado": "¿Puede un protector de cabeza estar unido o sujeto a la camiseta del jugador?", "opciones": {"A": "No, no deberá estar unido o sujeto a la camiseta.", "B": "Sí, siempre que la sujeción sea mediante velcro y no represente riesgo alguno.", "C": "Sí, es la forma habitual y recomendada de sujeción."}, "correcta": "A", "explicacion": "Los protectores de cabeza no deberán estar unidos o sujetos a la camiseta.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-031", "bloque": "reglas", "enunciado": "¿Qué exige la Regla 4 respecto a las protuberancias o partes que sobresalgan en un protector de cabeza?", "opciones": {"A": "Que el protector carezca de partes que sobresalgan.", "B": "Que las protuberancias estén acolchadas, sin necesidad de eliminarlas.", "C": "No existe ninguna restricción específica sobre protuberancias."}, "correcta": "A", "explicacion": "Los protectores de cabeza deberán carecer de partes que sobresalgan (protuberancias).", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-032", "bloque": "reglas", "enunciado": "¿Están autorizados los jugadores, suplentes y jugadores sustituidos o expulsados a llevar equipos electrónicos o de comunicación durante el partido?", "opciones": {"A": "No, salvo que se permita el uso de sistemas EPTS.", "B": "Sí, sin ninguna restricción, siempre que no interfieran en el juego.", "C": "Sí, únicamente los guardametas, para comunicarse con el cuerpo técnico."}, "correcta": "A", "explicacion": "Los jugadores (incluidos suplentes, sustituidos y expulsados) no están autorizados a llevar o utilizar equipos electrónicos o de comunicación, excepto en el caso de que se permita el uso de EPTS.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-033", "bloque": "reglas", "enunciado": "¿Qué tipo de equipos electrónicos de comunicación se permite utilizar al cuerpo técnico, y con qué finalidad?", "opciones": {"A": "Equipos pequeños y portátiles (p. ej. micrófonos, auriculares, teléfonos, relojes inteligentes o tabletas), relacionados con el bienestar y la seguridad del jugador o con fines tácticos o de instrucción.", "B": "Cualquier tipo de equipo electrónico, sin límite de tamaño ni de finalidad específica establecida por la Regla 4, siempre que lo lleve un miembro del cuerpo técnico durante el partido.", "C": "Únicamente teléfonos móviles, con exclusión expresa de cualquier otro dispositivo electrónico portátil, aunque esté relacionado con el bienestar o la seguridad de los jugadores."}, "correcta": "A", "explicacion": "Se permite el uso de sistemas electrónicos de comunicación por parte del cuerpo técnico, en lo relativo al bienestar y seguridad del jugador o por razones tácticas o de instrucción, pero solo equipos pequeños y portátiles.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-034", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico utiliza un equipo electrónico no autorizado o se comporta de manera inapropiada como consecuencia de su uso. ¿Qué sanción corresponde?", "opciones": {"A": "Será expulsado, ya que el uso de equipos electrónicos no autorizados se considera infracción grave.", "B": "Será amonestado únicamente, sin que se le retire el dispositivo electrónico no autorizado.", "C": "No corresponde sanción disciplinaria, solo se le retira el dispositivo utilizado de forma indebida."}, "correcta": "A", "explicacion": "Serán expulsados aquellos miembros del cuerpo técnico que usen equipos no autorizados o que se comporten de manera inapropiada como producto de su uso.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-035", "bloque": "reglas", "enunciado": "Cuando se usan dispositivos EPTS facilitados por los organizadores del partido o la competición, ¿de quién es la responsabilidad de garantizar que los datos transmitidos al área técnica sean fiables y precisos?", "opciones": {"A": "De los propios organizadores que facilitan dichos dispositivos.", "B": "Del club que utiliza el dispositivo durante el partido.", "C": "Del árbitro principal del encuentro."}, "correcta": "A", "explicacion": "Cuando los EPTS los faciliten los organizadores del partido o la competición, será responsabilidad de estos garantizar que la información y los datos transmitidos sean fiables y precisos.", "referencia": "Regla 4 / Otro tipo de equipamiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-036", "bloque": "reglas", "enunciado": "¿Qué tipo de eslóganes, mensajes o imágenes tiene prohibido contener el equipamiento de un jugador según la Regla 4?", "opciones": {"A": "De carácter político, religioso o personal.", "B": "Únicamente los de carácter comercial no autorizado por la competición.", "C": "De carácter deportivo relacionado con otro club, sin más restricciones."}, "correcta": "A", "explicacion": "El equipamiento no deberá contener eslóganes, mensajes o imágenes de carácter político, religioso o personal.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-037", "bloque": "reglas", "enunciado": "¿Dónde deben aparecer, con carácter general, los eslóganes, mensajes e imágenes autorizados en el equipamiento?", "opciones": {"A": "Únicamente en el frontal de la camiseta o en el brazalete.", "B": "En cualquier parte visible del equipamiento, incluidas las mangas y la espalda.", "C": "Únicamente en la parte posterior de la camiseta, junto al dorsal."}, "correcta": "A", "explicacion": "Los eslóganes autorizados, los mensajes y las imágenes deberán aparecer únicamente en el frontal de la camiseta o en el brazalete.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-038", "bloque": "reglas", "enunciado": "¿A qué colectivos se aplican los principios de la Regla 4 relativos al equipamiento, además de a jugadores, suplentes y jugadores sustituidos?", "opciones": {"A": "A todos los miembros del cuerpo técnico ubicados en el área técnica.", "B": "Únicamente a los delegados de campo acreditados.", "C": "A los espectadores situados en las primeras filas de la grada."}, "correcta": "A", "explicacion": "Los principios de la Regla 4 serán también aplicables a todos los miembros del cuerpo técnico ubicados en el área técnica.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-039", "bloque": "reglas", "enunciado": "Entre los elementos que (generalmente) se permiten en el equipamiento, ¿qué incluye la Regla 4 además del número, el nombre y el escudo del equipo?", "opciones": {"A": "Eslóganes de alguna iniciativa y logotipos que promuevan el fútbol, el respeto y la integridad.", "B": "Cualquier mensaje comercial no relacionado con el fabricante del equipamiento.", "C": "Imágenes de personalidades públicas ajenas al mundo del fútbol."}, "correcta": "A", "explicacion": "Se permite, entre otros elementos, el número del jugador, el nombre, el escudo del equipo, eslóganes de alguna iniciativa y logotipos que promuevan el fútbol, el respeto y la integridad.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-040", "bloque": "reglas", "enunciado": "Un eslogan o imagen relativa a un acto o acontecimiento de carácter político, ¿está autorizado en el equipamiento según la interpretación de la Regla 4?", "opciones": {"A": "No, no se permitirán eslóganes, mensajes ni imágenes de ningún acto o acontecimiento de carácter político.", "B": "Sí, siempre que se trate de un acontecimiento histórico y no de actualidad.", "C": "Sí, siempre que lo autorice expresamente el club al que pertenece el jugador."}, "correcta": "A", "explicacion": "Entre los supuestos no permitidos, la Regla 4 incluye expresamente ningún acto o acontecimiento de carácter político.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-041", "bloque": "reglas", "enunciado": "Según la interpretación de la Regla 4, ¿está permitida una imagen de una persona, viva o fallecida, en el equipamiento de un jugador?", "opciones": {"A": "No, salvo que dicha persona forme parte del nombre de la competición.", "B": "Sí, siempre que la persona no esté vinculada a ningún partido político.", "C": "Sí, sin restricción alguna, ya que solo se prohíben imágenes de organizaciones."}, "correcta": "A", "explicacion": "No se permitirán eslóganes, mensajes o imágenes de personas, vivas o ya fallecidas, a menos que formen parte del nombre de la competición.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-042", "bloque": "reglas", "enunciado": "¿Está permitida en el equipamiento una imagen relacionada con una organización de carácter discriminatorio?", "opciones": {"A": "No, no se permite ninguna organización de carácter discriminatorio.", "B": "Sí, siempre que no se explicite el nombre completo de la organización.", "C": "Sí, si el árbitro no aprecia intencionalidad ofensiva en el jugador que la porta."}, "correcta": "A", "explicacion": "No se permite ningún eslogan, mensaje o imagen de ninguna organización de carácter discriminatorio.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-043", "bloque": "reglas", "enunciado": "Cuando se conmemora un acto relevante nacional o internacional a través del equipamiento, ¿qué debe tenerse en cuenta según la Regla 4?", "opciones": {"A": "Las sensibilidades del equipo adversario, de sus seguidores y del público en general.", "B": "Únicamente la autorización previa del árbitro del encuentro.", "C": "Exclusivamente el criterio del club organizador del partido."}, "correcta": "A", "explicacion": "Cuando se conmemore un acto relevante nacional o internacional, se deberán tener en consideración las sensibilidades del equipo adversario, de sus seguidores y del público en general.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-044", "bloque": "reglas", "enunciado": "¿Puede el reglamento de la competición establecer restricciones adicionales sobre el tamaño, número y posición de los eslóganes, mensajes e imágenes permitidos?", "opciones": {"A": "Sí, las reglas de la competición podrán estipular otro tipo de restricciones o limitaciones al respecto.", "B": "No, esas condiciones vienen fijadas de forma exhaustiva y cerrada por la Regla 4, sin margen adicional.", "C": "Sí, pero únicamente en lo referente al tamaño, nunca al número o la posición."}, "correcta": "A", "explicacion": "Las reglas de la competición podrán estipular otro tipo de restricciones o limitaciones relativas al tamaño, número y posición de los eslóganes, mensajes e imágenes permitidos.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 40}, {"id": "RJ4-045", "bloque": "reglas", "enunciado": "Un jugador incumple la prohibición de mostrar en su ropa interior imágenes de carácter publicitario ajenas al logotipo del fabricante. ¿Quién puede sancionar esta infracción según la Regla 4?", "opciones": {"A": "El organizador de la competición, la federación nacional de fútbol o la FIFA.", "B": "Únicamente el árbitro del encuentro, mediante amonestación directa e inmediata.", "C": "Únicamente el club al que pertenece el jugador, de forma interna."}, "correcta": "A", "explicacion": "En caso de infracción por mostrar ropa interior con imágenes no autorizadas, el jugador o el equipo serán sancionados por el organizador de la competición, la federación nacional o la FIFA.", "referencia": "Regla 4 / Eslóganes, mensajes, imágenes y publicidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-046", "bloque": "reglas", "enunciado": "Un jugador incumple alguna disposición de la Regla 4 sobre equipamiento durante el desarrollo del juego. ¿Debe el árbitro detener el juego de inmediato para corregirlo?", "opciones": {"A": "No, no es necesario detener el juego; el árbitro ordenará al jugador que abandone el terreno para corregir su equipamiento cuando el juego se detenga.", "B": "Sí, debe detener el juego inmediatamente en cuanto detecte la infracción del equipamiento cometida por el jugador.", "C": "No, la infracción de equipamiento nunca obliga al jugador a abandonar el terreno de juego para corregirla."}, "correcta": "A", "explicacion": "En caso de infracción de la Regla 4, no es necesario detener el juego; el árbitro ordenará al jugador infractor que abandone el terreno de juego para corregir su equipamiento.", "referencia": "Regla 4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 40}, {"id": "RJ4-047", "bloque": "reglas", "enunciado": "Cuando se detiene el juego por otra causa y un jugador tiene pendiente corregir su equipamiento conforme a la Regla 4, ¿qué debe hacer?", "opciones": {"A": "Salir del terreno de juego cuando se detenga el juego, a menos que ya haya corregido su equipamiento.", "B": "Continuar jugando de todas formas hasta que finalice esa parte del encuentro.", "C": "Esperar exclusivamente al descanso del medio tiempo para corregir el equipamiento."}, "correcta": "A", "explicacion": "El jugador saldrá del terreno de juego cuando se detenga el juego, a menos que ya haya corregido su equipamiento previamente.", "referencia": "Regla 4 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 40}, {"id": "RJ4-048", "bloque": "reglas", "enunciado": "¿En qué momento se debe inspeccionar a los jugadores suplentes respecto a su equipamiento?", "opciones": {"A": "Antes de que entren en el terreno de juego.", "B": "Únicamente al finalizar el partido, junto con los titulares.", "C": "No es necesario inspeccionar a los suplentes, solo a los titulares."}, "correcta": "A", "explicacion": "Se deberá inspeccionar a los jugadores antes del inicio del partido y a los suplentes antes de que entren en el terreno de juego.", "referencia": "Regla 4.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 37}, {"id": "RJ4-049", "bloque": "reglas", "enunciado": "Además de guantes, rodilleras y coderas, ¿qué otro equipamiento permite expresamente la Regla 4?", "opciones": {"A": "Las gorras para guardametas y las gafas de protección.", "B": "Los guantes de campo para cualquier jugador que no sea guardameta.", "C": "Los cascos rígidos de tipo deportivo para todos los jugadores de campo."}, "correcta": "A", "explicacion": "También están permitidas las gorras para guardametas y las gafas de protección.", "referencia": "Regla 4.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-050", "bloque": "reglas", "enunciado": "Además de carecer de protuberancias, ¿qué otro requisito debe cumplir un protector de cabeza?", "opciones": {"A": "No suponer ningún riesgo para el jugador que lo lleve ni para ningún otro jugador, como por ejemplo un cierre alrededor del cuello.", "B": "Estar fabricado obligatoriamente del mismo color que el pantalón del equipo al que pertenece el jugador.", "C": "Incorporar el escudo del club en la parte frontal del protector de forma obligatoria según la Regla 4."}, "correcta": "A", "explicacion": "El protector de cabeza no deberá suponer ningún riesgo para el jugador que lo lleve ni para ningún otro jugador (p. ej. un cierre alrededor del cuello).", "referencia": "Regla 4.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 38}, {"id": "RJ4-051", "bloque": "reglas", "enunciado": "Cuando se usan dispositivos EPTS en una competición oficial, ¿qué debe garantizar el organizador de la competición respecto a dichos dispositivos?", "opciones": {"A": "Que no sean peligrosos y que cumplan los criterios del Programa de calidad de la FIFA de EPTS.", "B": "Que sean fabricados exclusivamente por el proveedor oficial de la competición.", "C": "Que su coste sea asumido íntegramente por el club que los utiliza."}, "correcta": "A", "explicacion": "El organizador de la competición deberá garantizar que los dispositivos EPTS no sean peligrosos y que cumplan con los criterios del Programa de calidad de la FIFA de EPTS.", "referencia": "Regla 4.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-052", "bloque": "reglas", "enunciado": "Además de los datos habituales del equipo, ¿qué otro tipo de información sobre el partido se permite generalmente incluir en el equipamiento?", "opciones": {"A": "Los datos del partido: equipo, fecha, competición, estadio y ciudad.", "B": "La clasificación actual del equipo en la competición.", "C": "El nombre del patrocinador principal de la competición, sin restricción alguna."}, "correcta": "A", "explicacion": "Entre lo que se permite generalmente se incluyen los datos de un partido: equipo, fecha, competición, estadio, ciudad.", "referencia": "Regla 4.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-053", "bloque": "reglas", "enunciado": "¿En qué casos, según la Regla 4, los eslóganes, mensajes o imágenes solo podrán aparecer en el brazalete del capitán?", "opciones": {"A": "En algunos casos así estipulados, en lugar de en el frontal de la camiseta.", "B": "Nunca; los eslóganes autorizados deben aparecer siempre en el frontal de la camiseta.", "C": "Únicamente cuando el capitán sea también el guardameta del equipo."}, "correcta": "A", "explicacion": "En algunos casos, los eslóganes, los mensajes o las imágenes aparecerán únicamente en el brazalete del capitán.", "referencia": "Regla 4.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-054", "bloque": "reglas", "enunciado": "A la hora de decidir si un eslogan, mensaje o imagen es permisible, ¿qué debe considerarse según la interpretación de la Regla 4?", "opciones": {"A": "Lo estipulado en la Regla 12, que obliga al árbitro a actuar si un jugador emplea lenguaje o actúa de modo ofensivo, insultante, humillante, provocador o exaltado.", "B": "Únicamente la opinión del delegado de campo sobre la conveniencia del mensaje mostrado en la prenda.", "C": "Exclusivamente si el mensaje ha sido previamente aprobado por escrito por el club adversario en ese partido."}, "correcta": "A", "explicacion": "Se deberá considerar lo estipulado en la Regla 12, que obliga al árbitro a actuar si un jugador emplea lenguaje o actúa de modo ofensivo, insultante o humillante, o de forma provocadora o exaltada.", "referencia": "Regla 4.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-055", "bloque": "reglas", "enunciado": "Además de las imágenes de personas y de organizaciones discriminatorias, ¿qué otro tipo de contenido de carácter político no estará autorizado en el equipamiento?", "opciones": {"A": "El de partidos, organizaciones o grupos de carácter político, ya sean locales, regionales, nacionales o internacionales, así como el de gobiernos y sus ministerios, cargos o funciones.", "B": "Cualquier mención al nombre de la ciudad o del estadio donde se dispute el partido en cuestión, al considerarse este tipo de referencia de carácter político según la Regla 4.", "C": "Cualquier referencia al organizador oficial de la competición en la que participan ambos equipos, entendida esta mención como propaganda política prohibida por la Regla 4."}, "correcta": "A", "explicacion": "No se permitirán eslóganes, mensajes o imágenes de partidos, organizaciones o grupos de carácter político, ni de gobiernos locales, regionales o nacionales ni de sus ministerios, cargos o funciones.", "referencia": "Regla 4.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 39}, {"id": "RJ4-056", "bloque": "reglas", "enunciado": "Un jugador que ha abandonado el terreno de juego para corregir su equipamiento quiere reincorporarse mientras el juego está en marcha. ¿Qué debe hacer antes y para volver a entrar?", "opciones": {"A": "Someter su equipamiento al control de un miembro del equipo arbitral y volver a entrar únicamente con el permiso del árbitro.", "B": "Puede reincorporarse libremente en cuanto haya corregido su equipamiento, sin necesidad de someterlo a ningún control.", "C": "Debe esperar obligatoriamente a que el juego se detenga, sin necesidad de permiso expreso del árbitro para reingresar."}, "correcta": "A", "explicacion": "Los jugadores que abandonen el terreno de juego para corregir o cambiar su equipamiento deberán someterlo al control de un miembro del equipo arbitral y volver a entrar únicamente con el permiso del árbitro, que puede concederse durante el juego.", "referencia": "Regla 4.6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 4", "pagina": 40}, {"id": "RJ4-057", "bloque": "reglas", "enunciado": "Un jugador reingresa en el terreno de juego tras corregir su equipamiento sin haber recibido el permiso expreso del árbitro. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Lo amonesta; si tuviera que detener el juego para hacerlo, concederá un tiro libre indirecto en el lugar donde se encontraba el balón cuando se detuvo el juego, salvo interferencia, en cuyo caso será directo (o penal) desde el lugar de la interferencia.", "B": "No podrá adoptar ninguna medida disciplinaria, al tratarse de una infracción menor no contemplada por la Regla 4, aunque tenga que detener el juego para hacer salir al jugador del terreno.", "C": "Lo expulsará directamente, al tratarse siempre de una conducta antideportiva grave según la Regla 4, con independencia de que el equipamiento ya hubiera sido corregido correctamente."}, "correcta": "A", "explicacion": "Se amonestará a los jugadores que reingresen sin el permiso expreso del árbitro; si hubiera que detener el juego para amonestarlo, se concederá un libre indirecto donde estaba el balón, salvo interferencia, en cuyo caso será directo o penal desde el lugar de la interferencia.", "referencia": "Regla 4.6", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 4", "pagina": 40}, {"id": "RJ5-001", "bloque": "reglas", "enunciado": "Un guardameta realiza marcas en el suelo con el pie dentro del terreno de juego mientras el balón está en juego, para orientarse en los saques de meta. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Detener inmediatamente el juego, sin posibilidad de aplicar la ventaja, y amonestarlo en ese mismo instante por conducta antideportiva.", "B": "Aplicar ventaja si procede y amonestarlo por conducta antideportiva en cuanto el balón deje de estar en juego, sin necesidad de detener el partido antes.", "C": "Expulsarlo directamente por alterar el terreno de juego, sin posibilidad de aplicar la ventaja previamente."}, "correcta": "B", "explicacion": "Se aplica el criterio de ventaja: se detiene el juego solo si no puede aplicarse la ventaja, amonestando por conducta antideportiva y reanudando, si procede, con balón a tierra.", "referencia": "Regla 5 / Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-002", "bloque": "reglas", "enunciado": "¿Puede el árbitro modificar una decisión ya tomada mientras el balón sigue en juego?", "opciones": {"A": "No, una vez tomada una decisión no puede cambiarla bajo ninguna circunstancia, aunque el juego no se haya reanudado.", "B": "Sí, siempre que el juego no se haya reanudado o no haya finalizado el partido, si se percata de un error.", "C": "Solo puede modificarla si el VAR se lo indica expresamente, no si es el propio árbitro quien advierte el error."}, "correcta": "B", "explicacion": "El árbitro puede modificar una decisión antes de la reanudación del juego (o antes de finalizar el partido en ciertos supuestos) si constata que fue incorrecta o se produjo mal informado.", "referencia": "Regla 5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-003", "bloque": "reglas", "enunciado": "¿Puede el árbitro suspender definitivamente un partido por mal estado del terreno de juego sobrevenido durante el encuentro?", "opciones": {"A": "No, una vez iniciado el partido debe finalizarse siempre, sea cual sea el estado del terreno de juego durante el encuentro.", "B": "Sí, el mal estado del terreno de juego es una de las causas de suspensión previstas.", "C": "Solo puede aplazarlo, nunca suspenderlo definitivamente, con independencia de la gravedad del estado del terreno."}, "correcta": "B", "explicacion": "El mal estado del terreno de juego sobrevenido es una de las causas reconocidas para la suspensión del partido por decisión arbitral.", "referencia": "Regla 5 / Reglamento de Competiciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-004", "bloque": "reglas", "enunciado": "¿Debe el árbitro redactar el acta del partido de forma fiel a lo sucedido, aunque contradiga una petición de un club?", "opciones": {"A": "No, puede matizar el acta si un club se lo solicita razonadamente.", "B": "Sí, el acta debe redactarse de forma fiel, concisa, clara, objetiva y completa, con independencia de peticiones de los clubes.", "C": "Depende de si el club afectado es el local o el visitante."}, "correcta": "B", "explicacion": "El árbitro tiene la obligación de redactar el acta de forma fiel, concisa, clara, objetiva y completa, sin que las peticiones de los clubes puedan alterar ese deber.", "referencia": "Regla 5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 46}, {"id": "RJ5-005", "bloque": "reglas", "enunciado": "¿Quién posee la autoridad para hacer cumplir las Reglas de Juego durante el partido?", "opciones": {"A": "El árbitro, junto con el capitán de cada equipo, que puede solicitar la revisión de cualquier decisión.", "B": "El árbitro, que es la persona encargada de dirigir el partido y posee plena autoridad para hacerlas cumplir.", "C": "El árbitro asistente de vídeo, que supervisa todas las decisiones del árbitro principal durante el encuentro."}, "correcta": "B", "explicacion": "El árbitro es la persona encargada de dirigir el partido y posee plena autoridad para hacer cumplir las Reglas de Juego.", "referencia": "Regla 5.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-006", "bloque": "reglas", "enunciado": "¿En qué se basarán las decisiones que adopte el árbitro durante el partido?", "opciones": {"A": "En el criterio conjunto y vinculante de los dos árbitros asistentes del encuentro.", "B": "Exclusivamente en la imagen que le proporcione el árbitro asistente de vídeo en cada jugada dudosa.", "C": "En su propio criterio, de acuerdo con las Reglas de Juego y el espíritu del fútbol."}, "correcta": "C", "explicacion": "El árbitro tomará sus decisiones según su criterio, de acuerdo a las Reglas de Juego y al espíritu del fútbol.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-007", "bloque": "reglas", "enunciado": "¿Para qué tipo de decisiones podrán las competiciones usar tecnología que ayude al árbitro?", "opciones": {"A": "Únicamente para el protocolo del VAR y las decisiones sobre conducta violenta fuera del terreno de juego.", "B": "Para el control del tiempo de juego, las sustituciones y la validez de las tarjetas mostradas por el árbitro.", "C": "Para el protocolo del VAR, el balón en juego (incluida la detección automática de goles) y el fuera de juego."}, "correcta": "C", "explicacion": "La tecnología puede ayudar al árbitro en el protocolo del VAR, el balón en juego (con DAG) y el fuera de juego.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-008", "bloque": "reglas", "enunciado": "¿Son revocables las decisiones arbitrales sobre hechos y acciones sucedidos durante el encuentro, incluyendo dar por válido un gol?", "opciones": {"A": "Sí, pueden modificarse en cualquier momento si el árbitro recibe una indicación de un árbitro asistente.", "B": "Sí, siempre que ambos capitanes estén de acuerdo en solicitar conjuntamente la revisión de la jugada.", "C": "No, son irrevocables, y las decisiones del equipo arbitral deben respetarse en todo momento."}, "correcta": "C", "explicacion": "Las decisiones sobre hechos sucedidos durante el encuentro, incluido dar por válido un gol, son irrevocables.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-009", "bloque": "reglas", "enunciado": "Tras haberse reanudado el juego con un saque de esquina, el árbitro se da cuenta de que debió conceder un saque de meta. ¿Puede cambiar su decisión sobre la forma de reanudación?", "opciones": {"A": "Sí, siempre que lo haga antes de que el balón salga del área donde se produjo la jugada.", "B": "No, una vez reanudado el juego, el árbitro no podrá cambiar la decisión sobre la forma de reanudar el juego.", "C": "Sí, siempre que el cambio se produzca antes de que transcurra un minuto desde la reanudación."}, "correcta": "B", "explicacion": "Una vez reanudado el juego, el árbitro no podrá cambiar la decisión sobre la forma de reanudarlo, aunque se dé cuenta de que era incorrecta.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 41}, {"id": "RJ5-010", "bloque": "reglas", "enunciado": "Al finalizar el primer tiempo, el árbitro abandona el terreno de juego dirigiéndose al área de revisión. Antes de que termine ese periodo, ¿puede modificar una decisión relativa a un incidente sucedido durante el mismo?", "opciones": {"A": "Sí, sigue siendo posible modificar una decisión relativa a un incidente sucedido antes de que finalizase ese tiempo.", "B": "No, en cuanto el árbitro abandona el terreno de juego pierde toda posibilidad de modificar decisiones de ese periodo.", "C": "Sí, pero únicamente si la modificación afecta a la validez de un gol y no a cualquier otro tipo de incidente."}, "correcta": "A", "explicacion": "Si el árbitro abandona el terreno de juego al término de un periodo para dirigirse al área de revisión, aún es posible modificar una decisión relativa a un incidente sucedido antes de que finalizase ese tiempo.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-011", "bloque": "reglas", "enunciado": "Una vez reanudado el juego, el cuarto árbitro detecta una infracción no sancionada y consigue comunicarla al árbitro principal antes de la reanudación. ¿Puede imponerse sanción disciplinaria?", "opciones": {"A": "No, salvo en los casos previstos en la Regla 12.4 y en el Protocolo del VAR, una vez reanudado el juego nunca puede sancionarse.", "B": "Sí, y además deberá repetirse la reanudación del juego para ajustarla a la infracción detectada.", "C": "Sí, podrá imponerse la sanción disciplinaria, pero esta no conllevará la reanudación del juego vinculada con ella."}, "correcta": "C", "explicacion": "Una vez reanudado el juego, solo podrá imponerse sanción disciplinaria si otro miembro del equipo arbitral detectó la infracción e intentó comunicarla antes de la reanudación; dicha sanción no conllevará la reanudación vinculada a ella.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-012", "bloque": "reglas", "enunciado": "Si el árbitro no estuviera en condiciones de seguir dirigiendo el partido, ¿qué ocurre?", "opciones": {"A": "El partido deberá suspenderse definitivamente de forma automática hasta que se designe un nuevo árbitro principal.", "B": "El árbitro asistente más antiguo asumirá de inmediato y de forma permanente todas las funciones del árbitro principal.", "C": "Podrá continuar bajo la supervisión de los demás miembros del equipo arbitral hasta que el balón deje de estar en juego."}, "correcta": "C", "explicacion": "Si el árbitro no está en condiciones de seguir dirigiendo el partido, podrá continuar bajo la supervisión de los demás miembros del equipo arbitral hasta que el balón deje de estar en juego.", "referencia": "Regla 5.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-013", "bloque": "reglas", "enunciado": "Además de hacer cumplir las Reglas de Juego, ¿cómo dirigirá el árbitro el partido?", "opciones": {"A": "De forma exclusiva e independiente, sin necesidad de contar con el resto del equipo arbitral.", "B": "En colaboración únicamente con los capitanes de ambos equipos designados antes del encuentro.", "C": "En colaboración con los otros miembros del equipo arbitral."}, "correcta": "C", "explicacion": "El árbitro dirigirá el partido en colaboración con los otros miembros del equipo arbitral.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-014", "bloque": "reglas", "enunciado": "¿Qué debe hacer el árbitro respecto al informe o acta del partido?", "opciones": {"A": "Delegará la elaboración del acta en el cuarto árbitro, limitándose a firmarla al finalizar el encuentro.", "B": "Cronometrará el tiempo, tomará nota de las incidencias y remitirá a las autoridades competentes el informe o acta del partido.", "C": "Únicamente deberá anotar el resultado final, sin necesidad de detallar las medidas disciplinarias adoptadas."}, "correcta": "B", "explicacion": "El árbitro cronometrará el tiempo, tomará nota de las incidencias del partido y remitirá el informe o acta a las autoridades competentes, detallando las medidas disciplinarias y demás incidencias.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-015", "bloque": "reglas", "enunciado": "Un incidente ocurrido durante el partido pasa inadvertido al árbitro, pero es visto por el árbitro asistente. ¿Qué debe hacer el árbitro principal?", "opciones": {"A": "Actuará conforme a las indicaciones de los otros miembros del equipo arbitral en relación con las incidencias que le hayan pasado inadvertidas.", "B": "No podrá tomar ninguna medida, ya que solo puede sancionar aquello que haya presenciado personalmente.", "C": "Deberá esperar al descanso para revisar el vídeo del incidente antes de tomar cualquier decisión al respecto."}, "correcta": "A", "explicacion": "El árbitro actuará conforme a las indicaciones de los otros miembros del equipo arbitral respecto a incidencias que le hayan pasado inadvertidas.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-016", "bloque": "reglas", "enunciado": "Se comete una infracción, pero el equipo adversario mantiene la posesión y una situación claramente ventajosa. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Dejará que el juego continúe de forma definitiva, sin poder ya sancionar la infracción cometida en ningún momento posterior.", "B": "Detendrá el juego de inmediato en todos los casos para sancionar la infracción, sin valorar la ventaja obtenida.", "C": "Permitirá que el juego prosiga y sancionará la infracción cometida si la situación ventajosa no se produce de manera inmediata o transcurridos unos pocos segundos."}, "correcta": "C", "explicacion": "El árbitro permitirá que el juego prosiga si el equipo adversario se beneficia de la ventaja, y sancionará la infracción o indicará que se repita la reanudación si la ventaja no se materializa de forma inmediata o en unos pocos segundos.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-017", "bloque": "reglas", "enunciado": "¿Cómo debe actuar el árbitro cuando se cometen dos infracciones al mismo tiempo por parte de jugadores diferentes?", "opciones": {"A": "Castigará la infracción más grave en función de la sanción, la reanudación, la gravedad física y las repercusiones tácticas.", "B": "Castigará automáticamente la infracción cometida por el jugador que primero tocó el balón, con independencia de su gravedad.", "C": "Castigará ambas infracciones de forma simultánea, aplicando dos sanciones disciplinarias distintas al mismo equipo."}, "correcta": "A", "explicacion": "Cuando se cometa más de una infracción al mismo tiempo, el árbitro castigará la más grave en función de la sanción, la reanudación, la gravedad física y las repercusiones tácticas.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-018", "bloque": "reglas", "enunciado": "¿Desde qué momento tiene el árbitro autoridad para tomar medidas disciplinarias?", "opciones": {"A": "Únicamente desde el pitido inicial hasta el pitido final del tiempo reglamentario, sin incluir la tanda de penales.", "B": "Desde que se firma el acta previa al encuentro hasta que finaliza el tiempo añadido del segundo tiempo.", "C": "Desde que entra en el terreno de juego para la inspección previa al partido hasta que lo abandona una vez terminado, incluida la tanda de penales."}, "correcta": "C", "explicacion": "El árbitro tiene autoridad para tomar medidas disciplinarias desde el momento en que entra al terreno de juego para la inspección previa hasta que lo abandona tras el partido, lo cual incluye la tanda de penales.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-019", "bloque": "reglas", "enunciado": "Antes de entrar en el terreno de juego al comienzo del partido, un jugador comete una infracción merecedora de expulsión. ¿Qué puede hacer el árbitro?", "opciones": {"A": "Podrá impedir que el jugador participe en el partido.", "B": "No podrá tomar ninguna medida, ya que el partido aún no ha comenzado formalmente.", "C": "Deberá permitir que el jugador salte al terreno de juego y amonestarlo en la primera interrupción del encuentro."}, "correcta": "A", "explicacion": "Si antes de entrar en el terreno de juego un jugador comete una infracción merecedora de expulsión, el árbitro podrá impedir que participe en el partido.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-020", "bloque": "reglas", "enunciado": "¿Hasta qué momento tiene el árbitro autoridad para mostrar tarjetas amarillas o rojas?", "opciones": {"A": "Desde que el jugador entra en el terreno de juego al comienzo del partido hasta que el partido ha terminado, incluyendo el descanso, la prórroga y la tanda de penales.", "B": "Desde el pitido inicial hasta el pitido final de cada parte, sin que puedan mostrarse tarjetas durante el descanso.", "C": "Únicamente durante los 90 minutos de tiempo reglamentario, sin incluir el descanso ni la tanda de penales."}, "correcta": "A", "explicacion": "El árbitro tiene autoridad para mostrar tarjetas desde que el jugador entra en el terreno de juego hasta que termina el partido, lo que incluye el descanso, la prórroga y la tanda de penales.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-021", "bloque": "reglas", "enunciado": "Un miembro del cuerpo técnico no actúa de forma responsable en el área técnica y no puede identificarse con exactitud al infractor. ¿A quién sancionará el árbitro?", "opciones": {"A": "A todo el cuerpo técnico presente en el área técnica de forma colectiva.", "B": "No podrá sancionar a nadie, al no poder determinarse con exactitud la identidad del infractor.", "C": "Al primer entrenador presente en el área técnica."}, "correcta": "C", "explicacion": "Si no fuera posible identificar al infractor entre los miembros del cuerpo técnico, se sancionará al primer entrenador presente en el área técnica.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-022", "bloque": "reglas", "enunciado": "El único médico del cuerpo técnico de un equipo comete una infracción sancionable con expulsión y el equipo no dispone de otro médico. ¿Qué puede hacer el árbitro?", "opciones": {"A": "Podrá permitir que permanezca únicamente si el equipo renuncia a recibir cualquier asistencia médica durante el resto del partido.", "B": "Podrá permitir que el médico permanezca, para que pueda intervenir si un jugador requiere atención médica.", "C": "Deberá expulsarlo obligatoriamente igual que a cualquier otro miembro del cuerpo técnico, sin excepción posible."}, "correcta": "B", "explicacion": "Si un médico del cuerpo técnico comete una infracción sancionable con expulsión, podrá permanecer si el equipo no cuenta con otro médico disponible, para intervenir si un jugador requiere atención médica.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-023", "bloque": "reglas", "enunciado": "¿Cuándo detendrá el árbitro el juego por una lesión de un jugador?", "opciones": {"A": "Únicamente cuando lo solicite expresamente el cuerpo técnico del equipo del jugador lesionado.", "B": "Siempre, en cuanto cualquier jugador manifieste sentir molestias, sea cual sea su gravedad.", "C": "Solo si el jugador ha sufrido una lesión grave."}, "correcta": "C", "explicacion": "El árbitro detendrá el juego solo si un jugador ha sufrido una lesión grave, permitiendo que sea transportado fuera del terreno de juego.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-024", "bloque": "reglas", "enunciado": "Un jugador sufre una lesión leve mientras el balón está en juego. ¿Debe el árbitro detener el juego de inmediato?", "opciones": {"A": "Sí, salvo que el equipo del jugador lesionado esté en clara situación de ventaja en ese momento.", "B": "Sí, deberá detener el juego de inmediato en todos los casos de lesión, sea cual sea su gravedad.", "C": "No, permitirá que el juego continúe hasta que el balón ya no esté en juego."}, "correcta": "C", "explicacion": "Si la lesión del jugador es leve, el árbitro permitirá que el juego continúe hasta que el balón deje de estar en juego.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-025", "bloque": "reglas", "enunciado": "Si se detiene el juego o se retrasa su reanudación por una lesión, ¿cuánto tiempo debe transcurrir desde que se reanuda el juego para que el jugador lesionado pueda volver a entrar?", "opciones": {"A": "Un minuto.", "B": "Dos minutos.", "C": "Treinta segundos."}, "correcta": "A", "explicacion": "Los jugadores lesionados deberán abandonar el campo y no se les permitirá volver a entrar hasta que haya transcurrido un minuto desde que el juego se haya reanudado.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-026", "bloque": "reglas", "enunciado": "Tras recibir tratamiento fuera del campo, un jugador lesionado quiere reincorporarse mientras el balón está en juego. ¿Por dónde debe volver a entrar?", "opciones": {"A": "Únicamente por la línea de meta más cercana a la portería de su equipo.", "B": "Por cualquiera de las líneas de demarcación del terreno de juego.", "C": "Por la línea de banda."}, "correcta": "C", "explicacion": "Si el balón está en juego, el jugador lesionado volverá al campo por la línea de banda; si el balón no está en juego, podrá hacerlo por cualquier línea de demarcación.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-027", "bloque": "reglas", "enunciado": "¿En cuál de estos casos NO se exige que el jugador lesionado abandone el terreno de juego para recibir tratamiento?", "opciones": {"A": "Cuando un jugador sufre un esguince leve de tobillo tras un choque fortuito con un adversario.", "B": "Cuando se lesiona un guardameta.", "C": "Cuando dos jugadores de equipos distintos chocan tras disputar un balón dividido."}, "correcta": "B", "explicacion": "Entre las excepciones a la salida obligatoria para recibir tratamiento se encuentran: que se lesione un guardameta, que un guardameta y un jugador de campo choquen y requieran atención médica, que choquen varios jugadores del mismo equipo, lesión grave, lesión por infracción sancionable con amonestación o expulsión del adversario, o que se vaya a lanzar un penal el propio jugador lesionado.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-028", "bloque": "reglas", "enunciado": "Un defensor comete una entrada temeraria sobre un atacante, por la cual es amonestado, y el atacante resulta lesionado como consecuencia de dicha infracción. ¿Debe el atacante lesionado abandonar obligatoriamente el terreno de juego para recibir tratamiento?", "opciones": {"A": "Sí, salvo que el árbitro considere que la lesión es de escasa entidad, en cuyo caso decidirá libremente.", "B": "No, esta es una de las excepciones que permiten que el jugador reciba tratamiento sin necesidad de salir del terreno de juego.", "C": "Sí, en cualquier caso el jugador debe abandonar el terreno de juego para recibir tratamiento, sin excepción posible."}, "correcta": "B", "explicacion": "Si la lesión de un jugador es consecuencia de una infracción física por la cual se amonesta o expulsa al adversario, se trata de una de las excepciones que permiten no salir del terreno de juego para recibir tratamiento.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-029", "bloque": "reglas", "enunciado": "Se concede un tiro penal y el propio jugador lesionado va a lanzarlo. ¿Debe abandonar el terreno de juego para recibir tratamiento antes de ejecutarlo?", "opciones": {"A": "No, se trata de una de las excepciones en las que el jugador lesionado no tiene que salir del terreno de juego.", "B": "Sí, deberá abandonar el terreno de juego y ser sustituido por otro jugador para poder ejecutar el tiro penal.", "C": "Sí, y el tiro penal deberá aplazarse hasta que sea atendido fuera del terreno de juego y pueda regresar."}, "correcta": "A", "explicacion": "Cuando se conceda un tiro penal y el jugador lesionado vaya a lanzarlo, es una de las excepciones que le permiten no abandonar el terreno de juego para recibir tratamiento.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-030", "bloque": "reglas", "enunciado": "Un jugador está sangrando durante el partido. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Invitarle a que abandone el terreno de juego, y solo podrá volver a entrar tras la señal del árbitro, quien comprobará que la hemorragia haya cesado y no haya sangre en su equipamiento.", "B": "Detener el partido de forma definitiva hasta que el jugador sea atendido en el vestuario por el equipo médico, sin posibilidad de que continúe jugando el resto del encuentro.", "C": "Permitir que continúe jugando sin ninguna restricción, siempre que la sangre no afecte visiblemente a otros jugadores ni al desarrollo normal del resto del partido."}, "correcta": "A", "explicacion": "Si un jugador está sangrando, el árbitro le invitará a abandonar el terreno de juego, y solo podrá volver a entrar tras la señal del árbitro, comprobando que la hemorragia haya cesado y no haya sangre en su equipamiento.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-031", "bloque": "reglas", "enunciado": "El árbitro autoriza la entrada de los médicos para atender a un jugador lesionado, pero este se niega a salir del terreno de juego caminando o en camilla. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Deberá expulsarlo directamente por desobedecer una orden expresa del árbitro.", "B": "Deberá amonestarlo por conducta antideportiva.", "C": "No podrá tomar ninguna medida disciplinaria, ya que se trata de un asunto exclusivamente médico."}, "correcta": "B", "explicacion": "Si el árbitro autoriza la entrada de médicos o camilleros y el jugador lesionado no acata la orden de salir del terreno de juego, deberá ser amonestado por conducta antideportiva.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-032", "bloque": "reglas", "enunciado": "El árbitro decide amonestar a un jugador que además debe abandonar el terreno de juego para recibir atención médica. ¿Cuándo debe mostrarle la tarjeta?", "opciones": {"A": "Una vez que el jugador haya sido atendido y regrese al terreno de juego.", "B": "Antes de que el jugador abandone el terreno de juego.", "C": "En el descanso del partido, junto con el resto de incidencias disciplinarias acumuladas."}, "correcta": "B", "explicacion": "Si el árbitro decide amonestar o expulsar a un jugador lesionado que deba salir para recibir atención médica, deberá mostrarle la tarjeta antes de que abandone el terreno de juego.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-033", "bloque": "reglas", "enunciado": "Un jugador se lesiona por una acción fortuita, sin que el juego se detuviera por ningún otro motivo relacionado con una infracción. ¿Cómo se reanuda el juego una vez atendido?", "opciones": {"A": "Con un tiro libre indirecto a favor del equipo del jugador lesionado.", "B": "Con un saque de banda a favor del equipo que tuviera la posesión cuando se produjo la lesión.", "C": "Con un balón a tierra."}, "correcta": "C", "explicacion": "Si el juego no se detuvo por cualquier otro motivo, o la lesión no fue consecuencia de una infracción de las Reglas de Juego, se reanudará con un balón a tierra.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-034", "bloque": "reglas", "enunciado": "Durante un partido, la iluminación artificial del estadio resulta inadecuada para continuar con normalidad. ¿Qué puede hacer el árbitro?", "opciones": {"A": "No podrá adoptar ninguna medida al respecto, al no tratarse de una circunstancia prevista en las Reglas de Juego.", "B": "Podrá detener, suspender temporalmente o de manera definitiva el partido.", "C": "Únicamente podrá suspender el partido de forma definitiva, sin posibilidad de suspensión temporal."}, "correcta": "B", "explicacion": "Una iluminación artificial inadecuada es una de las circunstancias de interferencia externa ante las que el árbitro podrá detener, suspender temporalmente o suspender definitivamente el partido.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-035", "bloque": "reglas", "enunciado": "Un espectador lanza un objeto que golpea a un árbitro asistente. En función de la gravedad del incidente, ¿qué puede decidir el árbitro?", "opciones": {"A": "Suspender el partido de forma definitiva de manera obligatoria en todos los casos, sin margen de valoración.", "B": "Expulsar automáticamente al espectador y continuar el partido sin ninguna otra consecuencia posible.", "C": "Permitir que el partido continúe, o bien detener, suspender temporalmente o suspender definitivamente el partido."}, "correcta": "C", "explicacion": "Cuando un espectador lanza un objeto que golpea a un miembro del equipo arbitral, en función de la gravedad el árbitro podrá permitir que el partido continúe, o detenerlo, suspenderlo temporalmente o de forma definitiva.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-036", "bloque": "reglas", "enunciado": "Un espectador hace sonar un silbato que interfiere claramente en el desarrollo del juego. ¿Cómo debe actuar el árbitro?", "opciones": {"A": "Detendrá el juego y lo reanudará con un balón a tierra.", "B": "Dejará que el juego continúe con normalidad, ya que no se trata de una interferencia contemplada en las Reglas de Juego.", "C": "Detendrá el juego y lo reanudará con un tiro libre indirecto a favor del equipo que tuviera el balón."}, "correcta": "A", "explicacion": "Si un espectador hace sonar un silbato que interfiere en el juego, el árbitro detendrá el juego y lo reanudará con un balón a tierra.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-037", "bloque": "reglas", "enunciado": "Un perro entra al terreno de juego mientras se desarrolla una jugada, pero no interfiere en ningún momento con el juego. ¿Qué debe hacer el árbitro?", "opciones": {"A": "Permitirá que el juego continúe y ordenará que el animal se retire del terreno de juego lo antes posible.", "B": "Detendrá el juego y lo reanudará siempre con un saque de banda a favor del equipo que tuviera la posesión del balón.", "C": "Detendrá el juego de forma automática y lo reanudará con un balón a tierra en el lugar donde se encontraba el balón."}, "correcta": "A", "explicacion": "Si un segundo balón, objeto o animal entra en el terreno de juego y no interfiere en el juego, el árbitro permitirá que continúe y ordenará que se retire lo antes posible.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-038", "bloque": "reglas", "enunciado": "Un segundo balón entra en el terreno de juego e interfiere en el desarrollo del juego, pero el balón original no se dirigía hacia la portería. ¿Cómo debe reanudarse el juego?", "opciones": {"A": "Con un tiro libre indirecto a favor del equipo que no tuviera el control del balón original en ese momento.", "B": "El juego debe continuar sin interrupción, retirando el balón sobrante en la siguiente detención natural del juego.", "C": "Con un balón a tierra, únicamente si el segundo balón interfirió en el juego."}, "correcta": "C", "explicacion": "El árbitro deberá detener el juego (reanudándolo con un balón a tierra) únicamente si el segundo balón, objeto o animal interfiriera en el juego.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-039", "bloque": "reglas", "enunciado": "Un segundo balón entra en el terreno de juego mientras el balón original se dirige hacia la portería, y dicha interferencia no impide que un defensor pueda jugar el balón original. Finalmente el balón original entra en la portería. ¿Qué decisión debe tomar el árbitro?", "opciones": {"A": "Anulará el gol únicamente si el segundo balón procedía del banquillo del equipo defensor, y lo concederá en caso contrario.", "B": "Concederá el gol, ya que la interferencia no impidió que un defensor pudiera jugar el balón.", "C": "Anulará el gol en todo caso y reanudará el juego con un balón a tierra en el punto donde entró el segundo balón."}, "correcta": "B", "explicacion": "Si el balón original iba a entrar en la portería y la interferencia no impidió que un defensor jugara el balón, se concederá gol, incluso si se produjo contacto con el segundo balón, salvo que la interferencia la hubiera causado el equipo atacante.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-040", "bloque": "reglas", "enunciado": "¿Qué debe hacer el árbitro respecto a personas no autorizadas que pretendan acceder al terreno de juego?", "opciones": {"A": "No permitirá que entren en el terreno de juego personas no autorizadas.", "B": "Podrá permitir su entrada siempre que no porten ningún objeto que pueda resultar peligroso.", "C": "Deberá consultarlo previamente con el delegado de campo antes de decidir si permite o no su entrada."}, "correcta": "A", "explicacion": "Entre las facultades del árbitro se incluye no permitir que entren en el terreno de juego personas no autorizadas.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-041", "bloque": "reglas", "enunciado": "Una vez reanudado el juego tras una detención, ¿en qué supuestos podrá el árbitro llevar a cabo una revisión e imponer la sanción disciplinaria correspondiente?", "opciones": {"A": "En cualquier infracción que haya sido detectada por un espectador y comunicada al cuarto árbitro antes de la siguiente jugada.", "B": "En casos de confusión de identidad o ante una posible infracción conducente a expulsión por conducta violenta, escupir, morder o actuar de forma extremadamente ofensiva, insultante o humillante.", "C": "Únicamente cuando la infracción hubiera sido cometida por un miembro del cuerpo técnico y no por un jugador."}, "correcta": "B", "explicacion": "Si el juego se reanuda tras ser detenido, el árbitro únicamente podrá revisar e imponer sanción en casos de confusión de identidad o ante infracciones de expulsión por conducta violenta, escupir, morder o conducta extremadamente ofensiva.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-042", "bloque": "reglas", "enunciado": "¿Cuándo estará permitida la actuación del VAR en un partido?", "opciones": {"A": "En cualquier competición oficial, con la sola comunicación previa a la federación territorial correspondiente.", "B": "Cuando el organizador cumpla todos los requisitos de implementación descritos en el Manual del VAR y haya recibido por escrito el permiso de la FIFA.", "C": "Siempre que el club local disponga de los medios técnicos necesarios, sin necesidad de autorización adicional."}, "correcta": "B", "explicacion": "La actuación del VAR solo está permitida cuando el organizador cumpla todos los requisitos del Manual del VAR y haya recibido por escrito el permiso de la FIFA.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-043", "bloque": "reglas", "enunciado": "¿En qué casos puede asistir el VAR al árbitro principal?", "opciones": {"A": "En cualquier jugada dudosa que uno de los dos equipos solicite expresamente que sea revisada.", "B": "Únicamente en caso de un «error claro, obvio y manifiesto» o un «incidente grave inadvertido».", "C": "En todas las decisiones relativas a faltas, con independencia de su claridad o gravedad."}, "correcta": "B", "explicacion": "El VAR puede asistir al árbitro únicamente en caso de que se produzca un «error claro, obvio y manifiesto» o un «incidente grave inadvertido».", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-044", "bloque": "reglas", "enunciado": "¿Sobre cuál de las siguientes situaciones NO puede intervenir el VAR según sus supuestos previstos?", "opciones": {"A": "Confusión de identidad, cuando el árbitro amonesta o expulsa a un jugador equivocado por error de identificación.", "B": "Gol o no gol, incluidas las decisiones relacionadas con posibles infracciones previas a la anotación del tanto.", "C": "Una amonestación por una falta cometida a mitad del campo sin repercusión clara en el marcador."}, "correcta": "C", "explicacion": "El VAR puede asistir en gol/no gol, penal/no penal, tarjeta roja, confusión de identidad y, como opción de competición, saques de esquina claramente erróneos; una amonestación simple por falta sin mayor repercusión no está entre esos supuestos.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 43}, {"id": "RJ5-045", "bloque": "reglas", "enunciado": "¿Puede el VAR intervenir en la concesión de un saque de esquina claramente erróneo?", "opciones": {"A": "Sí, siempre que la decisión pueda cambiarse inmediatamente y sin retrasar la reanudación, y sea una opción habilitada por la competición.", "B": "Sí, en todas las competiciones y sin ningún tipo de condición adicional.", "C": "No, los saques de esquina quedan en todo caso excluidos de la revisión del VAR."}, "correcta": "A", "explicacion": "Un saque de esquina concedido de forma claramente errónea puede revisarse por el VAR siempre que el cambio pueda hacerse inmediatamente sin retrasar la reanudación, siendo esta una opción para las competiciones.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-046", "bloque": "reglas", "enunciado": "¿En qué se basará la ayuda que proporcione el árbitro asistente de vídeo?", "opciones": {"A": "Exclusivamente en la opinión verbal transmitida por el cuarto árbitro sin visionado de imágenes.", "B": "En la repetición del incidente.", "C": "En el criterio del delegado de campo, que actúa como enlace entre el VAR y el árbitro principal."}, "correcta": "B", "explicacion": "La ayuda del VAR se basará en la repetición del incidente, y el árbitro deberá tomar siempre la decisión final.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-047", "bloque": "reglas", "enunciado": "¿Quién toma la decisión final tras una revisión del VAR?", "opciones": {"A": "El árbitro, que podrá basarse exclusivamente en la información del VAR o en la revisión que él mismo haga de las imágenes en el terreno.", "B": "El árbitro asistente de vídeo, cuya decisión resulta vinculante para el árbitro principal en todos los casos.", "C": "El comité de competición correspondiente, una vez finalizado el encuentro y revisado el informe arbitral."}, "correcta": "A", "explicacion": "El árbitro deberá tomar la decisión final, que podrá basarse exclusivamente en la información del VAR o en la revisión que él mismo haga de las imágenes en el terreno.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-048", "bloque": "reglas", "enunciado": "Salvo en los casos de «incidente grave inadvertido», ¿qué debe hacer siempre el árbitro ante una jugada, incluso si decide no sancionar una posible infracción?", "opciones": {"A": "Consultar obligatoriamente con el VAR antes de adoptar cualquier decisión, aunque la jugada sea clara.", "B": "Esperar a la siguiente detención del juego para comunicar verbalmente su decisión a ambos capitanes.", "C": "Tomar siempre una decisión, incluida la de no penalizar la posible infracción."}, "correcta": "C", "explicacion": "Excepto en los casos de «incidente grave inadvertido», el árbitro deberá tomar siempre una decisión, incluso la de no penalizar una posible infracción, y dicha decisión no se modificará salvo error claro, obvio y manifiesto.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-049", "bloque": "reglas", "enunciado": "¿Cuál de los siguientes dispositivos NO está autorizado para su uso por los árbitros en el terreno de juego según la Regla 5?", "opciones": {"A": "Sistemas de seguimiento electrónico del rendimiento o dispositivos de control del rendimiento físico.", "B": "Intercomunicadores como banderines con señal acústica o auriculares para contactar con el resto del equipo arbitral.", "C": "Cualquier equipamiento electrónico o cámara distinta de las cámaras corporales autorizadas."}, "correcta": "C", "explicacion": "Los árbitros están autorizados a emplear intercomunicadores, sistemas de seguimiento del rendimiento y, en su caso, cámaras corporales; se prohíbe cualquier otro equipamiento electrónico, incluidas otras cámaras.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-050", "bloque": "reglas", "enunciado": "Respecto a las cámaras corporales que pueda usar el equipo arbitral, ¿qué condición se establece sobre los micrófonos que puedan incluir?", "opciones": {"A": "No se pueden usar para retransmitir las comunicaciones con el VAR, aunque las autoridades competentes pueden usar sus imágenes y sonido para asuntos disciplinarios.", "B": "Solo pueden usarse para retransmitir las comunicaciones con el VAR, quedando prohibido cualquier otro uso del sonido captado.", "C": "Deben permanecer desactivados en todo momento y bajo cualquier circunstancia durante el desarrollo del encuentro."}, "correcta": "A", "explicacion": "Las cámaras corporales pueden incluir micrófonos, pero no se pueden usar para retransmitir las comunicaciones con el VAR; su imagen y sonido sí pueden usarse por las autoridades competentes para asuntos disciplinarios.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-051", "bloque": "reglas", "enunciado": "¿Pueden los árbitros llevar accesorios personales durante el partido?", "opciones": {"A": "No, ningún tipo de accesorio está permitido para los miembros del equipo arbitral en el terreno de juego.", "B": "Sí, sin ninguna restricción ni condición, a diferencia de lo que ocurre con los jugadores.", "C": "Sí, siempre y cuando no sean peligrosos."}, "correcta": "C", "explicacion": "Los árbitros pueden llevar accesorios siempre y cuando no sean peligrosos.", "referencia": "Regla 5.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-052", "bloque": "reglas", "enunciado": "¿Cuál de los siguientes elementos forma parte del equipamiento obligatorio del árbitro?", "opciones": {"A": "Silbato(s), cronómetro(s), tarjetas rojas y amarillas y otro medio para anotar las incidencias del partido.", "B": "Silbato(s), banderín de córner y un intercomunicador homologado por la federación organizadora.", "C": "Cronómetro(s), tarjetas rojas y amarillas y una cámara corporal proporcionada por el club local."}, "correcta": "A", "explicacion": "El equipamiento obligatorio del árbitro incluye silbato(s), cronómetro(s), tarjetas rojas y amarillas, y otro medio para anotar las incidencias del partido.", "referencia": "Regla 5.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 44}, {"id": "RJ5-053", "bloque": "reglas", "enunciado": "Un entrenador reacciona de forma incorrecta ante una decisión arbitral, sin llegar a merecer una tarjeta roja directa. ¿Qué puede hacer el árbitro?", "opciones": {"A": "No podrá tomar ninguna medida disciplinaria contra los miembros del cuerpo técnico en ningún caso.", "B": "Únicamente podrá expulsarlo con tarjeta roja, sin posibilidad de amonestación previa.", "C": "Podrá hacerle una advertencia y amonestarlo con tarjeta amarilla."}, "correcta": "C", "explicacion": "El árbitro tomará medidas contra los miembros del cuerpo técnico que no actúen de forma responsable, pudiendo hacerles una advertencia y amonestarlos con tarjeta amarilla, o mostrarles tarjeta roja y expulsarlos.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-054", "bloque": "reglas", "enunciado": "¿Hasta dónde alcanza la potestad del árbitro para expulsar del terreno de juego y sus inmediaciones a un miembro del cuerpo técnico?", "opciones": {"A": "Incluye el área técnica.", "B": "Solo las gradas reservadas al cuerpo técnico, no el propio banquillo del equipo.", "C": "Únicamente el banquillo de suplentes, sin extenderse al resto del área técnica."}, "correcta": "A", "explicacion": "El árbitro podrá mostrar tarjeta roja y expulsar a un miembro del cuerpo técnico del terreno de juego y sus inmediaciones, incluida el área técnica.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-055", "bloque": "reglas", "enunciado": "¿Qué debe hacer el árbitro si detecta cualquier tipo de conducta incorrecta durante el partido, además de las medidas disciplinarias que le correspondan?", "opciones": {"A": "Comunicarlo exclusivamente al finalizar la temporada, dentro de un informe global de conducta.", "B": "Guardar constancia únicamente si dicha conducta ha sido sancionada con tarjeta roja directa.", "C": "Informará sobre dicha conducta incorrecta."}, "correcta": "C", "explicacion": "Entre las facultades y obligaciones del árbitro se incluye informar sobre cualquier tipo de conducta incorrecta.", "referencia": "Regla 5.3", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 5", "pagina": 42}, {"id": "RJ5-056", "bloque": "reglas", "enunciado": "¿Cuándo tendrá el árbitro autoridad para tomar medidas disciplinarias en relación con la inspección previa al partido?", "opciones": {"A": "Únicamente a partir del saque inicial, ya que la inspección previa queda fuera de su ámbito disciplinario.", "B": "Desde que se entrega el acta previa a ambos equipos, con independencia de si el árbitro ha entrado al terreno.", "C": "Desde el momento en que entra en el terreno de juego para realizar la inspección previa al partido."}, "correcta": "C", "explicacion": "El árbitro tendrá autoridad para tomar medidas disciplinarias desde el momento en que entra en el terreno de juego para realizar la inspección previa al partido hasta que lo abandona tras el partido.", "referenci
