<title>Examen de Ascenso Arbitral F11 — CTA/RFEF</title>
<style>
:root{
  --primary:#0d3b66; --primary-dark:#082744; --accent:#1e88e5; --green:#2e7d32; --red:#c62828;
  --amber:#f9a825; --bg:#f4f6f9; --card:#ffffff; --text:#1c1c1c; --muted:#5f6b7a; --border:#dde3ea;
  --soft:#f7f9fc; --soft2:#eef3fa; --neutral:#eee; --error-bg:#fdecea; --selected-bg:#eaf3fd;
  --correcta-bg:#e8f5e9; --incorrecta-bg:#fdecea; --amber-bg:#fff3d6; --amber-text:#8a5a00;
}
:root[data-theme="dark"]{
  --primary:#4a90d9; --primary-dark:#0d3b66; --accent:#5aa3ec; --green:#4caf50; --red:#ef5350;
  --amber:#ffca28; --bg:#12161c; --card:#1b212b; --text:#e7ebf0; --muted:#98a4b3; --border:#2b3341;
  --soft:#232b37; --soft2:#20293a; --neutral:#242c38; --error-bg:#3a2226; --selected-bg:#1c2c40;
  --correcta-bg:#1c3324; --incorrecta-bg:#3a2226; --amber-bg:#3a3120; --amber-text:#ffca28;
}
body{transition:background-color .2s,color .2s;}
.card{transition:background-color .2s,border-color .2s;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
.container{max-width:900px;margin:0 auto;padding:20px;}
header.app-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:24px 20px;text-align:center;position:relative;}
header.app-header h1{margin:0;font-size:1.5rem;}
header.app-header p{margin:6px 0 0;opacity:.85;font-size:.9rem;}
.docs-bar{max-width:860px;width:calc(100% - 40px);margin:12px auto 0;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.docs-bar .docs-title{font-weight:700;font-size:.9rem;color:var(--primary);margin-right:4px;}
.docs-bar a{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--primary);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;}
.docs-bar a:hover{opacity:.9;}
#btnTema{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer;}
#btnTema:hover{background:rgba(255,255,255,.25);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
h2{margin-top:0;color:var(--primary);font-size:1.15rem;}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:.92rem;}
select,input[type=number],input[type=text]{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;width:100%;max-width:220px;background:var(--card);color:var(--text);}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.row > div{flex:1;min-width:150px;}
.radio-group{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;}
.radio-group label{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;cursor:pointer;}
button{cursor:pointer;border:none;border-radius:8px;padding:12px 20px;font-size:1rem;font-weight:600;transition:opacity .15s;}
button:hover{opacity:.9;}
button:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-success{background:var(--green);color:#fff;}
.btn-outline{background:var(--card);border:1px solid var(--accent);color:var(--accent);}
.btn-danger{background:var(--red);color:#fff;}
.btn-block{width:100%;}
.btn-lg{font-size:1.15rem;padding:16px;}
.error-box{background:var(--error-bg);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:6px;margin-top:10px;font-size:.9rem;}
.hidden{display:none !important;}
.progress-grid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.progress-grid button{width:34px;height:34px;padding:0;font-size:.8rem;border-radius:6px;background:var(--neutral);color:var(--text);border:1px solid var(--border);}
.progress-grid button.answered{background:var(--accent);color:#fff;}
.progress-grid button.current{outline:3px solid var(--amber);}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.q-header .badge{background:var(--soft2);color:var(--primary);padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:600;}
.enunciado{font-size:1.05rem;line-height:1.5;margin-bottom:18px;font-weight:500;}
.opcion{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:.95rem;line-height:1.4;color:var(--text);}
.opcion:hover{border-color:var(--accent);}
.opcion.selected{border-color:var(--accent);background:var(--selected-bg);}
.opcion.correcta{border-color:var(--green);background:var(--correcta-bg);}
.opcion.incorrecta{border-color:var(--red);background:var(--incorrecta-bg);}
.opcion .letra{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--primary);color:#fff;font-size:.8rem;margin-right:8px;font-weight:700;}
.nav-buttons{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;}
.nav-buttons > div{display:flex;gap:10px;}
.explicacion-box{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--soft);border:1px solid var(--border);font-size:.9rem;}
.explicacion-box.correcta-box{border-color:var(--green);background:var(--correcta-bg);}
.explicacion-box.incorrecta-box{border-color:var(--red);background:var(--incorrecta-bg);}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.92rem;}
.stat-row:last-child{border-bottom:none;}
.big-number{font-size:2.4rem;font-weight:700;color:var(--primary);text-align:center;}
.pct-label{text-align:center;color:var(--muted);margin-bottom:10px;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
.review-item.ok{border-left:5px solid var(--green);}
.review-item.ko{border-left:5px solid var(--red);}
.review-item.blank{border-left:5px solid var(--amber);}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--soft2);color:var(--primary);margin-right:6px;}
.footer-note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px;}
.summary-block{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
.summary-block > div{flex:1;min-width:140px;background:var(--soft);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border);}
.summary-block .num{font-size:1.5rem;font-weight:700;}
.toggle-config{display:flex;gap:10px;margin-bottom:6px;}
.toggle-config button{flex:1;background:var(--neutral);color:var(--text);}
.toggle-config button.active{background:var(--primary);color:#fff;}
.nivel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px;}
.nivel-opt{display:flex !important;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:8px;padding:10px;font-weight:500 !important;margin:0 !important;background:var(--soft);}
.nivel-opt small{display:block;color:var(--muted);font-weight:400;margin-top:2px;line-height:1.3;}
.tag-nivel{background:var(--amber-bg);color:var(--amber-text);}
.info-text{font-size:.82rem;color:var(--muted);margin-top:4px;}

.timer-box{margin-bottom:14px;}
.timer-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px;}
.timer-bar{height:10px;background:var(--neutral);border-radius:6px;overflow:hidden;}
.timer-fill{height:100%;width:100%;background:var(--green);transition:width .25s linear,background .3s;}
.timer-box.warn .timer-fill{background:var(--amber);}
.timer-box.danger .timer-fill{background:var(--red);}
.timer-box.danger .timer-top{color:var(--red);}
.opcion:disabled{cursor:not-allowed;opacity:1;color:var(--text);-webkit-text-fill-color:var(--text);}
.opcion:disabled .letra{color:#fff;-webkit-text-fill-color:#fff;}
</style>
</head>

<script id="data-banco" type="application/json">[{"id": "BC-001", "bloque": "normativa", "enunciado": "Según las Bases de Competición, ¿qué obligación tiene el club local respecto a la asistencia sanitaria en cada partido?", "opciones": {"A": "Disponer de un médico colegiado en plantilla y una ambulancia de soporte vital básico.", "B": "Disponer únicamente de un fisioterapeuta en el banquillo local.", "C": "Disponer de una ambulancia solo cuando lo solicite el equipo visitante."}, "correcta": "A", "explicacion": "El Art. 20 exige médico colegiado obligatorio presente como local y ambulancia de soporte vital básico aportada por el club local.", "referencia": "Art. 20", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 20"}, {"id": "BC-002", "bloque": "normativa", "enunciado": "¿Quién es responsable, entre otras funciones, del control antidopaje según el Art. 20 de las Bases de Competición?", "opciones": {"A": "El delegado de campo.", "B": "El médico colegiado de la plantilla.", "C": "El cuarto árbitro."}, "correcta": "B", "explicacion": "El médico colegiado obligatorio en plantilla es responsable, entre otras cosas, del control antidopaje.", "referencia": "Art. 20", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 20"}, {"id": "BC-003", "bloque": "normativa", "enunciado": "¿Cuál es el número mínimo de futbolistas de la plantilla de la categoría necesario para poder empezar un partido según el Art. 23?", "opciones": {"A": "7 futbolistas.", "B": "8 futbolistas.", "C": "9 futbolistas."}, "correcta": "A", "explicacion": "El Art. 23 exige un mínimo de 7 futbolistas de la plantilla de la categoría para poder empezar el partido; en caso contrario, incomparecencia.", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 23"}, {"id": "BC-004", "bloque": "normativa", "enunciado": "Durante un partido, ¿cuántos futbolistas como máximo pueden no pertenecer a la plantilla de la categoría en que militan, según el Art. 23?", "opciones": {"A": "2 futbolistas.", "B": "4 futbolistas.", "C": "6 futbolistas."}, "correcta": "B", "explicacion": "El Art. 23 fija un máximo de 4 futbolistas que no pertenezcan a la plantilla de la categoría durante el partido.", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 23"}, {"id": "BC-005", "bloque": "normativa", "enunciado": "Si un equipo se presenta con menos de 7 futbolistas de su plantilla de categoría, ¿qué situación se produce según el Art. 23?", "opciones": {"A": "Se retrasa el inicio 30 minutos.", "B": "Incomparecencia.", "C": "Se juega igualmente con autorización del árbitro."}, "correcta": "B", "explicacion": "El mínimo de 7 futbolistas de la plantilla de la categoría es requisito para empezar; de no cumplirse, se considera incomparecencia.", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 23"}, {"id": "BC-006", "bloque": "normativa", "enunciado": "¿Cuál es el número máximo de suplentes posibles según el Art. 24 de las Bases de Competición?", "opciones": {"A": "7 suplentes.", "B": "9 suplentes.", "C": "12 suplentes."}, "correcta": "B", "explicacion": "El Art. 24 establece un máximo de 9 suplentes posibles.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 24"}, {"id": "BC-007", "bloque": "normativa", "enunciado": "¿Cuántas sustituciones efectivas como máximo, y en cuántas interrupciones por equipo, permite el Art. 24?", "opciones": {"A": "3 sustituciones en 2 interrupciones.", "B": "5 sustituciones en 3 interrupciones.", "C": "6 sustituciones en 4 interrupciones."}, "correcta": "B", "explicacion": "El Art. 24 permite máximo 5 sustituciones efectivas, distribuidas en 3 interrupciones por equipo, previa autorización arbitral.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 24"}, {"id": "BC-008", "bloque": "normativa", "enunciado": "En el Play Off de Ascenso, si el partido llega a la prórroga, ¿qué sustituciones adicionales contempla el Art. 24?", "opciones": {"A": "2 sustituciones adicionales y 2 oportunidades más.", "B": "1 sustitución adicional y 1 oportunidad de sustitución más.", "C": "No se permite ninguna sustitución adicional en prórroga."}, "correcta": "B", "explicacion": "En Play Off de Ascenso y Torneo de Permanencia, si hay prórroga se concede 1 sustitución adicional y 1 oportunidad de sustitución más.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 24"}, {"id": "BC-009", "bloque": "normativa", "enunciado": "¿Cuántos futbolistas como máximo pueden calentar por equipo en banda junto al preparador físico, según el Art. 24?", "opciones": {"A": "3 futbolistas.", "B": "5 futbolistas.", "C": "7 futbolistas."}, "correcta": "B", "explicacion": "El Art. 24 fija un máximo de 5 futbolistas por equipo calentando en banda junto al preparador físico.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 24"}, {"id": "BC-010", "bloque": "normativa", "enunciado": "¿Se puede sustituir a un futbolista que ha sido expulsado, según el Art. 24 de las Bases de Competición?", "opciones": {"A": "Sí, siempre que queden sustituciones disponibles.", "B": "No, en ningún caso.", "C": "Sí, pero solo en la segunda parte."}, "correcta": "B", "explicacion": "El Art. 24 establece expresamente que no se puede sustituir a un futbolista expulsado.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 24"}, {"id": "BC-011", "bloque": "normativa", "enunciado": "¿Quién puede acceder al vestuario según el Art. 24 de las Bases de Competición?", "opciones": {"A": "Cualquier aficionado acreditado por el club.", "B": "Solo miembros autorizados: equipo arbitral, futbolistas inscritos en acta, técnicos, médicos, fisioterapeutas, delegados, etc.", "C": "Únicamente los capitanes de ambos equipos."}, "correcta": "B", "explicacion": "El Art. 24 limita el acceso al vestuario a los miembros autorizados expresamente enumerados.", "referencia": "Art. 24", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 24"}, {"id": "BC-012", "bloque": "normativa", "enunciado": "¿A qué normativa de juego están sujetos obligatoriamente los partidos según el Art. 25 de las Bases de Competición?", "opciones": {"A": "A las Reglas de Juego de la IFAB vigentes en la temporada en curso.", "B": "A las Reglas de Juego que decida cada federación autonómica.", "C": "A un reglamento propio de la RFEF independiente de la IFAB."}, "correcta": "A", "explicacion": "El Art. 25 establece la sujeción obligatoria a las Reglas de Juego de la IFAB vigentes en la temporada en curso.", "referencia": "Art. 25", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 25"}, {"id": "BC-013", "bloque": "normativa", "enunciado": "Según el Art. 26, ¿con qué balón es obligatorio disputar todos los partidos de la competición?", "opciones": {"A": "Con cualquier balón homologado por la FIFA.", "B": "Con el balón oficial aprobado por la RFEF para esa competición.", "C": "Con el balón que elija el club local en cada jornada."}, "correcta": "B", "explicacion": "El Art. 26 obliga a disputar todos los partidos, en fase regular y sucesivas fases, con el balón oficial aprobado por la RFEF.", "referencia": "Art. 26", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 26"}, {"id": "BC-014", "bloque": "normativa", "enunciado": "¿Qué consecuencia tiene el incumplimiento del pago de honorarios arbitrales según el Art. 27?", "opciones": {"A": "Ninguna, es un asunto exclusivamente económico entre clubes.", "B": "Sanciones disciplinarias y competicionales.", "C": "Solo un recargo económico sin efectos deportivos."}, "correcta": "B", "explicacion": "El Art. 27 establece que el incumplimiento del pago de honorarios arbitrales conlleva sanciones disciplinarias y competicionales.", "referencia": "Art. 27", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 27"}, {"id": "BC-015", "bloque": "normativa", "enunciado": "¿Cuántas equipaciones mínimas deben comunicarse al Departamento de Competiciones junto con la inscripción, según el Art. 28?", "opciones": {"A": "1 equipación.", "B": "2 equipaciones.", "C": "3 equipaciones."}, "correcta": "B", "explicacion": "El Art. 28 exige un mínimo de 2 equipaciones comunicadas junto con la inscripción.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 28"}, {"id": "BC-016", "bloque": "normativa", "enunciado": "¿Qué tipo de contenido publicitario está prohibido, incluso en el brazalete de capitán, según el Art. 28?", "opciones": {"A": "Contenido político o religioso.", "B": "Contenido de marcas de bebidas isotónicas.", "C": "Contenido de otras entidades deportivas nacionales."}, "correcta": "A", "explicacion": "El Art. 28 exige publicidad siempre de contenido comercial y prohíbe expresamente el contenido político o religioso, también en el brazalete de capitán.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 28"}, {"id": "BC-017", "bloque": "normativa", "enunciado": "¿En qué manga es obligatorio el parche identificativo RFEF/competición según el Art. 28?", "opciones": {"A": "En la manga izquierda.", "B": "En la manga derecha.", "C": "En ambas mangas."}, "correcta": "B", "explicacion": "El Art. 28 establece el parche identificativo RFEF/competición obligatorio en la manga derecha.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 28"}, {"id": "BC-018", "bloque": "normativa", "enunciado": "¿Qué altura debe tener el dorsal en la espalda según el Art. 28 de las Bases de Competición?", "opciones": {"A": "20 cm.", "B": "25 cm.", "C": "30 cm."}, "correcta": "B", "explicacion": "El Art. 28 fija 25 cm de altura para el dorsal en la espalda.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 28"}, {"id": "BC-019", "bloque": "normativa", "enunciado": "¿Qué altura debe tener la identificación nominal situada encima del dorsal, según el Art. 28?", "opciones": {"A": "5 cm.", "B": "7,5 cm.", "C": "10 cm."}, "correcta": "B", "explicacion": "El Art. 28 establece 7,5 cm de altura para la identificación nominal encima del dorsal.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 28"}, {"id": "BC-020", "bloque": "normativa", "enunciado": "Según el Art. 28, ¿qué números de dorsal están reservados a los guardametas y a un eventual tercer guardameta?", "opciones": {"A": "El 1 y el 13 para guardametas; el 25 reservado para un eventual tercer guardameta.", "B": "El 1 y el 12 para guardametas; el 24 para el tercer guardameta.", "C": "Solo el número 1 está reservado, sin reserva adicional para un tercer guardameta."}, "correcta": "A", "explicacion": "El Art. 28 reserva el 1 y el 13 para guardametas, y el 25 para un eventual tercer guardameta, dentro de la numeración del 1 al 25.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 28"}, {"id": "BC-021", "bloque": "normativa", "enunciado": "¿A partir de qué número deben llevar dorsal fijo los futbolistas de equipos filiales/dependientes, según el Art. 28?", "opciones": {"A": "A partir del número 20.", "B": "A partir del número 26.", "C": "A partir del número 30."}, "correcta": "B", "explicacion": "El Art. 28 exige a los futbolistas de equipos filiales/dependientes un dorsal fijo a partir del número 26.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 28"}, {"id": "BC-022", "bloque": "normativa", "enunciado": "¿Qué altura debe tener el dorsal situado en el pantalón, en su parte anterior derecha, según el Art. 28?", "opciones": {"A": "7,5 cm.", "B": "10 cm.", "C": "15 cm."}, "correcta": "B", "explicacion": "El Art. 28 fija 10 cm de altura para el dorsal en la parte anterior derecha del pantalón.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 1, "articulo": "Art. 28"}, {"id": "BC-023", "bloque": "normativa", "enunciado": "¿Con cuánta antelación mínima al inicio de la competición debe remitirse la relación de plantilla y dorsales al Departamento de Competiciones, según el Art. 28?", "opciones": {"A": "5 días.", "B": "10 días.", "C": "15 días."}, "correcta": "B", "explicacion": "El Art. 28 exige remitir la relación de plantilla y dorsales con al menos 10 días de antelación al inicio de la competición.", "referencia": "Art. 28", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 28"}, {"id": "BC-024", "bloque": "normativa", "enunciado": "¿Está permitido alterar las medidas del rectángulo de juego declaradas al inicio de temporada, según el Art. 29?", "opciones": {"A": "Sí, siempre que se informe al árbitro antes del partido.", "B": "No, está prohibido.", "C": "Sí, únicamente en el campo alternativo."}, "correcta": "B", "explicacion": "El Art. 29 prohíbe expresamente alterar las medidas del rectángulo de juego declaradas al inicio de temporada.", "referencia": "Art. 29", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 29"}, {"id": "BC-025", "bloque": "normativa", "enunciado": "¿Dentro de qué ámbito territorial deben estar el campo principal y el alternativo, según el Art. 29?", "opciones": {"A": "Dentro del ámbito territorial de la federación autonómica del club.", "B": "En cualquier comunidad autónoma de España.", "C": "Solo en el mismo municipio del club, sin más restricciones."}, "correcta": "A", "explicacion": "El Art. 29 exige que el campo principal y el alternativo estén dentro del ámbito territorial de la federación autonómica del club.", "referencia": "Art. 29", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 29"}, {"id": "BC-026", "bloque": "normativa", "enunciado": "¿Hasta qué día y hora debe solicitarse a través de Novanet un acto protocolario para un partido de jornada de fin de semana, según el Art. 30?", "opciones": {"A": "Los jueves a las 12h.", "B": "Los viernes a las 12h.", "C": "Los sábados a las 10h."}, "correcta": "B", "explicacion": "El Art. 30 exige solicitar los actos protocolarios antes de los viernes a las 12h (o los martes a las 12h si es jornada intersemanal).", "referencia": "Art. 30", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 30"}, {"id": "BC-027", "bloque": "normativa", "enunciado": "Si se produce un fallecimiento fuera de plazo y el club quiere guardar un minuto de silencio, ¿qué exige el Art. 30?", "opciones": {"A": "Necesita autorización previa igualmente, sin excepciones.", "B": "No necesita autorización previa, pero sí informar al árbitro.", "C": "Queda automáticamente prohibido por falta de plazo."}, "correcta": "B", "explicacion": "El Art. 30 exceptúa de autorización previa el fallecimiento fuera de plazo, aunque exige informar al árbitro.", "referencia": "Art. 30", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 30"}, {"id": "BC-028", "bloque": "normativa", "enunciado": "¿Cuánto tiempo antes del inicio del partido deben haber finalizado una entrega de trofeos o un homenaje del club local, según el Art. 30?", "opciones": {"A": "5 minutos antes.", "B": "7 minutos antes.", "C": "10 minutos antes."}, "correcta": "B", "explicacion": "El Art. 30 exige que la entrega de trofeos y los homenajes del club local acaben 7 minutos antes del inicio del partido.", "referencia": "Art. 30", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 30"}, {"id": "BC-029", "bloque": "normativa", "enunciado": "Según el Art. 23, ¿qué debe hacer el árbitro respecto a las alineaciones antes del inicio del partido?", "opciones": {"A": "Debe ser informado de titulares, suplentes y banquillo técnico antes del inicio.", "B": "No es necesario informar al árbitro salvo cambios de última hora.", "C": "Solo debe ser informado si hay futbolistas ajenos a la plantilla de la categoría."}, "correcta": "A", "explicacion": "El Art. 23 exige que el árbitro sea informado antes del inicio del partido de titulares/suplentes y del banquillo técnico.", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 23"}, {"id": "BC-030", "bloque": "normativa", "enunciado": "¿Qué debe declarar el club a la RFEF al inscribirse, según el Art. 29 de las Bases de Competición?", "opciones": {"A": "Situación, medidas, superficie y campo alternativo.", "B": "Únicamente el aforo del estadio.", "C": "El nombre del preparador físico y del delegado."}, "correcta": "A", "explicacion": "El Art. 29 obliga a informar a la RFEF, al inscribirse, sobre situación, medidas, superficie y campo alternativo.", "referencia": "Art. 29", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "articulo": "Art. 29"}, {"id": "BC-049", "bloque": "normativa", "regla": null, "articulo": "Art. 23", "enunciado": "Según el Art. 23 de las Bases de Competición, ¿por qué normativa se rigen los futbolistas de equipos filiales/dependientes?", "opciones": {"A": "Por la normativa específica de la RFEF.", "B": "Por el mismo límite de edad que los árbitros aficionados.", "C": "No pueden alinearse en ningún caso en el primer equipo."}, "correcta": "A", "explicacion": "Según el Art. 23, los futbolistas de filiales/dependientes se rigen por la normativa específica de la RFEF.", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "pagina": null}, {"id": "BC-050", "bloque": "normativa", "regla": null, "articulo": "Art. 29", "enunciado": "Además de declarar situación, medidas y superficie del campo, ¿qué otro requisito exige el Art. 29 sobre las instalaciones?", "opciones": {"A": "Disponer de licencia de apertura y funcionamiento vigente.", "B": "Tener un aforo mínimo de 500 espectadores.", "C": "Disponer de césped artificial homologado obligatoriamente."}, "correcta": "A", "explicacion": "El Art. 29 exige que las instalaciones dispongan de licencia de apertura y funcionamiento vigente.", "referencia": "Art. 29", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "pagina": null}, {"id": "BC-051", "bloque": "normativa", "regla": null, "articulo": "Art. 30", "enunciado": "Según el Art. 30, ¿hasta cuándo debe solicitarse a través de Novanet un acto protocolario, según el tipo de jornada?", "opciones": {"A": "Los viernes a las 12h para jornada de fin de semana, o los martes a las 12h si es jornada intersemanal.", "B": "Siempre los lunes a las 9h, sin distinción del tipo de jornada.", "C": "El mismo día del partido, con un mínimo de 2 horas de antelación."}, "correcta": "A", "explicacion": "El Art. 30 estipula que estas solicitudes se hacen a través de Novanet antes de los viernes a las 12h, o los martes a las 12h si se trata de una jornada intersemanal.", "referencia": "Art. 30", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "pagina": null}, {"id": "BC-052", "bloque": "normativa", "regla": null, "articulo": "Art. 30", "enunciado": "Según el Art. 30, ¿qué requieren con carácter general el minuto de silencio, los brazaletes negros, los saques de honor y la entrega de trofeos?", "opciones": {"A": "Autorización previa.", "B": "Ninguna autorización, basta con informar al árbitro el mismo día.", "C": "Autorización exclusivamente de la federación autonómica correspondiente."}, "correcta": "A", "explicacion": "El Art. 30 exige autorización previa para estos actos protocolarios, salvo la excepción expresa del fallecimiento fuera de plazo, que no necesita autorización pero sí informar al árbitro.", "referencia": "Art. 30", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-001", "bloque": "normativa", "enunciado": "¿Cuántos asistentes componen el equipo arbitral en fútbol 11 según el Art. 105 del Reglamento de Competiciones?", "opciones": {"A": "1 asistente.", "B": "2 asistentes.", "C": "3 asistentes."}, "correcta": "B", "explicacion": "El Art. 105 establece que el equipo arbitral se compone de principal, 2 asistentes, 4º árbitro y VAR/AVAR.", "referencia": "Art. 105", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 105"}, {"id": "RC-002", "bloque": "normativa", "enunciado": "Según el Art. 106, ¿es compatible para un árbitro participar en apuestas con contenido económico relacionadas con el fútbol?", "opciones": {"A": "Sí, si no afecta a partidos que él mismo arbitra.", "B": "No, es totalmente incompatible y afecta a todo el equipo arbitral.", "C": "Sí, siempre que lo autorice el CTA."}, "correcta": "B", "explicacion": "El Art. 106 declara totalmente incompatible la participación en apuestas o juegos con contenido económico, afectando a todo el equipo arbitral.", "referencia": "Art. 106", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 106"}, {"id": "RC-003", "bloque": "normativa", "enunciado": "¿Puede un árbitro tener simultáneamente otra licencia de actividad futbolística, según el Art. 106?", "opciones": {"A": "Sí, sin restricciones.", "B": "No, no se puede tener otra licencia de la actividad del fútbol a la vez.", "C": "Sí, si es en una categoría inferior."}, "correcta": "B", "explicacion": "El Art. 106 establece el régimen de incompatibilidades, prohibiendo tener otra licencia de la actividad del fútbol simultáneamente.", "referencia": "Art. 106", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 106"}, {"id": "RC-004", "bloque": "normativa", "enunciado": "¿A qué están obligados los árbitros según el Art. 107 en relación con el dopaje?", "opciones": {"A": "A someterse a controles de dopaje.", "B": "A supervisar exclusivamente los controles de dopaje de los jugadores.", "C": "No tienen obligación alguna relacionada con el dopaje."}, "correcta": "A", "explicacion": "El Art. 107 recoge como obligación específica de la licencia el someterse a controles de dopaje.", "referencia": "Art. 107", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 107"}, {"id": "RC-005", "bloque": "normativa", "enunciado": "¿Cuál es la duración mínima y máxima de la suspensión voluntaria de afiliación al colectivo arbitral aficionado, según el Art. 108?", "opciones": {"A": "No inferior a 1 mes ni superior a 6 meses.", "B": "No inferior a 3 meses ni superior a 12 meses.", "C": "No inferior a 6 meses ni superior a 24 meses."}, "correcta": "B", "explicacion": "El Art. 108 fija la duración de la suspensión voluntaria entre 3 y 12 meses.", "referencia": "Art. 108", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 108"}, {"id": "RC-006", "bloque": "normativa", "enunciado": "Tras reingresar a activo, ¿cuánto tiempo debe pasar antes de poder solicitar otra suspensión voluntaria, según el Art. 108?", "opciones": {"A": "1 año.", "B": "2 años.", "C": "3 años."}, "correcta": "B", "explicacion": "El Art. 108 exige que pasen 2 años desde el reingreso a activo para poder solicitar otra suspensión.", "referencia": "Art. 108", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 108"}, {"id": "RC-007", "bloque": "normativa", "enunciado": "¿Con cuánta antelación a la finalización de la suspensión debe solicitarse la reincorporación al CTA, según el Art. 108?", "opciones": {"A": "7 días antes.", "B": "15 días antes.", "C": "30 días antes."}, "correcta": "B", "explicacion": "El Art. 108 exige solicitar la reincorporación al CTA 15 días antes de finalizar la suspensión.", "referencia": "Art. 108", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 108"}, {"id": "RC-008", "bloque": "normativa", "enunciado": "¿Cuántas árbitras y árbitras asistentes descienden cada temporada de 1ª Federación Femenina, según el Art. 110?", "opciones": {"A": "1 árbitra y 1 árbitra asistente.", "B": "2 árbitras y 2 árbitras asistentes.", "C": "3 árbitras y 3 árbitras asistentes."}, "correcta": "B", "explicacion": "El Art. 110 establece que descienden cada temporada las 2 árbitras y 2 árbitras asistentes peor evaluadas de 1ª Federación Femenina.", "referencia": "Art. 110", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 110"}, {"id": "RC-009", "bloque": "normativa", "enunciado": "¿Cuántos árbitros ascienden a Segunda Federación desde el Programa de Talentos y Mentores, según el Art. 110?", "opciones": {"A": "10 árbitros, o los necesarios hasta completar 80.", "B": "20 árbitros, o los necesarios hasta completar 120.", "C": "30 árbitros, o los necesarios hasta completar 150."}, "correcta": "B", "explicacion": "El Art. 110 fija el ascenso de 20 árbitros (o los necesarios hasta completar 120) del Programa de Talentos y Mentores.", "referencia": "Art. 110", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 110"}, {"id": "RC-010", "bloque": "normativa", "enunciado": "Según el Art. 111, ¿cómo se determina la plantilla de asistentes profesionales de una categoría?", "opciones": {"A": "Es igual al número de árbitros principales de esa categoría.", "B": "Es el doble de los árbitros principales de esa categoría.", "C": "Es la mitad de los árbitros principales de esa categoría."}, "correcta": "B", "explicacion": "El Art. 111 establece que la plantilla de asistentes profesionales equivale al doble de los árbitros principales de la categoría.", "referencia": "Art. 111", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 111"}, {"id": "RC-011", "bloque": "normativa", "enunciado": "¿A qué edad se produce la baja por edad para árbitros no profesionales de 1ª, 2ª y 3ª Federación, según el Art. 112?", "opciones": {"A": "38 años cumplidos a 1 de julio.", "B": "40 años cumplidos a 1 de julio.", "C": "42 años cumplidos a 1 de julio."}, "correcta": "B", "explicacion": "El Art. 112 fija la baja por edad en 40 años cumplidos a 1 de julio para 1ª/2ª/3ª Federación.", "referencia": "Art. 112", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 112"}, {"id": "RC-012", "bloque": "normativa", "enunciado": "¿Cuál es la edad máxima de baja en el fútbol femenino aficionado, según el Art. 112?", "opciones": {"A": "40 años.", "B": "45 años.", "C": "50 años."}, "correcta": "B", "explicacion": "El Art. 112 establece 45 años como edad máxima de baja en el fútbol femenino aficionado.", "referencia": "Art. 112", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 112"}, {"id": "RC-013", "bloque": "normativa", "enunciado": "¿Cuál es la edad límite de acceso a 2ª Federación según el Art. 112?", "opciones": {"A": "32 años.", "B": "34 años.", "C": "39 años."}, "correcta": "A", "explicacion": "El Art. 112 fija en 32 años la edad límite de acceso a 2ª Federación.", "referencia": "Art. 112", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 112"}, {"id": "RC-014", "bloque": "normativa", "enunciado": "¿Cuál es el plazo para alegar la pérdida de categoría desde la notificación, según el Art. 113?", "opciones": {"A": "10 días naturales.", "B": "15 días naturales.", "C": "30 días naturales."}, "correcta": "B", "explicacion": "El Art. 113 fija el plazo de alegación en 15 días naturales desde la notificación.", "referencia": "Art. 113", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 113"}, {"id": "RC-015", "bloque": "normativa", "enunciado": "Según el Art. 113, ¿qué porcentaje de actuaciones respecto a la media de su categoría determina la pérdida de categoría?", "opciones": {"A": "Menos del 50% de la media de actuaciones.", "B": "Menos del 30% de la media de actuaciones.", "C": "Menos del 70% de la media de actuaciones."}, "correcta": "A", "explicacion": "El Art. 113 establece que pierde la categoría quien actúe en menos del 50% de la media de actuaciones de su categoría, salvo lesión o enfermedad grave.", "referencia": "Art. 113", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 113"}, {"id": "RC-016", "bloque": "normativa", "enunciado": "¿En qué plazo aproximado se convoca la repesca para quienes no superan las pruebas físicas/técnicas, según el Art. 113?", "opciones": {"A": "15 días.", "B": "30 días.", "C": "60 días."}, "correcta": "B", "explicacion": "El Art. 113 indica una convocatoria de repesca en un plazo aproximado de 30 días tras no superar las pruebas.", "referencia": "Art. 113", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 113"}, {"id": "RC-017", "bloque": "normativa", "enunciado": "Según el Art. 114, ¿en qué casos interviene el VAR en 1ª/2ª División?", "opciones": {"A": "En cualquier decisión dudosa del árbitro.", "B": "Solo ante 'error claro y manifiesto' o 'incidente grave inadvertido'.", "C": "Únicamente cuando lo solicita el capitán del equipo perjudicado."}, "correcta": "B", "explicacion": "El Art. 114 limita la intervención del VAR a error claro y manifiesto o incidente grave inadvertido: gol/no gol, penalti/no penalti, roja directa o confusión de identidad.", "referencia": "Art. 114", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 114"}, {"id": "RC-018", "bloque": "normativa", "enunciado": "¿Son recurribles por los clubes las decisiones derivadas del uso del VAR, según el Art. 114?", "opciones": {"A": "Sí, ante el Comité de Competición.", "B": "No, no son recurribles.", "C": "Sí, pero solo en Copa del Rey."}, "correcta": "B", "explicacion": "El Art. 114 establece que las decisiones derivadas del uso del VAR no son recurribles por los clubes.", "referencia": "Art. 114", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 114"}, {"id": "RC-019", "bloque": "normativa", "enunciado": "¿Qué consecuencia tiene, según el Art. 116, que un árbitro aficionado no comparezca o abandone una prueba sin autorización?", "opciones": {"A": "Ninguna consecuencia si se justifica posteriormente.", "B": "Suspensión inmediata de designaciones y posible expediente disciplinario.", "C": "Una simple amonestación verbal del CTA."}, "correcta": "B", "explicacion": "El Art. 116 prevé suspensión inmediata de designaciones y posible expediente disciplinario ante esa conducta.", "referencia": "Art. 116", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 116"}, {"id": "RC-020", "bloque": "normativa", "enunciado": "¿Dónde deben pernoctar los árbitros profesionales la víspera del partido en 1ª/2ª División, según el Art. 117?", "opciones": {"A": "En su domicilio habitual.", "B": "En la misma localidad del partido, salvo autorización o si son VAR/AVAR.", "C": "En cualquier localidad siempre que lleguen a tiempo."}, "correcta": "B", "explicacion": "El Art. 117 obliga a pernoctar la víspera en la misma localidad, salvo autorización o para funciones de VAR/AVAR.", "referencia": "Art. 117", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 117"}, {"id": "RC-021", "bloque": "normativa", "enunciado": "¿Cuál es el periodo de vigencia de una licencia arbitral definitiva, según el Art. 121?", "opciones": {"A": "Del 1 de enero al 31 de diciembre.", "B": "Del 1 de julio al 30 de junio del año siguiente.", "C": "Del 1 de septiembre al 31 de agosto."}, "correcta": "B", "explicacion": "El Art. 121 fija la validez de la licencia definitiva del 1 de julio al 30 de junio del año siguiente, debiendo renovarse cada temporada.", "referencia": "Art. 121", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 121"}, {"id": "RC-022", "bloque": "normativa", "enunciado": "¿Cuál es el plazo para convalidar una licencia defectuosa desde su rechazo, según el Art. 124?", "opciones": {"A": "7 días.", "B": "15 días.", "C": "20 días."}, "correcta": "B", "explicacion": "El Art. 124 fija en 15 días desde el rechazo el plazo para convalidar una licencia defectuosa.", "referencia": "Art. 124", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 124"}, {"id": "RC-023", "bloque": "normativa", "enunciado": "¿Cuántos años como árbitro se exigen como mínimo para acceder a Árbitro Profesional de 1ª División, según el Art. 126?", "opciones": {"A": "5 años, con 1 año en 2ª División.", "B": "9 años, con 1 año mínimo en 2ª División.", "C": "12 años, con 2 años en 2ª División."}, "correcta": "B", "explicacion": "El Art. 126 exige mínimo 9 años como árbitro más 1 año mínimo en 2ª División para acceder a Árbitro Profesional de 1ª División.", "referencia": "Art. 126", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 126"}, {"id": "RC-024", "bloque": "normativa", "enunciado": "¿Qué certificado de idioma se exige para la licencia profesional según el Art. 126?", "opciones": {"A": "Certificado de francés B1.", "B": "Certificado de inglés B1.", "C": "Certificado de inglés B2."}, "correcta": "B", "explicacion": "El Art. 126 exige certificado de inglés B1, con un periodo de carencia de 2 temporadas.", "referencia": "Art. 126", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 126"}, {"id": "RC-025", "bloque": "normativa", "enunciado": "¿Cuál es el rango de edad de acceso, a 1 de julio, para Árbitro de 1ª Federación, según el Art. 128?", "opciones": {"A": "18-32 años.", "B": "18-39 años.", "C": "18-44 años."}, "correcta": "B", "explicacion": "El Art. 128 fija la edad de acceso a Árbitro de 1ª Federación entre 18 y 39 años a 1 de julio.", "referencia": "Art. 128", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 128"}, {"id": "RC-026", "bloque": "normativa", "enunciado": "¿Cuál es la edad límite de acceso para la primera licencia en 1ª Federación (árbitro o asistente), según el Art. 128?", "opciones": {"A": "32 años.", "B": "34 años.", "C": "39 años."}, "correcta": "B", "explicacion": "El Art. 128 fija en 34 años la edad límite de acceso para la primera licencia en 1ª Federación.", "referencia": "Art. 128", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 128"}, {"id": "RC-027", "bloque": "normativa", "enunciado": "¿Cuántos balones reglamentarios como mínimo debe disponer el club titular del campo, según el Art. 130?", "opciones": {"A": "2 balones.", "B": "3 balones.", "C": "5 balones."}, "correcta": "B", "explicacion": "El Art. 130 exige que el club titular del campo disponga de un mínimo de 3 balones reglamentarios.", "referencia": "Art. 130", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 130"}, {"id": "RC-028", "bloque": "normativa", "enunciado": "¿Con cuánta antelación mínima debe presentarse el equipo en el recinto deportivo en categoría no profesional, según el Art. 133?", "opciones": {"A": "30 minutos antes.", "B": "1 hora antes.", "C": "1 hora y media antes."}, "correcta": "B", "explicacion": "El Art. 133 exige que en categoría no profesional se presenten al menos 1 hora antes del inicio (1 hora y media en profesional).", "referencia": "Art. 133", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 133"}, {"id": "RC-029", "bloque": "normativa", "enunciado": "¿Está permitido calentar en el terreno de juego en los minutos previos al inicio, según el Art. 133?", "opciones": {"A": "Sí, sin restricción de tiempo.", "B": "Está prohibido en los 10 minutos previos al inicio; deben estar listos para salir 5 minutos antes.", "C": "Está prohibido durante toda la hora previa al partido."}, "correcta": "B", "explicacion": "El Art. 133 prohíbe calentar en el terreno de juego en los 10 minutos previos al inicio, debiendo estar listos para salir 5 minutos antes.", "referencia": "Art. 133", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 133"}, {"id": "RC-030", "bloque": "normativa", "enunciado": "¿Cuánto tiempo debe transcurrir desde la hora fijada, sin presentarse o con jugadores insuficientes, para tener un equipo por no comparecido, según el Art. 133?", "opciones": {"A": "15 minutos.", "B": "20 minutos.", "C": "30 minutos."}, "correcta": "C", "explicacion": "El Art. 133 establece que se tiene por no comparecido un equipo si transcurren 30 minutos desde la hora fijada sin presentarse o con jugadores insuficientes.", "referencia": "Art. 133", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 133"}, {"id": "RC-031", "bloque": "normativa", "enunciado": "¿Cuál es el número mínimo y máximo de uniformes oficiales que debe comunicar un club, según el Art. 135?", "opciones": {"A": "Mínimo 1 y máximo 2.", "B": "Mínimo 2 y máximo 3.", "C": "Mínimo 3 y máximo 4."}, "correcta": "B", "explicacion": "El Art. 135 exige un mínimo de 2 y máximo de 3 uniformes oficiales, comunicados con 15 días de antelación al primer partido.", "referencia": "Art. 135", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 135"}, {"id": "RC-032", "bloque": "normativa", "enunciado": "Según el Art. 135, ¿qué numeración corresponde a los titulares y cuál a los suplentes?", "opciones": {"A": "Del 1 al 11 titulares, del 12 en adelante suplentes.", "B": "Del 1 al 10 titulares, del 11 en adelante suplentes.", "C": "No hay distinción de numeración entre titulares y suplentes."}, "correcta": "A", "explicacion": "El Art. 135 asigna del 1 al 11 a los titulares y del 12 en adelante a los suplentes.", "referencia": "Art. 135", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 135"}, {"id": "RC-033", "bloque": "normativa", "enunciado": "¿Qué es el acta arbitral según el Art. 136 del Reglamento de Competiciones?", "opciones": {"A": "Un documento meramente informativo sin efectos disciplinarios.", "B": "El documento para examen, calificación y sanción de los hechos de un partido.", "C": "Un resumen técnico elaborado solo por el delegado de campo."}, "correcta": "B", "explicacion": "El Art. 136 define el acta como el documento para examen, calificación y sanción de los hechos de un partido.", "referencia": "Art. 136", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 136"}, {"id": "RC-034", "bloque": "normativa", "enunciado": "¿Quién firma el acta arbitral antes del inicio del partido, según el Art. 137?", "opciones": {"A": "Los 2 capitanes y entrenadores/as.", "B": "El árbitro y los delegados.", "C": "Solo el árbitro principal."}, "correcta": "A", "explicacion": "El Art. 137 establece que antes del partido firman el acta los 2 capitanes y entrenadores/as; al final, el árbitro y los delegados.", "referencia": "Art. 137", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 137"}, {"id": "RC-035", "bloque": "normativa", "enunciado": "¿En qué plazo debe el árbitro remitir el original del acta a la RFEF, según el Art. 138?", "opciones": {"A": "Dentro de las 12 horas siguientes a la conclusión del partido.", "B": "Dentro de las 24 horas siguientes a la conclusión del partido.", "C": "Dentro de las 48 horas siguientes a la conclusión del partido."}, "correcta": "B", "explicacion": "El Art. 138 exige remitir el original del acta a la RFEF dentro de las 24 horas siguientes a la conclusión del partido.", "referencia": "Art. 138", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 138"}, {"id": "RC-036", "bloque": "normativa", "enunciado": "¿En qué plazo deben remitirse los informes ampliatorios al acta, según el Art. 139?", "opciones": {"A": "Dentro de las 24 horas siguientes a la terminación del partido.", "B": "Dentro de las 48 horas siguientes a la terminación del partido.", "C": "Dentro de los 3 días siguientes a la terminación del partido."}, "correcta": "A", "explicacion": "El Art. 139 exige remitir los informes ampliatorios dentro de las 24 horas siguientes a la terminación del partido.", "referencia": "Art. 139", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 139"}, {"id": "RC-037", "bloque": "normativa", "enunciado": "Si un equipo queda con menos de 7 futbolistas por expulsión o lesión durante el partido, ¿qué resultado se establece según el Art. 141?", "opciones": {"A": "Se suspende el partido sin resultado.", "B": "Resultado de 3-0 a favor del rival, salvo resultado más favorable ya obtenido.", "C": "Se decide por sorteo entre ambos equipos."}, "correcta": "B", "explicacion": "El Art. 141 establece un resultado de 3-0 a favor del rival cuando un equipo queda con menos de 7 futbolistas por expulsión o lesión, salvo resultado más favorable ya obtenido.", "referencia": "Art. 141", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 141"}, {"id": "RC-038", "bloque": "normativa", "enunciado": "Según el Art. 144, ¿cuántas sustituciones máximas se permiten en categoría Juvenil?", "opciones": {"A": "3 sustituciones.", "B": "4 sustituciones.", "C": "5 sustituciones."}, "correcta": "B", "explicacion": "El Art. 144 fija un máximo de 4 sustituciones permitidas en categoría Juvenil.", "referencia": "Art. 144", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 144"}, {"id": "RC-039", "bloque": "normativa", "enunciado": "¿Cuántos futbolistas pueden calentar simultáneamente en banda por equipo, según el Art. 144, salvo en categoría Juvenil?", "opciones": {"A": "Máximo 3 futbolistas (4 en Juvenil).", "B": "Máximo 5 futbolistas (6 en Juvenil).", "C": "Máximo 2 futbolistas (3 en Juvenil)."}, "correcta": "A", "explicacion": "El Art. 144 fija un máximo de 3 futbolistas por equipo calentando simultáneamente en banda, elevado a 4 en categoría Juvenil.", "referencia": "Art. 144", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 144"}, {"id": "RC-040", "bloque": "normativa", "enunciado": "¿Puede un futbolista sustituido volver a ser alineado en el mismo partido, según el Art. 144?", "opciones": {"A": "Sí, si el entrenador lo solicita al árbitro.", "B": "No, un futbolista sustituido no puede volver a ser alineado.", "C": "Sí, únicamente en categoría Juvenil."}, "correcta": "B", "explicacion": "El Art. 144 establece que un futbolista sustituido no puede volver a ser alineado, y un expulsado nunca puede ser sustituido.", "referencia": "Art. 144", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 144"}, {"id": "RC-041", "bloque": "normativa", "enunciado": "¿Cuántas personas como máximo puede haber en el banquillo técnico adicional, situado a 5 metros del principal, según el Art. 150?", "opciones": {"A": "3 personas.", "B": "5 personas.", "C": "7 personas."}, "correcta": "B", "explicacion": "El Art. 150 fija un máximo de 5 personas en el banquillo técnico adicional, situado a 5 metros del principal.", "referencia": "Art. 150", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 150"}, {"id": "RC-042", "bloque": "normativa", "enunciado": "Un futbolista expulsado, ¿puede presenciar el resto del partido desde la grada, según el Art. 150?", "opciones": {"A": "Sí, sin restricciones.", "B": "No, debe ir al vestuario, salvo que sea médico, enfermero o fisioterapeuta.", "C": "Sí, siempre que no se siente junto al banquillo rival."}, "correcta": "B", "explicacion": "El Art. 150 exige que los expulsados vayan al vestuario sin presenciar el partido desde la grada, salvo médico/enfermero/fisioterapeuta.", "referencia": "Art. 150", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 150"}, {"id": "RC-043", "bloque": "normativa", "enunciado": "¿Quién no puede ejercer como delegado de campo, según el Art. 151?", "opciones": {"A": "Un miembro de la Junta Directiva de la RFEF.", "B": "El entrenador titular del equipo local.", "C": "Cualquier futbolista suplente."}, "correcta": "A", "explicacion": "El Art. 151 prohíbe que sea delegado de campo un miembro de la Junta Directiva de la RFEF.", "referencia": "Art. 151", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 151"}, {"id": "RC-044", "bloque": "normativa", "enunciado": "¿Puede el Presidente del club actuar como delegado según el Art. 153?", "opciones": {"A": "Sí, es una función habitual del Presidente.", "B": "No, no puede actuar como delegado el/la Presidente/a o Consejero/a Delegado/a del club.", "C": "Sí, siempre que lo autorice el árbitro antes del partido."}, "correcta": "B", "explicacion": "El Art. 153 prohíbe que el Presidente o Consejero Delegado del club actúe como delegado, ni tampoco un miembro de la Junta Directiva de la RFEF.", "referencia": "Art. 153", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 153"}, {"id": "RC-045", "bloque": "normativa", "enunciado": "¿Qué obligación tienen los capitanes respecto al acta, según el Art. 154?", "opciones": {"A": "Firmar la primera parte del acta antes del comienzo del partido.", "B": "Redactar personalmente el informe de incidencias.", "C": "No tienen ninguna obligación relacionada con el acta."}, "correcta": "A", "explicacion": "El Art. 154 exige que los capitanes firmen la primera parte del acta antes del comienzo del partido.", "referencia": "Art. 154", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 154"}, {"id": "RC-046", "bloque": "normativa", "enunciado": "Según el Art. 155, ¿cuándo empiezan y terminan las facultades del árbitro?", "opciones": {"A": "Empiezan al pitar el inicio y terminan al pitar el final, sin incluir descansos.", "B": "Empiezan al entrar en el recinto y no terminan hasta que lo abandona, incluidos descansos y suspensiones.", "C": "Solo tiene facultades mientras el balón está en juego."}, "correcta": "B", "explicacion": "El Art. 155 establece que las facultades del árbitro empiezan al entrar en el recinto y no terminan hasta que lo abandona, incluyendo descansos y suspensiones.", "referencia": "Art. 155", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 155"}, {"id": "RC-047", "bloque": "normativa", "enunciado": "Si el árbitro principal no puede continuar el partido, ¿quién lo sustituye según el Art. 155?", "opciones": {"A": "El cuarto árbitro automáticamente.", "B": "El asistente de superior categoría arbitral.", "C": "Se suspende el partido obligatoriamente."}, "correcta": "B", "explicacion": "El Art. 155 establece que si el árbitro no puede continuar, lo sustituye el asistente de superior categoría arbitral.", "referencia": "Art. 155", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "articulo": "Art. 155"}, {"id": "RC-048", "bloque": "normativa", "enunciado": "Según el Art. 156, ¿cuántas personas pueden estar en el terreno de juego sin autorización, sumando futbolistas y equipo arbitral?", "opciones": {"A": "22 futbolistas más árbitros asistentes y 4º árbitro.", "B": "20 futbolistas más árbitros asistentes únicamente.", "C": "24 futbolistas más todo el equipo técnico."}, "correcta": "A", "explicacion": "El Art. 156 permite en el terreno de juego a 22 futbolistas más árbitros asistentes y 4º árbitro, sin autorización de nadie más.", "referencia": "Art. 156", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 156"}, {"id": "RC-049", "bloque": "normativa", "enunciado": "¿Con qué antelación mínima debe personarse el equipo arbitral en el campo, según el Art. 158?", "opciones": {"A": "Una hora.", "B": "Hora y media.", "C": "Dos horas."}, "correcta": "B", "explicacion": "El Art. 158 exige que el equipo arbitral se persone en el campo con una antelación mínima de hora y media.", "referencia": "Art. 158", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 1, "articulo": "Art. 158"}, {"id": "RC-050", "bloque": "normativa", "enunciado": "¿En qué categorías es obligatoria la ambulancia según el Art. 175 del Reglamento de Competiciones?", "opciones": {"A": "Solo en 1ª y 2ª División.", "B": "En campos de 1ª/2ª Federación, 1ª/2ª Fed. Femenina y 1ª División de Fútbol Sala.", "C": "En todas las categorías sin excepción, incluidas categorías inferiores."}, "correcta": "B", "explicacion": "El Art. 175 exige ambulancia obligatoria en campos de 1ª/2ª Federación, 1ª/2ª Federación Femenina y 1ª División de Fútbol Sala.", "referencia": "Art. 175", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 175"}, {"id": "RC-051", "bloque": "normativa", "enunciado": "¿Qué está prohibido sobre el terreno de juego, marcos/redes de porterías y banderines de córner durante el partido, según el Art. 175?", "opciones": {"A": "Toda publicidad.", "B": "Únicamente la publicidad de bebidas alcohólicas.", "C": "No hay ninguna restricción publicitaria en esos elementos."}, "correcta": "A", "explicacion": "El Art. 175 prohíbe toda publicidad sobre el terreno de juego, marcos/redes de porterías y banderines de córner durante el partido.", "referencia": "Art. 175", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 175"}, {"id": "RC-052", "bloque": "normativa", "enunciado": "¿Qué logotipo es obligat idos la publicidad de otras competiciones sin autorización de la RFEF, así como los contenidos políticos o religiosos.", "referencia": "Art. 185", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 185"}, {"id": "BC-031", "bloque": "normativa", "enunciado": "Según las Bases de Competición, ¿qué artículo lleva por título «Obligaciones de dotación médica»?", "opciones": {"A": "Art. 23", "B": "Art. 20", "C": "Art. 25"}, "correcta": "B", "explicacion": "En las Bases de Competición, el Art. 20 se titula «Obligaciones de dotación médica».", "referencia": "Art. 20", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 20"}, {"id": "BC-032", "bloque": "normativa", "enunciado": "Según las Bases de Competición, ¿qué título recibe el Art. 20?", "opciones": {"A": "Obligaciones de dotación médica", "B": "Actos previos y protocolarios", "C": "Reglas del juego"}, "correcta": "A", "explicacion": "En las Bases de Competición, el Art. 20 se titula «Obligaciones de dotación médica».", "referencia": "Art. 20", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 3, "articulo": "Art. 20"}, {"id": "BC-033", "bloque": "normativa", "enunciado": "Según las Bases de Competición, ¿qué artículo lleva por título «Alineación de futbolistas»?", "opciones": {"A": "Art. 23", "B": "Art. 27", "C": "Art. 26"}, "correcta": "A", "explicacion": "En las Bases de Competición, el Art. 23 se titula «Alineación de futbolistas».", "referencia": "Art. 23", "fuente": "Resumen_Articulos_Bases_Competicion_20-30.pdf", "dificultad": 4, "articulo": "Art. 23"}, {"id": "BC-034", "bloque": "normativa", "enunciado": "Según las Bases de Competición, ¿qué título recibe el Art. 23?", "opciones": {"A": "Actos previos y protocolarios", "B": "Alineación de futbolistas", "C": "Suplentes y sustituciones"}, "correcta": "B", "explicacion": "En las Bases de Competición, el Art. 23 se titula «Alineación de futbolistas».", "referencia": "Art. a": "C", "explicacion": "En el Reglamento de Competiciones, el Art. 183 se titula «Publicidad en prendas deportivas».", "referencia": "Art. 183", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 183"}, {"id": "RC-139", "bloque": "normativa", "enunciado": "Según el Reglamento de Competiciones, ¿cuál es el título del Art. 183?", "opciones": {"A": "Publicidad en prendas deportivas", "B": "Los/as capitanes/as de los equipos", "C": "Uniformes de los/as futbolistas"}, "correcta": "A", "explicacion": "En el Reglamento de Competiciones, el Art. 183 se titula «Publicidad en prendas deportivas».", "referencia": "Art. 183", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 183"}, {"id": "RC-140", "bloque": "normativa", "enunciado": "Según el Reglamento de Competiciones, ¿qué artículo lleva por título «Tamaño de la publicidad»?", "opciones": {"A": "Art. 184", "B": "Art. 158", "C": "Art. 156"}, "correcta": "A", "explicacion": "En el Reglamento de Competiciones, el Art. 184 se titula «Tamaño de la publicidad».", "referencia": "Art. 184", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 184"}, {"id": "RC-141", "bloque": "normativa", "enunciado": "Según el Reglamento de Competiciones, ¿cuál es el título del Art. 184?", "opciones": {"A": "El/la árbitro: obligaciones", "B": "Tamaño de la publicidad", "C": "Las actas arbitrales"}, "correcta": "B", "explicacion": "En el Reglamento de Competiciones, el Art. 184 se titula «Tamaño de la publicidad».", "referencia": "Art. 184", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 184"}, {"id": "RC-142", "bloque": "normativa", "enunciado": "Según el Reglamento de Competiciones, ¿qué artículo lleva por título «Concepto de publicidad»?", "opciones": {"A": "Art. 158", "B": "Art. 183", "C": "Art. 185"}, "correcta": "C", "explicacion": "En el Reglamento de Competiciones, el Art. 185 se titula «Concepto de publicidad».", "referencia": "Art. 185", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 4, "articulo": "Art. 185"}, {"id": "RC-143", "bloque": "normativa", "enunciado": "Según el Reglamento de Competiciones, ¿cuál es el título del Art. 185?", "opciones": {"A": "Concepto de publicidad", "B": "Tamaño de la publicidad", "C": "El/la árbitro: funciones"}, "correcta": "A", "explicacion": "En el Reglamento de Competiciones, el Art. 185 se titula «Concepto de publicidad».", "referencia": "Art. 185", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 3, "articulo": "Art. 185"}, {"id": "RJ1-001", "bloque": "reglas", "enunciado": "Durante un partido en el que se utiliza el VAR, un miembro del cuerpo técnico intenta comunicarse por radio con el AVAR sin estar autorizado para ello. ¿Qué establece la Regla 1 al respecto?", "opciones": {"A": "Que solo las personas autorizadas podrán entrar en la sala de vídeo o comunicarse con el VAR, el AVAR o el técnico de repeticiones.", "B": "Que cualquier miembro del cuerpo técnico puede comunicarse libremente con el AVAR siempre que sea antes del descanso.", "C": "Que la comunicación con el AVAR solo está restringida para los jugadores, no para el cuerpo técnico."}, "correcta": "A", "explicacion": "Durante el partido, únicamente las personas autorizadas podrán entrar en la sala de vídeo o comunicarse con el VAR, el AVAR o el técnico de repeticiones.", "referencia": "Regla 1 / Árbitros asistentes de vídeo (VAR)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 29}, {"id": "RJ1-002", "bloque": "reglas", "enunciado": "¿Qué establece la Regla 1 sobre el cumplimiento de un programa de calidad para las porterías empleadas en competiciones oficiales auspiciadas por la FIFA o las confederaciones?", "opciones": {"A": "Se recomienda que cumplan los criterios del Programa de calidad de la FIFA de porterías de fútbol.", "B": "Es obligatorio que cumplan los criterios del Programa de calidad de la FIFA de porterías de fútbol.", "C": "No existe ninguna referencia normativa sobre programas de calidad para las porterías."}, "correcta": "A", "explicacion": "La Regla 1 recomienda, sin imponerlo como obligación, que las porterías empleadas en competiciones oficiales auspiciadas por la FIFA o las confederaciones cumplan los criterios del Programa de calidad de la FIFA de porterías de fútbol.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-003", "bloque": "reglas", "enunciado": "¿Cómo describe la Regla 1 la composición de una portería respecto a los postes de los banderines de esquina?", "opciones": {"A": "Dos postes verticales equidistantes de los postes de los banderines de esquina, unidos por un travesaño horizontal.", "B": "Dos postes verticales situados a la misma distancia entre sí que los postes de los banderines de esquina.", "C": "Dos postes verticales alineados con los postes de los banderines de esquina, sin travesaño obligatorio."}, "correcta": "A", "explicacion": "Una portería consta de dos postes verticales, equidistantes de los postes de los banderines de esquina y unidos en la parte superior por un travesaño horizontal.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RJ1-004", "bloque": "reglas", "enunciado": "Un club fabrica los postes de su portería con un material no homologado que, además, resulta peligroso para los jugadores. ¿Qué exige la Regla 1 sobre los materiales de postes y travesaño?", "opciones": {"A": "Que estén fabricados con materiales homologados y no constituyan ningún peligro.", "B": "Que estén fabricados con materiales homologados, aunque puedan suponer cierto riesgo si el club lo asume.", "C": "Que el material sea decidido libremente por el club, sin exigencia de homologación."}, "correcta": "A", "explicacion": "Los postes y el travesaño deberán estar fabricados con materiales homologados y no deberán constituir ningún peligro.", "referencia": "Regla 1 / Porterías", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 1", "pagina": 27}, {"id": "RC-144", "bloque": "normativa", "regla": null, "articulo": "Art. 105", "enunciado": "Según el Art. 105, ¿cuáles son los requisitos generales exigidos a un árbitro?", "opciones": {"A": "No superar la edad límite, superar las pruebas técnicas/físicas/médicas, tener licencia y estar al corriente de cuotas.", "B": "Únicamente tener licencia en vigor, sin más requisitos.", "C": "Superar solo las pruebas físicas, sin exigencia de edad ni de licencia."}, "correcta": "A", "explicacion": "El Art. 105 exige no superar la edad límite, superar las pruebas técnicas, físicas y médicas, tener licencia y estar al corriente de cuotas.", "referencia": "Art. 105", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-145", "bloque": "normativa", "regla": null, "articulo": "Art. 106", "enunciado": "Además de la incompatibilidad con otra licencia futbolística y con las apuestas, ¿qué otras dos incompatibilidades establece el Art. 106?", "opciones": {"A": "Ocupar cargos en órganos de la RFEF/autonómicos que comprometan la imparcialidad, y arbitrar en competiciones ajenas a la estructura federativa sin autorización del CTA.", "B": "Residir fuera de la comunidad autónoma de su comité y tener estudios universitarios.", "C": "Ser socio de un club de cualquier categoría y practicar otro deporte federado."}, "correcta": "A", "explicacion": "El Art. 106 también declara incompatible ocupar cargos en órganos de la RFEF o autonómicos que comprometan la imparcialidad, y arbitrar en competiciones ajenas a la estructura federativa sin autorización del CTA.", "referencia": "Art. 106", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-146", "bloque": "normativa", "regla": null, "articulo": "Art. 107", "enunciado": "Además de la obligación de someterse a controles de dopaje, ¿qué derecho reconoce el Art. 107 a los árbitros?", "opciones": {"A": "Derecho a prestaciones de la Mutualidad de Previsión Social de Futbolistas Españoles.", "B": "Derecho a una plaza reservada en la Real Federación Española de Fútbol.", "C": "Derecho a arbitrar un mínimo garantizado de partidos por temporada."}, "correcta": "A", "explicacion": "El Art. 107 reconoce el derecho a prestaciones de la Mutualidad de Previsión Social de Futbolistas Españoles, además de la obligación de someterse a controles de dopaje.", "referencia": "Art. 107", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-147", "bloque": "normativa", "regla": null, "articulo": "Art. 109", "enunciado": "Según el Art. 109, ¿qué establece el CTA al inicio de temporada y qué se tiene en cuenta para la valoración?", "opciones": {"A": "Establece criterios de valoración (con criterio de igualdad entre colegiados/as) y se consideran las evaluaciones de Oficiales Informadores/as y de la Comisión Técnica del CTA.", "B": "Solo se valora el número de partidos arbitrados, sin ningún otro criterio.", "C": "La valoración corresponde exclusivamente a los propios árbitros mediante autoevaluación."}, "correcta": "A", "explicacion": "El Art. 109 dispone que el CTA establece criterios de valoración al inicio de temporada, considerando las evaluaciones de Oficiales Informadores/as y de la Comisión Técnica del CTA.", "referencia": "Art. 109", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-148", "bloque": "normativa", "regla": null, "articulo": "Art. 110", "enunciado": "Además del número de descensos y ascensos, ¿qué otros dos límites de plantilla establece el Art. 110?", "opciones": {"A": "Máximo 24 árbitras y máximo 24 árbitras asistentes en 1ª Federación Femenina, y plantilla mínima de 15 Asistentes de Vídeo.", "B": "Máximo 10 árbitras en total y ningún mínimo para Asistentes de Vídeo.", "C": "Sin límite de plantilla en ninguna categoría."}, "correcta": "A", "explicacion": "El Art. 110 fija un máximo de 24 árbitras y 24 árbitras asistentes en 1ª Federación Femenina, y una plantilla mínima de 15 Asistentes de Vídeo.", "referencia": "Art. 110", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-149", "bloque": "normativa", "regla": null, "articulo": "Art. 111", "enunciado": "Además de que la plantilla de asistentes profesionales sea el doble de los árbitros principales, ¿qué otras dos reglas establece el Art. 111?", "opciones": {"A": "Se subdividen en grupos de cuatro, y en partidos de un árbitro internacional uno de los asistentes debe ser también internacional si es posible.", "B": "Se subdividen en grupos de dos, y ningún asistente puede ser internacional.", "C": "No existe ningún tipo de subdivisión ni requisito adicional."}, "correcta": "A", "explicacion": "El Art. 111 establece que los asistentes se subdividen en grupos de cuatro, y que en partidos de un árbitro internacional uno de los asistentes debe ser también internacional, si es posible.", "referencia": "Art. 111", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-150", "bloque": "normativa", "regla": null, "articulo": "Art. 112", "enunciado": "Según el Art. 112, ¿cuáles son las edades límite de acceso a las siguientes categorías: 2ª División, 1ª División de Fútbol Femenino y 1ª Federación?", "opciones": {"A": "39 años (2ª División), 44 años (1ª División Fútbol Femenino) y 34 años (1ª Federación).", "B": "32 años (2ª División), 39 años (1ª División Fútbol Femenino) y 44 años (1ª Federación).", "C": "34 años (2ª División), 32 años (1ª División Fútbol Femenino) y 39 años (1ª Federación)."}, "correcta": "A", "explicacion": "El Art. 112 fija las edades límite de acceso en 39 años (2ª División), 44 años (1ª División Fútbol Femenino), 34 años (1ª Federación) y 32 años (2ª Federación).", "referencia": "Art. 112", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-151", "bloque": "normativa", "regla": null, "articulo": "Art. 113", "enunciado": "Según el Art. 113, ¿antes de qué fecha deben realizarse el cambio de Comité de Árbitros (3ª Federación) y los traslados?", "opciones": {"A": "Antes del 31 de diciembre de la temporada en curso.", "B": "Antes del 30 de junio de la temporada en curso.", "C": "Antes del 1 de septiembre de la temporada en curso."}, "correcta": "A", "explicacion": "El Art. 113 exige que el cambio de Comité de Árbitros (3ª Federación) y los traslados se realicen antes del 31 de diciembre de la temporada en curso.", "referencia": "Art. 113", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-152", "bloque": "normativa", "regla": null, "articulo": "Art. 115", "enunciado": "Según el Art. 115, ¿cómo se compone el cuerpo de Oficiales Informadores/as y con qué funciones es incompatible?", "opciones": {"A": "50 miembros en fútbol profesional y mínimo 120 en el resto de categorías, seleccionados por el CTA y aprobados por el/la Presidente/a de la RFEF; incompatible con la función arbitral nacional y con actuar como periodista o comentarista.", "B": "Un único informador para todas las categorías, designado directamente por cada club.", "C": "Se compone exclusivamente de exárbitros profesionales, sin límite de número."}, "correcta": "A", "explicacion": "El Art. 115 fija un cuerpo de 50 miembros en fútbol profesional (mínimo 120 en el resto), seleccionados por el CTA y aprobados por el/la Presidente/a de la RFEF, con función incompatible con la arbitral nacional y con el periodismo.", "referencia": "Art. 115", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-153", "bloque": "normativa", "regla": null, "articulo": "Art. 117", "enunciado": "Además de pernoctar en la localidad del partido, ¿qué otras dos obligaciones impone el Art. 117 a los árbitros profesionales?", "opciones": {"A": "Tener un contrato de trabajo con la RFEF de una temporada (del 1 de julio al 30 de junio siguiente) y comunicar al Comité Técnico su programa de entrenamiento.", "B": "Residir de forma permanente en Madrid y renovar su licencia cada mes.", "C": "Ninguna otra obligación adicional distinta a la de pernoctar."}, "correcta": "A", "explicacion": "El Art. 117 exige un contrato de trabajo con la RFEF de una temporada (1 de julio a 30 de junio) y comunicar al Comité Técnico el programa, lugar, día y hora de entrenamiento.", "referencia": "Art. 117", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-154", "bloque": "normativa", "regla": null, "articulo": "Art. 121", "enunciado": "Según el Art. 121, ¿cuál es el requisito previo para obtener la licencia arbitral?", "opciones": {"A": "La afiliación al Comité Técnico de Árbitros mediante colegiación.", "B": "Superar una oposición pública convocada por el Consejo Superior de Deportes.", "C": "Contar con el aval de un club de la máxima categoría."}, "correcta": "A", "explicacion": "El Art. 121 exige como requisito previo la afiliación al Comité Técnico de Árbitros mediante colegiación.", "referencia": "Art. 121", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-155", "bloque": "normativa", "regla": null, "articulo": "Art. 122", "enunciado": "Según el Art. 122, ¿cuáles son las causas de cancelación de las licencias arbitrales?", "opciones": {"A": "Baja concedida por el CTA, imposibilidad total permanente, expiración o resolución del contrato (profesionales), y acuerdo de los órganos competentes.", "B": "Únicamente la edad, sin ninguna otra causa posible.", "C": "Solo la sanción disciplinaria firme, sin otras causas."}, "correcta": "A", "explicacion": "El Art. 122 recoge como causas de cancelación la baja concedida por el CTA, la imposibilidad total permanente, la expiración o resolución del contrato (para profesionales) y el acuerdo de los órganos competentes.", "referencia": "Art. 122", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-156", "bloque": "normativa", "regla": null, "articulo": "Art. 123", "enunciado": "Según el Art. 123, ¿cómo se clasifican las licencias arbitrales?", "opciones": {"A": "En profesionales (1ª/2ª División, Asistentes de Vídeo y 1ª División de Fútbol Femenino) y aficionadas (el resto de árbitros, asistentes y Oficiales Informadores de categoría nacional).", "B": "Únicamente en licencias masculinas y femeninas.", "C": "En licencias temporales y licencias vitalicias."}, "correcta": "A", "explicacion": "El Art. 123 clasifica las licencias en profesionales (adscritos a 1ª/2ª División, Asistentes de Vídeo y 1ª División de Fútbol Femenino) y aficionadas (resto de categoría nacional).", "referencia": "Art. 123", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-157", "bloque": "normativa", "regla": null, "articulo": "Art. 125", "enunciado": "Según el Art. 125, ¿por qué se rige el régimen contractual de los árbitros con licencia profesional?", "opciones": {"A": "Por la legislación vigente.", "B": "Exclusivamente por lo que acuerde el club para el que arbitran.", "C": "Por un convenio internacional específico de la FIFA."}, "correcta": "A", "explicacion": "El Art. 125 establece que el régimen contractual de los árbitros con licencia profesional se rige por la legislación vigente.", "referencia": "Art. 125", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-158", "bloque": "normativa", "regla": null, "articulo": "Art. 126", "enunciado": "Según el Art. 126, ¿qué años mínimos de experiencia se exigen para Árbitro Asistente Profesional de 1ª División y para Árbitro Asistente Profesional de 2ª División, respectivamente?", "opciones": {"A": "5 años (más 1 en 2ª División como asistente) y 3 años (más 1 en 1ª/2ª Federación).", "B": "9 años y 9 años, los mismos que para Árbitro Profesional de 1ª División.", "C": "2 años y 1 año, respectivamente, sin exigencia de experiencia previa en otra categoría."}, "correcta": "A", "explicacion": "El Art. 126 exige un mínimo de 5 años (más 1 en 2ª División de asistente) para Árbitro Asistente Profesional de 1ª División, y 3 años (más 1 en 1ª/2ª Federación) para el de 2ª División.", "referencia": "Art. 126", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-159", "bloque": "normativa", "regla": null, "articulo": "Art. 127", "enunciado": "Según el Art. 127, ¿cuáles son las causas de cancelación de la licencia deportiva profesional?", "opciones": {"A": "No ser adscrito por el CTA, no reunir requisitos, no superar las pruebas, imposibilidad permanente, fin de contrato o sanción disciplinaria.", "B": "Únicamente cumplir la edad de jubilación laboral general.", "C": "Solamente el descenso de categoría del equipo al que pertenece el club local."}, "correcta": "A", "explicacion": "El Art. 127 recoge como causas no ser adscrito por el CTA, no reunir requisitos, no superar las pruebas, la imposibilidad permanente, el fin de contrato o la sanción disciplinaria.", "referencia": "Art. 127", "fuente": "ResumenReglamentoCompeticiones.pdf", "dificultad": 2, "pagina": null}, {"id": "RC-160", "bloque": "normativa", "regla": null, "articulo": "Art. 128", "enunciado": "Según el Art. 128, ¿cuántos años mínimos de experiencia se exigen para Árbitro de 2ª Federación y para Árbitro Asistente de 2ª Federación, respectivamente?", "opciones": {"A": "4 años (más 1 en 3ª Federación) y 2 años (más 15 partidos en 3ª Federación).", "B": "5 años y 3 años, respectivamente, igual que en 1ª Federación.", "C": "1 año y 6 meses, respectivamente, sin exigencia de partidos disputados."}, "correcta": "A", "explicacion": "El Art. 128 exige un mínimo de 4 años (más 1 en 3ª Federación) para Árbitro de 2ª Federación, y 2 años (más 15 partidos
