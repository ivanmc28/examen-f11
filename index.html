golpeo, y detiene el penal. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el penal y advierte al guardameta por no mantener ambos pies completamente sobre la línea de meta.", "B": "Concede un tiro libre indirecto a favor del equipo atacante, al considerar irregular la posición del guardameta.", "C": "Permite el juego, pues cumple con tener parte de un pie en contacto con la línea."}, "correcta": "C", "explicacion": "En el golpeo, el guardameta deberá tener al menos parte de un pie en contacto directo con la línea, sobre ella o por detrás.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-025", "bloque": "reglas", "enunciado": "¿Cuándo está el balón en juego en un tiro penal?", "opciones": {"A": "Cuando el balón sale del área penal.", "B": "En el momento en que el árbitro da la señal de ejecución.", "C": "En el momento en que se golpea y se desplaza con claridad."}, "correcta": "C", "explicacion": "El balón estará en juego en el momento en que se golpee y se desplace con claridad.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-026", "bloque": "reglas", "enunciado": "Tras ejecutar un penal, el balón rebota en el poste y el mismo ejecutor lo vuelve a tocar voluntariamente con el pie antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo defensor.", "B": "Permite que el juego continúe, al ser el mismo ejecutor.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "C", "explicacion": "Si el ejecutor vuelve a tocar intencionadamente el balón antes de que lo toque otro jugador, se concede libre indirecto.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-027", "bloque": "reglas", "enunciado": "Tras ejecutar un penal, el balón rebota en el larguero y el ejecutor lo toca voluntariamente con la mano antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "Concede un tiro libre directo a favor del equipo defensor.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "B", "explicacion": "Si el ejecutor vuelve a tocar el balón con infracción por mano, se concede libre directo.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-028", "bloque": "reglas", "enunciado": "Al ejecutar un penal, el lanzador golpea de manera involuntaria el balón con los dos pies a la vez y el balón entra directamente en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo defensor.", "B": "Concede el gol.", "C": "Ordena repetir el tiro penal."}, "correcta": "C", "explicacion": "Si el lanzador golpea involuntariamente con los dos pies simultáneamente y el balón entra directamente, se repite el penal.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-029", "bloque": "reglas", "enunciado": "Al ejecutar un penal, el balón toca la pierna de apoyo del lanzador justo después del golpeo, involuntariamente, y no entra directamente en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un saque de meta a favor del equipo defensor.", "B": "Ordena repetir el tiro penal.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "C", "explicacion": "Si el balón toca la pierna de apoyo involuntariamente y no entra directamente, se concede libre indirecto.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-030", "bloque": "reglas", "enunciado": "El lanzador de un penal termina la carrera y, antes de golpear el balón, hace un amago con el pie. Después golpea y marca gol. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal sin sanción disciplinaria.", "B": "Anula el gol, concede un tiro libre indirecto y amonesta al lanzador.", "C": "Concede el gol y amonesta al lanzador."}, "correcta": "B", "explicacion": "Si el ejecutor finta al golpear tras finalizar la carrera, se concede libre indirecto y se amonesta, aunque haya gol.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-031", "bloque": "reglas", "enunciado": "El lanzador de un penal finta durante la carrera, sin haberla terminado, y después ejecuta el tiro correctamente. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, pues fintar durante la carrera está permitido.", "B": "Ordena repetir el tiro penal y amonesta al lanzador.", "C": "Concede un tiro libre indirecto y amonesta al lanzador."}, "correcta": "A", "explicacion": "Se permite fintar durante la carrera; la finta antirreglamentaria es la que se hace al golpear tras finalizar la carrera.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-032", "bloque": "reglas", "enunciado": "Un jugador que no ha sido designado como ejecutor lanza el penal, que entra en la portería. El árbitro no lo había permitido. ¿Qué decide el árbitro?", "opciones": {"A": "Concede el gol y amonesta al lanzador.", "B": "Ordena repetir el penal con el jugador designado.", "C": "Concede un tiro libre indirecto y amonesta al lanzador."}, "correcta": "C", "explicacion": "Si el penal lo ejecuta un jugador no designado, se concede libre indirecto y se amonesta al lanzador.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-033", "bloque": "reglas", "enunciado": "Tras la señal del árbitro para ejecutar un penal, el ejecutor tarda de forma excesiva en lanzarlo. ¿Qué puede hacer el árbitro?", "opciones": {"A": "Adoptar medidas disciplinarias antes de volver a dar la señal de ejecución.", "B": "Ordenar el lanzamiento inmediato sin poder sancionar al ejecutor.", "C": "Conceder un tiro libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "Tras la señal, el penal debe lanzarse de inmediato; si no, el árbitro podrá adoptar medidas disciplinarias antes de volver a dar la señal.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-034", "bloque": "reglas", "enunciado": "En un penal, un defensor y un atacante entran en el área antes del golpeo y ninguno comete una infracción más grave. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo defensor.", "B": "Concede el gol si el balón entra.", "C": "Ordena repetir el penal."}, "correcta": "C", "explicacion": "Si un defensor y un atacante infringen, se repite el penal, a menos que un jugador cometiera una infracción más grave.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-035", "bloque": "reglas", "enunciado": "El guardameta y el ejecutor de un penal cometen una infracción al mismo tiempo, sin que exista una infracción más grave. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el penal.", "B": "Concede el gol si el balón entra.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "Cuando infringen un defensor y un atacante se repite el penal; desaparece la amonestación automática al lanzador.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-036", "bloque": "reglas", "enunciado": "Un agente externo toca el balón mientras este se dirige hacia la portería tras un penal y el balón no iba a entrar. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "Reanuda con un balón a tierra en el lugar del contacto.", "C": "Concede saque de meta a favor del equipo defensor."}, "correcta": "A", "explicacion": "Si un agente externo toca el balón cuando este se mueve hacia delante, se repite el tiro, salvo que el balón fuera a entrar.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-037", "bloque": "reglas", "enunciado": "Un balón de repuesto interfiere en un penal cuando iba a entrar en la portería, sin impedir que el guardameta lo jugara; el balón entra después. ¿Qué decide el árbitro?", "opciones": {"A": "Concede el gol, salvo que el equipo atacante fuera responsable de la interferencia.", "B": "Reanuda con balón a tierra en el lugar de la interferencia.", "C": "Ordena repetir el tiro penal en todos los casos."}, "correcta": "A", "explicacion": "Si iba a entrar y la interferencia no impide que el guardameta o un defensor juegue el balón, se concede gol si entra, salvo responsabilidad atacante.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-038", "bloque": "reglas", "enunciado": "Tras el lanzamiento de un penal, el balón rebota en el guardameta y vuelve al terreno de juego, donde lo toca un agente externo. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un saque de meta a favor del equipo defensor, sin tener en cuenta el contacto del agente externo.", "B": "Detiene el juego y reanuda con un balón a tierra donde el agente externo tocó el balón.", "C": "Ordena repetir el tiro penal, al considerar que el contacto del agente externo invalida el lanzamiento realizado."}, "correcta": "B", "explicacion": "Si el balón vuelve al terreno tras rebotar y un agente externo lo toca, se detiene el juego y se reanuda con balón a tierra donde se tocó.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-039", "bloque": "reglas", "enunciado": "¿Cuándo se considera completada la ejecución de un tiro penal (sin tiempo adicional)?", "opciones": {"A": "Cuando el balón cruza la línea de meta o sale del terreno de juego únicamente.", "B": "Cuando el guardameta toca el balón, sin ningún otro supuesto.", "C": "Cuando el balón deja de moverse, deja de estar en juego o el árbitro detiene el juego por una infracción."}, "correcta": "C", "explicacion": "La ejecución se completa cuando el balón deja de moverse, deja de estar en juego o el árbitro detiene el juego por infracción.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-040", "bloque": "reglas", "enunciado": "Se concede tiempo adicional al final de la primera parte para ejecutar un penal. El guardameta lo detiene, pero antes había adelantado ilegalmente sus dos pies. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo atacante.", "B": "Ordena repetir el lanzamiento.", "C": "Da por finalizado el periodo, al haberse detenido el penal."}, "correcta": "B", "explicacion": "Con tiempo adicional, si un defensor (incluido el guardameta) comete infracción y se falla o detiene el penal, se repite el lanzamiento.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-041", "bloque": "reglas", "enunciado": "Se concede tiempo adicional para ejecutar un penal al final del partido. El lanzador golpea, el guardameta detiene el balón y el propio lanzador lo remata al rechace sin que haya infracción. ¿Cuándo se completó el penal?", "opciones": {"A": "Cuando el balón fue jugado por un jugador (incluido el lanzador) distinto del guardameta defensor.", "B": "Solo cuando el balón cruzó la línea de meta.", "C": "Cuando el guardameta detuvo el balón y este dejó de moverse."}, "correcta": "A", "explicacion": "Con tiempo adicional, el penal se completa cuando el balón es jugado por un jugador (incluido el lanzador) aparte del guardameta defensor, entre otros supuestos.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-042", "bloque": "reglas", "enunciado": "Durante la ejecución de un penal, un compañero del ejecutor invade el área antes del golpeo sin influir en la jugada, y el lanzamiento entra directamente en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede el gol.", "B": "Ordena repetir el tiro penal.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "El adelantamiento de un compañero del ejecutor solo se sanciona si influye claramente en el guardameta o interviene en la jugada; si no influye y el balón entra, el gol es válido.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-043", "bloque": "reglas", "enunciado": "Un compañero del ejecutor invade el área antes del golpeo sin influir en la jugada, y el lanzamiento no entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "No repite el lanzamiento, que se registra como fallado.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "B", "explicacion": "Si el adelantamiento de un compañero del ejecutor no influye en la jugada y el balón no entra, no se repite el lanzamiento.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-044", "bloque": "reglas", "enunciado": "Un compañero del guardameta invade el área antes del golpeo e influye claramente en el lanzador, y aun así el lanzamiento entra directamente en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "Concede el gol.", "C": "Concede un tiro libre indirecto a favor del equipo atacante."}, "correcta": "B", "explicacion": "El adelantamiento de un compañero del guardameta no impide la validez del gol si finalmente se marca, con independencia de que haya influido claramente en el lanzador.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-045", "bloque": "reglas", "enunciado": "Un compañero del guardameta invade el área antes del golpeo sin influir en la jugada, y el lanzamiento no entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "No repite el lanzamiento, que se registra como fallado.", "C": "Concede un tiro libre indirecto a favor del equipo atacante."}, "correcta": "B", "explicacion": "Si el adelantamiento de un compañero del guardameta no influye en la jugada y el balón no entra, no se repite el lanzamiento.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-046", "bloque": "reglas", "enunciado": "Durante una tanda de penaltis, un jugador golpea el balón dos veces de forma completamente involuntaria tras tropezarse, enviándolo por encima del travesaño. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto sobre el punto de penal a favor del equipo contrario.", "B": "Contabiliza el lanzamiento como errado.", "C": "Ordena repetir el lanzamiento."}, "correcta": "B", "explicacion": "En la tanda de penaltis, el doble toque involuntario no genera sanción adicional; el lanzamiento se contabiliza simplemente como fallado.", "referencia": "Reanudaciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 66}, {"id": "RJ15-001", "bloque": "reglas", "enunciado": "El entrenador de un equipo retiene el balón con las manos para evitar que su propio equipo ejecute un saque de banda de forma rápida. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Amonesta al entrenador por retrasar la puesta en juego del balón con ánimo de perder tiempo.", "B": "Expulsa directamente al entrenador, al tratarse de una conducta violenta cometida fuera del terreno de juego.", "C": "Se limita a una advertencia verbal, sin sanción disciplinaria, ya que los miembros del cuerpo técnico no pueden ser amonestados."}, "correcta": "A", "explicacion": "Impedir deliberadamente la rápida puesta en juego del balón, incluso por parte de un miembro del cuerpo técnico, se sanciona con amonestación por conducta antideportiva / retraso.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-002", "bloque": "reglas", "enunciado": "Si un saque de banda se ejecuta incorrectamente, ¿puede el árbitro aplicar la ventaja?", "opciones": {"A": "No, salvo que exista una ocasión manifiesta de gol para el equipo adversario.", "B": "Sí, siempre que el equipo beneficiado sea el equipo adversario.", "C": "No, nunca."}, "correcta": "B", "explicacion": "Ante un saque de banda mal ejecutado, el árbitro puede aplicar la ventaja si el equipo que se beneficia del error es el equipo contrario al infractor.", "referencia": "Regla 15", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-003", "bloque": "reglas", "enunciado": "¿Puede marcarse un gol directamente desde un saque de banda?", "opciones": {"A": "Sí, si entra directamente en la portería contraria, contabilizándose como un gol válido igual que en un tiro libre directo.", "B": "No, si el balón entra directamente en la portería contraria se concede saque de meta o de esquina según el caso.", "C": "Sí, pero solo si lo ejecuta el capitán del equipo, ya que el resto de jugadores no pueden marcar de forma directa."}, "correcta": "B", "explicacion": "El saque de banda no puede resultar en gol directo: si el balón entra directamente en la portería, se concede saque de meta (si lo hizo un atacante) o de esquina (si lo hizo un defensor, en su propia meta).", "referencia": "Regla 15", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 79}, {"id": "RJ15-004", "bloque": "reglas", "enunciado": "¿A quién se concede el saque de banda cuando el balón atraviesa completamente la línea de banda?", "opciones": {"A": "Al equipo del último jugador que tocó el balón.", "B": "Al equipo del jugador más cercano al lugar por donde salió el balón.", "C": "A los adversarios del último jugador que tocó el balón."}, "correcta": "C", "explicacion": "El saque de banda se concede a los adversarios del último jugador que tocó el balón antes de que este atravesase totalmente la línea de banda.", "referencia": "Regla 15 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-005", "bloque": "reglas", "enunciado": "Un balón bombeado sale por encima de la línea de banda, por el aire, sin llegar a tocar el suelo fuera del campo. ¿Qué decide el árbitro?", "opciones": {"A": "Ha dejado de estar en juego, pues atravesó totalmente la línea de banda por el aire, y se concede saque de banda.", "B": "En juego, si vuelve a entrar en el terreno de juego por efecto del viento antes de tocar el suelo fuera de él.", "C": "En juego, mientras no toque el suelo fuera del terreno de juego, aunque haya atravesado la línea de banda por el aire."}, "correcta": "A", "explicacion": "El saque de banda se concede cuando el balón atraviesa totalmente la línea de banda por el suelo o por el aire.", "referencia": "Regla 15 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-006", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda y el balón entra directamente en la portería adversaria sin que lo toque nadie. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de meta a favor del equipo defensor.", "B": "Ordena repetir el saque de banda.", "C": "Concede gol, al haber entrado el balón desde el saque."}, "correcta": "A", "explicacion": "No se puede marcar gol directamente de saque de banda; si entra en la portería adversaria se concede saque de meta.", "referencia": "Regla 15 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-007", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda a su portero y el balón, sin que lo toque nadie, entra en su propia portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de esquina a favor del equipo adversario.", "B": "Concede gol a favor del equipo adversario.", "C": "Concede saque de meta a favor del equipo del lanzador."}, "correcta": "A", "explicacion": "Si el balón entra en la portería del lanzador desde un saque de banda, se concede saque de esquina al adversario.", "referencia": "Regla 15 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-008", "bloque": "reglas", "enunciado": "¿Cómo debe lanzar el balón el ejecutor de un saque de banda?", "opciones": {"A": "Con una o ambas manos, desde la altura del pecho, desde cualquier punto de la banda.", "B": "Con ambas manos, por encima de la cabeza, desde el punto más cercano al centro del campo.", "C": "Con ambas manos, desde atrás y por encima de la cabeza, desde el lugar por donde salió."}, "correcta": "C", "explicacion": "El lanzador deberá lanzar el balón con ambas manos desde atrás y por encima de la cabeza desde el lugar en que el balón salió del campo.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-009", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda con un pie completamente levantado del suelo, mientras el otro pisa la línea de banda. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de banda al mismo equipo.", "B": "Concede el saque de banda al equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "B", "explicacion": "El lanzador debe pisar la línea con los dos pies, aunque sea parcialmente, o estar por fuera; si no ejecuta correctamente, saca el adversario.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-010", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda con los dos pies fuera de la línea de banda, de pie y mirando al terreno de juego. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, al ser una posición válida.", "B": "Concede el saque de banda al equipo adversario.", "C": "Ordena repetir el saque de banda."}, "correcta": "A", "explicacion": "El lanzador puede pisar la línea de banda con los dos pies o estar situado por fuera de la misma.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-011", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda de espaldas al terreno de juego, con el balón lanzado con ambas manos por encima de la cabeza. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, si el balón entra en el terreno.", "B": "Concede el saque de banda al equipo adversario.", "C": "Ordena repetir el saque de banda al mismo equipo."}, "correcta": "B", "explicacion": "El lanzador debe estar de pie frente al terreno de juego; si no ejecuta correctamente, saca de banda el adversario.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-012", "bloque": "reglas", "enunciado": "¿A qué distancia mínima del lugar de ejecución de un saque de banda deben permanecer los adversarios?", "opciones": {"A": "5 metros.", "B": "3 metros.", "C": "2 metros."}, "correcta": "C", "explicacion": "Todos los adversarios deberán permanecer a una distancia mínima de 2 m del lugar de la línea de banda donde se vaya a ejecutar el saque.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-013", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda y el balón toca el suelo antes de entrar en el terreno de juego. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de banda desde la misma posición.", "B": "Concede el saque de banda al equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "Si el balón toca el suelo antes de entrar en el terreno de juego, se repite el saque de banda desde la misma posición.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-014", "bloque": "reglas", "enunciado": "¿Cuándo está en juego el balón en un saque de banda?", "opciones": {"A": "Cuando el lanzador lo suelta con las manos.", "B": "Cuando el balón es tocado por otro jugador.", "C": "Tan pronto como haya entrado en el terreno de juego."}, "correcta": "C", "explicacion": "El balón estará en juego tan pronto como haya entrado en el terreno de juego.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-015", "bloque": "reglas", "enunciado": "Tras un saque de banda correcto, el ejecutor lanza voluntariamente el balón contra un adversario para volver a jugarlo, sin imprudencia, temeridad ni fuerza excesiva. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Ordena repetir el saque de banda."}, "correcta": "A", "explicacion": "Si el ejecutor lanza voluntariamente el balón contra un adversario para jugarlo de nuevo sin imprudencia, el árbitro permite continuar.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-016", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de banda, el ejecutor toca de nuevo el balón con el pie antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de banda.", "B": "Concede un tiro libre directo a favor del equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "Si el ejecutor vuelve a tocar el balón antes de que lo toque otro jugador, se concede libre indirecto.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-017", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de banda, el ejecutor, que no es guardameta, toca el balón con la mano dentro de su área penal antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Señala tiro penal a favor del equipo adversario.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Concede un tiro libre directo en el borde del área."}, "correcta": "A", "explicacion": "Si el ejecutor comete infracción por mano dentro de su área se concede penal, salvo que sea el guardameta defensor, en cuyo caso libre indirecto.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-018", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de banda, el guardameta ejecutor toca de nuevo el balón con la mano dentro de su área penal antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario.", "B": "Concede un tiro libre directo a favor del equipo adversario.", "C": "Señala tiro penal a favor del equipo adversario."}, "correcta": "A", "explicacion": "Cuando el ejecutor es el guardameta del equipo defensor y comete mano en su área, se concede libre indirecto, no penal.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-019", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de banda, el ejecutor, un jugador de campo, toca el balón con la mano fuera de su área antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo adversario.", "B": "Ordena repetir el saque de banda.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "Si el ejecutor comete una infracción por mano, se concede libre directo (o penal si es en su área).", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-020", "bloque": "reglas", "enunciado": "Un jugador tarda injustamente en ejecutar un saque de banda de su equipo. ¿Cómo procede el árbitro según el protocolo de cuenta atrás?", "opciones": {"A": "Amonesta de inmediato al jugador y concede el saque al equipo adversario.", "B": "Concede directamente un tiro libre indirecto al equipo adversario.", "C": "Hace sonar el silbato y señala con la mano levantada la cuenta atrás de cinco segundos."}, "correcta": "C", "explicacion": "Si un jugador retrasa injustamente el saque, el árbitro silba y señala el inicio de la cuenta atrás de cinco segundos con la mano levantada.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-021", "bloque": "reglas", "enunciado": "Tras la cuenta atrás de cinco segundos, un equipo no ha ejecutado su saque de banda. ¿Qué decide el árbitro?", "opciones": {"A": "Amonesta al jugador y repite el saque de banda.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Concede el saque de banda al equipo adversario."}, "correcta": "C", "explicacion": "Si el saque de banda no se ha efectuado antes del final de los cinco segundos, se concede al equipo adversario.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-022", "bloque": "reglas", "enunciado": "Tras concederse el saque de banda al adversario por la cuenta atrás, el jugador infractor sigue retrasando de forma excesiva la reanudación. ¿Qué decide el árbitro?", "opciones": {"A": "No adopta medida alguna, al haber perdido ya el saque de banda.", "B": "Expulsa al infractor por retrasar la reanudación.", "C": "Amonesta al infractor por retrasar excesivamente la reanudación."}, "correcta": "C", "explicacion": "Se amonestará al infractor solo si retrasa excesivamente la reanudación después de concederse el saque al adversario.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-023", "bloque": "reglas", "enunciado": "Un adversario se sitúa a un metro del lanzador antes de que este ejecute el saque de banda, obstaculizándole. ¿Qué decide el árbitro?", "opciones": {"A": "Advierte verbalmente al adversario y repite el saque.", "B": "Amonesta al adversario por conducta antideportiva.", "C": "Concede un tiro libre indirecto a favor del equipo del lanzador."}, "correcta": "B", "explicacion": "El adversario que distraiga u obstaculice de forma antirreglamentaria al ejecutor (incluido estar a menos de 2 m) será amonestado por conducta antideportiva.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-024", "bloque": "reglas", "enunciado": "Un adversario distrae de forma antirreglamentaria al lanzador cuando el saque de banda ya se ha ejecutado. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe sin sanción.", "B": "Amonesta al adversario y repite el saque de banda.", "C": "Concede un tiro libre indirecto a favor del equipo del lanzador."}, "correcta": "C", "explicacion": "Si ya se ha ejecutado el saque, la distracción u obstaculización del adversario se sanciona con libre indirecto.", "referencia": "Regla 15.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ15-025", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de banda desde un lugar distinto del que salió el balón, unos metros más adelante. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de banda desde el lugar correcto.", "B": "Permite el juego si el balón entra en el terreno.", "C": "Concede el saque de banda al equipo adversario."}, "correcta": "C", "explicacion": "Debe lanzarse desde el lugar por donde salió el balón; si no se ejecuta correctamente, saca el adversario.", "referencia": "Regla 15.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 15", "pagina": 77}, {"id": "RJ15-026", "bloque": "reglas", "enunciado": "Un adversario, situado a más de 2 metros del lugar de ejecución, agita los brazos y grita para distraer al lanzador justo antes de que este ejecute el saque de banda. ¿Qué decide el árbitro?", "opciones": {"A": "No hay infracción, al respetar la distancia reglamentaria de 2 metros.", "B": "Amonesta al adversario por conducta antideportiva, al haberlo distraído u obstaculizado de forma antirreglamentaria.", "C": "Concede un libre indirecto a favor del equipo lanzador, sin sanción disciplinaria."}, "correcta": "B", "explicacion": "Distraer u obstaculizar de forma antirreglamentaria al ejecutor de un saque de banda se sanciona con amonestación, con independencia de si además se incumple la distancia de 2 metros.", "referencia": "Regla 15.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 15", "pagina": 78}, {"id": "RJ16-001", "bloque": "reglas", "enunciado": "En un saque de meta, el guardameta eleva el balón para que un compañero se lo devuelva de cabeza, con el objetivo de poder cogerlo después con las manos. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Deja que el juego continúe con normalidad.", "B": "Amonesta al guardameta por intentar burlar las reglas y concede tiro libre indirecto al equipo adversario.", "C": "Amonesta al compañero que cede el balón de cabeza y concede tiro libre indirecto."}, "correcta": "B", "explicacion": "El intento de burlar la prohibición de la cesión intencionada mediante un artificio (elevar el balón para que otro lo remate de cabeza al guardameta) se sanciona amonestando al guardameta y concediendo tiro libre indirecto.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-002", "bloque": "reglas", "enunciado": "Tras un saque de meta correctamente ejecutado, el guardameta golpea mal el balón y queda cerca del punto de penalti; al ver a un adversario próximo con posibilidad de disputarlo, antes de que este lo juegue, lo desvía con la mano evitando un ataque prometedor. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto al equipo adversario y amonesta al guardameta.", "B": "Ordena repetir el saque de meta.", "C": "Concede tiro libre indirecto y expulsa al guardameta."}, "correcta": "A", "explicacion": "Tocar el balón con la mano fuera del área tras un saque de meta ya en juego, evitando un ataque prometedor, se sanciona con tiro libre indirecto y amonestación (no expulsión, al no ser ocasión manifiesta de gol sino ataque prometedor).", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-003", "bloque": "reglas", "enunciado": "Un jugador ejecuta correctamente un saque de meta y, antes de que el balón sea tocado por otro jugador, lo golpea intencionadamente con la mano. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede siempre tiro libre indirecto a favor del equipo adversario, con o sin sanción disciplinaria según la infracción.", "B": "Concede tiro libre indirecto, directo o penal según la infracción, con la sanción disciplinaria que corresponda.", "C": "Ordena repetir el saque de meta."}, "correcta": "B", "explicacion": "Jugar el balón con la mano tras un saque de meta, antes de que otro jugador lo toque, se sanciona según la gravedad: indirecto, directo o penal, con la sanción disciplinaria correspondiente.", "referencia": "Regla 12 / Regla 16", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-004", "bloque": "reglas", "enunciado": "¿Debe el balón abandonar el área penal para que el saque de meta se considere correctamente ejecutado y pueda ser jugado por otro jugador?", "opciones": {"A": "No es necesario, puede jugarse dentro del área penal por cualquier jugador.", "B": "Sí, el balón está en juego una vez pateado directamente y sale del área penal.", "C": "Solo debe salir del área de meta pequeña, no del área penal."}, "correcta": "B", "explicacion": "En un saque de meta, el balón está en juego cuando es pateado directamente y sale del área penal; hasta entonces no puede ser jugado por otro jugador.", "referencia": "Regla 16", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-005", "bloque": "reglas", "enunciado": "¿Cuándo se concede un saque de meta?", "opciones": {"A": "Cuando el balón atraviesa completamente la línea de meta, el último en tocarlo es un defensor y no se ha marcado gol.", "B": "Cuando el balón atraviesa la línea de meta, sea quien sea el último en tocarlo y no se haya marcado gol.", "C": "Cuando el balón atraviesa completamente la línea de meta, el último en tocarlo es un atacante y no se ha marcado gol."}, "correcta": "C", "explicacion": "Se concede saque de meta cuando el balón atraviesa completamente la línea de meta y el último en tocarlo fue un jugador del equipo atacante, sin gol.", "referencia": "Regla 16 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-006", "bloque": "reglas", "enunciado": "Un defensor ejecuta un saque de meta y el balón entra directamente en la portería adversaria sin que lo toque nadie. ¿Qué decide el árbitro?", "opciones": {"A": "Concede gol.", "B": "Ordena repetir el saque de meta.", "C": "Concede saque de meta al equipo adversario."}, "correcta": "A", "explicacion": "Se podrá marcar gol directamente de saque de meta, pero solo contra el equipo adversario.", "referencia": "Regla 16 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-007", "bloque": "reglas", "enunciado": "El guardameta ejecuta un saque de meta y el balón, sin tocar a nadie, entra en su propia portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de esquina al equipo adversario.", "B": "Ordena repetir el saque de meta.", "C": "Concede gol al equipo adversario."}, "correcta": "A", "explicacion": "Si el balón entra directamente en la portería del ejecutor, se concede saque de esquina al adversario.", "referencia": "Regla 16 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-008", "bloque": "reglas", "enunciado": "¿Desde dónde puede ejecutarse un saque de meta?", "opciones": {"A": "Desde cualquier punto del área de meta.", "B": "Únicamente desde el punto central de la línea del área de meta.", "C": "Desde cualquier punto del área penal."}, "correcta": "A", "explicacion": "Un jugador del equipo defensor golpeará el balón desde cualquier punto del área de meta.", "referencia": "Regla 16.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-009", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de meta con el balón inmóvil dentro del área de meta y este se mueve con claridad sin salir del área penal. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de meta, porque no salió del área penal.", "B": "Concede un tiro libre indirecto al equipo adversario.", "C": "Considera el balón en juego y permite que el juego continúe."}, "correcta": "C", "explicacion": "El balón está en juego cuando ha sido golpeado con el pie y está claramente en movimiento; no es necesario que salga del área.", "referencia": "Regla 16.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-010", "bloque": "reglas", "enunciado": "¿Dónde deben permanecer los adversarios hasta que el balón esté en juego en un saque de meta?", "opciones": {"A": "Fuera del área de meta, pudiendo estar en el área penal.", "B": "Fuera del área penal.", "C": "A 9.15 m del balón, aunque estén en el área penal."}, "correcta": "B", "explicacion": "Los adversarios deberán permanecer fuera del área penal hasta que el balón esté en juego.", "referencia": "Regla 16.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-011", "bloque": "reglas", "enunciado": "El equipo defensor ejecuta un saque de meta y un atacante que no tuvo tiempo de salir del área penal sigue dentro de ella, sin tocar el balón. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego prosiga.", "B": "Ordena repetir el saque de meta.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "Si un adversario no ha tenido tiempo de salir del área penal, el árbitro permite que el juego prosiga.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-012", "bloque": "reglas", "enunciado": "En un saque de meta, un atacante toca el balón dentro del área penal antes de que este esté en juego. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo defensor.", "B": "Ordena repetir el saque de meta.", "C": "Amonesta al atacante y concede un balón a tierra."}, "correcta": "B", "explicacion": "Si un adversario toca o disputa el balón dentro del área antes de que esté en juego, se repite el saque de meta.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-013", "bloque": "reglas", "enunciado": "Antes de que el balón esté en juego en un saque de meta, un atacante entra en el área penal y comete una infracción contra un defensor. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro penal a favor del equipo defensor.", "B": "Concede un tiro libre directo a favor del equipo defensor y amonesta al atacante.", "C": "Ordena repetir el saque de meta y podrá amonestar o expulsar al infractor según la gravedad."}, "correcta": "C", "explicacion": "Si un jugador entra en el área penal antes de que el balón esté en juego y comete infracción contra un adversario, se repite el saque y puede sancionarse.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-014", "bloque": "reglas", "enunciado": "Un guardameta tarda injustamente en ejecutar un saque de meta. ¿Cómo procede el árbitro?", "opciones": {"A": "Hace sonar el silbato y señala con la mano levantada la cuenta atrás de cinco segundos.", "B": "Concede de inmediato un saque de esquina al equipo adversario.", "C": "Amonesta de inmediato al guardameta y repite el saque."}, "correcta": "A", "explicacion": "Si un jugador retrasa injustamente el saque de meta, el árbitro silba e indica la cuenta atrás de cinco segundos con la mano levantada.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-015", "bloque": "reglas", "enunciado": "Tras la cuenta atrás de cinco segundos, un equipo no ha ejecutado su saque de meta. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario.", "B": "Concede un saque de banda al equipo adversario.", "C": "Concede un saque de esquina al equipo adversario."}, "correcta": "C", "explicacion": "Si el saque de meta no se ha efectuado antes del final de los cinco segundos, se concede saque de esquina al adversario.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-016", "bloque": "reglas", "enunciado": "Tras concederse el saque de esquina por la cuenta atrás, el guardameta continúa retrasando excesivamente la reanudación. ¿Qué decide el árbitro?", "opciones": {"A": "Amonesta al infractor, por retrasar en exceso la reanudación tras el saque de esquina.", "B": "No adopta medida alguna, al haberse ya sancionado con el saque de esquina.", "C": "Expulsa al guardameta por retrasar la reanudación."}, "correcta": "A", "explicacion": "Se amonestará al infractor solo si retrasa excesivamente la reanudación después de concederse el saque de esquina al adversario.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-017", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de meta, el ejecutor lo toca de nuevo con el pie antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de meta.", "B": "Concede un tiro libre directo a favor del equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "Si el ejecutor vuelve a tocar el balón antes de que lo toque otro jugador, se concede libre indirecto.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-018", "bloque": "reglas", "enunciado": "Tras un saque de meta ejecutado correctamente por un defensor, este toca el balón con la mano dentro de su área antes de que lo toque otro jugador. No es el guardameta. ¿Qué decide el árbitro?", "opciones": {"A": "Señala tiro penal a favor del equipo adversario.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Ordena repetir el saque de meta."}, "correcta": "A", "explicacion": "Si el ejecutor comete infracción por mano dentro de su área penal se concede penal, salvo que sea el guardameta.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-019", "bloque": "reglas", "enunciado": "Tras un saque de meta ejecutado correctamente por el guardameta, este toca el balón con la mano dentro de su área penal antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario.", "B": "Ordena repetir el saque de meta.", "C": "Señala tiro penal a favor del equipo adversario."}, "correcta": "A", "explicacion": "Si el ejecutor es el guardameta y comete mano en su área, se concede libre indirecto y no penal.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-020", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de meta con el balón aún rodando por el suelo del área de meta, sin que exista otra infracción. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de meta.", "B": "Concede un saque de esquina al equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "El balón debe estar inmóvil; si se comete cualquier otra infracción de esta regla, se repite el saque.", "referencia": "Regla 16.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-021", "bloque": "reglas", "enunciado": "Un jugador recibe el balón directamente de un saque de meta estando en posición adelantada respecto a los defensores. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto por fuera de juego, al considerar aplicable la sanción a los saques de meta.", "B": "Ordena repetir el saque de meta, al entender que la posición adelantada del jugador vicia la ejecución del saque.", "C": "Permite que el juego continúe, pues no hay fuera de juego en un saque de meta."}, "correcta": "C", "explicacion": "No existirá infracción por fuera de juego cuando un jugador reciba el balón directamente de un saque de meta.", "referencia": "Regla 11.3 / Situaciones que no constituyen infracción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 16", "pagina": 79}, {"id": "RJ16-022", "bloque": "reglas", "enunciado": "Antes de que el balón esté en juego en un saque de meta, un atacante que había entrado en el área penal es objeto de una infracción por parte de un defensor. ¿Qué decide el árbitro?", "opciones": {"A": "Se repite el saque de meta y el defensor infractor podrá ser amonestado o expulsado según la gravedad.", "B": "Concede un tiro libre indirecto a favor del equipo atacante desde el lugar de la infracción.", "C": "Concede un tiro penal a favor del equipo atacante, al producirse la infracción dentro del área."}, "correcta": "A", "explicacion": "Si un jugador entra en el área penal antes de que el balón esté en juego y es objeto de una infracción por parte de un adversario, se repite el saque de meta y el infractor podrá ser amonestado o expulsado según la gravedad de la infracción.", "referencia": "Regla 16.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 16", "pagina": 80}, {"id": "RJ16-023", "bloque": "reglas", "enunciado": "Tras un saque de meta ejecutado correctamente, el ejecutor recupera el balón fuera de su área penal y, antes de que lo toque otro jugador, lo golpea de forma voluntaria con la mano. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo adversario.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Ordena repetir el saque de meta."}, "correcta": "A", "explicacion": "Si el ejecutor de un saque de meta vuelve a tocar el balón con la mano fuera de su propia área penal, se sanciona con libre directo, como cualquier infracción por mano fuera del área.", "referencia": "Regla 16.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 16", "pagina": 80}, {"id": "RJ17-001", "bloque": "reglas", "enunciado": "En la ejecución de un saque de esquina, el balón golpea en un poste y entra en la portería mientras un jugador estaba en posición de fuera de juego interfiriendo a un adversario. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede el gol, ya que la posición de fuera de juego no impide la validez de un tanto marcado directamente desde un córner.", "B": "No concede el gol y ordena saque de meta, por interferencia en el juego activo del jugador en posición adelantada.", "C": "No concede el gol y ordena tiro libre indirecto por interferir el jugador en el juego activo."}, "correcta": "C", "explicacion": "La posición de fuera de juego con interferencia en el juego activo se sanciona con tiro libre indirecto a favor del equipo adversario, incluso si el balón termina entrando por rebote en un poste.", "referencia": "Regla 11 / Regla 17", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-002", "bloque": "reglas", "enunciado": "En la ejecución de un saque de esquina, ¿a qué distancia mínima deben situarse los adversarios del balón hasta que esté en juego?", "opciones": {"A": "5 metros.", "B": "7,32 metros.", "C": "9,15 metros."}, "correcta": "C", "explicacion": "En los saques de esquina, los adversarios deben permanecer a una distancia mínima de 9,15 metros del balón hasta que esté en juego, igual que en los tiros libres.", "referencia": "Regla 17", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-003", "bloque": "reglas", "enunciado": "¿Cuándo se concede un saque de esquina?", "opciones": {"A": "Cuando el balón atraviesa la línea de meta, el último en tocarlo es un atacante y no se ha marcado gol.", "B": "Cuando el balón atraviesa la línea de banda y toca el banderín de esquina.", "C": "Cuando el balón atraviesa la línea de meta, el último en tocarlo es un defensor y no se ha marcado gol."}, "correcta": "C", "explicacion": "Se concede saque de esquina cuando el balón atraviesa completamente la línea de meta y el último en tocarlo fue un defensor, sin gol.", "referencia": "Regla 17 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-004", "bloque": "reglas", "enunciado": "Además de cuando el balón sale por la línea de meta tras tocarlo un defensor, ¿qué dos sanciones dan lugar a un saque de esquina?", "opciones": {"A": "Que el guardameta controle el balón más de ocho segundos o que un jugador retrase su saque de meta.", "B": "Que el guardameta reciba una cesión con el pie o que un jugador retrase un tiro libre.", "C": "Que el guardameta suelte el balón y lo vuelva a coger o que un jugador retrase su saque de banda."}, "correcta": "A", "explicacion": "El árbitro concede saque de esquina si sanciona al guardameta por controlar el balón más de ocho segundos o a un jugador por retrasar su saque de meta.", "referencia": "Regla 17 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-005", "bloque": "reglas", "enunciado": "Un atacante ejecuta un saque de esquina y el balón entra directamente en la portería adversaria sin que lo toque nadie. ¿Qué decide el árbitro?", "opciones": {"A": "Concede gol.", "B": "Ordena repetir el saque de esquina.", "C": "Concede saque de meta a favor del equipo defensor."}, "correcta": "A", "explicacion": "Se podrá marcar gol directamente de saque de esquina, pero solo contra el equipo adversario.", "referencia": "Regla 17 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-006", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de esquina y el balón entra directamente en su propia portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede saque de esquina al equipo adversario.", "B": "Concede gol al equipo adversario.", "C": "Concede saque de meta al equipo adversario."}, "correcta": "A", "explicacion": "Si el balón entra directamente en la portería del ejecutor, se concede saque de esquina al adversario.", "referencia": "Regla 17 / Concesión", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-007", "bloque": "reglas", "enunciado": "Un guardameta es sancionado por controlar el balón con las manos más de ocho segundos dentro de su área, en la zona más cercana al banderín derecho. ¿Dónde se coloca el balón?", "opciones": {"A": "En el cuadrante de esquina del lado izquierdo, por ser el contrario.", "B": "En el punto donde el guardameta soltó el balón.", "C": "En el cuadrante de esquina más cercano al lugar que ocupaba el guardameta."}, "correcta": "C", "explicacion": "El balón se coloca en el cuadrante de esquina más cercano al lugar por el que cruzó la línea o al que ocupaba el guardameta cuando se le sancionó.", "referencia": "Regla 17.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-008", "bloque": "reglas", "enunciado": "¿Dónde se coloca el balón en un saque de esquina cuando ha cruzado la línea de meta?", "opciones": {"A": "En el cuadrante de esquina del lado en el que se encontraba el guardameta.", "B": "En el cuadrante de esquina más cercano al lugar por el que cruzó la línea de meta.", "C": "En el punto de la línea de meta más cercano a la esquina."}, "correcta": "B", "explicacion": "El balón se colocará en el cuadrante de esquina más cercano al lugar por el que cruzó la línea de meta.", "referencia": "Regla 17.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-009", "bloque": "reglas", "enunciado": "¿Quién ejecuta un saque de esquina?", "opciones": {"A": "Un jugador del equipo atacante.", "B": "Un jugador del equipo defensor.", "C": "Cualquier jugador del equipo que designe el árbitro."}, "correcta": "A", "explicacion": "El balón deberá estar inmóvil y ejecutará el saque un jugador del equipo atacante.", "referencia": "Regla 17.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-010", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de esquina y el balón se mueve con claridad sin salir del cuadrante de esquina. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de esquina.", "B": "Considera el balón en juego y permite continuar.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "B", "explicacion": "El balón está en juego una vez golpeado con el pie y en movimiento con claridad; no es necesario que salga del cuadrante.", "referencia": "Regla 17.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-011", "bloque": "reglas", "enunciado": "¿Está permitido mover el poste del banderín de esquina para facilitar la ejecución de un saque de esquina?", "opciones": {"A": "Sí, siempre que lo autorice el árbitro antes de la ejecución.", "B": "Sí, siempre que se vuelva a colocar tras el saque.", "C": "No, no se deberá mover el poste del banderín."}, "correcta": "C", "explicacion": "En la ejecución del saque de esquina no se deberá mover el poste del banderín.", "referencia": "Regla 17.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-012", "bloque": "reglas", "enunciado": "El guardameta, dentro de su propia área, toca el balón con la mano tras un saque de esquina ejecutado correctamente, antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Señala tiro penal a favor del equipo adversario.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Ordena repetir el saque de esquina."}, "correcta": "B", "explicacion": "Si el ejecutor comete infracción por mano dentro de su área, se concede penal, a menos que sea el guardameta, en cuyo caso se concede libre indirecto.", "referencia": "Regla 17.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 82}, {"id": "RJ17-013", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de esquina, el ejecutor toca de nuevo el balón con el pie antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo adversario.", "B": "Ordena repetir el saque de esquina.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "Si el ejecutor vuelve a tocar el balón antes de que lo toque otro jugador, se concede libre indirecto.", "referencia": "Regla 17.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 82}, {"id": "RJ17-014", "bloque": "reglas", "enunciado": "Con el balón en juego tras un saque de esquina, el ejecutor toca el balón con la mano antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo adversario.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Ordena repetir el saque de esquina."}, "correcta": "A", "explicacion": "Si el ejecutor comete una infracción por mano, se concede libre directo.", "referencia": "Regla 17.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 17", "pagina": 82}, {"id": "RJ17-015", "bloque": "reglas", "enunciado": "Durante un saque de esquina correcto, el ejecutor golpea voluntariamente el balón contra un adversario para jugarlo de nuevo, sin imprudencia, temeridad ni fuerza excesiva. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de esquina.", "B": "Concede un tiro libre indirecto a favor del equipo adversario.", "C": "Permite que el juego continúe."}, "correcta": "C", "explicacion": "Si el ejecutor golpea el balón contra un adversario para jugarlo de nuevo sin imprudencia ni fuerza excesiva, el juego continúa.", "referencia": "Regla 17.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 82}, {"id": "RJ17-016", "bloque": "reglas", "enunciado": "Un jugador ejecuta un saque de esquina con el balón aún en movimiento y se comete alguna otra infracción de la regla, sin ninguna otra circunstancia. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el saque de esquina.", "B": "Concede un tiro libre indirecto a favor del equipo defensor.", "C": "Concede un saque de meta a favor del equipo defensor."}, "correcta": "A", "explicacion": "Si se cometiera cualquier otra infracción de esta regla, se repetirá el saque.", "referencia": "Regla 17.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 17", "pagina": 82}, {"id": "RJ17-017", "bloque": "reglas", "enunciado": "Un jugador retrasa injustamente la ejecución de un saque de meta de su equipo y el árbitro se lo concede finalmente al equipo adversario tras la cuenta atrás. ¿Con qué saque se reanuda el juego?", "opciones": {"A": "Con un saque de esquina a favor del equipo adversario.", "B": "Con un saque de meta a favor del equipo adversario.", "C": "Con un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "Sancionar a un jugador por retrasar la ejecución de un saque de meta de su equipo es, junto con el balón que cruza la línea de meta tras tocarlo un defensor, una de las causas por las que se concede un saque de esquina.", "referencia": "Regla 17", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 17", "pagina": 81}, {"id": "RJ17-018", "bloque": "reglas", "enunciado": "Un jugador de campo, que no es el guardameta, ejecuta correctamente un saque de esquina y, tras entrar el balón en juego, se desplaza hasta su propia área penal y lo toca con la mano antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre directo a favor del equipo adversario.", "B": "Concede un tiro penal a favor del equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "B", "explicacion": "Si el ejecutor de un saque de esquina comete infracción por mano dentro de su propia área penal, se concede tiro penal, salvo que se trate del guardameta, en cuyo caso se concede libre indirecto.", "referencia": "Regla 17.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 17", "pagina": 82}, {"id": "GL-001", "bloque": "reglas", "enunciado": "Según el Glosario de las Reglas de Juego, ¿qué son los dispositivos de detección automática de goles (DAG)?", "opciones": {"A": "Dispositivos que informan inmediatamente al árbitro sobre la validez de un gol.", "B": "Dispositivos que informan en el lapso de un segundo al árbitro sobre la validez de un gol, según la Regla 5.", "C": "Dispositivos que informan en el lapso de un segundo al árbitro sobre la validez de un gol, según la Regla 1."}, "correcta": "C", "explicacion": "El Glosario define la DAG como el sistema que informa en el lapso de un segundo sobre si el balón ha atravesado completamente la línea de meta, remitiendo a la Regla 1.", "referencia": "Glosario / Regla 1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-002", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué se entiende por 'cuerpo técnico'?", "opciones": {"A": "Conjunto de miembros oficiales del equipo, sin contar jugadores, que figuran en la lista oficial, como el entrenador, el delegado o el preparador físico.", "B": "Conjunto de miembros oficiales del equipo, sin contar jugadores, como el entrenador, el fisioterapeuta o el médico.", "C": "Conjunto de miembros oficiales del equipo, sin contar jugadores, como el entrenador, el delegado o el médico."}, "correcta": "A", "explicacion": "El Glosario define el cuerpo técnico como los miembros oficiales del equipo, excluidos los jugadores, que figuran en la lista oficial: entrenador, delegado, preparador físico, etc.", "referencia": "Glosario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 108}, {"id": "GL-003", "bloque": "reglas", "enunciado": "¿Cuántas confederaciones continentales de fútbol existen, según el Glosario de las Reglas de Juego?", "opciones": {"A": "4.", "B": "5.", "C": "6."}, "correcta": "C", "explicacion": "El Glosario reconoce 6 confederaciones continentales responsables del fútbol en sus respectivos continentes.", "referencia": "Glosario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 106}, {"id": "GL-004", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cuál es la definición de 'agente externo'?", "opciones": {"A": "Toda persona ajena al equipo arbitral o no inscrita en la lista del equipo, incluyendo también animales, objetos o estructuras.", "B": "Toda persona ajena al equipo arbitral o no inscrita en la lista del equipo, sin incluir animales, objetos o estructuras.", "C": "Únicamente los espectadores que invaden el terreno de juego."}, "correcta": "A", "explicacion": "El Glosario define agente externo como cualquier persona ajena al equipo arbitral o no inscrita en la lista del equipo, incluyendo también animales, objetos o estructuras.", "referencia": "Glosario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 107}, {"id": "GL-005", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define «infracción»?", "opciones": {"A": "Acción que vulnera las Reglas de Juego, también denominada «falta».", "B": "Acción que vulnera las Reglas de Juego, sancionable siempre con expulsión.", "C": "Acción intencionada que vulnera las Reglas de Juego, distinta de la «falta»."}, "correcta": "A", "explicacion": "El Glosario define infracción como la acción que vulnera las Reglas de Juego, también denominada «falta».", "referencia": "Glosario / Infracción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 109}, {"id": "GL-006", "bloque": "reglas", "enunciado": "Según el Glosario, ¿en qué consiste la regla de los goles marcados fuera de casa?", "opciones": {"A": "Es el método empleado para dilucidar el ganador de una eliminatoria a doble partido si, al concluir el encuentro de vuelta, ambos equipos hubieran anotado el mismo número de goles, contando doble los marcados fuera de casa.", "B": "Es el método por el que gana automáticamente el equipo que jugó como visitante en el partido de ida, si el resultado global queda empatado.", "C": "Es un procedimiento de desempate alternativo a la tanda de penales, que solo puede aplicarse si ambas competiciones lo acuerdan expresamente."}, "correcta": "A", "explicacion": "La regla de los goles marcados fuera de casa dilucida al ganador de una eliminatoria a doble partido empatada en goles, contando doble los goles marcados fuera de casa.", "referencia": "Glosario / Goles marcados fuera de casa", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-007", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el lenguaje o las acciones ofensivas, insultantes o humillantes y cuál es su sanción?", "opciones": {"A": "Expresiones verbales o conductas de carácter denigrante, hiriente o irrespetuoso, sancionables con expulsión.", "B": "Expresiones verbales de carácter denigrante, sancionables únicamente con amonestación.", "C": "Conductas físicas de carácter denigrante, sancionables con expulsión, pero no las expresiones verbales."}, "correcta": "A", "explicacion": "El lenguaje o las acciones ofensivas, insultantes o humillantes son expresiones verbales o conductas denigrantes, hirientes o irrespetuosas, sancionables con expulsión.", "referencia": "Glosario / Lenguaje o acciones ofensivas, insultantes o humillantes", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 109}, {"id": "GL-008", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la tecnología semiautomatizada para la detección del fuera de juego?", "opciones": {"A": "Tecnología que envía a los árbitros asistentes de vídeo información al instante sobre las posiciones de fuera de juego y, en una versión avanzada, también a los árbitros asistentes.", "B": "Tecnología que sustituye por completo la decisión del árbitro asistente en cualquier jugada de fuera de juego que se produzca.", "C": "Tecnología que únicamente informa al árbitro principal, sin ninguna comunicación con el resto del equipo arbitral de vídeo."}, "correcta": "A", "explicacion": "Esta tecnología envía información al instante sobre posiciones de fuera de juego a los VAR y, en versión avanzada, también a los árbitros asistentes.", "referencia": "Glosario / Tecnología semiautomatizada para la detección del fuera de juego", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 111}, {"id": "GL-009", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es el sistema electrónico de seguimiento del rendimiento (EPTS)?", "opciones": {"A": "Cualquiera de los diferentes dispositivos o sistemas de registro y análisis sobre el rendimiento físico y fisiológico de un jugador.", "B": "Dispositivo exclusivo para verificar si el balón ha atravesado completamente la línea de meta.", "C": "Sistema de comunicación entre el árbitro y el VAR durante el proceso de revisión."}, "correcta": "A", "explicacion": "El EPTS agrupa los dispositivos o sistemas de registro y análisis del rendimiento físico y fisiológico de un jugador.", "referencia": "Glosario / Sistema electrónico de seguimiento del rendimiento (EPTS)", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 110}, {"id": "GL-010", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el «tiro libre directo»?", "opciones": {"A": "Golpeo del balón para ejecutar un lanzamiento de falta con el que se puede marcar gol directamente en la portería adversaria sin que el balón toque a ningún otro jugador.", "B": "Golpeo del balón para ejecutar un lanzamiento de falta con el que solo se puede marcar gol si otro jugador toca el balón antes.", "C": "Golpeo del balón ejecutado exclusivamente dentro del área penal propia, sin restricción sobre el toque de otros jugadores."}, "correcta": "A", "explicacion": "El tiro libre directo permite marcar gol directamente en la portería adversaria sin que el balón toque a ningún otro jugador.", "referencia": "Glosario / Tiro libre directo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 111}, {"id": "GL-011", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define el «tiro libre indirecto»?", "opciones": {"A": "Golpeo del balón para ejecutar un lanzamiento de falta con el que solo se puede marcar gol si otro jugador, de uno de los dos equipos, toca el balón después.", "B": "Golpeo del balón para ejecutar un lanzamiento de falta con el que se puede marcar gol directamente, sin necesidad de que otro jugador lo toque.", "C": "Golpeo del balón ejecutado únicamente por el guardameta dentro de su propia área penal."}, "correcta": "A", "explicacion": "El tiro libre indirecto solo permite marcar gol si otro jugador, de cualquiera de los dos equipos, toca el balón después del lanzamiento.", "referencia": "Glosario / Tiro libre indirecto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Glosario", "pagina": 111}, {"id": "GL-012", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué conforman los «miembros del equipo arbitral de vídeo»?", "opciones": {"A": "El conjunto de VAR y AVAR que asisten al árbitro de conformidad con las Reglas de Juego y el Protocolo del VAR.", "B": "El conjunto de árbitros asistentes que ayudan al árbitro principal dentro del terreno de juego.", "C": "El conjunto formado únicamente por el técnico de repeticiones y el cuarto árbitro."}, "correcta": "A", "explicacion": "Los miembros del equipo arbitral de vídeo son el conjunto de VAR y AVAR que asisten al árbitro conforme a las Reglas de Juego y el Protocolo del VAR.", "referencia": "Glosario / Miembros del equipo arbitral de vídeo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 112}, {"id": "GL-013", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es la «advertencia»?", "opciones": {"A": "Sanción disciplinaria comunicada con tarjeta amarilla y de la que se da parte a la autoridad competente.", "B": "Acto por el que el árbitro censura al infractor y lo anota en el acta sin comunicárselo.", "C": "Acto por el que el árbitro apercibe y censura verbalmente al infractor, que no recibe sanción alguna por la infracción."}, "correcta": "C", "explicacion": "El Glosario define la advertencia (o apercibimiento) como censura verbal sin sanción alguna.", "referencia": "Glosario / Advertencia", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-014", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cuál es la definición de «amonestación»?", "opciones": {"A": "Sanción disciplinaria comunicada con tarjeta amarilla; dos en un mismo partido a un mismo jugador dan lugar a su expulsión.", "B": "Sanción disciplinaria comunicada con tarjeta roja; dos en un mismo partido dan lugar a la suspensión del jugador.", "C": "Censura verbal sin sanción alguna; dos en un mismo partido a un mismo jugador dan lugar a su expulsión."}, "correcta": "A", "explicacion": "La amonestación es la sanción que se comunica con tarjeta amarilla; dos en el mismo partido conllevan expulsión.", "referencia": "Glosario / Amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-015", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cómo se define un «ataque prometedor»?", "opciones": {"A": "Fase del juego caracterizada por su inminencia potencial de cara a la portería contraria.", "B": "Fase del juego en la que un atacante se encuentra solo ante el guardameta.", "C": "Fase del juego en la que un equipo dispone de superioridad numérica en el área penal."}, "correcta": "A", "explicacion": "Ataque prometedor es la fase del juego caracterizada por su inminencia potencial de cara a la portería contraria.", "referencia": "Glosario / Ataque prometedor", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-016", "bloque": "reglas", "enunciado": "Según el Glosario, ¿cuál es la definición de «balón a tierra»?", "opciones": {"A": "Reanudación del juego tras detenerlo el árbitro sin que se haya cometido ninguna infracción, por ejemplo por lesión o balón defectuoso.", "B": "Reanudación del juego tras detenerlo el árbitro por una infracción cometida por un jugador que no merece sanción.", "C": "Reanudación del juego tras detenerlo el árbitro únicamente por una lesión o un balón defectuoso."}, "correcta": "A", "explicacion": "El balón a tierra es la reanudación tras detener el árbitro el juego sin infracción, p. ej. por lesión o balón defectuoso.", "referencia": "Glosario / Balón a tierra", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-017", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué se entiende por «brutalidad»?", "opciones": {"A": "Acción realizada sin tener en cuenta el riesgo para el adversario.", "B": "Acción en la que se muestra falta de atención o de consideración hacia el adversario.", "C": "Acción especialmente dura, desmesurada o premeditadamente violenta."}, "correcta": "C", "explicacion": "El Glosario define brutalidad como acción especialmente dura, desmesurada o premeditadamente violenta.", "referencia": "Glosario / Brutalidad", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-018", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué establece sobre las camisetas de los jugadores de un mismo equipo?", "opciones": {"A": "Serán idénticas en todos los casos, incluida la longitud de las mangas y la camiseta del guardameta.", "B": "Salvo por la longitud de las mangas, serán iguales, con excepción del guardameta, cuya camiseta debe distinguirlo.", "C": "Serán iguales, aunque el guardameta podrá usar el mismo color que sus compañeros si el árbitro lo autoriza."}, "correcta": "B", "explicacion": "Las camisetas de un equipo serán iguales salvo la longitud de las mangas y salvo la del guardameta, que debe distinguirlo.", "referencia": "Glosario / Camiseta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Glosario", "pagina": 107}, {"id": "GL-019", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una «carga»?", "opciones": {"A": "Pugna física contra un adversario en la que generalmente se utiliza el hombro y la parte superior del brazo, que se mantiene cerca del cuerpo.", "B": "Disputa con el pie por el balón, a ras del suelo o por el aire.", "C": "Acción con la que un jugador pugna con un adversario por un balón cercano con el fin de arrebatárselo."}, "correcta": "A", "explicacion": "La carga es la pugna física con hombro y parte superior del brazo pegado al cuerpo.", "referencia": "Glosario / Carga", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Glosario", "pagina": 107}, {"id": "GL-020", "bloque": "reglas", "enunciado": "Según el Glosario, ¿qué es una «entrada»?", "opciones": {"A": "Pugna física contra un adversario en la que se utiliza el hombro y el brazo pegado al cuerpo.", "B": "Disputa con el pie por el balón, a ras del suelo o por el aire.", "C": "Acción de detener o desviar un balón dirigido a la portería con cualquier parte del cuerpo."}, "correcta": "B", "explicacion": "El Glosario define la entrada como disputa con el pie por el balón (a ras del suelo o por el aire).", "refe
