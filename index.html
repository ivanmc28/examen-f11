un árbitro asistente que se encuentra en la línea de banda, fuera del terreno de juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre indirecto en el lugar donde estaba el balón, al haberse cometido la infracción fuera del terreno de juego.", "B": "Con libre directo desde el punto de la línea de demarcación más cercano al lugar de la infracción.", "C": "Con balón a tierra en el lugar donde estaba el balón, al no atribuirse a ningún jugador del terreno de juego la infracción."}, "correcta": "B", "explicacion": "Si un jugador comete una infracción contra un miembro del equipo arbitral fuera del terreno de juego, se reanuda con libre desde el punto de la línea de demarcación más cercano al lugar donde se produjo la infracción.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-191", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador insulta con lenguaje ofensivo a un miembro de su propio cuerpo técnico que está en el área técnica. ¿Cómo se reanuda el juego tras expulsarlo?", "opciones": {"A": "Con libre directo desde el punto más cercano de la línea de demarcación.", "B": "Con libre indirecto desde el lugar donde se encontraba el jugador al cometer la infracción.", "C": "Con balón a tierra donde estaba el balón."}, "correcta": "B", "explicacion": "Las infracciones de carácter verbal se sancionan con libre indirecto.", "referencia": "Regla 12.5 / Infracciones verbales", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-192", "bloque": "reglas", "enunciado": "Según la introducción de la Regla 12, ¿por qué infracciones pueden concederse libres directos, libres indirectos y penales?", "opciones": {"A": "Por cualquier infracción cometida en el terreno de juego, esté o no el balón en juego.", "B": "Por infracciones cometidas con el balón en juego o durante una interrupción por lesión.", "C": "Solamente por infracciones cometidas con el balón en juego."}, "correcta": "C", "explicacion": "Los tiros libres directos e indirectos y los lanzamientos desde el punto penal solamente podrán concederse por infracciones cometidas con el balón en juego.", "referencia": "Regla 12 / Introducción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 62}, {"id": "RJ12-193", "bloque": "reglas", "enunciado": "Con el balón fuera de juego tras haber salido por la línea de meta, un jugador golpea imprudentemente a un adversario. ¿Concede el árbitro un libre directo?", "opciones": {"A": "Sí, libre directo en el lugar de la infracción, con independencia de que el balón estuviera o no en juego en ese momento.", "B": "No, porque los libres solo se conceden por infracciones con el balón en juego; el juego se reanuda como correspondía.", "C": "Sí, libre indirecto en la línea de meta, al considerarse que el balón fuera de juego no exime de sanción al infractor."}, "correcta": "B", "explicacion": "Los libres y penales solo pueden concederse por infracciones cometidas con el balón en juego; con el balón detenido se reanuda según la decisión anterior, adoptando las medidas disciplinarias que procedan.", "referencia": "Regla 12 / Introducción y 12.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-194", "bloque": "reglas", "enunciado": "Con el balón detenido, un jugador escupe a un adversario. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa y concede libre directo en el lugar de la agresión.", "B": "Lo expulsa y reanuda el juego según la decisión adoptada anteriormente.", "C": "Lo amonesta y reanuda con balón a tierra."}, "correcta": "B", "explicacion": "Escupir a alguien es motivo de expulsión; al estar el balón detenido, el juego se reanuda según la decisión anterior.", "referencia": "Regla 12.4 y 12.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-195", "bloque": "reglas", "enunciado": "Un jugador salta a cabecear un balón y el balón golpea su brazo, que se encontraba en una posición natural derivada del movimiento de su cuerpo al saltar. ¿Qué decide el árbitro?", "opciones": {"A": "No sanciona infracción por mano.", "B": "Concede libre directo o penal por mano.", "C": "Concede libre indirecto por juego peligroso."}, "correcta": "A", "explicacion": "Se comete infracción cuando la posición del brazo no es consecuencia del movimiento del cuerpo en esa acción; si está justificada por dicho movimiento, no hay infracción, salvo que el balón entre directamente en la meta tras el contacto.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-196", "bloque": "reglas", "enunciado": "El guardameta, fuera de su área, toca el balón con las manos tras una cesión con el pie de un compañero, sin evitar ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo por mano fuera del área.", "B": "Concede libre indirecto, como si estuviera dentro del área.", "C": "Deja seguir el juego, porque es el guardameta."}, "correcta": "A", "explicacion": "Fuera de su área el guardameta está sujeto a las mismas restricciones que cualquier jugador respecto a tocar el balón con la mano, por lo que la infracción por mano se sanciona con libre directo.", "referencia": "Regla 12.1 / Guardameta y mano fuera del área", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-197", "bloque": "reglas", "enunciado": "Un defensor cabecea con fuerza excesiva a un adversario en la disputa de un balón aéreo, poniendo en peligro su integridad. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto y amonesta al defensor.", "B": "Concede libre directo (o penal) y amonesta al defensor.", "C": "Concede libre directo (o penal) y expulsa al defensor por juego brusco y grave."}, "correcta": "C", "explicacion": "Golpear con la cabeza está incluido en las faltas sancionables; cuando se emplea fuerza excesiva o se pone en peligro la integridad física en la disputa, es juego brusco y grave.", "referencia": "Regla 12.1 y 12.4 / Juego brusco y grave", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-198", "bloque": "reglas", "enunciado": "Un jugador comete una infracción que no aparece recogida en las Reglas de Juego y el árbitro detiene el partido para amonestarle. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo a favor del equipo adversario.", "B": "Con balón a tierra en el lugar de la infracción.", "C": "Con libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "Se concede libre indirecto si un jugador comete cualquier otra infracción no mencionada en las Reglas por la que se interrumpe el partido para amonestar o expulsar a un jugador.", "referencia": "Regla 12.2 / Libre indirecto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-199", "bloque": "reglas", "enunciado": "Un jugador amonestado comete una falta merecedora de segunda amonestación mientras el equipo contrario mantiene la posesión, sin que exista ocasión manifiesta de gol. ¿Puede el árbitro conceder ventaja?", "opciones": {"A": "Sí, y le muestra la segunda amarilla cuando el balón deje de estar en juego.", "B": "No, salvo que se trate de una ocasión manifiesta de gol.", "C": "Sí, pero solo si el equipo contrario está en su propia mitad."}, "correcta": "B", "explicacion": "No se debe conceder ventaja en faltas merecedoras de una segunda amonestación, a menos que se trate de una ocasión manifiesta de gol.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-200", "bloque": "reglas", "enunciado": "Tras el pitido final, cuando el árbitro aún no ha abandonado el terreno de juego, un jugador le insulta gravemente. ¿Puede el árbitro expulsarlo?", "opciones": {"A": "Sí, porque su autoridad disciplinaria se mantiene hasta que abandona el terreno de juego.", "B": "No, porque el partido ya ha terminado.", "C": "Solo puede hacerlo constar en el acta, sin tarjeta."}, "correcta": "A", "explicacion": "El árbitro tiene autoridad disciplinaria desde que entra en el terreno de juego para la inspección previa hasta que lo abandona una vez terminado el partido.", "referencia": "Regla 12.4 / Autoridad disciplinaria", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-201", "bloque": "reglas", "enunciado": "Antes de la inspección previa al partido, un miembro del cuerpo técnico comete una infracción merecedora de expulsión antes de que el árbitro haya entrado en el terreno de juego. ¿Qué puede hacer el árbitro?", "opciones": {"A": "Nada, porque su autoridad disciplinaria aún no ha comenzado.", "B": "Impedir que participe en el partido y hacer constar el caso.", "C": "Amonestarlo y permitirle ocupar el área técnica."}, "correcta": "B", "explicacion": "Si antes de entrar en el terreno de juego un jugador o miembro del cuerpo técnico comete una infracción merecedora de expulsión, el árbitro puede impedir su participación y debe hacer constar los casos de conducta incorrecta.", "referencia": "Regla 12.4 / Autoridad disciplinaria", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-202", "bloque": "reglas", "enunciado": "Un adversario se sitúa a menos de la distancia reglamentaria en la ejecución de un saque de banda, sin ningún otro comportamiento reprochable. ¿Qué decide el árbitro?", "opciones": {"A": "Expulsa al jugador por retrasar la reanudación.", "B": "Amonesta al jugador por no respetar la distancia reglamentaria.", "C": "No adopta medida disciplinaria, porque el saque no se ha ejecutado."}, "correcta": "B", "explicacion": "No respetar la distancia reglamentaria en un balón a tierra, saque de esquina, tiro libre o saque de banda es infracción amonestable.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-203", "bloque": "reglas", "enunciado": "Un suplente repite de manera insistente el gesto de «revisión» ante el árbitro desde el banquillo. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, por repetir de manera insistente el gesto de «revisión».", "B": "Lo expulsa, al tratarse de una reiteración equivalente a una segunda amonestación en el mismo partido.", "C": "Lo advierte, siempre, sin llegar nunca a amonestarlo por este tipo de conducta desde el banquillo."}, "correcta": "A", "explicacion": "Se amonestará al suplente o jugador sustituido que repita de manera insistente el gesto de la «revisión».", "referencia": "Regla 12.4 / Amonestación de suplentes y sustituidos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-204", "bloque": "reglas", "enunciado": "Un jugador sustituido, sentado en el banquillo, comete un acto de conducta antideportiva hacia un adversario. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta, por incurrir en conducta antideportiva pese a estar en el banquillo.", "B": "Lo advierte, al aplicarle el mismo sistema de apercibimiento previsto para el cuerpo técnico.", "C": "No puede sancionarle, al no estar disputando el balón ni encontrarse dentro del terreno de juego."}, "correcta": "A", "explicacion": "Se amonestará al suplente o jugador sustituido que realice conducta antideportiva.", "referencia": "Regla 12.4 / Amonestación de suplentes y sustituidos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-205", "bloque": "reglas", "enunciado": "Un jugador lanza con rabia el balón contra el suelo tras un pitido en contra, mostrando así su desaprobación. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta por mostrar desaprobación con acciones.", "B": "Lo expulsa por lanzar el balón.", "C": "No adopta medida, porque no hay contacto con nadie."}, "correcta": "A", "explicacion": "Mostrar desaprobación con palabras o acciones es infracción sancionable con amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-206", "bloque": "reglas", "enunciado": "Un defensor, fuera de su área, entra a un atacante que se dirigía solo hacia la portería. Intentaba jugar el balón, pero llega tarde y lo derriba. ¿Qué medida disciplinaria toma el árbitro?", "opciones": {"A": "Concede libre directo y amonesta al defensor porque intentaba jugar el balón.", "B": "Concede libre directo y expulsa al defensor por evitar una ocasión manifiesta de gol.", "C": "Concede libre directo sin sanción disciplinaria."}, "correcta": "B", "explicacion": "La reducción a amonestación por intentar jugar el balón solo se aplica cuando el árbitro señala tiro penal; fuera del área, evitar una ocasión manifiesta de gol mediante falta conlleva expulsión.", "referencia": "Regla 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-207", "bloque": "reglas", "enunciado": "Un jugador de campo, con el balón en juego, patea un perro que ha invadido el terreno de juego; el árbitro detiene el juego. ¿Cómo se reanuda?", "opciones": {"A": "Con libre directo a favor del equipo adversario.", "B": "Con libre indirecto a favor del equipo adversario.", "C": "Con un balón a tierra."}, "correcta": "C", "explicacion": "Los animales se consideran agentes externos; si un jugador comete una infracción sobre un agente externo y el árbitro detiene el juego, se reanuda con balón a tierra.", "referencia": "Regla 12.5 / Infracción sobre un agente externo", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-208", "bloque": "reglas", "enunciado": "Según la Regla 12.5, si el balón está en juego y un jugador comete una infracción de carácter físico dentro del terreno de juego contra un adversario, ¿cómo se reanuda el juego?", "opciones": {"A": "Siempre con libre directo, con independencia del lugar del terreno de juego donde se produzca la infracción física.", "B": "Con libre indirecto, libre directo o tiro penal, según el caso.", "C": "Siempre con libre indirecto, al considerarse toda infracción física como una infracción de menor gravedad."}, "correcta": "B", "explicacion": "Si un jugador comete una infracción física dentro del campo contra un adversario, el juego se reanuda con libre indirecto, directo o tiro penal, según el caso.", "referencia": "Regla 12.5 / Reanudación tras faltas", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-209", "bloque": "reglas", "enunciado": "Un jugador que está dentro del terreno de juego arroja un objeto contra un suplente rival que está en el banquillo, con el balón en juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre directo desde el lugar donde el objeto golpeó o habría golpeado al suplente (o el punto más cercano de la línea de demarcación).", "B": "Con balón a tierra en el lugar donde estaba el balón, al no atribuirse la infracción a ningún jugador del terreno de juego.", "C": "Con libre indirecto desde el lugar donde estaba el lanzador, al tratarse de una infracción cometida contra un suplente."}, "correcta": "A", "explicacion": "Si se lanza un objeto contra un suplente del equipo contrario, el juego se reanuda con libre directo desde el lugar donde el objeto golpeó o habría golpeado; si es fuera del campo, desde el punto más cercano de la línea de demarcación.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-210", "bloque": "reglas", "enunciado": "Un ayudante del entrenador golpea con brutalidad a un jugador adversario desde el área técnica, con el balón en juego. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta y concede libre indirecto, al no considerarse la conducta del ayudante lo suficientemente grave para expulsarlo.", "B": "Lo expulsa y reanuda con balón a tierra, al no poder determinarse con claridad el lugar exacto de la infracción.", "C": "Lo expulsa por conducta violenta y concede libre directo desde el punto de la línea de demarcación más cercano."}, "correcta": "C", "explicacion": "Un miembro del cuerpo técnico que comete una infracción contra un jugador adversario fuera del terreno de juego se sanciona (expulsión por conducta violenta) y el juego se reanuda con libre desde el punto de la línea de demarcación más cercano.", "referencia": "Regla 12.4 y 12.5", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-211", "bloque": "reglas", "enunciado": "Un entrenador celebra un gol de su equipo de manera provocativa y exaltada frente al banquillo rival. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa, al asimilar la celebración provocativa a una entrada con ánimo de confrontación hacia el banquillo rival.", "B": "Le advierte, siempre, sin llegar a amonestarlo por este tipo de celebración provocativa.", "C": "Lo amonesta, por celebrar de manera provocativa y exaltada frente al banquillo rival."}, "correcta": "C", "explicacion": "Proceder de manera provocativa o exaltada es motivo de amonestación para los miembros del cuerpo técnico.", "referencia": "Regla 12.4 / Amonestación a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-212", "bloque": "reglas", "enunciado": "El guardameta controla el balón con las manos dentro de su área durante siete segundos y lo suelta. ¿Qué decide el árbitro?", "opciones": {"A": "Deja seguir el juego, al no haberse superado los ocho segundos.", "B": "Concede saque de esquina, al considerar que se ha superado el límite de tiempo permitido para retener el balón.", "C": "Concede libre indirecto, al entender que siete segundos ya constituyen una retención excesiva del balón con las manos."}, "correcta": "A", "explicacion": "La infracción se produce si el guardameta controla el balón con las manos o los brazos durante más de ocho segundos antes de soltarlo.", "referencia": "Regla 12.3 / Ocho segundos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-213", "bloque": "reglas", "enunciado": "Un defensor golpea con el puño en la cabeza a un atacante cuando ninguno disputaba el balón, con una fuerza claramente apreciable. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo (o penal) y lo expulsa por juego brusco y grave.", "B": "Concede libre directo (o penal) y lo expulsa por conducta violenta.", "C": "Concede libre indirecto y lo amonesta."}, "correcta": "B", "explicacion": "Si un jugador golpea deliberadamente a un adversario en la cabeza o la cara sin disputar el balón, la acción es conducta violenta (expulsión); el juego brusco y grave exige disputa del balón.", "referencia": "Regla 12.4 / Conducta violenta", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-214", "bloque": "reglas", "enunciado": "Un jugador aplaude de forma sarcástica una decisión del árbitro en su cara, faltándole al respeto. ¿Qué decide el árbitro?", "opciones": {"A": "Lo expulsa por lenguaje o gestos humillantes.", "B": "Lo amonesta por mostrar desaprobación con acciones.", "C": "Solo le advierte, siempre."}, "correcta": "B", "explicacion": "Mostrar desaprobación con acciones, como faltar al respeto al equipo arbitral aplaudiendo sarcásticamente, es motivo de amonestación.", "referencia": "Regla 12.4 / Infracciones sancionables con amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-215", "bloque": "reglas", "enunciado": "¿Cómo se denomina también la «advertencia» a que se refiere la Regla 12.4 para determinadas infracciones de los miembros del cuerpo técnico?", "opciones": {"A": "Apercibimiento, el otro término que emplea la Regla 12.4 para esta advertencia.", "B": "Amonestación verbal, término que utiliza la Regla 12.4 como sinónimo exacto de la advertencia.", "C": "Tarjeta blanca, elemento que la Regla 12.4 reserva para este tipo concreto de infracción."}, "correcta": "A", "explicacion": "La Regla 12.4 indica que la advertencia se denomina también «apercibimiento»; su reiteración o carácter improcedente podrían suponer amonestación o expulsión.", "referencia": "Regla 12.4 / Advertencia a miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-216", "bloque": "reglas", "enunciado": "¿Qué distingue, respecto al área técnica, una advertencia de una amonestación a un miembro del cuerpo técnico?", "opciones": {"A": "La advertencia procede por cualquier salida; la amonestación, por salir más de una vez en la misma parte.", "B": "La advertencia procede fuera del partido; la amonestación, solo durante el juego.", "C": "La advertencia procede por salidas ocasionales sin otra infracción; la amonestación, por no respetar de manera obvia o persistente los límites del área técnica."}, "correcta": "C", "explicacion": "Salir del área técnica de manera ocasional sin otra infracción da lugar a advertencia; no respetar de manera obvia o persistente sus límites es motivo de amonestación.", "referencia": "Regla 12.4 / Miembros del cuerpo técnico", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 68}, {"id": "RJ12-217", "bloque": "reglas", "enunciado": "Un jugador entra en el terreno de juego sin permiso del árbitro y, acto seguido, toca el balón con la mano para impedir un ataque prometedor. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta una sola vez, por la infracción más grave.", "B": "Lo expulsa directamente por conducta antideportiva, sin doble amarilla.", "C": "Lo amonesta dos veces y, por tanto, lo expulsa."}, "correcta": "C", "explicacion": "Si un mismo jugador comete dos infracciones sancionables, incluso sucesivamente, se le deberá amonestar dos veces, por ejemplo al entrar sin autorización y frustrar después un ataque prometedor tocando el balón con la mano.", "referencia": "Regla 12.4 / Doble amonestación", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-218", "bloque": "reglas", "enunciado": "El guardameta, dentro de su área, sujeta a un atacante que iba a rematar solo ante la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto y amonesta al guardameta.", "B": "Señala penal y expulsa al guardameta.", "C": "Señala penal y amonesta al guardameta."}, "correcta": "B", "explicacion": "Sujetar es una de las acciones (agarrar, tirar, empujar) que, al evitar una ocasión manifiesta de gol con penal, suponen expulsión, porque no se pretendía jugar o disputar el balón.", "referencia": "Regla 12.1 y 12.4 / Evitar un gol o una ocasión manifiesta de gol", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-219", "bloque": "reglas", "enunciado": "Un atacante empuja el balón con la mano de forma voluntaria hacia la portería y marca gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede el gol y amonesta al atacante.", "B": "Anula el gol y concede saque de meta, sin sanción disciplinaria.", "C": "Anula el gol, concede libre directo al equipo defensor y amonesta al atacante."}, "correcta": "C", "explicacion": "Marcar gol directamente con la mano es infracción (libre directo para el adversario) y tocar el balón con la mano al intentar marcar gol es conducta antideportiva, por lo que se amonesta.", "referencia": "Regla 12.1 y 12.4 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-220", "bloque": "reglas", "enunciado": "Un defensor, dentro de su área, comete una falta imprudente intentando jugar el balón e interfiere en un ataque prometedor, sin que exista ocasión manifiesta de gol; el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Amonestación por conducta antideportiva.", "B": "Expulsión por evitar un ataque prometedor.", "C": "Ninguna medida disciplinaria."}, "correcta": "C", "explicacion": "La conducta antideportiva por interferir en un ataque prometedor no se aplica cuando el árbitro concede penal por una infracción con la que se pretende jugar o disputar el balón.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-221", "bloque": "reglas", "enunciado": "Un defensor, dentro de su área, agarra por la camiseta a un atacante e interfiere en un ataque prometedor, sin que exista ocasión manifiesta de gol; el árbitro señala penal. ¿Qué medida disciplinaria toma?", "opciones": {"A": "Ninguna medida disciplinaria, al haberse señalado ya el penal correspondiente.", "B": "Expulsión por evitar una ocasión manifiesta de gol.", "C": "Amonestación por conducta antideportiva."}, "correcta": "C", "explicacion": "Al no pretender jugar o disputar el balón, la excepción no se aplica: interferir en un ataque prometedor mediante una infracción es conducta antideportiva y se amonesta.", "referencia": "Regla 12.4 / Conducta antideportiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 66}, {"id": "RJ12-222", "bloque": "reglas", "enunciado": "Un jugador lanza imprudentemente una bota contra el árbitro, sin llegar a impactarle. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con libre indirecto desde el lugar donde se encontraba el lanzador.", "B": "Con libre directo desde el lugar donde el objeto habría golpeado al árbitro.", "C": "Con balón a tierra en el lugar donde se detuvo el juego."}, "correcta": "B", "explicacion": "Si un jugador lanza un objeto contra un miembro del equipo arbitral, el juego se reanuda con libre directo desde el lugar donde el objeto golpeó o habría golpeado a la persona.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-223", "bloque": "reglas", "enunciado": "Con el balón en juego, un jugador escupe a un árbitro asistente que se encuentra en la línea de banda. ¿Qué decide el árbitro?", "opciones": {"A": "Lo amonesta y concede libre indirecto donde se encontraba el balón.", "B": "Lo expulsa y reanuda con balón a tierra.", "C": "Lo expulsa y concede libre directo desde el punto de la línea de demarcación más cercano."}, "correcta": "C", "explicacion": "Escupir a un miembro del equipo arbitral se sanciona con libre directo y expulsión; al estar la víctima fuera del campo, se ejecuta desde el punto de la línea de demarcación más cercano.", "referencia": "Regla 12.1 y 12.5 / Escupir o morder", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 69}, {"id": "RJ12-224", "bloque": "reglas", "enunciado": "El árbitro concede ventaja tras una entrada temeraria (sin ocasión manifiesta de gol) y el equipo beneficiado marca gol. ¿Qué hace con el infractor?", "opciones": {"A": "No lo amonesta, porque se marcó gol.", "B": "Lo amonesta en cuanto el balón deje de estar en juego.", "C": "Lo expulsa por haber provocado la ventaja."}, "correcta": "B", "explicacion": "La exención de sanción tras un gol por ventaja se aplica solo a infracciones que evitan una ocasión manifiesta de gol; en el resto, la amonestación se aplica en cuanto el balón deje de estar en juego.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-225", "bloque": "reglas", "enunciado": "El guardameta comete una falta imprudente sobre un delantero dentro de su propia área, sin ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Señala penal y amonesta al guardameta.", "B": "Señala penal sin sanción disciplinaria.", "C": "Concede libre indirecto sin sanción disciplinaria."}, "correcta": "B", "explicacion": "Una falta imprudente no requiere sanción disciplinaria; cometida dentro del área del infractor, se sanciona con tiro penal.", "referencia": "Regla 12.1 / Imprudente, temeraria y fuerza excesiva", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-226", "bloque": "reglas", "enunciado": "El guardameta sale de su área y toca el balón voluntariamente con las manos, interrumpiendo un ataque prometedor, pero sin evitar una ocasión manifiesta de gol. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo y lo expulsa.", "B": "Concede libre directo y lo amonesta por conducta antideportiva.", "C": "Concede libre indirecto sin sanción disciplinaria."}, "correcta": "B", "explicacion": "Fuera de su área el guardameta está sujeto a las mismas restricciones que cualquier jugador: la mano voluntaria que interrumpe un ataque prometedor es conducta antideportiva.", "referencia": "Regla 12.1 y 12.4 / Guardameta y mano fuera del área", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-227", "bloque": "reglas", "enunciado": "Un jugador temporalmente fuera del terreno de juego recibiendo atención médica lanza una botella al campo y esta golpea el balón que está en juego. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con balón a tierra en el lugar donde golpeó el objeto.", "B": "Con libre directo (o penal) en el lugar donde el objeto golpeó el balón.", "C": "Con libre indirecto en la línea de banda más cercana."}, "correcta": "B", "explicacion": "Si un jugador temporalmente fuera del campo lanza un objeto al terreno de juego y este contacta con el balón, se reanuda con libre directo (o penal) donde el objeto golpeó al balón.", "referencia": "Regla 12.5 / Lanzamiento de objetos", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 70}, {"id": "RJ12-228", "bloque": "reglas", "enunciado": "Un defensor, fuera de su área, toca el balón con la mano en posición antinatural, haciendo que su cuerpo ocupe más espacio, sin interrumpir ningún ataque prometedor. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre directo sin sanción disciplinaria.", "B": "Concede libre directo y amonesta al defensor.", "C": "Concede libre indirecto sin sanción disciplinaria."}, "correcta": "A", "explicacion": "La infracción por mano se sanciona con libre directo; solo se amonesta o expulsa si con ella se interrumpe un ataque prometedor o se evita un gol u ocasión manifiesta de gol.", "referencia": "Regla 12.1 y 12.4 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-229", "bloque": "reglas", "enunciado": "Un jugador comete una falta de juego brusco y grave cuando el atacante mantiene una ocasión manifiesta de gol y el árbitro concede ventaja. El balón sale del campo poco después. ¿Qué hace el árbitro con el infractor?", "opciones": {"A": "Lo amonesta, porque concedió ventaja.", "B": "No adopta medida disciplinaria, al haber aplicado ventaja.", "C": "Lo expulsa en cuanto el balón deje de estar en juego."}, "correcta": "C", "explicacion": "En el juego brusco y grave solo se concede ventaja si hay ocasión manifiesta de gol; el árbitro expulsa al jugador en cuanto el balón deje de estar en juego.", "referencia": "Regla 12.4 / Ventaja", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 65}, {"id": "RJ12-230", "bloque": "reglas", "enunciado": "Un jugador controla el balón con la mano de forma voluntaria para ponerlo a su pie y seguir la jugada, sin evitar gol ni ataque. ¿Qué decide el árbitro?", "opciones": {"A": "Concede libre indirecto sin sanción disciplinaria.", "B": "Concede libre directo (o penal si es en su área) sin sanción disciplinaria.", "C": "Deja seguir el juego, porque no ha evitado ningún ataque."}, "correcta": "B", "explicacion": "La infracción por mano voluntaria se sanciona con libre directo (o penal); solo se sanciona disciplinariamente si interrumpe un ataque prometedor o evita un gol u ocasión manifiesta de gol.", "referencia": "Regla 12.1 / Tocar el balón con la mano", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-231", "bloque": "reglas", "enunciado": "Un defensor, fuera de su área penal, obstaculiza el avance de un atacante sin que exista contacto físico, impidiéndole llegar en solitario hacia la portería y evitando así una clara ocasión de gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto y amonesta al defensor por conducta antideportiva.", "B": "Concede tiro libre indirecto y expulsa al defensor por evitar una ocasión manifiesta de gol.", "C": "Concede tiro libre indirecto sin sanción disciplinaria, al no existir contacto físico."}, "correcta": "B", "explicacion": "Evitar un gol o una ocasión manifiesta de gol mediante una infracción sancionable con libre, directo o indirecto, fuera del área del infractor conlleva expulsión.", "referencia": "Regla 12.4", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ12-232", "bloque": "reglas", "enunciado": "El guardameta, en una jugada de ataque de su equipo lejos de su propia área, golpea el balón directamente con la mano y este entra en la portería contraria. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede el gol, al considerar que la infracción por mano del guardameta lejos de su área no impide su validez.", "B": "No concede el gol; concede tiro libre indirecto a favor del equipo adversario, al tratarse de una simple infracción por mano.", "C": "No concede el gol; concede tiro libre directo a favor del equipo adversario en el lugar del contacto."}, "correcta": "C", "explicacion": "Marcar gol directamente con la mano o el brazo constituye infracción por mano, incluido el guardameta, y se sanciona con libre directo en el lugar donde se produjo el contacto.", "referencia": "Regla 12.1", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 12", "pagina": 67}, {"id": "RJ12-233", "bloque": "reglas", "enunciado": "Un defensor cede deliberadamente el balón a su guardameta con el pecho, en una clara maniobra para burlar la prohibición de recibir el balón con las manos tras una cesión con el pie. El guardameta controla el balón únicamente con el pie, sin llegar a tocarlo con la mano. ¿Qué decide el árbitro?", "opciones": {"A": "No hay infracción, ya que el guardameta no tocó el balón con la mano.", "B": "Concede tiro libre indirecto a favor del equipo adversario, sancionando también al guardameta si fue responsable de iniciar la acción.", "C": "Concede tiro libre directo a favor del equipo adversario por burlar deliberadamente las Reglas de Juego."}, "correcta": "B", "explicacion": "Burlar deliberadamente la Regla para hacer llegar el balón al guardameta con el pecho se sanciona con libre indirecto, independientemente de que el guardameta llegue a tocar el balón con la mano.", "referencia": "Regla 12.2", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 12", "pagina": 64}, {"id": "RJ13-001", "bloque": "reglas", "enunciado": "El ejecutor de un tiro libre, fuera del área penal, toca el balón por segunda vez de forma involuntaria antes de que lo toque otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre en todo caso, sin posibilidad de aplicar la ventaja al equipo contrario.", "B": "Aplica ventaja si procede; de no ser posible, concede tiro libre indirecto al equipo contrario desde el lugar de la infracción.", "C": "Deja que el juego continúe sin más consecuencias, al ser un acto involuntario que no constituye infracción."}, "correcta": "B", "explicacion": "El doble toque involuntario del ejecutor se sanciona con tiro libre indirecto al equipo contrario, aplicando ventaja si es posible antes de detener el juego.", "referencia": "Regla 13", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-002", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre rápidamente cuando un adversario se encuentra a solo 5 metros de distancia, interceptando el balón. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre y amonesta al infractor.", "B": "Ordena repetir el tiro libre sin amonestación.", "C": "Deja que el juego continúe."}, "correcta": "B", "explicacion": "Si el adversario está a menos de la distancia reglamentaria en un tiro libre ejecutado rápidamente e intercepta el balón, procede repetir el lanzamiento, sin necesidad de amonestar salvo circunstancias adicionales.", "referencia": "Regla 13", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-003", "bloque": "reglas", "enunciado": "El equipo defensor ejecuta un tiro libre indirecto desde su propia área de meta, y el balón se introduce directamente en su propia portería. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre indirecto.", "B": "Concede un balón a tierra al guardameta dentro de su área de penal.", "C": "Concede un saque de esquina al equipo adversario."}, "correcta": "C", "explicacion": "Si un tiro libre indirecto ejecutado por el equipo defensor entra directamente en su propia portería, se concede saque de esquina al equipo adversario.", "referencia": "Regla 13", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-004", "bloque": "reglas", "enunciado": "En un tiro libre a favor del equipo defensor, ejecutado desde su propia área de meta, el balón se introduce directamente en la portería del equipo ejecutor. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre indirecto.", "B": "Concede balón a tierra al guardameta dentro de su área de penal.", "C": "Concede saque de esquina al equipo adversario."}, "correcta": "C", "explicacion": "Un tiro libre indirecto del equipo defensor que entra directamente en su propia portería se resuelve con saque de esquina para el equipo contrario.", "referencia": "Regla 13", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-005", "bloque": "reglas", "enunciado": "En la ejecución de un tiro libre directo a favor del equipo atacante fuera del área, ¿a qué distancia mínima deben situarse los adversarios del balón, salvo que estén sobre su propia línea de meta entre los postes?", "opciones": {"A": "5 metros.", "B": "7,32 metros.", "C": "9,15 metros."}, "correcta": "C", "explicacion": "La distancia reglamentaria mínima que deben guardar los adversarios en los tiros libres es de 9,15 metros, salvo excepciones específicas junto a la propia meta.", "referencia": "Regla 13", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-006", "bloque": "reglas", "enunciado": "¿Cómo indica el árbitro un tiro libre indirecto?", "opciones": {"A": "Levantando ambos brazos en horizontal a la altura de los hombros.", "B": "Señalando con un brazo extendido hacia el punto del lanzamiento.", "C": "Levantando un brazo por encima de la cabeza."}, "correcta": "C", "explicacion": "El árbitro indica el libre indirecto levantando un brazo por encima de la cabeza.", "referencia": "Regla 13.1 / Señal de tiro libre indirecto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-007", "bloque": "reglas", "enunciado": "¿Hasta cuándo mantiene el árbitro la señal de tiro libre indirecto?", "opciones": {"A": "Hasta que se ejecuta el tiro y el balón toca a otro jugador, deja de estar en juego o es evidente que no puede marcarse gol directamente.", "B": "Hasta que el balón toque a un jugador adversario, sin ningún otro supuesto posible.", "C": "Hasta que el balón esté en juego tras ser golpeado con el pie y se mueva con claridad."}, "correcta": "A", "explicacion": "La señal se mantiene hasta que se ejecuta el tiro y el balón toca a otro jugador, deja de estar en juego o está claro que no es posible marcar gol directamente.", "referencia": "Regla 13.1 / Señal de tiro libre indirecto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-008", "bloque": "reglas", "enunciado": "El árbitro concede un tiro libre indirecto, pero olvida levantar el brazo. El ejecutor golpea el balón y este entra directamente en la portería contraria sin tocar a nadie. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre.", "B": "Concede saque de meta, al ser un tiro libre indirecto.", "C": "Concede gol, ya que el error de señalización es del árbitro."}, "correcta": "A", "explicacion": "Si el árbitro olvida indicar que el tiro es indirecto y el balón entra directamente en la portería, se repite el tiro.", "referencia": "Regla 13.1 / Señal de tiro libre indirecto", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-009", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre directo desde el círculo central y el balón entra directamente en la portería adversaria sin tocar a ningún otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede gol.", "B": "Concede saque de meta a favor del equipo defensor.", "C": "Ordena repetir el tiro libre por la distancia recorrida."}, "correcta": "A", "explicacion": "Si un libre directo entra directamente en la portería contraria, se concede gol.", "referencia": "Regla 13.1 / El balón entra en la portería", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-010", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre indirecto correctamente y el balón entra directamente en la portería adversaria sin que lo toque nadie más. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un saque de esquina a favor del equipo atacante.", "B": "Con un gol válido, al haber sido ejecutado correctamente.", "C": "Con un saque de meta a favor del equipo defensor."}, "correcta": "C", "explicacion": "Si un libre indirecto entra directamente en la portería contraria, se concede saque de meta.", "referencia": "Regla 13.1 / El balón entra en la portería", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-011", "bloque": "reglas", "enunciado": "Un centrocampista ejecuta un tiro libre directo desde su propio campo y, por un error de dirección, el balón entra directamente en su propia portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede gol al equipo adversario.", "B": "Concede saque de esquina al equipo adversario.", "C": "Concede saque de meta a favor del equipo del ejecutor."}, "correcta": "B", "explicacion": "Si un libre directo o indirecto entra directamente en la propia portería, se concede saque de esquina al adversario.", "referencia": "Regla 13.1 / El balón entra en la portería", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-012", "bloque": "reglas", "enunciado": "Un guardameta toca de nuevo el balón con las manos, dentro de su área de meta, después de haberlo soltado y antes de que lo toque otro jugador. ¿Desde dónde se ejecuta el tiro libre indirecto a favor del equipo atacante?", "opciones": {"A": "Desde el punto más próximo de la línea del área de meta paralela a la línea de meta.", "B": "Desde el punto exacto donde el guardameta tocó de nuevo el balón.", "C": "Desde el borde del área penal, en línea con el lugar de la infracción."}, "correcta": "A", "explicacion": "Los libres indirectos a favor del atacante por una infracción en el área de meta adversaria se ejecutan desde el punto más próximo de la línea del área de meta paralela a la línea de meta.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-013", "bloque": "reglas", "enunciado": "Un defensor obstaculiza sin contacto a un atacante dentro del área de meta de su propio equipo. ¿Desde dónde se ejecuta el libre indirecto a favor del equipo atacante?", "opciones": {"A": "Desde el lugar exacto donde se produjo la obstaculización, dentro del área de meta del equipo defensor.", "B": "Desde el punto más próximo de la línea del área de meta paralela a la línea de meta.", "C": "Desde el punto penal, por haberse producido la infracción en el interior del área penal del equipo defensor."}, "correcta": "B", "explicacion": "Los libres indirectos a favor del equipo atacante por una infracción dentro del área de meta adversaria se ejecutan desde el punto más próximo de la línea paralela a la línea de meta.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-014", "bloque": "reglas", "enunciado": "El equipo defensor tiene un tiro libre a su favor dentro de su propia área de meta. ¿Desde qué lugar puede ejecutarse?", "opciones": {"A": "Desde el punto más próximo al banderín de esquina.", "B": "Únicamente desde el lugar exacto de la infracción.", "C": "Desde cualquier punto del área de meta."}, "correcta": "C", "explicacion": "Los tiros libres a favor del equipo defensor en su área de meta podrán ejecutarse desde cualquier punto de dicha área.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-015", "bloque": "reglas", "enunciado": "Un jugador vuelve a entrar en el terreno de juego sin permiso del árbitro, que detiene el juego para sancionarlo, sin que haya habido interferencia. ¿Desde dónde se ejecuta el tiro libre?", "opciones": {"A": "Desde el lugar donde se encontraba el balón cuando se detuvo el juego.", "B": "Desde el punto de la línea de demarcación por donde entró el jugador.", "C": "Desde el punto central del terreno de juego."}, "correcta": "A", "explicacion": "Los libres por entrada, reingreso o salida sin permiso se ejecutan desde el lugar donde estaba el balón cuando se detuvo el juego.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-016", "bloque": "reglas", "enunciado": "Un suplente comete fuera del terreno de juego una infracción física contra un jugador adversario mientras el balón está en juego, en un punto cercano a la línea de banda. ¿Dónde se ejecuta el tiro libre?", "opciones": {"A": "En el lugar donde se encontraba el balón cuando se produjo la infracción.", "B": "En el punto de la línea de banda más cercano al banquillo del suplente.", "C": "En el punto de la línea de demarcación más cercano al lugar donde se produjo la infracción."}, "correcta": "C", "explicacion": "Cuando la infracción se comete fuera del terreno de juego, el tiro libre se ejecuta en la línea de demarcación más cercana al lugar de la infracción.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-017", "bloque": "reglas", "enunciado": "Un adversario se sitúa a 5 metros del balón en un tiro libre y el árbitro no puede aplicar la ventaja. El ejecutor no ha llegado a golpear el balón. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Ordena que se vuelva a ejecutar el tiro libre.", "B": "Concede un tiro libre indirecto en el lugar donde estaba el adversario.", "C": "Permite que el tiro se ejecute sin más consecuencias."}, "correcta": "A", "explicacion": "Si un adversario no respeta la distancia reglamentaria, se vuelve a ejecutar el tiro a menos que pueda concederse ventaja.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-018", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre rápido y un adversario que estaba a 6 metros del balón intercepta el pase. El adversario no había obstaculizado deliberadamente la ejecución. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo del ejecutor.", "B": "Ordena repetir el tiro libre y amonesta al adversario.", "C": "Permite que el juego continúe."}, "correcta": "C", "explicacion": "En un tiro libre rápido, si un adversario a menos de 9.15 m intercepta el balón, el árbitro permite que el juego continúe.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-019", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre rápido y un adversario se coloca deliberadamente delante del balón para obstaculizar el saque. ¿Qué decide el árbitro?", "opciones": {"A": "Amonesta al adversario por retrasar la reanudación del juego.", "B": "Expulsa al adversario por conducta violenta.", "C": "No adopta medida disciplinaria y permite continuar."}, "correcta": "A", "explicacion": "El adversario que obstaculice deliberadamente el saque de un tiro libre rápido será amonestado por retrasar la reanudación.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-020", "bloque": "reglas", "enunciado": "¿Cuándo está en juego el balón en un tiro libre?", "opciones": {"A": "Cuando ha sido golpeado con el pie y se mueve con claridad.", "B": "Cuando ha salido del área penal en el caso del equipo defensor.", "C": "Cuando el árbitro ha hecho sonar el silbato en todos los casos."}, "correcta": "A", "explicacion": "El balón deberá estar inmóvil y estará en juego una vez haya sido golpeado con el pie y se mueva con claridad.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-021", "bloque": "reglas", "enunciado": "El equipo defensor ejecuta un tiro libre dentro de su área penal y un atacante sigue dentro del área porque no tuvo tiempo de salir; no toca ni disputa el balón. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe.", "B": "Concede un tiro libre indirecto a favor del equipo defensor.", "C": "Ordena repetir el tiro libre."}, "correcta": "A", "explicacion": "Si un adversario sigue en el área porque no tuvo tiempo de salir, el árbitro permite que continúe el juego.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-022", "bloque": "reglas", "enunciado": "El equipo defensor ejecuta un tiro libre dentro de su área penal y un atacante, que estaba dentro del área, toca el balón antes de que esté en juego. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo atacante.", "B": "Concede un balón a tierra para el guardameta.", "C": "Ordena repetir el tiro libre."}, "correcta": "C", "explicacion": "Si un adversario dentro del área toca o disputa el balón antes de que esté en juego, se repite el tiro libre.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-023", "bloque": "reglas", "enunciado": "Hasta que el balón esté en juego en un tiro libre, ¿a qué distancia mínima del balón deben situarse los adversarios?", "opciones": {"A": "A 5 m, salvo que se trate de un libre a favor del equipo defensor.", "B": "A 9.15 m, sin ninguna excepción posible.", "C": "A 9.15 m, salvo que estén sobre la línea de meta entre los postes de su propia portería."}, "correcta": "C", "explicacion": "Los adversarios deben estar a 9.15 m mínimo, salvo si se hallan sobre la línea de meta entre los postes de su propia portería.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-024", "bloque": "reglas", "enunciado": "En un tiro libre a favor del equipo atacante dentro del área penal del adversario, ¿dónde deben permanecer los adversarios hasta que el balón esté en juego?", "opciones": {"A": "Dentro del área penal, formando barrera a 9,15 metros del balón, igual que en un tiro libre fuera del área.", "B": "Fuera del área de meta, pudiendo permanecer dentro del área penal siempre que respeten la distancia mínima.", "C": "Fuera del área penal y a 9.15 m del balón, salvo los situados en su línea de meta entre los postes."}, "correcta": "C", "explicacion": "En libres dentro del área penal del adversario, estos deben estar a 9.15 m y fuera del área penal, salvo los que estén sobre la línea de meta entre los postes.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-025", "bloque": "reglas", "enunciado": "Cuatro defensores forman una barrera y, durante la ejecución del tiro libre, un atacante se sitúa a 50 cm de ella. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Permite continuar, pues la barrera no exige distancia alguna.", "B": "Concede un tiro libre indirecto a favor del equipo defensor.", "C": "Ordena repetir el tiro libre y advierte al atacante."}, "correcta": "B", "explicacion": "Si un atacante está a menos de 1 m de una barrera de tres o más defensores durante la ejecución, se concede libre indirecto.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-026", "bloque": "reglas", "enunciado": "Dos defensores forman una barrera y, durante la ejecución del tiro libre, un atacante se sitúa pegado a ellos. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Amonesta al atacante por no respetar la distancia reglamentaria.", "B": "Concede un tiro libre indirecto a favor del equipo defensor.", "C": "Permite que el juego continúe, pues no existe barrera de tres o más jugadores."}, "correcta": "C", "explicacion": "La distancia de 1 m solo se exige cuando tres o más defensores forman una barrera.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-027", "bloque": "reglas", "enunciado": "¿Cuál es la distancia mínima que deben guardar los atacantes respecto de una barrera de tres o más defensores hasta que el balón esté en juego?", "opciones": {"A": "3 metros.", "B": "2 metros.", "C": "1 metro."}, "correcta": "C", "explicacion": "Los atacantes deben guardar al menos 1 m de distancia respecto a la barrera formada por tres o más defensores.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-028", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre elevando el balón con los dos pies simultáneamente. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre y amonesta al ejecutor.", "B": "Permite que el juego continúe, al ser una forma válida de ejecución.", "C": "Concede un tiro libre indirecto a favor del adversario."}, "correcta": "B", "explicacion": "Se podrá ejecutar un tiro libre elevando el balón con un solo pie o con los dos simultáneamente.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-029", "bloque": "reglas", "enunciado": "Un jugador amaga con golpear el balón durante la ejecución de un tiro libre para confundir a los adversarios y después lo juega. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe, ya que fintar durante el tiro libre está permitido.", "B": "Ordena repetir el tiro libre sin sanción disciplinaria.", "C": "Concede un tiro libre indirecto y amonesta al ejecutor."}, "correcta": "A", "explicacion": "Fintar durante la ejecución de un tiro libre para confundir a los adversarios forma parte del juego y está permitido.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-030", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre fuera de su área penal y, con el balón ya en juego, lo toca voluntariamente con la mano antes de que lo toque otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario.", "B": "Ordena repetir el tiro libre y amonesta al ejecutor.", "C": "Concede un tiro libre directo a favor del equipo adversario."}, "correcta": "C", "explicacion": "Si el ejecutor vuelve a tocar el balón con infracción por mano, se concede libre directo.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-031", "bloque": "reglas", "enunciado": "Un defensor ejecuta un tiro libre dentro de su área penal y, una vez el balón en juego, lo toca con la mano antes de que lo toque otro jugador. No es el guardameta. ¿Qué decide el árbitro?", "opciones": {"A": "Señala tiro penal.", "B": "Concede un tiro libre directo en el borde del área penal.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "Si el ejecutor comete infracción por mano dentro de su área penal se concede penal, a menos que sea el guardameta.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-032", "bloque": "reglas", "enunciado": "El guardameta ejecuta un tiro libre dentro de su área penal y, con el balón ya en juego, lo toca con la mano antes de que lo toque otro jugador. ¿Qué decide el árbitro?", "opciones": {"A": "Señala tiro penal a favor del equipo adversario.", "B": "Concede un tiro libre directo a favor del equipo adversario.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "C", "explicacion": "Si el ejecutor es el guardameta e incurre en mano dentro de su área, se concede libre indirecto y no penal.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-033", "bloque": "reglas", "enunciado": "Tras ejecutar un tiro libre desde fuera del área, el ejecutor golpea de nuevo el balón con el pie antes de que lo toque otro jugador. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo adversario.", "B": "Concede un tiro libre directo a favor del equipo adversario.", "C": "Ordena repetir el tiro libre desde el mismo lugar."}, "correcta": "A", "explicacion": "Si el ejecutor vuelve a tocar el balón antes de que lo toque otro jugador, se concede libre indirecto.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-034", "bloque": "reglas", "enunciado": "Durante un tiro libre correcto, el ejecutor golpea voluntariamente el balón contra un adversario para volver a jugarlo, sin imprudencia, temeridad ni fuerza excesiva. ¿Qué decide el árbitro?", "opciones": {"A": "Permite que el juego continúe.", "B": "Ordena repetir el tiro libre y amonesta al ejecutor.", "C": "Concede un tiro libre indirecto a favor del equipo adversario."}, "correcta": "A", "explicacion": "Si el ejecutor golpea voluntariamente el balón contra un adversario para jugarlo de nuevo sin imprudencia, temeridad ni fuerza excesiva, el juego continúa.", "referencia": "Regla 13.3 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-035", "bloque": "reglas", "enunciado": "¿A favor de quién se concede el tiro libre cuando un miembro del cuerpo técnico comete una infracción sancionable con libre?", "opciones": {"A": "A favor del equipo adversario del responsable de la infracción.", "B": "A favor del equipo cuyo jugador más cercano estuviese en el lugar.", "C": "A favor del mismo equipo, siempre que el árbitro lo decida."}, "correcta": "A", "explicacion": "Se concede libre directo o indirecto al equipo adversario de un jugador, suplente, sustituido, expulsado o miembro del cuerpo técnico responsable de la infracción.", "referencia": "Regla 13.1 / Tipos de tiros libres", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 13", "pagina": 71}, {"id": "RJ13-036", "bloque": "reglas", "enunciado": "Un jugador ejecuta un tiro libre indirecto y el balón toca a un compañero antes de entrar en la portería adversaria. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro libre indirecto.", "B": "Concede gol.", "C": "Concede saque de meta a favor del equipo defensor."}, "correcta": "B", "explicacion": "El libre indirecto solo no vale si entra directamente en la portería; si toca antes a otro jugador, se concede gol.", "referencia": "Regla 13.1 / El balón entra en la portería", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 13", "pagina": 72}, {"id": "RJ13-037", "bloque": "reglas", "enunciado": "Un suplente comete, fuera del terreno de juego, una infracción sancionable con libre directo contra un adversario, justo en el punto correspondiente a su propia área penal. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede un tiro libre en la línea de demarcación más cercana al lugar de la infracción, a favor del equipo contrario.", "B": "Concede un tiro penal a favor del equipo contrario.", "C": "Concede un balón a tierra en el lugar donde se encontraba el balón cuando se produjo la infracción."}, "correcta": "B", "explicacion": "Cuando una infracción cometida fuera del terreno de juego, sancionable con libre directo, se produce en un punto correspondiente al área penal del infractor, se señala tiro penal.", "referencia": "Regla 13.2 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 13", "pagina": 72}, {"id": "RJ14-001", "bloque": "reglas", "enunciado": "Tras ejecutarse correctamente un tiro penal, el balón se desplaza hacia adelante y queda defectuoso sin haber tocado a ningún jugador ni al guardameta. ¿Cómo se reanuda el juego?", "opciones": {"A": "Con un balón a tierra a favor del guardameta dentro de su área.", "B": "Con la repetición del tiro penal.", "C": "Con un balón a tierra a favor del ejecutor, por ser el último que tocó el balón."}, "correcta": "B", "explicacion": "Si el balón queda defectuoso tras un tiro penal correctamente ejecutado, antes de tocar a otro jugador, guardameta o cuerpo extraño, se repite el lanzamiento.", "referencia": "Regla 14 / Glosario", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-002", "bloque": "reglas", "enunciado": "Un defensor ejecuta correctamente un tiro libre indirecto desde su propia área penal, dirigido hacia su guardameta, que se encuentra también dentro del área. El guardameta coge el balón con las manos antes de que entre en la portería. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto a favor del equipo adversario, sin sanción disciplinaria.", "B": "Ordena repetir el tiro libre y amonesta al defensor.", "C": "Concede tiro libre indirecto y expulsa al guardameta por evitar una ocasión manifiesta de gol."}, "correcta": "A", "explicacion": "El guardameta comete infracción al tocar con las manos un pase deliberado de un compañero, sancionándose con tiro libre indirecto sin sanción disciplinaria adicional en este supuesto.", "referencia": "Regla 12", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-003", "bloque": "reglas", "enunciado": "Tras un disparo de un atacante, el balón se desplaza hacia adelante, queda defectuoso sin tocar a nadie más y termina entrando en la portería. ¿Cómo se resuelve la jugada?", "opciones": {"A": "Balón a tierra a favor del guardameta dentro de su área.", "B": "Balón a tierra a favor del equipo atacante por ser el último que tocó el balón.", "C": "El gol es válido."}, "correcta": "C", "explicacion": "Si el balón, tras un disparo correcto, se desplaza y entra en la portería aunque quede defectuoso en el trayecto sin más contacto, el gol es válido.", "referencia": "Regla 2 / Regla 10", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-004", "bloque": "reglas", "enunciado": "Tras el lanzamiento de un penal se produce un rechace, y en ese momento un defensor que había infringido las reglas de juego interfiere en el segundo disparo del atacante. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede el gol si entra o manda repetir el tiro penal.", "B": "Concede el gol si entra o reanuda con tiro libre indirecto.", "C": "Manda repetir el tiro penal o reanuda con tiro libre indirecto."}, "correcta": "A", "explicacion": "Cuando el defensor infringe antes del rechace y luego interfiere en el segundo disparo, el árbitro concede el gol si el balón entra o, en caso contrario, ordena repetir el tiro penal.", "referencia": "Regla 14", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 4, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-005", "bloque": "reglas", "enunciado": "Durante la ejecución de un tiro penal, el ejecutor golpea dos veces el balón de manera involuntaria y consigue marcar gol. ¿Qué decisión toma el árbitro?", "opciones": {"A": "Concede tiro libre indirecto sobre el punto de penal a favor del equipo contrario.", "B": "Concede el gol, ya que el doble toque involuntario del ejecutor no impide la validez del tanto conseguido en el lanzamiento.", "C": "Ordena repetir el tiro penal, al considerarse el doble toque como una interrupción ajena a la voluntad del ejecutor."}, "correcta": "A", "explicacion": "El doble toque involuntario en la ejecución de un penal impide la validez del gol, sancionándose con tiro libre indirecto a favor del equipo contrario desde el punto de penal.", "referencia": "Regla 14", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-006", "bloque": "reglas", "enunciado": "¿Cuál es la posición correcta del árbitro asistente durante la ejecución de un tiro penal?", "opciones": {"A": "Detrás del banderín de esquina, siguiendo la misma referencia que en un saque de esquina del equipo defensor.", "B": "En la intersección de la línea de meta con el área de meta, controlando exclusivamente la posición del guardameta.", "C": "En la intersección de la línea de meta con el área penal, o a la altura del punto de penalti en la línea de banda."}, "correcta": "C", "explicacion": "Durante un tiro penal, el asistente se sitúa en la intersección de la línea de meta y el área penal, o a la altura del punto de penalti sobre la línea de banda.", "referencia": "Regla 14", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 77}, {"id": "RJ14-007", "bloque": "reglas", "enunciado": "En la ejecución de un tiro penal, ¿dónde deben situarse todos los jugadores excepto el ejecutor y el guardameta?", "opciones": {"A": "Dentro del área penal, a más de 5 metros del punto de penal.", "B": "Fuera del área penal, detrás del punto de penal y a al menos 9,15 metros de dicho punto.", "C": "En cualquier lugar del terreno de juego siempre que no estén dentro del círculo central."}, "correcta": "B", "explicacion": "En un tiro penal, el resto de jugadores deben permanecer fuera del área penal, detrás del punto de penal y a una distancia mínima de 9,15 metros de este.", "referencia": "Regla 14", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-008", "bloque": "reglas", "enunciado": "¿Por qué tipo de infracción se concede un tiro penal?", "opciones": {"A": "Por cualquier infracción, directa o indirecta, cometida por un jugador dentro de su propia área penal.", "B": "Por una infracción sancionable con libre directo cometida en cualquier punto de su propia mitad del campo.", "C": "Por una infracción sancionable con libre directo cometida por un jugador dentro de su propia área penal."}, "correcta": "C", "explicacion": "Se concede penal siempre que un jugador cometa una infracción sancionable con libre directo dentro de su área penal o fuera del terreno de juego como parte del juego.", "referencia": "Regla 14 / Introducción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-009", "bloque": "reglas", "enunciado": "¿Puede marcarse gol directamente de un tiro penal?", "opciones": {"A": "Sí, se podrá marcar gol directamente de tiro penal.", "B": "Solo si el guardameta llega a tocar el balón.", "C": "No, el balón debe tocar antes a otro jugador o al guardameta."}, "correcta": "A", "explicacion": "La Regla 14 establece que se podrá marcar gol directamente de tiro penal.", "referencia": "Regla 14 / Introducción", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-010", "bloque": "reglas", "enunciado": "¿Cómo debe estar el balón en el momento de ejecutar un tiro penal?", "opciones": {"A": "Inmóvil y tocando en parte el centro del punto penal o sobresaliendo de él.", "B": "Inmóvil, a 1 m detrás del punto penal como máximo.", "C": "Inmóvil y con todo el balón dentro del círculo del punto penal."}, "correcta": "A", "explicacion": "El balón deberá estar inmóvil y tocará en parte el centro del punto penal o sobresaldrá de él.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-011", "bloque": "reglas", "enunciado": "¿Qué debe quedar claro antes de ejecutarse un tiro penal en relación con el lanzamiento?", "opciones": {"A": "Quién será el ejecutor del lanzamiento.", "B": "Cuántos pasos de carrera utilizará el ejecutor.", "C": "Con qué pie ejecutará el lanzamiento el jugador."}, "correcta": "A", "explicacion": "Deberá indicarse con claridad quién será el ejecutor del lanzamiento.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-012", "bloque": "reglas", "enunciado": "¿Dónde debe situarse el guardameta defensor hasta el golpeo del balón en un tiro penal?", "opciones": {"A": "A un máximo de un metro por delante de la línea de meta.", "B": "Sobre la línea del área de meta, frente al ejecutor.", "C": "Sobre su línea de meta, entre los postes y frente al ejecutor."}, "correcta": "C", "explicacion": "El guardameta deberá permanecer sobre su propia línea de meta, entre los postes y frente al ejecutor hasta el golpeo.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 1, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-013", "bloque": "reglas", "enunciado": "Antes del golpeo de un tiro penal, el guardameta toca con la mano el travesaño para distraer al ejecutor. El penal se ejecuta y el balón entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "Concede el gol.", "C": "Concede un tiro libre indirecto a favor del equipo atacante."}, "correcta": "B", "explicacion": "Si el guardameta comete una infracción y el balón entra en la portería, se concede gol.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-014", "bloque": "reglas", "enunciado": "Antes del golpeo de un tiro penal, el guardameta avanza con los dos pies delante de la línea de meta y detiene el lanzamiento. Es la primera infracción del guardameta en el partido. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el penal y advierte al guardameta.", "B": "Ordena repetir el penal y amonesta al guardameta.", "C": "Concede un tiro libre indirecto a favor del equipo atacante."}, "correcta": "A", "explicacion": "Si el guardameta evita el gol con su infracción se repite el penal; se advierte en la primera infracción y se amonesta en la reincidencia.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-015", "bloque": "reglas", "enunciado": "Antes del golpeo de un penal, el guardameta, que ya había sido advertido por una infracción anterior en el partido, se adelanta de la línea y detiene el lanzamiento. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el penal y advierte de nuevo al guardameta.", "B": "Ordena repetir el penal y amonesta al guardameta.", "C": "Concede gol y amonesta al guardameta."}, "correcta": "B", "explicacion": "Si la infracción conlleva repetición, se advierte al guardameta en la primera infracción y se le amonesta en caso de reincidencia.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 75}, {"id": "RJ14-016", "bloque": "reglas", "enunciado": "El guardameta se adelanta de su línea antes del golpeo, pero el lanzamiento se estrella en el poste y sale fuera del terreno de juego sin que la infracción haya influido en el ejecutor. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo atacante.", "B": "Ordena repetir el tiro penal y advierte al guardameta.", "C": "No repite el penal, al no haber influido claramente en el lanzador."}, "correcta": "C", "explicacion": "Si el balón no entra o rebota en los postes, solo se repite si la infracción del guardameta influye claramente en el lanzador.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-017", "bloque": "reglas", "enunciado": "Durante un penal, un defensor no ha respetado los 9.15 m y entra en el área antes del golpeo, sin influir en la jugada, y el lanzamiento entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede gol.", "B": "Ordena repetir el tiro penal.", "C": "Concede un tiro libre indirecto a favor del equipo atacante."}, "correcta": "A", "explicacion": "Solo se sanciona el adelantamiento de un compañero del guardameta si influye claramente o juega/disputa el balón; si no influye y entra, es gol.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-018", "bloque": "reglas", "enunciado": "Un compañero del guardameta entra en el área antes del golpeo e influye claramente en el lanzador; el penal se lanza y el balón sale fuera de la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Concede un tiro libre indirecto a favor del equipo atacante.", "B": "Concede saque de meta a favor del equipo defensor.", "C": "Ordena repetir el tiro penal."}, "correcta": "C", "explicacion": "Si un compañero del guardameta infringe y el balón no entra, se repite el tiro penal.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-019", "bloque": "reglas", "enunciado": "Un compañero del ejecutor entra en el área antes del golpeo e influye claramente en el guardameta; el lanzamiento entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Ordena repetir el tiro penal.", "B": "Concede el gol.", "C": "Concede un tiro libre indirecto a favor del equipo defensor."}, "correcta": "A", "explicacion": "Si el ejecutor o un compañero infringe las Reglas y el balón entra, se repite el penal.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-020", "bloque": "reglas", "enunciado": "Un compañero del ejecutor entra en el área antes del golpeo e influye claramente en el guardameta; el lanzamiento no entra en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Reanuda con un saque de meta a favor del equipo defensor, al no haber entrado el balón en la portería.", "B": "Ordena repetir el tiro penal, al considerar que la influencia sobre el guardameta no altera la validez del lanzamiento.", "C": "Detiene el juego y lo reanuda con un tiro libre indirecto a favor del equipo defensor."}, "correcta": "C", "explicacion": "Si el ejecutor o un compañero infringe y el balón no entra, el árbitro detiene el juego y lo reanuda con libre indirecto.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-021", "bloque": "reglas", "enunciado": "¿Dónde deben situarse todos los jugadores, excepto el ejecutor y el guardameta, mientras se ejecuta un penal?", "opciones": {"A": "A 9.15 m del punto penal, detrás de este, dentro del terreno de juego y fuera del área penal.", "B": "A 9.15 m del punto penal, detrás de este y dentro del área penal.", "C": "A 5 m del punto penal, detrás de la línea del área penal."}, "correcta": "A", "explicacion": "Todos deben estar a 9.15 m del punto penal, detrás del punto, dentro del terreno y fuera del área penal.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-022", "bloque": "reglas", "enunciado": "¿Cómo debe tocar el ejecutor el balón en un tiro penal?", "opciones": {"A": "Con el pie hacia delante; se permite el tacón siempre que el balón se mueva hacia delante.", "B": "Con cualquier parte del cuerpo, siempre que el balón se mueva hacia delante.", "C": "Con el pie y en línea recta, sin poder utilizar el tacón en ningún caso."}, "correcta": "A", "explicacion": "El ejecutor tocará el balón con el pie hacia delante y se permite golpearlo con el tacón siempre que el balón se mueva hacia delante.", "referencia": "Regla 14.1 / Procedimiento", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 2, "regla": "Regla 14", "pagina": 73}, {"id": "RJ14-023", "bloque": "reglas", "enunciado": "El ejecutor de un penal golpea el balón con el pie de forma que este rueda hacia atrás, hacia el centro del campo, sin entrar en la portería. ¿Qué decide el árbitro?", "opciones": {"A": "Detiene el juego y lo reanuda con un tiro libre indirecto.", "B": "Concede un tiro libre directo a favor del equipo defensor.", "C": "Ordena repetir el tiro penal sin sanción alguna."}, "correcta": "A", "explicacion": "Si el penal se ejecuta hacia atrás, se detiene el juego y se reanuda con libre indirecto, independientemente de que se marque gol.", "referencia": "Regla 14.2 / Infracciones y sanciones", "fuente": "ReglasDelJuego26-27.pdf", "dificultad": 3, "regla": "Regla 14", "pagina": 74}, {"id": "RJ14-024", "bloque": "reglas", "enunciado": "El guardameta tiene el pie delantero en el aire pero el otro pie sobre la línea de meta en el momento del
